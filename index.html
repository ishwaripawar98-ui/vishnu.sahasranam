<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viṣṇu Sahasranāma — Modern Sanskrit Pronunciation, Meaning &amp; Origin Story</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #F6F7FB;
      --bg-surface: #FFFFFF;
      --bg-soft: #EEF0F8;
      --bg-hover: #E5E8F5;
      --border-hair: rgba(15, 23, 42, 0.08);
      --text-primary: #0F172A;
      --text-secondary: #5B6478;
      --accent: #4F46E5;
      --accent-soft: rgba(79, 70, 229, 0.10);
      --dock-bg: rgba(255, 255, 255, 0.86);
      --aura: radial-gradient(65% 48% at 20% 0%, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.06) 42%, transparent 100%),
              radial-gradient(50% 40% at 85% 4%, rgba(249, 115, 22, 0.09) 0%, transparent 100%);
      --font-scale: 1;
    }
    html.dark {
      --bg-page: #070A14;
      --bg-surface: #0F1426;
      --bg-soft: #161D36;
      --bg-hover: #1E2747;
      --border-hair: rgba(148, 163, 184, 0.14);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --accent: #818CF8;
      --accent-soft: rgba(129, 140, 248, 0.16);
      --dock-bg: rgba(15, 20, 38, 0.88);
      --aura: radial-gradient(65% 48% at 22% 0%, rgba(99, 102, 241, 0.22) 0%, rgba(139, 92, 246, 0.10) 45%, transparent 100%),
              radial-gradient(45% 38% at 82% 5%, rgba(249, 115, 22, 0.14) 0%, transparent 100%);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      background-image: var(--aura);
      background-repeat: no-repeat;
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
      padding-bottom: 120px;
    }
    .font-display { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
    .font-devanagari {
      font-family: 'Noto Serif Devanagari', serif;
      line-height: 1.9;
      font-size: calc(1.38rem * var(--font-scale));
    }
    .font-devanagari-focus {
      font-family: 'Noto Serif Devanagari', serif;
      line-height: 1.95;
      font-size: calc(1.68rem * var(--font-scale));
    }
    .font-marathi {
      font-family: 'Noto Serif Devanagari', 'Inter', sans-serif;
    }
    .surface {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hair);
    }
    .soft-surface {
      background-color: var(--bg-soft);
      border: 1px solid var(--border-hair);
    }
    .verse-playing {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 1px var(--accent), 0 12px 32px -12px rgba(79, 70, 229, 0.28);
    }
    .name-tile {
      background-color: var(--bg-soft);
      border: 1px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .name-tile:hover, .name-tile.speaking {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      transform: translateY(-1px);
    }
    .accent-pill {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 55%, #F97316 100%);
      color: #FFFFFF;
    }
    .dock-glass {
      background-color: var(--dock-bg);
      border: 1px solid var(--border-hair);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    input[type="range"] {
      accent-color: #4F46E5;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes eqPulse {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    .eq-bar {
      width: 2.5px;
      height: 12px;
      border-radius: 99px;
      background-color: currentColor;
      animation: eqPulse 0.85s ease-in-out infinite;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    @media (max-width: 640px) {
      .font-devanagari { font-size: calc(1.16rem * var(--font-scale)); }
      .font-devanagari-focus { font-size: calc(1.36rem * var(--font-scale)); }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-orange-500/20">

  <!-- Pre-synced Built-in Challakere Brothers Recitation Audio -->
  <audio id="chantAudio" src="./assets/vishnu_sahasranama.mp3" preload="auto"></audio>

  <!-- Minimal Toast -->
  <div id="toast" class="fixed top-5 right-5 z-50 hidden px-4 py-2 rounded-full shadow-xl text-xs font-medium text-white bg-neutral-900/95 border border-white/10 backdrop-blur-md"></div>

  <!-- Minimal Floating Glass Header -->
  <header class="sticky top-0 z-30 border-b backdrop-blur-xl" style="background-color: var(--dock-bg); border-color: var(--border-hair);">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <!-- Brand -->
      <button id="btnBrandHome" type="button" class="flex items-center gap-2.5 min-w-0 text-left group">
        <div class="w-8 h-8 rounded-xl accent-pill flex items-center justify-center font-devanagari text-base font-bold shrink-0 shadow-sm group-hover:scale-105 transition">ॐ</div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-display text-sm sm:text-[15px] font-bold tracking-tight truncate">Viṣṇu Sahasranāma</span>
            <span class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Synced
            </span>
          </div>
          <p class="text-[11px] truncate" style="color: var(--text-secondary);">श्रीविष्णुसहस्रनामस्तोत्रम् • EN &amp; मराठी</p>
        </div>
      </button>

      <!-- Right Actions: Origin Story Button + Minimal Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="btnOriginStory" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition border" style="border-color: rgba(234, 88, 12, 0.35); background-color: var(--accent-soft); color: var(--accent);">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>Origin Story</span>
        </button>

        <div class="hidden sm:flex items-center rounded-full overflow-hidden border" style="border-color: var(--border-hair); background-color: var(--bg-surface);">
          <button id="btnFontDec" type="button" class="px-2.5 py-1 text-[11px] font-semibold hover:bg-orange-500/10 transition" title="Smaller text">A-</button>
          <button id="btnFontInc" type="button" class="px-2.5 py-1 text-[11px] font-semibold border-l hover:bg-orange-500/10 transition" style="border-color: var(--border-hair);" title="Larger text">A+</button>
        </div>

        <button id="btnTheme" type="button" class="w-8 h-8 rounded-full border flex items-center justify-center hover:bg-orange-500/10 transition" style="border-color: var(--border-hair); background-color: var(--bg-surface);" title="Toggle Dark / Light Mode" aria-label="Toggle theme">
          <i id="iconTheme" data-lucide="moon" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Minimal Control Strip -->
  <section id="chantControls" class="max-w-4xl mx-auto px-4 pt-5 space-y-3">
    <!-- Section Pills + Progress + View Toggle -->
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <div id="sectionTabs" class="flex items-center gap-1 p-1 rounded-2xl soft-surface overflow-x-auto no-scrollbar">
        <button data-section="purva" type="button" class="sec-tab px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition">Pūrva Pīṭhikā</button>
        <button data-section="dhyanam" type="button" class="sec-tab px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition">Dhyānam</button>
        <button data-section="stotram" type="button" class="sec-tab px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition">108 Ślokas</button>
        <button data-section="phala" type="button" class="sec-tab px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition">Phalaśruti</button>
      </div>

      <div class="flex items-center gap-2">
        <span id="progressBadge" class="text-[11px] font-medium px-2.5 py-1 rounded-full soft-surface" style="color: var(--text-secondary);">0 / 171</span>
        <div class="inline-flex p-1 rounded-2xl soft-surface">
          <button id="btnViewFocus" type="button" class="px-2.5 py-1 rounded-xl text-xs font-semibold inline-flex items-center gap-1 transition">
            <i data-lucide="maximize-2" class="w-3 h-3"></i> Focus
          </button>
          <button id="btnViewList" type="button" class="px-2.5 py-1 rounded-xl text-xs font-semibold inline-flex items-center gap-1 transition">
            <i data-lucide="align-justify" class="w-3 h-3"></i> List
          </button>
        </div>
      </div>
    </div>

    <!-- Minimal Search + Language + Filters -->
    <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2" style="color: var(--text-secondary);"></i>
        <input id="searchInput" type="text" placeholder="Search śloka #, Sanskrit, name (Padmanabha), English or मराठी..." class="w-full pl-10 pr-8 py-2 rounded-2xl text-xs sm:text-sm soft-surface focus:outline-none focus:ring-2 focus:ring-orange-500/30 transition" />
        <button id="btnClearSearch" type="button" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 p-1 rounded-full hover:bg-orange-500/10" aria-label="Clear search">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <div class="flex items-center gap-1.5 flex-wrap">
        <div id="langGroup" class="inline-flex p-1 rounded-2xl soft-surface text-[11px] font-semibold">
          <button data-lang="both" type="button" class="lang-btn px-2.5 py-1 rounded-xl transition">EN + मराठी</button>
          <button data-lang="mr" type="button" class="lang-btn px-2.5 py-1 rounded-xl transition">मराठी</button>
          <button data-lang="en" type="button" class="lang-btn px-2.5 py-1 rounded-xl transition">EN</button>
        </div>

        <button id="btnToggleIast" type="button" class="px-3 py-1.5 rounded-2xl text-[11px] font-semibold soft-surface transition">IAST</button>
        <button id="btnBookmarksOnly" type="button" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-2xl text-[11px] font-semibold soft-surface transition">
          <i data-lucide="bookmark" class="w-3 h-3"></i>
          <span id="bookmarkCount">0</span>
        </button>
      </div>
    </div>

    <!-- Stotram Range Pills -->
    <div id="stotramRangeBar" class="hidden flex items-center justify-between gap-2 flex-wrap pt-0.5">
      <div class="flex items-center gap-1.5 flex-wrap">
        <button data-range="all" type="button" class="range-btn px-2.5 py-1 rounded-full text-[11px] font-semibold transition">All 108</button>
        <button data-range="1-36" type="button" class="range-btn px-2.5 py-1 rounded-full text-[11px] font-semibold transition">Ślokas 1–36</button>
        <button data-range="37-72" type="button" class="range-btn px-2.5 py-1 rounded-full text-[11px] font-semibold transition">Ślokas 37–72</button>
        <button data-range="73-108" type="button" class="range-btn px-2.5 py-1 rounded-full text-[11px] font-semibold transition">Ślokas 73–108</button>
      </div>
      <span id="resultMeta" class="text-[11px]" style="color: var(--text-secondary);"></span>
    </div>
  </section>

  <!-- Main Content Stage (Verses OR Origin Story) -->
  <main id="mainStage" class="max-w-4xl mx-auto px-4 pt-4 space-y-4"></main>

  <!-- Minimal Footer -->
  <footer class="max-w-4xl mx-auto px-4 pt-10 pb-4 text-center text-[11px] space-y-1" style="color: var(--text-secondary);">
    <p>Grounded in Ādi Śaṅkarācārya's <em>Viṣṇu Sahasranāma Bhāṣya</em> (English &amp; मराठी) • Pre-synced to Challakere Brothers Recitation</p>
    <p class="opacity-75">Space: Play/Pause • ← / →: Prev / Next • L: Loop</p>
  </footer>

  <!-- Floating Capsule Audio Dock (Apple Music / Minimal Gen-Z style) -->
  <div class="fixed bottom-3 inset-x-0 z-40 px-3 pointer-events-none">
    <div id="playerBar" class="dock-glass pointer-events-auto max-w-3xl mx-auto rounded-2xl shadow-2xl overflow-hidden">
      <!-- Thin Integrated Progress Track -->
      <div class="px-4 pt-2 flex items-center gap-2.5">
        <span id="timeCurrent" class="text-[10px] font-mono w-8 text-right" style="color: var(--text-secondary);">00:00</span>
        <input id="audioScrub" type="range" min="0" max="2364" step="0.5" value="0" class="flex-1 h-1 cursor-pointer" aria-label="Seek audio" />
        <span id="timeTotal" class="text-[10px] font-mono w-8" style="color: var(--text-secondary);">39:24</span>
      </div>

      <div class="px-4 py-2.5 flex items-center justify-between gap-2 sm:gap-4">
        <!-- Left: Play + Current Verse -->
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <button id="btnPlayPause" type="button" class="w-9 h-9 rounded-full accent-pill flex items-center justify-center shrink-0 shadow-md hover:scale-105 active:scale-95 transition" aria-label="Play or pause">
            <i id="iconPlayPause" data-lucide="play" class="w-4 h-4 ml-0.5"></i>
          </button>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span id="playerVerseTitle" class="font-display text-xs sm:text-sm font-bold truncate">Śloka 1</span>
              <span id="engineBadge" class="px-1.5 py-0.5 rounded-md text-[10px] font-semibold" style="background-color: var(--accent-soft); color: var(--accent);">Audio</span>
            </div>
            <p id="playerVerseSub" class="text-[11px] truncate" style="color: var(--text-secondary);">Challakere Brothers • 08:34 – 08:48</p>
          </div>
        </div>

        <!-- Center: Transport -->
        <div class="flex items-center gap-0.5 sm:gap-1 shrink-0">
          <button id="btnPrevVerse" type="button" class="p-2 rounded-full hover:bg-orange-500/10 transition" title="Previous Verse" aria-label="Previous verse">
            <i data-lucide="skip-back" class="w-4 h-4"></i>
          </button>
          <button id="btnNextVerse" type="button" class="p-2 rounded-full hover:bg-orange-500/10 transition" title="Next Verse" aria-label="Next verse">
            <i data-lucide="skip-forward" class="w-4 h-4"></i>
          </button>
          <button id="btnPlaybackMode" type="button" class="px-2.5 py-1.5 rounded-full soft-surface text-[11px] font-semibold inline-flex items-center gap-1 hover:bg-orange-500/10 transition" title="Single / Loop / Continuous">
            <i id="iconPlaybackMode" data-lucide="play-circle" class="w-3.5 h-3.5"></i>
            <span id="labelPlaybackMode" class="hidden sm:inline">Single</span>
          </button>
        </div>

        <!-- Right: Speed, Engine & Offset -->
        <div class="flex items-center gap-1.5 shrink-0">
          <select id="speedSelect" class="px-2 py-1 rounded-full soft-surface text-[11px] font-semibold cursor-pointer focus:outline-none" aria-label="Playback speed">
            <option value="0.75">0.75×</option>
            <option value="0.9">0.9×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
          </select>

          <button id="btnEngineToggle" type="button" class="hidden sm:inline-flex items-center gap-1 px-2.5 py-1 rounded-full soft-surface text-[11px] font-semibold hover:bg-orange-500/10 transition" title="Switch between Pre-Synced Audio and Sanskrit TTS">
            <span id="labelEngineToggle">MP3</span>
          </button>

          <select id="offsetSelect" class="hidden md:block px-2 py-1 rounded-full soft-surface text-[11px] font-semibold cursor-pointer focus:outline-none" title="Fine-tune audio sync" aria-label="Sync offset">
            <option value="-2">-2s</option>
            <option value="-1">-1s</option>
            <option value="-0.5">-0.5s</option>
            <option value="0" selected>0s</option>
            <option value="0.5">+0.5s</option>
            <option value="1">+1s</option>
            <option value="2">+2s</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VERSES = [{"id": "purva-1", "section": "purva", "num": "1", "label": "Śloka 1", "speaker": "Invocation", "start": 18, "end": 29, "sanskrit": "शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम् ।\nप्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ १ ॥", "iast": "śuklāmbaradharaṃ viṣṇuṃ śaśivarṇaṃ caturbhujam,\nprasannavadanaṃ dhyāyet sarvavighnopaśāntaye.", "meaning": "One should meditate on Viṣṇu, dressed in white robes, moon-coloured, four-armed, with a cheerful face, for the removal of all obstacles.", "meaningMarathi": "सर्व विघ्नांच्या शांतीसाठी शुभ्र वस्त्र धारण केलेल्या, चंद्राप्रमाणे कांती असलेल्या, चार हात असलेल्या आणि प्रसन्न मुखकमल असलेल्या श्रीविष्णूंचे ध्यान करावे."}, {"id": "purva-2", "section": "purva", "num": "2", "label": "Śloka 2", "speaker": "Invocation", "start": 29, "end": 40, "sanskrit": "यस्य द्विरदवक्त्राद्याः पारिषद्याः परः शतम् ।\nविघ्नं निघ्नन्ति सततं विष्वक्सेनं तमाश्रये ॥ २ ॥", "iast": "yasya dviradavaktrādyāḥ pāriṣadyāḥ paraḥ śatam,\nvighnaṃ nighnanti satataṃ viṣvaksenaṃ tam āśraye.", "meaning": "I take refuge in Viṣvaksena – whose attendants, led by the elephant-faced one and numbering in the hundreds, ever remove all obstacles. (Note: In the Challakere Brothers recording at 00:29, Nārāyaṇaṃ namaskṛtya is chanted here.)", "meaningMarathi": "ज्यांच्या गजमुखादी शेकडो पार्षदांकडून सर्व विघ्नांचा सदैव नाश केला जातो, अशा भगवान विष्वक्सेनांना मी शरण जातो. (चालकेरे बंधूंच्या पठणात ०:२९ येथे 'नारायणं नमस्कृत्य' हे श्लोकपठण आहे.)"}, {"id": "purva-3", "section": "purva", "num": "3", "label": "Śloka 3", "speaker": "Pūrva Pīṭhikā", "start": 40, "end": 51, "sanskrit": "व्यासं वसिष्ठनप्तारं शक्तेः पौत्रमकल्मषम् ।\nपराशरात्मजं वन्दे शुकतातं तपोनिधिम् ॥ ३ ॥", "iast": "vyāsaṃ vasiṣṭhanaptāraṃ śakteḥ pautramakalmaṣam,\nparāśarātmajaṃ vande śukatātaṃ taponidhim.", "meaning": "I salute Vyāsa – the great-grandson of Vasiṣṭha, the grandson of Śakti, the immaculate son of Parāśara, the father of Śuka, the treasure of austerities.", "meaningMarathi": "वसिष्ठांचे पणतू, शक्तींचे नातू, पराशरांचे निष्कलंक पुत्र, शुक्राचार्यांचे (शुकांचे) पिता आणि तपाचे निधी असलेल्या महर्षी व्यासांना मी वंदन करतो."}, {"id": "purva-4", "section": "purva", "num": "4", "label": "Śloka 4", "speaker": "Pūrva Pīṭhikā", "start": 51, "end": 62, "sanskrit": "व्यासाय विष्णुरूपाय व्यासरूपाय विष्णवे ।\nनमो वै ब्रह्मनिधये वासिष्ठाय नमो नमः ॥ ४ ॥", "iast": "vyāsāya viṣṇurūpāya vyāsarūpāya viṣṇave,\nnamo vai brahmanidhaye vāsiṣṭhāya namo namaḥ.", "meaning": "O Vyāsa in the form of Viṣṇu, O Viṣṇu in the form of Vyāsa, O descendant of Vasiṣṭha, O treasure of Brahman – I offer obeisances unto Thee again and again.", "meaningMarathi": "विष्णूरूप असलेल्या व्यासांना, व्यासरूप असलेल्या विष्णूंना, ब्रह्मनिधी असलेल्या वसिष्ठवंशीय व्यासांना माझा पुनःपुन्हा नमस्कार असो."}, {"id": "purva-5", "section": "purva", "num": "5", "label": "Śloka 5", "speaker": "Pūrva Pīṭhikā", "start": 62, "end": 73, "sanskrit": "अविकाराय शुद्धाय नित्याय परमात्मने ।\nसदैकरूपरूपाय विष्णवे सर्वजिष्णवे ॥ ५ ॥", "iast": "avikārāya śuddhāya nityāya paramātmane,\nsadaikarūparūpāya viṣṇave sarvajiṣṇave.", "meaning": "I bow before Viṣṇu – the pure, the unchanging, the eternal, the Supreme Self, ever of one form, ever victorious over all.", "meaningMarathi": "विकाररहित, शुद्ध, नित्य, परमात्मा, सदैव एकरूप असलेल्या आणि सर्वांवर विजय मिळवणाऱ्या भगवान श्रीविष्णूंना नमस्कार असो."}, {"id": "purva-6", "section": "purva", "num": "6", "label": "Śloka 6", "speaker": "Pūrva Pīṭhikā", "start": 73, "end": 88, "sanskrit": "यस्य स्मरणमात्रेण जन्मसंसारबन्धनात् ।\nविमुच्यते नमस्तस्मै विष्णवे प्रभविष्णवे ॥ ६ ॥\nॐ नमो विष्णवे प्रभविष्णवे ।", "iast": "yasya smaraṇamātreṇa janmasaṃsārabandhanāt,\nvimucyate namas tasmai viṣṇave prabhaviṣṇave.\noṃ namo viṣṇave prabhaviṣṇave.", "meaning": "Obeisance to that Viṣṇu, the all-powerful – whose mere remembrance frees one from the bondage of birth and the cycle of worldly existence. Om, salutations to the all-powerful Viṣṇu.", "meaningMarathi": "ज्यांच्या केवळ स्मरणाने जीव जन्म-मृत्यूच्या संसारबंधनातून मुक्त होतो, अशा सर्वसमर्थ प्रभविष्णू श्रीविष्णूंना माझा नमस्कार असो. ॐ प्रभविष्णू श्रीविष्णूंना नमस्कार."}, {"id": "purva-7", "section": "purva", "num": "7", "label": "Śloka 7", "speaker": "Śrī Vaiśampāyana uvāca", "start": 88, "end": 103, "sanskrit": "श्रीवैशम्पायन उवाच –\nश्रुत्वा धर्मानशेषेण पावनानि च सर्वशः ।\nयुधिष्ठिरः शान्तनवं पुनरेवाभ्यभाषत ॥ ७ ॥", "iast": "śrī vaiśampāyana uvāca –\nśrutvā dharmānaśeṣeṇa pāvanāni ca sarvaśaḥ,\nyudhiṣṭhiraḥ śāntanavaṃ punarevābhyabhāṣata.", "meaning": "Śrī Vaiśampāyana said: Having heard the Dharma in its entirety and all the purifying teachings, Yudhiṣṭhira again addressed the son of Śāntanu (Bhīṣma).", "meaningMarathi": "श्रीवैशम्पायन म्हणाले – संपूर्ण धर्म आणि सर्व पावन करणारी तत्त्वे ऐकून युधिष्ठिराने शंतनूपुत्र भीष्मांना पुन्हा विचारले."}, {"id": "purva-8", "section": "purva", "num": "8", "label": "Śloka 8", "speaker": "Yudhiṣṭhira uvāca", "start": 103, "end": 117, "sanskrit": "युधिष्ठिर उवाच –\nकिमेकं दैवतं लोके किं वाप्येकं परायणम् ।\nस्तुवन्तः कं कमर्चन्तः प्राप्नुयुर्मानवाः शुभम् ॥ ८ ॥", "iast": "yudhiṣṭhira uvāca –\nkim ekaṃ daivataṃ loke kiṃ vāpy ekaṃ parāyaṇam,\nstuvantaḥ kaṃ kam arcantaḥ prāpnuyur mānavāḥ śubham.", "meaning": "Yudhiṣṭhira asked: Who is the one God in this world? Who is the one supreme refuge? By praising and worshipping whom do human beings attain good?", "meaningMarathi": "युधिष्ठिर म्हणाले – या जगात एकमेव श्रेष्ठ दैवत कोणते? एकमेव परम आश्रयस्थान कोणते? कोणाची स्तुती व अर्चना करून मानव कल्याण (शुभ) प्राप्त करतात?"}, {"id": "purva-9", "section": "purva", "num": "9", "label": "Śloka 9", "speaker": "Yudhiṣṭhira uvāca", "start": 117, "end": 129, "sanskrit": "को धर्मः सर्वधर्माणां भवतः परमो मतः ।\nकिं जपन्मुच्यते जन्तुर्जन्मसंसारबन्धनात् ॥ ९ ॥", "iast": "ko dharmaḥ sarvadharmāṇāṃ bhavataḥ paramo mataḥ,\nkiṃ japan mucyate jantur janmasaṃsārabandhanāt.", "meaning": "Which Dharma do you consider to be the supreme of all Dharmas? By chanting what is a creature freed from the bondage of birth and the cycle of worldly existence?", "meaningMarathi": "सर्व धर्मांमध्ये तुमच्या मते परम श्रेष्ठ धर्म कोणता? आणि कशाचा जप केल्याने प्राणी जन्म-संसाराच्या बंधनातून मुक्त होतो?"}, {"id": "purva-10", "section": "purva", "num": "10", "label": "Śloka 10", "speaker": "Śrī Bhīṣma uvāca", "start": 129, "end": 142, "sanskrit": "श्रीभीष्म उवाच –\nजगत्प्रभुं देवदेवमनन्तं पुरुषोत्तमम् ।\nस्तुवन्नामसहस्रेण पुरुषः सततोत्थितः ॥ १० ॥", "iast": "śrī bhīṣma uvāca –\njagatprabhuṃ devadevamanantaṃ puruṣottamam,\nstuvan nāmasahasreṇa puruṣaḥ satatotthitaḥ.", "meaning": "Bhīṣma replied: Praising the Lord of the universe, the God of gods, the infinite Puruṣottama, with a thousand names, a person ever rises to greatness.", "meaningMarathi": "श्रीभीष्म म्हणाले – जो मनुष्य सदैव तत्पर राहून जगत्प्रभू, देवदेव, अनंत आणि पुरुषोत्तम श्रीविष्णूंची सहस्रनामांनी स्तुती करतो..."}, {"id": "purva-11", "section": "purva", "num": "11", "label": "Śloka 11", "speaker": "Śrī Bhīṣma uvāca", "start": 142, "end": 153, "sanskrit": "तमेव चार्चयन्नित्यं भक्त्या पुरुषमव्ययम् ।\nध्यायन् स्तुवन्नमस्यंश्च यजमानस्तमेव च ॥ ११ ॥", "iast": "tam eva cārcayan nityaṃ bhaktyā puruṣam avyayam,\ndhyāyan stuvan namasyaṃś ca yajamānas tam eva ca.", "meaning": "Worshipping Him alone daily with devotion, meditating on, praising, and bowing to the inexhaustible Puruṣa, and sacrificing to Him alone.", "meaningMarathi": "...आणि नित्य भक्तीने त्या अविनाशी पुरुषाची अर्चना, ध्यान, स्तुती, नमस्कार आणि यजन करतो (तो परम श्रेयाला प्राप्त होतो)."}, {"id": "purva-12", "section": "purva", "num": "12", "label": "Śloka 12", "speaker": "Śrī Bhīṣma uvāca", "start": 153, "end": 164, "sanskrit": "अनादिनिधनं विष्णुं सर्वलोकमहेश्वरम् ।\nलोकाध्यक्षं स्तुवन्नित्यं सर्वदुःखातिगो भवेत् ॥ १२ ॥", "iast": "anādinidhanaṃ viṣṇuṃ sarvalokamaheśvaram,\nlokādhyakṣaṃ stuvan nityaṃ sarvaduḥkhātigo bhavet.", "meaning": "By praising Viṣṇu – who is without beginning or end, the great Lord of all the worlds, the presiding deity of the worlds – one passes beyond all sorrows.", "meaningMarathi": "आदि आणि अंत नसलेल्या, सर्व लोकांचे महेश्वर आणि लोकाध्यक्ष असलेल्या श्रीविष्णूंची नित्य स्तुती केल्याने मनुष्य सर्व दुःखांच्या पलीकडे जातो."}, {"id": "purva-13", "section": "purva", "num": "13", "label": "Śloka 13", "speaker": "Śrī Bhīṣma uvāca", "start": 164, "end": 176, "sanskrit": "ब्रह्मण्यं सर्वधर्मज्ञं लोकानां कीर्तिवर्धनम् ।\nलोकनाथं महद्भूतं सर्वभूतभवोद्भवम् ॥ १३ ॥", "iast": "brahmaṇyaṃ sarvadharmajñaṃ lokānāṃ kīrtivardhanam,\nlokanāthaṃ mahadbhūtaṃ sarvabhūtabhavodbhavam.", "meaning": "He is the support of Brahman, the knower of all dharmas, the enhancer of the glory of the worlds, the Lord of the worlds, the great Being, the source of origin of all beings.", "meaningMarathi": "जे वेदांचे रक्षक, सर्व धर्मांचे ज्ञाते, लोकांची कीर्ती वाढवणारे, लोकनाथ, महद्भूत आणि सर्व भूतांच्या उत्पत्तीचे कारण आहेत."}, {"id": "purva-14", "section": "purva", "num": "14", "label": "Śloka 14", "speaker": "Śrī Bhīṣma uvāca", "start": 176, "end": 188, "sanskrit": "एष मे सर्वधर्माणां धर्मोऽधिकतमो मतः ।\nयद्भक्त्या पुण्डरीकाक्षं स्तवैरर्चेन्नरः सदा ॥ १४ ॥", "iast": "eṣa me sarvadharmāṇāṃ dharmo 'dhikatamo mataḥ,\nyad bhaktyā puṇḍarīkākṣaṃ stavair arcen naraḥ sadā.", "meaning": "This is the Dharma I consider highest of all – that one should always worship the lotus-eyed Lord with devotion and hymns.", "meaningMarathi": "मनुष्याने सदैव भक्तीने आणि स्तोत्रांनी कमलनयन श्रीविष्णूंची अर्चना करावी, हाच सर्व धर्मांमध्ये श्रेष्ठतम धर्म आहे असे माझे मत आहे."}, {"id": "purva-15", "section": "purva", "num": "15", "label": "Śloka 15", "speaker": "Śrī Bhīṣma uvāca", "start": 188, "end": 199, "sanskrit": "परमं यो महत्तेजः परमं यो महत्तपः ।\nपरमं यो महद्ब्रह्म परमं यः परायणम् ॥ १५ ॥", "iast": "paramaṃ yo mahattejaḥ paramaṃ yo mahattapaḥ,\nparamaṃ yo mahadbrahma paramaṃ yaḥ parāyaṇam.", "meaning": "He is the supreme great light; He is the supreme great austerity; He is the supreme great Brahman (Absolute); He is the supreme highest goal.", "meaningMarathi": "जे परम महान् तेज आहेत, जे परम महान् तप आहेत, जे परम महद्ब्रह्म आहेत आणि जे परम आश्रयस्थान (परायण) आहेत."}, {"id": "purva-16", "section": "purva", "num": "16", "label": "Śloka 16", "speaker": "Śrī Bhīṣma uvāca", "start": 199, "end": 211, "sanskrit": "पवित्राणां पवित्रं यो मङ्गलानां च मङ्गलम् ।\nदैवतं देवतानां च भूतानां योऽव्ययः पिता ॥ १६ ॥", "iast": "pavitrāṇāṃ pavitraṃ yo maṅgalānāṃ ca maṅgalam,\ndaivataṃ devatānāṃ ca bhūtānāṃ yo 'vyayaḥ pitā.", "meaning": "He who is the most holy among the holy and the most auspicious among the auspicious, who is the God of gods and the inexhaustible Father of all beings.", "meaningMarathi": "जे पवित्रात पवित्र, मंगलांमध्ये परम मंगल, देवांचेही दैवत आणि सर्व प्राणिमात्रांचे अविनाशी पिता आहेत."}, {"id": "purva-17", "section": "purva", "num": "17", "label": "Śloka 17", "speaker": "Śrī Bhīṣma uvāca", "start": 211, "end": 222, "sanskrit": "यतः सर्वाणि भूतानि भवन्त्यादियुगागमे ।\nयस्मिंश्च प्रलयं यान्ति पुनरेव युगक्षये ॥ १७ ॥", "iast": "yataḥ sarvāṇi bhūtāni bhavanty ādiyugāgame,\nyasmiṃś ca pralayaṃ yānti punar eva yugakṣaye.", "meaning": "From Him all creatures proceed at the beginning of an age, and in Him they are absorbed again at the end of the age.", "meaningMarathi": "ज्यांच्यापासून युगाच्या आरंभी सर्व प्राणी निर्माण होतात आणि युगक्षयाच्या वेळी ज्यांच्यातच पुन्हा विलीन होतात."}, {"id": "purva-18", "section": "purva", "num": "18", "label": "Śloka 18", "speaker": "Śrī Bhīṣma uvāca", "start": 222, "end": 233, "sanskrit": "तस्य लोकप्रधानस्य जगन्नाथस्य भूपते ।\nविष्णोर्नामसहस्रं मे शृणु पापभयापहम् ॥ १८ ॥", "iast": "tasya lokapradhānasya jagannāthasya bhūpate,\nviṣṇor nāmasahasraṃ me śṛṇu pāpabhayāpaham.", "meaning": "Of that Chief of the world, of the Lord of the universe, O King – hear from me the thousand names of Viṣṇu, which remove all sin and fear.", "meaningMarathi": "हे राजा युधिष्ठिरा! त्या लोकप्रधान आणि जगन्नाथ श्रीविष्णूंचे पाप व भय नाहीसे करणारे सहस्रनाम माझ्याकडून ऐक."}, {"id": "purva-19", "section": "purva", "num": "19", "label": "Śloka 19", "speaker": "Śrī Bhīṣma uvāca", "start": 233, "end": 244, "sanskrit": "यानि नामानि गौणानि विख्यातानि महात्मनः ।\nऋषिभिः परिगीतानि तानि वक्ष्यामि भूतये ॥ १९ ॥", "iast": "yāni nāmāni gauṇāni vikhyātāni mahātmanaḥ,\nṛṣibhiḥ parigītāni tāni vakṣyāmi bhūtaye.", "meaning": "Those famous names of the Great Soul which reveal His manifold qualities, celebrated by rishis (seers), I shall declare for the good of all.", "meaningMarathi": "त्या महात्म्याची गुणवाचक, सुप्रसिद्ध आणि ऋषींनी गायलेली जी नामे आहेत, ती मी सर्व प्राण्यांच्या कल्याणासाठी सांगतो."}, {"id": "purva-20", "section": "purva", "num": "20", "label": "Śloka 20", "speaker": "Śrī Bhīṣma uvāca", "start": 244, "end": 255, "sanskrit": "ऋषिर्नाम्नां सहस्रस्य वेदव्यासो महामुनिः ।\nछन्दोऽनुष्टुप् तथा देवो भगवान् देवकीसुतः ॥ २० ॥", "iast": "ṛṣir nāmnāṃ sahasrasya vedavyāso mahāmuniḥ,\nchando 'nuṣṭup tathā devo bhagavān devakīsutaḥ.", "meaning": "The rishi of the thousand names is Vedavyāsa, the great contemplative sage. The metre is Anuṣṭup, and the deity is the blessed son of Devakī (Kṛṣṇa).", "meaningMarathi": "या सहस्रनाम स्तोत्राचे ऋषी महामुनी वेदव्यास आहेत, छंद अनुष्टुप् आहे आणि देवता भगवान देवकीनंदन श्रीकृष्ण आहेत."}, {"id": "purva-21", "section": "purva", "num": "21", "label": "Śloka 21", "speaker": "Śrī Bhīṣma uvāca", "start": 255, "end": 267, "sanskrit": "अमृतांशूद्भवो बीजं शक्तिर्देवकीनन्दनः ।\nत्रिसामा हृदयं तस्य शान्त्यर्थे विनियुज्यते ॥ २१ ॥", "iast": "amṛtāṃśūdbhavo bījaṃ śaktir devakīnandanaḥ,\ntrisāmā hṛdayaṃ tasya śāntyarthe viniyujyate.", "meaning": "The bīja (seed-syllable) is He born of the nectar-rayed one (Moon); the śakti (power) is the son of Devakī; Trisāmā is assigned to the heart; the purpose is the attainment of peace.", "meaningMarathi": "'अमृतांशूद्भव' हे बीज आहे, 'देवकीनंदन' ही शक्ती आहे, 'त्रिसामा' हे हृदय आहे आणि शांतीच्या प्राप्तीसाठी याचा विनियोग केला जातो."}, {"id": "purva-22", "section": "purva", "num": "22", "label": "Śloka 22", "speaker": "Śrī Bhīṣma uvāca", "start": 267, "end": 279, "sanskrit": "विष्णुं जिष्णुं महाविष्णुं प्रभविष्णुं महेश्वरम् ।\nअनेकरूप दैत्यान्तं नमामि पुरुषोत्तमम् ॥ २२ ॥", "iast": "viṣṇuṃ jiṣṇuṃ mahāviṣṇuṃ prabhaviṣṇuṃ maheśvaram,\nanekarūpa daityāntaṃ namāmi puruṣottamam.", "meaning": "I bow to Viṣṇu, the Conqueror, the Great Viṣṇu, the Creator, the Great Lord – He of many forms, the Destroyer of demons, the Supreme Person.", "meaningMarathi": "विष्णू, जिष्णू, महाविष्णू, प्रभविष्णू, महेश्वर, अनेक रूपे धारण करणारे आणि दैत्यांचा नाश करणारे अशा पुरुषोत्तमाला मी नमस्कार करतो."}, {"id": "purva-23", "section": "purva", "num": "Nyāsa", "label": "Pūrvanyāsaḥ", "speaker": "Viniyogaḥ", "start": 279, "end": 350, "sanskrit": "अस्य श्रीविष्णोर्दिव्यसहस्रनामस्तोत्रमहामन्त्रस्य । श्रीवेदव्यासो भगवान् ऋषिः । अनुष्टुप् छन्दः । श्रीमहाविष्णुः परमात्मा श्रीमन्नारायणो देवता । अमृतांशूद्भवो भानुरिति बीजम् । देवकीनन्दनः स्रष्टेति शक्तिः । उद्भवः क्षोभणो देव इति परमो मन्त्रः । शङ्खभृन्नन्दकी चक्रीति कीलकम् । शार्ङ्गधन्वा गदाधर इत्यस्त्रम् । रथाङ्गपाणिरक्षोभ्य इति नेत्रम् । त्रिसामा सामगः सामेति कवचम् । आनन्दं परब्रह्मेति योनिः । ऋतुः सुदर्शनः काल इति दिग्बन्धः । श्रीविश्वरूप इति ध्यानम् । श्रीमहाविष्णुप्रीत्यर्थे सहस्रनामपारायणे विनियोगः ॥", "iast": "asya śrīviṣṇor divyasahasranāmastotramahāmantrasya, śrīvedavyāso bhagavān ṛṣiḥ, anuṣṭup chandaḥ, śrīmahāviṣṇuḥ paramātmā śrīmannārāyaṇo devatā, amṛtāṃśūdbhavo bhānur iti bījam, devakīnandanaḥ sraṣṭeti śaktiḥ, udbhavaḥ kṣobhaṇo deva iti paramo mantraḥ, śaṅkhabhṛnnandakī cakrīti kīlakam, śārṅgadhanvā gadādhara ity astram, rathāṅgapāṇir akṣobhya iti netram, trisāmā sāmagaḥ sāmeti kavacam, ānandaṃ parabrahmeti yoniḥ, ṛtuḥ sudarśanaḥ kāla iti digbandhaḥ, śrīviśvarūpa iti dhyānam, śrīmahāviṣṇuprītyarthe sahasranāmapārāyaṇe viniyogaḥ.", "meaning": "Of this great mantra-hymn of the divine thousand names of Śrī Viṣṇu – the venerable Vedavyāsa is the seer (ṛṣi); the metre is Anuṣṭup; Śrī Mahāviṣṇu, the Supreme Self, Śrīman Nārāyaṇa, is the deity (devatā); Amṛtāṃśūdbhava Bhānu is the seed (bīja); Devakīnandanaḥ Sraṣṭā is the power (śakti); Udbhava, Kṣobhaṇa, Deva is the supreme mantra; Śaṅkhabhṛt, Nandakī, Cakrī is the pin (kīlaka); Śārṅgadhanvā, Gadādhara is the weapon (astra); Rathāṅgapāṇi, Akṣobhya is the eye (netra); Trisāmā, Sāmagaḥ, Sāma is the armour (kavaca); Ānanda, Parabrahma is the source (yoni); Ṛtu, Sudarśana, Kāla is the directional binding (digbandha); Śrī Viśvarūpa is the meditation (dhyāna). This recitation of the thousand names is undertaken for the gratification of Śrī Mahāviṣṇu (viniyoga).", "meaningMarathi": "या श्रीविष्णूंच्या दिव्य सहस्रनाम स्तोत्र महामंत्राचे भगवान श्रीवेदव्यास हे ऋषी आहेत; अनुष्टुप् हा छंद आहे; श्रीमहाविष्णू परमात्मा श्रीमन्नारायण हे देवता आहेत; 'अमृतांशूद्भवो भानुः' हे बीज आहे; 'देवकीनन्दनः स्रष्टा' ही शक्ती आहे; 'उद्भवः क्षोभणो देवः' हा परम मंत्र आहे; 'शङ्खभृन्नन्दकी चक्री' हे कीलक आहे; 'शार्ङ्गधन्वा गदाधरः' हे अस्त्र आहे; 'रथाङ्गपाणिरक्षोभ्यः' हे नेत्र आहे; 'त्रिसामा सामगः साम' हे कवच आहे; 'आनन्दं परब्रह्म' ही योनी आहे; 'ऋतुः सुदर्शनः कालः' हा दिग्बंध आहे; 'श्रीविश्वरूप' हे ध्यान आहे. श्रीमहाविष्णूंच्या प्रीतीसाठी सहस्रनाम पारायणात याचा विनियोग आहे."}, {"id": "dhyana-1", "section": "dhyanam", "num": "1", "label": "Dhyānam 1", "speaker": "Atha Dhyānam", "start": 351, "end": 381, "sanskrit": "क्षीरोदन्वत्प्रदेशे शुचिमणिविलसत्सैकते मौक्तिकानां\nमालाक्लृप्तासनस्थः स्फटिकमणिनिभैर्मौक्तिकैर्मण्डिताङ्गः ।\nशुभ्रैरभ्रैरदभ्रैरुपरिविरचितैर्मुक्तपीयूषवर्षैः\nआनन्दी नः पुनीयादरिनलिनगदाशङ्खपाणिर्मुकुन्दः ॥ १ ॥", "iast": "kṣīrodanvatpradeśe śucimaṇivilasatsaikate mauktikānāṃ\nmālākḷptāsanasthaḥ sphaṭikamaṇinibhair mauktikair maṇḍitāṅgaḥ,\nśubhrair abhrair adabhrair upariviracitair muktapīyūṣavarṣaiḥ\nānandī naḥ punīyād arinalinagadāśaṅkhapāṇir mukundaḥ.", "meaning": "In the region of the milk-ocean, seated upon a throne fashioned from a garland of pure gems and pearls, His body adorned with crystal-like pearls, amidst white and abundant clouds raining pure nectar from above – may Mukunda, the destroyer of foes, bearing discus, lotus, mace and conch in his hands, fill us with bliss and purify us.", "meaningMarathi": "क्षीरसागराच्या प्रदेशात, शुद्ध रत्ने व मोत्यांच्या वाळवंटात मोत्यांच्या माळांनी सजवलेल्या आसनावर विराजमान झालेले, स्फटिकमण्यांप्रमाणे चमकणाऱ्या मोत्यांनी अलंकृत, वरून अमृताचा वर्षाव करणाऱ्या शुभ्र मेघांखाली बसलेले, हातात चक्र, कमल, गदा व शंख धारण करणारे आनंदस्वरूप भगवान मुकुंद आम्हाला पावन करोत."}, {"id": "dhyana-2", "section": "dhyanam", "num": "2", "label": "Dhyānam 2", "speaker": "Atha Dhyānam", "start": 381, "end": 410, "sanskrit": "भूः पादौ यस्य नाभिर्वियदसुरनिलश्चन्द्र सूर्यौ च नेत्रे\nकर्णावाशाः शिरो द्यौर्मुखमपि दहनो यस्य वासो यमब्धिः ।\nअन्तःस्थं यस्य विश्वं सुरनरखगगोभोगिगन्धर्वदैत्यैः\nचित्रं रं रम्यते तं त्रिभुवनवपुषं विष्णुमीशं नमामि ॥ २ ॥", "iast": "bhūḥ pādau yasya nābhir viyad asuranilaś candra sūryau ca netre\nkarṇāv āśāḥ śiro dyaur mukham api dahano yasya vāso yam abdhiḥ,\nantaḥsthaṃ yasya viśvaṃ suranara khagago bhogi gandharva daityaiḥ\ncitraṃ raṃ ramyate taṃ tribhuvana vapuṣaṃ viṣṇum īśaṃ namāmi.", "meaning": "I bow before Viṣṇu, the Lord of three worlds – whose feet are the earth, whose navel is the sky, whose vital breath is the air, whose eyes are the moon and sun, whose ears are the four directions, whose head is the realm of gods, whose mouth is fire, whose garment is the ocean – and within whose belly play and rejoice the gods, men, birds, animals, serpent-beings, Gandharvas and Asuras.", "meaningMarathi": "पृथ्वी ज्यांचे चरण, आकाश ज्यांची नाभी, वायू ज्यांचा प्राण, चंद्र व सूर्य ज्यांचे नेत्र, दिशा ज्यांचे कान, स्वर्गलोक ज्यांचे मस्तक, अग्नी ज्यांचे मुख आणि महासागर ज्यांचे वस्त्र आहे; ज्यांच्या उदरात देव, मानव, पक्षी, पशू, नाग, गंधर्व आणि दैत्य विहार करतात, अशा त्रिभुवनरूप भगवान श्रीविष्णूंना मी नमस्कार करतो."}, {"id": "dhyana-3", "section": "dhyanam", "num": "3", "label": "Dhyānam 3", "speaker": "Atha Dhyānam", "start": 410, "end": 438, "sanskrit": "ॐ नमो भगवते वासुदेवाय ।\nशान्ताकारं भुजगशयनं पद्मनाभं सुरेशं\nविश्वाधारं गगनसदृशं मेघवर्णं शुभाङ्गम् ।\nलक्ष्मीकान्तं कमलनयनं योगिहृद्ध्यानगम्यं\nवन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम् ॥ ३ ॥", "iast": "oṃ namo bhagavate vāsudevāya.\nśāntākāraṃ bhujagaśayanaṃ padmanābhaṃ sureśaṃ\nviśvādhāraṃ gaganasadṛśaṃ meghavarṇaṃ śubhāṅgam,\nlakṣmīkāntaṃ kamalanayanaṃ yogihṛddhyānagamyaṃ\nvande viṣṇuṃ bhavabhayaharaṃ sarvalokaikanātham.", "meaning": "Om, salutations to Lord Vāsudeva. I bow before Viṣṇu – the personification of peace, who sleeps on the coils of the serpent, who has a lotus in his navel, the Lord of gods, the support of the universe, vast as the sky, dark as a raincloud, with beautiful limbs, the beloved of Lakṣmī, with lotus-like eyes, attainable by yogis through meditation, the destroyer of the fear of worldly existence, the sole Lord of all worlds.", "meaningMarathi": "ॐ नमो भगवते वासुदेवाय. शांत स्वरूप असलेले, शेषनागावर शयन करणारे, नाभीत कमळ असलेले, देवांचे स्वामी, विश्वाचे आधार, आकाशाप्रमाणे व्यापक, मेघाप्रमाणे श्यामवर्ण, सुंदर अवयव असलेले, लक्ष्मीचे पती, कमलनयन, योग्यांना ध्यानातून प्राप्त होणारे, संसारभय हरणारे आणि सर्व लोकांचे एकमेव स्वामी असलेल्या श्रीविष्णूंना मी वंदन करतो."}, {"id": "dhyana-4", "section": "dhyanam", "num": "4", "label": "Dhyānam 4", "speaker": "Atha Dhyānam", "start": 438, "end": 456, "sanskrit": "मेघश्यामं पीतकौशेयवासं\nश्रीवत्साङ्कं कौस्तुभोद्भासिताङ्गम् ।\nपुण्योपेतं पुण्डरीकायताक्षं\nविष्णुं वन्दे सर्वलोकैकनाथम् ॥ ४ ॥", "iast": "meghaśyāmaṃ pītakauśeyavāsaṃ\nśrīvatsāṅkaṃ kaustubhodbhāsitāṅgam,\npuṇyopetaṃ puṇḍarīkāyatākṣaṃ\nviṣṇuṃ vande sarvalokaikanātham.", "meaning": "I bow before Viṣṇu, the sole Lord of all the universe – dark as a raincloud, wearing yellow silk, bearing the Śrīvatsa mark, with limbs radiant from the Kaustubha gem, endowed with all auspiciousness, with eyes expansive as a full-blown lotus.", "meaningMarathi": "मेघाप्रमाणे श्यामवर्ण, पिवळे रेशमी पीतांबर नेसलेले, वक्षःस्थळावर श्रीवत्स चिन्ह आणि कौस्तुभ मण्याने शोभणारे, पुण्यसंपन्न आणि विशाल कमलनयन असलेल्या सर्वलोकैकनाथ श्रीविष्णूंना मी वंदन करतो."}, {"id": "dhyana-5", "section": "dhyanam", "num": "5", "label": "Dhyānam 5", "speaker": "Atha Dhyānam", "start": 456, "end": 467, "sanskrit": "नमः समस्तभूतानामादिभूताय भूभृते ।\nअनेकरूपरूपाय विष्णवे प्रभविष्णवे ॥ ५ ॥", "iast": "namaḥ samastabhūtānām ādibhūtāya bhūbhṛte,\nanekarūparūpāya viṣṇave prabhaviṣṇave.", "meaning": "Obeisance to Viṣṇu – the primordial source of all beings, the sustainer of the earth, He of manifold forms, the all-powerful originator.", "meaningMarathi": "सर्व प्राण्यांचे आदिकारण, पृथ्वीचे धारणकर्ते, अनेक रूपे धारण करणारे आणि सर्वसमर्थ प्रभविष्णू श्रीविष्णूंना माझा नमस्कार असो."}, {"id": "dhyana-6", "section": "dhyanam", "num": "6", "label": "Dhyānam 6", "speaker": "Atha Dhyānam", "start": 467, "end": 482, "sanskrit": "सशङ्खचक्रं सकिरीटकुण्डलं\nसपीतवस्त्रं सरसीरुहेक्षणम् ।\nसहारवक्षःस्थलशोभिकौस्तुभं\nनमामि विष्णुं शिरसा चतुर्भुजम् ॥ ६ ॥", "iast": "saśaṅkhacakraṃ sakirīṭakuṇḍalaṃ\nsapītavastraṃ sarasīruhekṣaṇam,\nsahāravakṣaḥsthalaśobhikaustubhaṃ\nnamāmi viṣṇuṃ śirasā caturbhujam.", "meaning": "I bow my head before Viṣṇu – four-armed, bearing conch and discus, wearing crown and earrings, clad in yellow silk, with lotus-like eyes, the Kaustubha gem glowing on his garlanded chest.", "meaningMarathi": "शंख व चक्र धारण केलेले, मुकुट व कुंडले परिधान केलेले, पीतांबर नेसलेले, कमलनयन, हार व कौस्तुभ मण्याने शोभणारे वक्षःस्थळ असलेल्या चतुर्भुज श्रीविष्णूंना मी मस्तक झुकवून नमस्कार करतो."}, {"id": "dhyana-7", "section": "dhyanam", "num": "7", "label": "Dhyānam 7", "speaker": "Atha Dhyānam", "start": 482, "end": 506, "sanskrit": "छायायां पारिजातस्य हेमसिंहासनोपरि\nआसीनमम्बुदश्याममायताक्षमलङ्कृतम् ।\nचन्द्राननं चतुर्बाहुं श्रीवत्साङ्कितवक्षसम्\nरुक्मिणीसत्यभामाभ्यां सहितं कृष्णमाश्रये ॥ ७ ॥", "iast": "chāyāyāṃ pārijātasya hemasiṃhāsanopari\nāsīnam ambudaśyāmam āyatākṣam alaṅkṛtam,\ncandrānanaṃ caturbāhuṃ śrīvatsāṅkitavakṣasam\nrukmiṇīsatyabhāmābhyāṃ sahitaṃ kṛṣṇam āśraye.", "meaning": "I seek refuge in Lord Kṛṣṇa – seated on a golden throne in the shade of the Pārijāta tree, dark as a raincloud, with wide eyes, beautifully adorned, with a moon-like face, four arms, and a chest bearing the Śrīvatsa mark – in the company of Rukmiṇī and Satyabhāmā.", "meaningMarathi": "पारिजात वृक्षाच्या छायेत सुवर्णसिंहासनावर विराजमान झालेले, जलदश्याम, विशाल नेत्रांचे, अलंकृत, चंद्रमुखी, चतुर्भुज, श्रीवत्सचिन्हांकित वक्षःस्थळ असलेले आणि रुक्मिणी व सत्यभामा यांच्यासह असलेल्या भगवान श्रीकृष्णांना मी शरण जातो."}, {"id": "stotram-1", "section": "stotram", "num": "1", "slokaNum": 1, "label": "Śloka 1", "speaker": "Names 1–9", "start": 514, "end": 528, "sanskrit": "विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः ।\nभूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥ १ ॥", "iast": "viśvaṃ viṣṇur vaṣaṭkāro bhūtabhavyabhavatprabhuḥ,\nbhūtakṛd bhūtabhṛd bhāvo bhūtātmā bhūtabhāvanaḥ.", "meaning": "Viśvaṃ – The all or the Universe. Viṣṇuḥ – He who pervades everything. Vaṣaṭkāraḥ – He for whom the sacrificial verses are uttered in yajñas. Bhūta-bhavya-bhavat-prabhuḥ – The master who transcends past, present and future. Bhūtakṛd – The creator and destroyer of all existences in the universe. Bhūtabhṛd – One who supports, sustains and governs the universe. Bhāvaḥ – Pure existence. Bhūtātmā – The essence of all beings. Bhūta-bhāvanaḥ – He who originates and develops all elements.", "meaningMarathi": "Viśvaṃ (संपूर्ण विश्वरूप असलेले) • Viṣṇuḥ (सर्वत्र व्यापून राहिलेले) • Vaṣaṭkāraḥ (यज्ञांतील वषट्कार मंत्राचे स्वरूप) • Bhūta-bhavya-bhavat-prabhuḥ (भूत, भविष्य आणि वर्तमानाचे स्वामी) • Bhūtakṛd (सर्व प्राण्यांची निर्मिती व संहार करणारे) • Bhūtabhṛd (संपूर्ण विश्वाचे धारण व पोषण करणारे) • Bhāvaḥ (शुद्ध सत्तारूप (अस्तित्व)) • Bhūtātmā (सर्व प्राण्यांचे अंतरात्मा) • Bhūta-bhāvanaḥ (सर्व भूतांना उत्पन्न व विकसित करणारे)", "names": [{"name": "Viśvaṃ", "meaning": "The all or the Universe.", "idx": 1, "marathi": "संपूर्ण विश्वरूप असलेले"}, {"name": "Viṣṇuḥ", "meaning": "He who pervades everything.", "idx": 2, "marathi": "सर्वत्र व्यापून राहिलेले"}, {"name": "Vaṣaṭkāraḥ", "meaning": "He for whom the sacrificial verses are uttered in yajñas.", "idx": 3, "marathi": "यज्ञांतील वषट्कार मंत्राचे स्वरूप"}, {"name": "Bhūta-bhavya-bhavat-prabhuḥ", "meaning": "The master who transcends past, present and future.", "idx": 4, "marathi": "भूत, भविष्य आणि वर्तमानाचे स्वामी"}, {"name": "Bhūtakṛd", "meaning": "The creator and destroyer of all existences in the universe.", "idx": 5, "marathi": "सर्व प्राण्यांची निर्मिती व संहार करणारे"}, {"name": "Bhūtabhṛd", "meaning": "One who supports, sustains and governs the universe.", "idx": 6, "marathi": "संपूर्ण विश्वाचे धारण व पोषण करणारे"}, {"name": "Bhāvaḥ", "meaning": "Pure existence.", "idx": 7, "marathi": "शुद्ध सत्तारूप (अस्तित्व)"}, {"name": "Bhūtātmā", "meaning": "The essence of all beings.", "idx": 8, "marathi": "सर्व प्राण्यांचे अंतरात्मा"}, {"name": "Bhūta-bhāvanaḥ", "meaning": "He who originates and develops all elements.", "idx": 9, "marathi": "सर्व भूतांना उत्पन्न व विकसित करणारे"}]}, {"id": "stotram-2", "section": "stotram", "num": "2", "slokaNum": 2, "label": "Śloka 2", "speaker": "Names 10–17", "start": 528, "end": 540, "sanskrit": "पूतात्मा परमात्मा च मुक्तानां परमा गतिः ।\nअव्ययः पुरुषः साक्षी क्षेत्रज्ञोऽक्षर एव च ॥ २ ॥", "iast": "pūtātmā paramātmā ca muktānāṃ paramā gatiḥ,\navyayaḥ puruṣaḥ sākṣī kṣetrajño 'kṣara eva ca.", "meaning": "Pūtātmā – One whose nature is purity. Paramātmā – The supreme Self. Muktānāṃ paramā gatiḥ – The highest goal of the liberated ones. Avyayaḥ – One for whom there is no decay. Puruṣaḥ – One who abides in the body (pura). Sākṣī – One who witnesses everything. Kṣetrajñaḥ – The knower of the field (body). Akṣaraḥ – He who is indestructible.", "meaningMarathi": "Pūtātmā (अत्यंत पवित्र आत्मा असलेले) • Paramātmā (परमात्मा (सर्वश्रेष्ठ आत्मा)) • Muktānāṃ paramā gatiḥ (मुक्त जीवांचे परम गतीस्थान) • Avyayaḥ (कधीही क्षय न पावणारे (अविनाशी)) • Puruṣaḥ (शरीररूपी पुरात वास करणारे पुरुष) • Sākṣī (सर्वांचे साक्षीदार) • Kṣetrajñaḥ (शरीररूपी क्षेत्राचे ज्ञाते) • Akṣaraḥ (अक्षर (नाशरहित) परब्रह्म)", "names": [{"name": "Pūtātmā", "meaning": "One whose nature is purity.", "idx": 10, "marathi": "अत्यंत पवित्र आत्मा असलेले"}, {"name": "Paramātmā", "meaning": "The supreme Self.", "idx": 11, "marathi": "परमात्मा (सर्वश्रेष्ठ आत्मा)"}, {"name": "Muktānāṃ paramā gatiḥ", "meaning": "The highest goal of the liberated ones.", "idx": 12, "marathi": "मुक्त जीवांचे परम गतीस्थान"}, {"name": "Avyayaḥ", "meaning": "One for whom there is no decay.", "idx": 13, "marathi": "कधीही क्षय न पावणारे (अविनाशी)"}, {"name": "Puruṣaḥ", "meaning": "One who abides in the body (pura).", "idx": 14, "marathi": "शरीररूपी पुरात वास करणारे पुरुष"}, {"name": "Sākṣī", "meaning": "One who witnesses everything.", "idx": 15, "marathi": "सर्वांचे साक्षीदार"}, {"name": "Kṣetrajñaḥ", "meaning": "The knower of the field (body).", "idx": 16, "marathi": "शरीररूपी क्षेत्राचे ज्ञाते"}, {"name": "Akṣaraḥ", "meaning": "He who is indestructible.", "idx": 17, "marathi": "अक्षर (नाशरहित) परब्रह्म"}]}, {"id": "stotram-3", "section": "stotram", "num": "3", "slokaNum": 3, "label": "Śloka 3", "speaker": "Names 18–24", "start": 540, "end": 552, "sanskrit": "योगो योगविदां नेता प्रधानपुरुषेश्वरः ।\nनारसिंहवपुः श्रीमान् केशवः पुरुषोत्तमः ॥ ३ ॥", "iast": "yogo yogavidāṃ netā pradhānapuruṣeśvaraḥ,\nnārasiṃhavapuḥ śrīmān keśavaḥ puruṣottamaḥ.", "meaning": "Yogaḥ – One attainable through Yoga. Yogavidāṃ netā – The master of those established in Yoga. Pradhāna-puruṣeśvaraḥ – The master of Pradhāna (Prakṛti) and Puruṣa (Jīva). Nārasiṃha-vapuḥ – One who combined the bodies of a man and a lion. Śrīmān – One on whose chest the goddess Śrī always dwells. Keśavaḥ – One whose locks (keśa) are beautiful. Puruṣottamaḥ – The greatest among all Puruṣas.", "meaningMarathi": "Yogaḥ (योगाद्वारे प्राप्त होणारे) • Yogavidāṃ netā (योगज्ञांचे मार्गदर्शक व नेते) • Pradhāna-puruṣeśvaraḥ (प्रकृती (प्रधान) आणि पुरुष यांचे ईश्वर) • Nārasiṃha-vapuḥ (नर आणि सिंहाचे संयुक्त रूप धारण करणारे) • Śrīmān (ज्यांच्या वक्षःस्थळावर श्रीलक्ष्मी सदैव वास करते) • Keśavaḥ (सुंदर केश असलेले केशव) • Puruṣottamaḥ (सर्व पुरुषांमध्ये श्रेष्ठ पुरुषोत्तम)", "names": [{"name": "Yogaḥ", "meaning": "One attainable through Yoga.", "idx": 18, "marathi": "योगाद्वारे प्राप्त होणारे"}, {"name": "Yogavidāṃ netā", "meaning": "The master of those established in Yoga.", "idx": 19, "marathi": "योगज्ञांचे मार्गदर्शक व नेते"}, {"name": "Pradhāna-puruṣeśvaraḥ", "meaning": "The master of Pradhāna (Prakṛti) and Puruṣa (Jīva).", "idx": 20, "marathi": "प्रकृती (प्रधान) आणि पुरुष यांचे ईश्वर"}, {"name": "Nārasiṃha-vapuḥ", "meaning": "One who combined the bodies of a man and a lion.", "idx": 21, "marathi": "नर आणि सिंहाचे संयुक्त रूप धारण करणारे"}, {"name": "Śrīmān", "meaning": "One on whose chest the goddess Śrī always dwells.", "idx": 22, "marathi": "ज्यांच्या वक्षःस्थळावर श्रीलक्ष्मी सदैव वास करते"}, {"name": "Keśavaḥ", "meaning": "One whose locks (keśa) are beautiful.", "idx": 23, "marathi": "सुंदर केश असलेले केशव"}, {"name": "Puruṣottamaḥ", "meaning": "The greatest among all Puruṣas.", "idx": 24, "marathi": "सर्व पुरुषांमध्ये श्रेष्ठ पुरुषोत्तम"}]}, {"id": "stotram-4", "section": "stotram", "num": "4", "slokaNum": 4, "label": "Śloka 4", "speaker": "Names 25–36", "start": 552, "end": 563, "sanskrit": "सर्वः शर्वः शिवः स्थाणुर्भूतादिर्निधिरव्ययः ।\nसम्भवो भावनो भर्ता प्रभवः प्रभुरीश्वरः ॥ ४ ॥", "iast": "sarvaḥ śarvaḥ śivaḥ sthāṇur bhūtādir nidhir avyayaḥ,\nsaṃbhavo bhāvano bhartā prabhavaḥ prabhur īśvaraḥ.", "meaning": "Sarvaḥ – The omniscient source of all existence. Śarvaḥ – Destroyer. Śivaḥ – The pure one. Sthāṇuḥ – One who is steady, immovable and changeless. Bhūtādiḥ – Source of all elements. Nidhir-avyayaḥ – The changeless, indestructible Being in whom the universe dissolves at Pralaya. Sambhavaḥ – One who incarnates by His own will. Bhāvanaḥ – One who generates the fruits of Karma for all Jīvas. Bhartā – One who supports the universe as its substratum. Prabhavaḥ – One from whom all great elements have their birth. Prabhuḥ – One who is adept in all rites. Īśvaraḥ – One who has unlimited lordliness and power over all things.", "meaningMarathi": "Sarvaḥ (सर्वज्ञ आणि सर्वांचे मूलकारण) • Śarvaḥ (संहारक (शर्व)) • Śivaḥ (परम पवित्र व मंगलमय (शिव)) • Sthāṇuḥ (स्थिर, अचल आणि विकाररहित) • Bhūtādiḥ (सर्व पंचमहाभूतांचे आदिकारण) • Nidhir-avyayaḥ (प्रलयकाळी सर्व विश्व सामावून घेणारे अविनाशी निधी) • Sambhavaḥ (स्वेच्छेने अवतार घेणारे) • Bhāvanaḥ (जीवांना कर्मफळ देणारे) • Bhartā (विश्वाचे आधार व भरणपोषण करणारे) • Prabhavaḥ (सर्व महाभूतांचे उगमस्थान) • Prabhuḥ (सर्व कार्यांत निपुण प्रभू) • Īśvaraḥ (असीम ऐश्वर्य व सामर्थ्य असलेले ईश्वर)", "names": [{"name": "Sarvaḥ", "meaning": "The omniscient source of all existence.", "idx": 25, "marathi": "सर्वज्ञ आणि सर्वांचे मूलकारण"}, {"name": "Śarvaḥ", "meaning": "Destroyer.", "idx": 26, "marathi": "संहारक (शर्व)"}, {"name": "Śivaḥ", "meaning": "The pure one.", "idx": 27, "marathi": "परम पवित्र व मंगलमय (शिव)"}, {"name": "Sthāṇuḥ", "meaning": "One who is steady, immovable and changeless.", "idx": 28, "marathi": "स्थिर, अचल आणि विकाररहित"}, {"name": "Bhūtādiḥ", "meaning": "Source of all elements.", "idx": 29, "marathi": "सर्व पंचमहाभूतांचे आदिकारण"}, {"name": "Nidhir-avyayaḥ", "meaning": "The changeless, indestructible Being in whom the universe dissolves at Pralaya.", "idx": 30, "marathi": "प्रलयकाळी सर्व विश्व सामावून घेणारे अविनाशी निधी"}, {"name": "Sambhavaḥ", "meaning": "One who incarnates by His own will.", "idx": 31, "marathi": "स्वेच्छेने अवतार घेणारे"}, {"name": "Bhāvanaḥ", "meaning": "One who generates the fruits of Karma for all Jīvas.", "idx": 32, "marathi": "जीवांना कर्मफळ देणारे"}, {"name": "Bhartā", "meaning": "One who supports the universe as its substratum.", "idx": 33, "marathi": "विश्वाचे आधार व भरणपोषण करणारे"}, {"name": "Prabhavaḥ", "meaning": "One from whom all great elements have their birth.", "idx": 34, "marathi": "सर्व महाभूतांचे उगमस्थान"}, {"name": "Prabhuḥ", "meaning": "One who is adept in all rites.", "idx": 35, "marathi": "सर्व कार्यांत निपुण प्रभू"}, {"name": "Īśvaraḥ", "meaning": "One who has unlimited lordliness and power over all things.", "idx": 36, "marathi": "असीम ऐश्वर्य व सामर्थ्य असलेले ईश्वर"}]}, {"id": "stotram-5", "section": "stotram", "num": "5", "slokaNum": 5, "label": "Śloka 5", "speaker": "Names 37–45", "start": 563, "end": 575, "sanskrit": "स्वयम्भूः शम्भुरादित्यः पुष्कराक्षो महास्वनः ।\nअनादिनिधनो धाता विधाता धातुरुत्तमः ॥ ५ ॥", "iast": "svayaṃbhūḥ śambhur ādityaḥ puṣkarākṣo mahāsvanaḥ,\nanādinidhano dhātā vidhātā dhāturuttamaḥ.", "meaning": "Svayambhūḥ – One who exists by Himself, uncaused. Śambhuḥ – One who bestows happiness on devotees. Ādityaḥ – The golden-hued person in the sun's orb. Puṣkarākṣaḥ – One with eyes resembling lotus petals. Mahāsvanaḥ – One from whom comes the great sound – the Veda. Anādi-nidhanaḥ – The one existence that has neither beginning nor end. Dhātā – One who is the support of the universe. Vidhātā – He who generates Karmas and their fruits. Dhāturuttamaḥ – The ultimate support of everything.", "meaningMarathi": "Svayambhūḥ (स्वयंभू (स्वतःहून अस्तित्वात असलेले)) • Śambhuḥ (भक्तांना सुख देणारे शंभू) • Ādityaḥ (सूर्यमंडळातील सुवर्णकांती आदित्य) • Puṣkarākṣaḥ (कमलदलांप्रमाणे नेत्र असलेले) • Mahāsvanaḥ (वेदरूपी महाध्वनीचे उगमस्थान) • Anādi-nidhanaḥ (आदि व अंत नसलेले) • Dhātā (विश्वाचे धारणकर्ते धाता) • Vidhātā (कर्मे व त्यांची फळे निर्माण करणारे विधाता) • Dhāturuttamaḥ (सर्वांचा परम आधार (धातुरुत्तम))", "names": [{"name": "Svayambhūḥ", "meaning": "One who exists by Himself, uncaused.", "idx": 37, "marathi": "स्वयंभू (स्वतःहून अस्तित्वात असलेले)"}, {"name": "Śambhuḥ", "meaning": "One who bestows happiness on devotees.", "idx": 38, "marathi": "भक्तांना सुख देणारे शंभू"}, {"name": "Ādityaḥ", "meaning": "The golden-hued person in the sun's orb.", "idx": 39, "marathi": "सूर्यमंडळातील सुवर्णकांती आदित्य"}, {"name": "Puṣkarākṣaḥ", "meaning": "One with eyes resembling lotus petals.", "idx": 40, "marathi": "कमलदलांप्रमाणे नेत्र असलेले"}, {"name": "Mahāsvanaḥ", "meaning": "One from whom comes the great sound – the Veda.", "idx": 41, "marathi": "वेदरूपी महाध्वनीचे उगमस्थान"}, {"name": "Anādi-nidhanaḥ", "meaning": "The one existence that has neither beginning nor end.", "idx": 42, "marathi": "आदि व अंत नसलेले"}, {"name": "Dhātā", "meaning": "One who is the support of the universe.", "idx": 43, "marathi": "विश्वाचे धारणकर्ते धाता"}, {"name": "Vidhātā", "meaning": "He who generates Karmas and their fruits.", "idx": 44, "marathi": "कर्मे व त्यांची फळे निर्माण करणारे विधाता"}, {"name": "Dhāturuttamaḥ", "meaning": "The ultimate support of everything.", "idx": 45, "marathi": "सर्वांचा परम आधार (धातुरुत्तम)"}]}, {"id": "stotram-6", "section": "stotram", "num": "6", "slokaNum": 6, "label": "Śloka 6", "speaker": "Names 46–54", "start": 575, "end": 586, "sanskrit": "अप्रमेयो हृषीकेशः पद्मनाभोऽमरप्रभुः ।\nविश्वकर्मा मनुस्त्वष्टा स्थविष्ठः स्थविरो ध्रुवः ॥ ६ ॥", "iast": "aprameyo hṛṣīkeśaḥ padmanābho 'maraprabhuḥ,\nviśvakarmā manus tvaṣṭā sthaviṣṭhaḥ sthaviro dhruvaḥ.", "meaning": "Aprameyaḥ – One not measurable by any means of knowledge. Hṛṣīkeśaḥ – The master of the senses. Padmanābhaḥ – He in whose navel stands the lotus, the source of the universe. Amara-prabhuḥ – The master of the immortal ones (Devas). Viśvakarmā – He whose works have resulted in all that exists. Manuḥ – He who thinks. Tvaṣṭā – He who makes all beings contract at the time of cosmic dissolution. Sthaviṣṭhaḥ – He who excels in bulk and substantiality. Sthaviraḥ-dhruvaḥ – The eternal, most ancient and unchanging One.", "meaningMarathi": "Aprameyaḥ (कोणत्याही प्रमाणाने मोजता न येणारे) • Hṛṣīkeśaḥ (सर्व इंद्रियांचे स्वामी (हृषीकेश)) • Padmanābhaḥ (ज्यांच्या नाभीत विश्वाचे कारण असे कमळ आहे) • Amara-prabhuḥ (अमर देवांचे प्रभू) • Viśvakarmā (संपूर्ण विश्वाचे निर्माता (विश्वकर्मा)) • Manuḥ (मननशील (मनू)) • Tvaṣṭā (प्रलयकाळी सृष्टीचे संकोचन करणारे (त्वष्टा)) • Sthaviṣṭhaḥ (अत्यंत विशाल व स्थूल रूप असलेले) • Sthaviraḥ-dhruvaḥ (अत्यंत प्राचीन, सनातन व अचल)", "names": [{"name": "Aprameyaḥ", "meaning": "One not measurable by any means of knowledge.", "idx": 46, "marathi": "कोणत्याही प्रमाणाने मोजता न येणारे"}, {"name": "Hṛṣīkeśaḥ", "meaning": "The master of the senses.", "idx": 47, "marathi": "सर्व इंद्रियांचे स्वामी (हृषीकेश)"}, {"name": "Padmanābhaḥ", "meaning": "He in whose navel stands the lotus, the source of the universe.", "idx": 48, "marathi": "ज्यांच्या नाभीत विश्वाचे कारण असे कमळ आहे"}, {"name": "Amara-prabhuḥ", "meaning": "The master of the immortal ones (Devas).", "idx": 49, "marathi": "अमर देवांचे प्रभू"}, {"name": "Viśvakarmā", "meaning": "He whose works have resulted in all that exists.", "idx": 50, "marathi": "संपूर्ण विश्वाचे निर्माता (विश्वकर्मा)"}, {"name": "Manuḥ", "meaning": "He who thinks.", "idx": 51, "marathi": "मननशील (मनू)"}, {"name": "Tvaṣṭā", "meaning": "He who makes all beings contract at the time of cosmic dissolution.", "idx": 52, "marathi": "प्रलयकाळी सृष्टीचे संकोचन करणारे (त्वष्टा)"}, {"name": "Sthaviṣṭhaḥ", "meaning": "He who excels in bulk and substantiality.", "idx": 53, "marathi": "अत्यंत विशाल व स्थूल रूप असलेले"}, {"name": "Sthaviraḥ-dhruvaḥ", "meaning": "The eternal, most ancient and unchanging One.", "idx": 54, "marathi": "अत्यंत प्राचीन, सनातन व अचल"}]}, {"id": "stotram-7", "section": "stotram", "num": "7", "slokaNum": 7, "label": "Śloka 7", "speaker": "Names 55–63", "start": 586, "end": 598, "sanskrit": "अग्राह्यः शाश्वतः कृष्णो लोहिताक्षः प्रतर्दनः ।\nप्रभूतस्त्रिककुब्धाम पवित्रं मङ्गलं परम् ॥ ७ ॥", "iast": "agrāhyaḥ śāśvataḥ kṛṣṇo lohitākṣaḥ pratardanaḥ,\nprabhūtas trikakubdhāma pavitraṃ maṅgalaṃ param.", "meaning": "Agrāhyaḥ – One who cannot be grasped by the organs of knowledge. Śāśvataḥ – One who exists at all times. Kṛṣṇaḥ – Existence-Knowledge-Bliss. Lohitākṣaḥ – One whose eyes are tinged red. Pratardanaḥ – Destroyer of all at the time of cosmic dissolution. Prabhūtaḥ – Great because of unique qualities like omnipotence and omniscience. Tri-kakub-dhāma – The support of the three regions – above, below and in the middle. Pavitraṃ – That which purifies everything. Maṅgalaṃ param – Supremely auspicious.", "meaningMarathi": "Agrāhyaḥ (इंद्रियांना व मनाला अगम्य) • Śāśvataḥ (सर्वकाळ अस्तित्वात असलेले शाश्वत) • Kṛṣṇaḥ (सच्चिदानंद स्वरूप श्रीकृष्ण) • Lohitākṣaḥ (लालसर कमलासारखे नेत्र असलेले) • Pratardanaḥ (प्रलयकाळी सर्वांचा संहार करणारे) • Prabhūtaḥ (सर्वज्ञत्व व सर्वशक्तिमत्त्वाने परिपूर्ण) • Tri-kakub-dhāma (ऊर्ध्व, मध्य व अधो या तीन लोकांचे आधार) • Pavitraṃ (सर्वांना पवित्र करणारे) • Maṅgalaṃ param (परम मंगलमय)", "names": [{"name": "Agrāhyaḥ", "meaning": "One who cannot be grasped by the organs of knowledge.", "idx": 55, "marathi": "इंद्रियांना व मनाला अगम्य"}, {"name": "Śāśvataḥ", "meaning": "One who exists at all times.", "idx": 56, "marathi": "सर्वकाळ अस्तित्वात असलेले शाश्वत"}, {"name": "Kṛṣṇaḥ", "meaning": "Existence-Knowledge-Bliss.", "idx": 57, "marathi": "सच्चिदानंद स्वरूप श्रीकृष्ण"}, {"name": "Lohitākṣaḥ", "meaning": "One whose eyes are tinged red.", "idx": 58, "marathi": "लालसर कमलासारखे नेत्र असलेले"}, {"name": "Pratardanaḥ", "meaning": "Destroyer of all at the time of cosmic dissolution.", "idx": 59, "marathi": "प्रलयकाळी सर्वांचा संहार करणारे"}, {"name": "Prabhūtaḥ", "meaning": "Great because of unique qualities like omnipotence and omniscience.", "idx": 60, "marathi": "सर्वज्ञत्व व सर्वशक्तिमत्त्वाने परिपूर्ण"}, {"name": "Tri-kakub-dhāma", "meaning": "The support of the three regions – above, below and in the middle.", "idx": 61, "marathi": "ऊर्ध्व, मध्य व अधो या तीन लोकांचे आधार"}, {"name": "Pavitraṃ", "meaning": "That which purifies everything.", "idx": 62, "marathi": "सर्वांना पवित्र करणारे"}, {"name": "Maṅgalaṃ param", "meaning": "Supremely auspicious.", "idx": 63, "marathi": "परम मंगलमय"}]}, {"id": "stotram-8", "section": "stotram", "num": "8", "slokaNum": 8, "label": "Śloka 8", "speaker": "Names 64–73", "start": 598, "end": 610, "sanskrit": "ईशानः प्राणदः प्राणो ज्येष्ठः श्रेष्ठः प्रजापतिः ।\nहिरण्यगर्भो भूगर्भो माधवो मधुसूदनः ॥ ८ ॥", "iast": "īśānaḥ prāṇadaḥ prāṇo jyeṣṭhaḥ śreṣṭhaḥ prajāpatiḥ,\nhiraṇyagarbho bhūgarbho mādhavo madhusūdanaḥ.", "meaning": "Īśānaḥ – He who controls and regulates everything. Prāṇadaḥ – One who bestows and activates Prāṇa, the vital energy. Prāṇaḥ – The Supreme Being. Jyeṣṭhaḥ – The eldest of all; for there is nothing before Him. Śreṣṭhaḥ – One deserving the highest praise. Prajāpatiḥ – The master of all living beings. Hiraṇyagarbhaḥ – One who is the Ātman of even Brahmā the creator. Bhūgarbhaḥ – One who has the world within Himself. Mādhavaḥ – The Consort of Mā (Mahālakṣmī); or one known through Madhu-Vidyā. Madhusūdanaḥ – The destroyer of the demon Madhu.", "meaningMarathi": "Īśānaḥ (सर्वांचे नियमन व शासन करणारे ईशान) • Prāṇadaḥ (प्राणशक्ती देणारे) • Prāṇaḥ (स्वतः परम प्राणस्वरूप) • Jyeṣṭhaḥ (सर्वांत ज्येष्ठ (आद्य)) • Śreṣṭhaḥ (सर्वोच्च स्तुतीस पात्र श्रेष्ठ) • Prajāpatiḥ (सर्व प्रजाजनांचे स्वामी प्रजापती) • Hiraṇyagarbhaḥ (ब्रह्मदेवाचेही अंतरात्मा हिरण्यगर्भ) • Bhūgarbhaḥ (संपूर्ण पृथ्वी ज्यांच्या उदरात आहे) • Mādhavaḥ (महालक्ष्मीचे पती (माधव)) • Madhusūdanaḥ (मधू दैत्याचा नाश करणारे मधुसूदन)", "names": [{"name": "Īśānaḥ", "meaning": "He who controls and regulates everything.", "idx": 64, "marathi": "सर्वांचे नियमन व शासन करणारे ईशान"}, {"name": "Prāṇadaḥ", "meaning": "One who bestows and activates Prāṇa, the vital energy.", "idx": 65, "marathi": "प्राणशक्ती देणारे"}, {"name": "Prāṇaḥ", "meaning": "The Supreme Being.", "idx": 66, "marathi": "स्वतः परम प्राणस्वरूप"}, {"name": "Jyeṣṭhaḥ", "meaning": "The eldest of all; for there is nothing before Him.", "idx": 67, "marathi": "सर्वांत ज्येष्ठ (आद्य)"}, {"name": "Śreṣṭhaḥ", "meaning": "One deserving the highest praise.", "idx": 68, "marathi": "सर्वोच्च स्तुतीस पात्र श्रेष्ठ"}, {"name": "Prajāpatiḥ", "meaning": "The master of all living beings.", "idx": 69, "marathi": "सर्व प्रजाजनांचे स्वामी प्रजापती"}, {"name": "Hiraṇyagarbhaḥ", "meaning": "One who is the Ātman of even Brahmā the creator.", "idx": 70, "marathi": "ब्रह्मदेवाचेही अंतरात्मा हिरण्यगर्भ"}, {"name": "Bhūgarbhaḥ", "meaning": "One who has the world within Himself.", "idx": 71, "marathi": "संपूर्ण पृथ्वी ज्यांच्या उदरात आहे"}, {"name": "Mādhavaḥ", "meaning": "The Consort of Mā (Mahālakṣmī); or one known through Madhu-Vidyā.", "idx": 72, "marathi": "महालक्ष्मीचे पती (माधव)"}, {"name": "Madhusūdanaḥ", "meaning": "The destroyer of the demon Madhu.", "idx": 73, "marathi": "मधू दैत्याचा नाश करणारे मधुसूदन"}]}, {"id": "stotram-9", "section": "stotram", "num": "9", "slokaNum": 9, "label": "Śloka 9", "speaker": "Names 74–84", "start": 610, "end": 622, "sanskrit": "ईश्वरो विक्रमी धन्वी मेधावी विक्रमः क्रमः ।\nअनुत्तमो दुराधर्षः कृतज्ञः कृतिरात्मवान् ॥ ९ ॥", "iast": "īśvaro vikramī dhanvī medhāvī vikramaḥ kramaḥ,\nanuttamo durādharṣaḥ kṛtajñaḥ kṛtir ātmavān.", "meaning": "Īśvaraḥ – The Omnipotent Being. Vikramī – The courageous One. Dhanvī – One armed with a bow. Medhāvī – He of great intelligence capable of grasping all texts. Vikramaḥ – He who transcends saṃsāra; or one whose mount is Garuḍa. Kramaḥ – The cause of crossing the ocean of saṃsāra for devotees. Anuttamaḥ – He than whom there is none greater. Durādharṣaḥ – One whom none can overcome. Kṛtajñaḥ – One who knows everything done by Jīvas; pleased even by simple offerings. Kṛtiḥ – That which is achieved through all human effort. Ātmavān – One established in His own greatness, requiring no other support.", "meaningMarathi": "Īśvaraḥ (सर्वशक्तिमान ईश्वर) • Vikramī (महापराक्रमी विक्रमी) • Dhanvī (धनुष्य धारण करणारे धन्वी) • Medhāvī (असाधारण बुद्धी व मेधा असलेले) • Vikramaḥ (संसारसागर पार करणारे (गरुडवाहन)) • Kramaḥ (भक्तांना संसार पार नेणारे क्रम) • Anuttamaḥ (ज्यांच्याहून श्रेष्ठ कोणीही नाही) • Durādharṣaḥ (कोणालाही जिंकता न येणारे) • Kṛtajñaḥ (जीवांच्या प्रत्येक कृतीची जाणीव ठेवणारे कृतज्ञ) • Kṛtiḥ (सर्व प्रयत्नांचे अंतिम फलस्वरूप) • Ātmavān (स्वतःच्याच महिमेत प्रतिष्ठित असलेले)", "names": [{"name": "Īśvaraḥ", "meaning": "The Omnipotent Being.", "idx": 74, "marathi": "सर्वशक्तिमान ईश्वर"}, {"name": "Vikramī", "meaning": "The courageous One.", "idx": 75, "marathi": "महापराक्रमी विक्रमी"}, {"name": "Dhanvī", "meaning": "One armed with a bow.", "idx": 76, "marathi": "धनुष्य धारण करणारे धन्वी"}, {"name": "Medhāvī", "meaning": "He of great intelligence capable of grasping all texts.", "idx": 77, "marathi": "असाधारण बुद्धी व मेधा असलेले"}, {"name": "Vikramaḥ", "meaning": "He who transcends saṃsāra; or one whose mount is Garuḍa.", "idx": 78, "marathi": "संसारसागर पार करणारे (गरुडवाहन)"}, {"name": "Kramaḥ", "meaning": "The cause of crossing the ocean of saṃsāra for devotees.", "idx": 79, "marathi": "भक्तांना संसार पार नेणारे क्रम"}, {"name": "Anuttamaḥ", "meaning": "He than whom there is none greater.", "idx": 80, "marathi": "ज्यांच्याहून श्रेष्ठ कोणीही नाही"}, {"name": "Durādharṣaḥ", "meaning": "One whom none can overcome.", "idx": 81, "marathi": "कोणालाही जिंकता न येणारे"}, {"name": "Kṛtajñaḥ", "meaning": "One who knows everything done by Jīvas; pleased even by simple offerings.", "idx": 82, "marathi": "जीवांच्या प्रत्येक कृतीची जाणीव ठेवणारे कृतज्ञ"}, {"name": "Kṛtiḥ", "meaning": "That which is achieved through all human effort.", "idx": 83, "marathi": "सर्व प्रयत्नांचे अंतिम फलस्वरूप"}, {"name": "Ātmavān", "meaning": "One established in His own greatness, requiring no other support.", "idx": 84, "marathi": "स्वतःच्याच महिमेत प्रतिष्ठित असलेले"}]}, {"id": "stotram-10", "section": "stotram", "num": "10", "slokaNum": 10, "label": "Śloka 10", "speaker": "Names 85–94", "start": 622, "end": 633, "sanskrit": "सुरेशः शरणं शर्म विश्वरेताः प्रजाभवः ।\nअहः संवत्सरो व्यालः प्रत्ययः सर्वदर्शनः ॥ १० ॥", "iast": "sureśaḥ śaraṇaṃ śarma viśvaretāḥ prajābhavaḥ,\nahaḥ saṃvatsaro vyālaḥ pratyayaḥ sarvadarśanaḥ.", "meaning": "Sureśaḥ – The lord of the Suras (Devas). Śaraṇaṃ – One who removes the sorrows of those in distress. Śarma – One who is of the nature of supreme bliss. Viśvaretāḥ – The seed of the universe. Prajābhavaḥ – He from whom all beings have originated. Ahaḥ – The luminous one. Saṃvatsaraḥ – As Time is a form of Viṣṇu, He is called Saṃvatsara (a year). Vyālaḥ – Being ungraspable like a serpent. Pratyayaḥ – One of the nature of Prajñā (consciousness). Sarva-darśanaḥ – One with eyes everywhere.", "meaningMarathi": "Sureśaḥ (सर्व देवांचे स्वामी सुरेश) • Śaraṇaṃ (दीनदुःखितांचे शरणस्थान) • Śarma (परमानंद स्वरूप शर्म) • Viśvaretāḥ (विश्वाचे मूलबीज (विश्वरेता)) • Prajābhavaḥ (सर्व प्रजेची उत्पत्ती ज्यांच्यापासून होते) • Ahaḥ (तेजोमय दिवसस्वरूप (अहः)) • Saṃvatsaraḥ (कालस्वरूप संवत्सर) • Vyālaḥ (सर्पाप्रमाणे पकडण्यास अगम्य (व्याल)) • Pratyayaḥ (प्रज्ञा व बोधस्वरूप प्रत्यय) • Sarva-darśanaḥ (सर्वत्र दृष्टी असलेले सर्वदर्शन)", "names": [{"name": "Sureśaḥ", "meaning": "The lord of the Suras (Devas).", "idx": 85, "marathi": "सर्व देवांचे स्वामी सुरेश"}, {"name": "Śaraṇaṃ", "meaning": "One who removes the sorrows of those in distress.", "idx": 86, "marathi": "दीनदुःखितांचे शरणस्थान"}, {"name": "Śarma", "meaning": "One who is of the nature of supreme bliss.", "idx": 87, "marathi": "परमानंद स्वरूप शर्म"}, {"name": "Viśvaretāḥ", "meaning": "The seed of the universe.", "idx": 88, "marathi": "विश्वाचे मूलबीज (विश्वरेता)"}, {"name": "Prajābhavaḥ", "meaning": "He from whom all beings have originated.", "idx": 89, "marathi": "सर्व प्रजेची उत्पत्ती ज्यांच्यापासून होते"}, {"name": "Ahaḥ", "meaning": "The luminous one.", "idx": 90, "marathi": "तेजोमय दिवसस्वरूप (अहः)"}, {"name": "Saṃvatsaraḥ", "meaning": "As Time is a form of Viṣṇu, He is called Saṃvatsara (a year).", "idx": 91, "marathi": "कालस्वरूप संवत्सर"}, {"name": "Vyālaḥ", "meaning": "Being ungraspable like a serpent.", "idx": 92, "marathi": "सर्पाप्रमाणे पकडण्यास अगम्य (व्याल)"}, {"name": "Pratyayaḥ", "meaning": "One of the nature of Prajñā (consciousness).", "idx": 93, "marathi": "प्रज्ञा व बोधस्वरूप प्रत्यय"}, {"name": "Sarva-darśanaḥ", "meaning": "One with eyes everywhere.", "idx": 94, "marathi": "सर्वत्र दृष्टी असलेले सर्वदर्शन"}]}, {"id": "stotram-11", "section": "stotram", "num": "11", "slokaNum": 11, "label": "Śloka 11", "speaker": "Names 95–103", "start": 633, "end": 644, "sanskrit": "अजः सर्वेश्वरः सिद्धः सिद्धिः सर्वादिरच्युतः ।\nवृषाकपिरमेयात्मा सर्वयोगविनिःसृतः ॥ ११ ॥", "iast": "ajaḥ sarveśvaraḥ siddhaḥ siddhiḥ sarvādir acyutaḥ,\nvṛṣākapir ameyātmā sarvayogaviniḥsṛtaḥ.", "meaning": "Ajaḥ – One who has no birth. Sarveśvaraḥ – The supreme Lord of all lords. Siddhaḥ – One ever established in one's own nature. Siddhiḥ – One who is of the nature of Consciousness in all. Sarvādiḥ – One who is the first cause of all elements. Acyutaḥ – One who never loses His inherent nature and powers. Vṛṣākapiḥ – One who showers all objects of desire. Ameyātmā – One whose form or nature cannot be measured. Sarvayoga-viniḥsṛtaḥ – One completely free from all bondage.", "meaningMarathi": "Ajaḥ (जन्मरहित (अज)) • Sarveśvaraḥ (सर्व ईश्वरांचेही परमेश्वर) • Siddhaḥ (सदैव स्वस्वरूपात सिद्ध असलेले) • Siddhiḥ (सर्वांतील चैतन्यरूपी सिद्धी) • Sarvādiḥ (सर्व तत्त्वांचे आदिकारण) • Acyutaḥ (स्वस्वरूपापासून कधीही च्युत न होणारे अच्युत) • Vṛṣākapiḥ (इष्ट कामनांचा वर्षाव करणारे वृषाकपि) • Ameyātmā (ज्यांचे स्वरूप मोजता येत नाही असे अमेयात्मा) • Sarvayoga-viniḥsṛtaḥ (सर्व बंधनांपासून पूर्णतः मुक्त)", "names": [{"name": "Ajaḥ", "meaning": "One who has no birth.", "idx": 95, "marathi": "जन्मरहित (अज)"}, {"name": "Sarveśvaraḥ", "meaning": "The supreme Lord of all lords.", "idx": 96, "marathi": "सर्व ईश्वरांचेही परमेश्वर"}, {"name": "Siddhaḥ", "meaning": "One ever established in one's own nature.", "idx": 97, "marathi": "सदैव स्वस्वरूपात सिद्ध असलेले"}, {"name": "Siddhiḥ", "meaning": "One who is of the nature of Consciousness in all.", "idx": 98, "marathi": "सर्वांतील चैतन्यरूपी सिद्धी"}, {"name": "Sarvādiḥ", "meaning": "One who is the first cause of all elements.", "idx": 99, "marathi": "सर्व तत्त्वांचे आदिकारण"}, {"name": "Acyutaḥ", "meaning": "One who never loses His inherent nature and powers.", "idx": 100, "marathi": "स्वस्वरूपापासून कधीही च्युत न होणारे अच्युत"}, {"name": "Vṛṣākapiḥ", "meaning": "One who showers all objects of desire.", "idx": 101, "marathi": "इष्ट कामनांचा वर्षाव करणारे वृषाकपि"}, {"name": "Ameyātmā", "meaning": "One whose form or nature cannot be measured.", "idx": 102, "marathi": "ज्यांचे स्वरूप मोजता येत नाही असे अमेयात्मा"}, {"name": "Sarvayoga-viniḥsṛtaḥ", "meaning": "One completely free from all bondage.", "idx": 103, "marathi": "सर्व बंधनांपासून पूर्णतः मुक्त"}]}, {"id": "stotram-12", "section": "stotram", "num": "12", "slokaNum": 12, "label": "Śloka 12", "speaker": "Names 104–113", "start": 644, "end": 656, "sanskrit": "वसुर्वसुमनाः सत्यः समात्मा सम्मितः समः ।\nअमोघः पुण्डरीकाक्षो वृषकर्मा वृषाकृतिः ॥ १२ ॥", "iast": "vasur vasumanāḥ satyaḥ samātmā sammitaḥ samaḥ,\namoghaḥ puṇḍarīkākṣo vṛṣakarmā vṛṣākṛtiḥ.", "meaning": "Vasuḥ – One in whom all beings dwell and who dwells in all beings. Vasumanāḥ – One possessed of a great, unattached mind. Satyaḥ – One whose nature is Truth. Samātmā – One whose mind is the same towards all beings. Sammitaḥ – The immeasurable one. Samaḥ – One unperturbed at all times. Amoghaḥ – One whose worship never goes in vain. Puṇḍarīkākṣaḥ – One whose eyes resemble lotus petals. Vṛṣakarmā – One whose actions are in accordance with Dharma. Vṛṣākṛtiḥ – One who takes form for the sake of Dharma.", "meaningMarathi": "Vasuḥ (सर्व प्राणी ज्यांच्यात राहतात व जे सर्वांत राहतात ते वसू) • Vasumanāḥ (विशाल व अनासक्त मनाचे वसुमना) • Satyaḥ (सत्यस्वरूप) • Samātmā (सर्व प्राण्यांप्रती समदृष्टी असलेले समात्मा) • Sammitaḥ (अतुलनीय व मोजता न येणारे) • Samaḥ (सदैव शांत व सम राहणारे) • Amoghaḥ (ज्यांची उपासना कधीही व्यर्थ जात नाही) • Puṇḍarīkākṣaḥ (कमलाप्रमाणे सुंदर नेत्र असलेले पुंडरीकाक्ष) • Vṛṣakarmā (धर्माचरण करणारे वृषकर्मा) • Vṛṣākṛtiḥ (धर्मरक्षणासाठी अवतार घेणारे वृषाकृती)", "names": [{"name": "Vasuḥ", "meaning": "One in whom all beings dwell and who dwells in all beings.", "idx": 104, "marathi": "सर्व प्राणी ज्यांच्यात राहतात व जे सर्वांत राहतात ते वसू"}, {"name": "Vasumanāḥ", "meaning": "One possessed of a great, unattached mind.", "idx": 105, "marathi": "विशाल व अनासक्त मनाचे वसुमना"}, {"name": "Satyaḥ", "meaning": "One whose nature is Truth.", "idx": 106, "marathi": "सत्यस्वरूप"}, {"name": "Samātmā", "meaning": "One whose mind is the same towards all beings.", "idx": 107, "marathi": "सर्व प्राण्यांप्रती समदृष्टी असलेले समात्मा"}, {"name": "Sammitaḥ", "meaning": "The immeasurable one.", "idx": 108, "marathi": "अतुलनीय व मोजता न येणारे"}, {"name": "Samaḥ", "meaning": "One unperturbed at all times.", "idx": 109, "marathi": "सदैव शांत व सम राहणारे"}, {"name": "Amoghaḥ", "meaning": "One whose worship never goes in vain.", "idx": 110, "marathi": "ज्यांची उपासना कधीही व्यर्थ जात नाही"}, {"name": "Puṇḍarīkākṣaḥ", "meaning": "One whose eyes resemble lotus petals.", "idx": 111, "marathi": "कमलाप्रमाणे सुंदर नेत्र असलेले पुंडरीकाक्ष"}, {"name": "Vṛṣakarmā", "meaning": "One whose actions are in accordance with Dharma.", "idx": 112, "marathi": "धर्माचरण करणारे वृषकर्मा"}, {"name": "Vṛṣākṛtiḥ", "meaning": "One who takes form for the sake of Dharma.", "idx": 113, "marathi": "धर्मरक्षणासाठी अवतार घेणारे वृषाकृती"}]}, {"id": "stotram-13", "section": "stotram", "num": "13", "slokaNum": 13, "label": "Śloka 13", "speaker": "Names 114–122", "start": 656, "end": 668, "sanskrit": "रुद्रो बहुशिरा बभ्रुर्विश्वयोनिः शुचिश्रवाः ।\nअमृतः शाश्वतस्थाणुर्वरारोहो महातपाः ॥ १३ ॥", "iast": "rudro bahuśirā babhrur viśvayoniḥ śuciśravāḥ,\namṛtaḥ śāśvatasthāṇur varāroho mahātapāḥ.", "meaning": "Rudraḥ – One who makes all beings cry at the time of cosmic dissolution. Bahuśirāḥ – One with innumerable heads. Babhruḥ – One who governs the world. Viśvayoniḥ – One who is the cause of the world. Śuciśravāḥ – One whose names and glories are holy and purifying to hear. Amṛtaḥ – One who is deathless. Śāśvata-sthāṇuḥ – One who is both eternal and firmly established, unchanging. Varārohaḥ – He whose lap gives the highest blessings. Mahātapāḥ – One of great potent knowledge-austerity.", "meaningMarathi": "Rudraḥ (प्रलयकाळी सर्वांना रडवणारे रुद्र) • Bahuśirāḥ (असंख्य मस्तके असलेले बहुशिरा) • Babhruḥ (जगाचे भरणपोषण करणारे बभ्रू) • Viśvayoniḥ (विश्वाचे उत्पत्तिस्थान (विश्वयोनी)) • Śuciśravāḥ (ज्यांची नामे व कीर्ती ऐकल्याने पावित्र्य येते) • Amṛtaḥ (मृत्यूरहित अमृतस्वरूप) • Śāśvata-sthāṇuḥ (शाश्वत व अचल स्थाणू) • Varārohaḥ (ज्यांची मांडी (आश्रय) परम कल्याण देणारी आहे) • Mahātapāḥ (महान ज्ञानरूप तप असलेले महातपा)", "names": [{"name": "Rudraḥ", "meaning": "One who makes all beings cry at the time of cosmic dissolution.", "idx": 114, "marathi": "प्रलयकाळी सर्वांना रडवणारे रुद्र"}, {"name": "Bahuśirāḥ", "meaning": "One with innumerable heads.", "idx": 115, "marathi": "असंख्य मस्तके असलेले बहुशिरा"}, {"name": "Babhruḥ", "meaning": "One who governs the world.", "idx": 116, "marathi": "जगाचे भरणपोषण करणारे बभ्रू"}, {"name": "Viśvayoniḥ", "meaning": "One who is the cause of the world.", "idx": 117, "marathi": "विश्वाचे उत्पत्तिस्थान (विश्वयोनी)"}, {"name": "Śuciśravāḥ", "meaning": "One whose names and glories are holy and purifying to hear.", "idx": 118, "marathi": "ज्यांची नामे व कीर्ती ऐकल्याने पावित्र्य येते"}, {"name": "Amṛtaḥ", "meaning": "One who is deathless.", "idx": 119, "marathi": "मृत्यूरहित अमृतस्वरूप"}, {"name": "Śāśvata-sthāṇuḥ", "meaning": "One who is both eternal and firmly established, unchanging.", "idx": 120, "marathi": "शाश्वत व अचल स्थाणू"}, {"name": "Varārohaḥ", "meaning": "He whose lap gives the highest blessings.", "idx": 121, "marathi": "ज्यांची मांडी (आश्रय) परम कल्याण देणारी आहे"}, {"name": "Mahātapāḥ", "meaning": "One of great potent knowledge-austerity.", "idx": 122, "marathi": "महान ज्ञानरूप तप असलेले महातपा"}]}, {"id": "stotram-14", "section": "stotram", "num": "14", "slokaNum": 14, "label": "Śloka 14", "speaker": "Names 123–132", "start": 668, "end": 680, "sanskrit": "सर्वगः सर्वविद्भानुर्विष्वक्सेनो जनार्दनः ।\nवेदो वेदविदव्यङ्गो वेदाङ्गो वेदवित् कविः ॥ १४ ॥", "iast": "sarvagaḥ sarvavid bhānur viṣvakseno janārdanaḥ,\nvedo vedavid avyaṅgo vedāṅgo vedavit kaviḥ.", "meaning": "Sarvagaḥ – One who pervades everything as their material cause. Sarvavid-bhānuḥ – One who is omniscient and illumines everything. Viṣvaksenaḥ – He before whom all Asura armies are scattered. Janārdanaḥ – One who inflicts suffering on evil men. Vedaḥ – He who is of the form of the Veda. Vedavid – One who knows the Veda and its meaning. Avyaṅgaḥ – One who is self-fulfilled and free from every defect. Vedāṅgaḥ – He to whom the Vedas stand as organs. Vedavit – One who knows all the Vedas. Kaviḥ – One who sees everything.", "meaningMarathi": "Sarvagaḥ (सर्वत्र व्यापून असलेले सर्वग) • Sarvavid-bhānuḥ (सर्वज्ञ व सर्वांना प्रकाशित करणारे भानू) • Viṣvaksenaḥ (ज्यांच्यापुढे असुरसेना विखुरते असे विष्वक्सेन) • Janārdanaḥ (दुष्टांना दंड देणारे जनार्दन) • Vedaḥ (वेदस्वरूप) • Vedavid (वेदांचे व त्यांच्या अर्थाचे ज्ञाते) • Avyaṅgaḥ (सर्व दोषांपासून मुक्त व परिपूर्ण) • Vedāṅgaḥ (वेद ज्यांचे अवयव आहेत) • Vedavit (सर्व वेदांचे मर्मज्ञ) • Kaviḥ (सर्वकाही पाहणारे क्रांतदर्शी कवी)", "names": [{"name": "Sarvagaḥ", "meaning": "One who pervades everything as their material cause.", "idx": 123, "marathi": "सर्वत्र व्यापून असलेले सर्वग"}, {"name": "Sarvavid-bhānuḥ", "meaning": "One who is omniscient and illumines everything.", "idx": 124, "marathi": "सर्वज्ञ व सर्वांना प्रकाशित करणारे भानू"}, {"name": "Viṣvaksenaḥ", "meaning": "He before whom all Asura armies are scattered.", "idx": 125, "marathi": "ज्यांच्यापुढे असुरसेना विखुरते असे विष्वक्सेन"}, {"name": "Janārdanaḥ", "meaning": "One who inflicts suffering on evil men.", "idx": 126, "marathi": "दुष्टांना दंड देणारे जनार्दन"}, {"name": "Vedaḥ", "meaning": "He who is of the form of the Veda.", "idx": 127, "marathi": "वेदस्वरूप"}, {"name": "Vedavid", "meaning": "One who knows the Veda and its meaning.", "idx": 128, "marathi": "वेदांचे व त्यांच्या अर्थाचे ज्ञाते"}, {"name": "Avyaṅgaḥ", "meaning": "One who is self-fulfilled and free from every defect.", "idx": 129, "marathi": "सर्व दोषांपासून मुक्त व परिपूर्ण"}, {"name": "Vedāṅgaḥ", "meaning": "He to whom the Vedas stand as organs.", "idx": 130, "marathi": "वेद ज्यांचे अवयव आहेत"}, {"name": "Vedavit", "meaning": "One who knows all the Vedas.", "idx": 131, "marathi": "सर्व वेदांचे मर्मज्ञ"}, {"name": "Kaviḥ", "meaning": "One who sees everything.", "idx": 132, "marathi": "सर्वकाही पाहणारे क्रांतदर्शी कवी"}]}, {"id": "stotram-15", "section": "stotram", "num": "15", "slokaNum": 15, "label": "Śloka 15", "speaker": "Names 133–140", "start": 680, "end": 693, "sanskrit": "लोकाध्यक्षः सुराध्यक्षो धर्माध्यक्षः कृताकृतः ।\nचतुरात्मा चतुर्व्यूहश्चतुर्दंष्ट्रश्चतुर्भुजः ॥ १५ ॥", "iast": "lokādhyakṣaḥ surādhyakṣo dharmādhyakṣaḥ kṛtākṛtaḥ,\ncaturātmā caturvyūhaś caturdaṃṣṭraś caturbhujaḥ.", "meaning": "Lokādhyakṣaḥ – He who witnesses the whole universe. Surādhyakṣaḥ – One who is the overlord of the protecting divinities of all regions. Dharmādhyakṣaḥ – One who directly sees the merits and demerits of beings. Kṛtākṛtaḥ – One who is both effect (the worlds) and non-effect (their cause). Caturātmā – One who assumes forms for creation, sustentation and dissolution. Caturvyūhaḥ – One who adopts a fourfold manifestation. Caturdaṃṣṭraḥ – One with four fangs in His Narasiṃha incarnation. Caturbhujaḥ – One with four arms.", "meaningMarathi": "Lokādhyakṣaḥ (संपूर्ण लोकांचे साक्षीदार लोकाध्यक्ष) • Surādhyakṣaḥ (सर्व देवलोकांचे अधिपती सुराध्यक्ष) • Dharmādhyakṣaḥ (धर्माधर्माचे प्रत्यक्ष साक्षी धर्माध्यक्ष) • Kṛtākṛtaḥ (कार्य (जग) आणि अकार्य (कारण) दोन्ही स्वरूप) • Caturātmā (उत्पत्ती, स्थिती व लयासाठी चार रूपे घेणारे) • Caturvyūhaḥ (वासुदेवादी चतुर्व्यूह रूप असलेले) • Caturdaṃṣṭraḥ (नरसिंह अवतारात चार दाढा असलेले) • Caturbhujaḥ (चार हात असलेले चतुर्भुज)", "names": [{"name": "Lokādhyakṣaḥ", "meaning": "He who witnesses the whole universe.", "idx": 133, "marathi": "संपूर्ण लोकांचे साक्षीदार लोकाध्यक्ष"}, {"name": "Surādhyakṣaḥ", "meaning": "One who is the overlord of the protecting divinities of all regions.", "idx": 134, "marathi": "सर्व देवलोकांचे अधिपती सुराध्यक्ष"}, {"
