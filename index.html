name": "Dharmādhyakṣaḥ", "meaning": "One who directly sees the merits and demerits of beings.", "idx": 135, "marathi": "धर्माधर्माचे प्रत्यक्ष साक्षी धर्माध्यक्ष"}, {"name": "Kṛtākṛtaḥ", "meaning": "One who is both effect (the worlds) and non-effect (their cause).", "idx": 136, "marathi": "कार्य (जग) आणि अकार्य (कारण) दोन्ही स्वरूप"}, {"name": "Caturātmā", "meaning": "One who assumes forms for creation, sustentation and dissolution.", "idx": 137, "marathi": "उत्पत्ती, स्थिती व लयासाठी चार रूपे घेणारे"}, {"name": "Caturvyūhaḥ", "meaning": "One who adopts a fourfold manifestation.", "idx": 138, "marathi": "वासुदेवादी चतुर्व्यूह रूप असलेले"}, {"name": "Caturdaṃṣṭraḥ", "meaning": "One with four fangs in His Narasiṃha incarnation.", "idx": 139, "marathi": "नरसिंह अवतारात चार दाढा असलेले"}, {"name": "Caturbhujaḥ", "meaning": "One with four arms.", "idx": 140, "marathi": "चार हात असलेले चतुर्भुज"}]}, {"id": "stotram-16", "section": "stotram", "num": "16", "slokaNum": 16, "label": "Śloka 16", "speaker": "Names 141–150", "start": 693, "end": 704, "sanskrit": "भ्राजिष्णुर्भोजनं भोक्ता सहिष्णुर्जगदादिजः ।\nअनघो विजयो जेता विश्वयोनिः पुनर्वसुः ॥ १६ ॥", "iast": "bhrājiṣṇur bhojanaṃ bhoktā sahiṣṇur jagadādijaḥ,\nanagho vijayo jetā viśvayoniḥ punarvasuḥ.", "meaning": "Bhrājiṣṇuḥ – One who is pure luminosity. Bhojanam – Prakṛti or Māyā, which is enjoyed by the Lord. Bhoktā – He who enjoys Prakṛti. Sahiṣṇuḥ – He who suppresses Asuras like Hiraṇyākṣa. Jagadādijaḥ – One who manifested as Hiraṇyagarbha at the beginning of creation. Anaghaḥ – The sinless one. Vijayaḥ – One who has mastery over the whole universe. Jetā – One who is naturally victorious over all beings. Viśvayoniḥ – The source of the universe. Punarvasuḥ – One who dwells again and again in bodies as the Jīvas.", "meaningMarathi": "Bhrājiṣṇuḥ (परम तेजस्वी भ्राजिष्णू) • Bhojanam (प्रकृतीरूपी भोग्य वस्तू (भोजन)) • Bhoktā (प्रकृतीचे भोक्ता) • Sahiṣṇuḥ (असुरांचे दमन करणारे सहिष्णू) • Jagadādijaḥ (सृष्टीच्या आरंभी हिरण्यगर्भ रूपात प्रकट झालेले) • Anaghaḥ (निष्पाप (अनघ)) • Vijayaḥ (संपूर्ण विश्वावर स्वामित्व असलेले विजय) • Jetā (स्वाभाविकच सर्वविजयी जेता) • Viśvayoniḥ (विश्वाचे मूलकारण विश्वयोनी) • Punarvasuḥ (जीवरूपाने शरीरांत पुनःपुन्हा वास करणारे पुनर्वसू)", "names": [{"name": "Bhrājiṣṇuḥ", "meaning": "One who is pure luminosity.", "idx": 141, "marathi": "परम तेजस्वी भ्राजिष्णू"}, {"name": "Bhojanam", "meaning": "Prakṛti or Māyā, which is enjoyed by the Lord.", "idx": 142, "marathi": "प्रकृतीरूपी भोग्य वस्तू (भोजन)"}, {"name": "Bhoktā", "meaning": "He who enjoys Prakṛti.", "idx": 143, "marathi": "प्रकृतीचे भोक्ता"}, {"name": "Sahiṣṇuḥ", "meaning": "He who suppresses Asuras like Hiraṇyākṣa.", "idx": 144, "marathi": "असुरांचे दमन करणारे सहिष्णू"}, {"name": "Jagadādijaḥ", "meaning": "One who manifested as Hiraṇyagarbha at the beginning of creation.", "idx": 145, "marathi": "सृष्टीच्या आरंभी हिरण्यगर्भ रूपात प्रकट झालेले"}, {"name": "Anaghaḥ", "meaning": "The sinless one.", "idx": 146, "marathi": "निष्पाप (अनघ)"}, {"name": "Vijayaḥ", "meaning": "One who has mastery over the whole universe.", "idx": 147, "marathi": "संपूर्ण विश्वावर स्वामित्व असलेले विजय"}, {"name": "Jetā", "meaning": "One who is naturally victorious over all beings.", "idx": 148, "marathi": "स्वाभाविकच सर्वविजयी जेता"}, {"name": "Viśvayoniḥ", "meaning": "The source of the universe.", "idx": 149, "marathi": "विश्वाचे मूलकारण विश्वयोनी"}, {"name": "Punarvasuḥ", "meaning": "One who dwells again and again in bodies as the Jīvas.", "idx": 150, "marathi": "जीवरूपाने शरीरांत पुनःपुन्हा वास करणारे पुनर्वसू"}]}, {"id": "stotram-17", "section": "stotram", "num": "17", "slokaNum": 17, "label": "Śloka 17", "speaker": "Names 151–162", "start": 704, "end": 716, "sanskrit": "उपेन्द्रो वामनः प्रांशुरमोघः शुचिरूर्जितः ।\nअतीन्द्रः सङ्ग्रहः सर्गो धृतात्मा नियमो यमः ॥ १७ ॥", "iast": "upendro vāmanaḥ prāṃśur amoghaḥ śucir ūrjitaḥ,\natīndraḥ saṅgrahaḥ sargo dhṛtātmā niyamo yamaḥ.", "meaning": "Upendraḥ – One born as the younger brother of Indra. Vāmanaḥ – One who in the form of the dwarf went begging to Bali. Prāṃśuḥ – One of great height. Amoghaḥ – One whose acts do not go in vain. Śuciḥ – One who purifies those who adore and praise Him. Ūrjitaḥ – One of infinite strength. Atīndraḥ – One who is superior to Indra. Saṅgrahaḥ – One who is of the subtle form of the universe to be created. Sargaḥ – The creator of Himself. Dhṛtātmā – One ever in His inherent form, without transformation. Niyamaḥ – One who appoints creatures to their particular stations. Yamaḥ – One who regulates all, remaining within them.", "meaningMarathi": "Upendraḥ (इंद्राचे धाकटे बंधू म्हणून अवतरलेले उपेंद्र) • Vāmanaḥ (बळीराजाकडे वामन रूपात गेलेले) • Prāṃśuḥ (अत्यंत विशाल उंचीचे प्रांशू) • Amoghaḥ (ज्यांचे कर्म कधीही व्यर्थ जात नाही) • Śuciḥ (भक्तांना पवित्र करणारे शुची) • Ūrjitaḥ (अनंत सामर्थ्यशाली ऊर्जित) • Atīndraḥ (इंद्रापेक्षाही श्रेष्ठ अतींद्र) • Saṅgrahaḥ (सूक्ष्म रूपात विश्व सामावून घेणारे संग्रह) • Sargaḥ (स्वतःच सृष्टीचे सृजन करणारे सर्ग) • Dhṛtātmā (विकाररहित धृतात्मा) • Niyamaḥ (प्रत्येकाला योग्य स्थानी नेमणारे नियम) • Yamaḥ (अंतर्यामी राहून सर्वांचे नियमन करणारे यम)", "names": [{"name": "Upendraḥ", "meaning": "One born as the younger brother of Indra.", "idx": 151, "marathi": "इंद्राचे धाकटे बंधू म्हणून अवतरलेले उपेंद्र"}, {"name": "Vāmanaḥ", "meaning": "One who in the form of the dwarf went begging to Bali.", "idx": 152, "marathi": "बळीराजाकडे वामन रूपात गेलेले"}, {"name": "Prāṃśuḥ", "meaning": "One of great height.", "idx": 153, "marathi": "अत्यंत विशाल उंचीचे प्रांशू"}, {"name": "Amoghaḥ", "meaning": "One whose acts do not go in vain.", "idx": 154, "marathi": "ज्यांचे कर्म कधीही व्यर्थ जात नाही"}, {"name": "Śuciḥ", "meaning": "One who purifies those who adore and praise Him.", "idx": 155, "marathi": "भक्तांना पवित्र करणारे शुची"}, {"name": "Ūrjitaḥ", "meaning": "One of infinite strength.", "idx": 156, "marathi": "अनंत सामर्थ्यशाली ऊर्जित"}, {"name": "Atīndraḥ", "meaning": "One who is superior to Indra.", "idx": 157, "marathi": "इंद्रापेक्षाही श्रेष्ठ अतींद्र"}, {"name": "Saṅgrahaḥ", "meaning": "One who is of the subtle form of the universe to be created.", "idx": 158, "marathi": "सूक्ष्म रूपात विश्व सामावून घेणारे संग्रह"}, {"name": "Sargaḥ", "meaning": "The creator of Himself.", "idx": 159, "marathi": "स्वतःच सृष्टीचे सृजन करणारे सर्ग"}, {"name": "Dhṛtātmā", "meaning": "One ever in His inherent form, without transformation.", "idx": 160, "marathi": "विकाररहित धृतात्मा"}, {"name": "Niyamaḥ", "meaning": "One who appoints creatures to their particular stations.", "idx": 161, "marathi": "प्रत्येकाला योग्य स्थानी नेमणारे नियम"}, {"name": "Yamaḥ", "meaning": "One who regulates all, remaining within them.", "idx": 162, "marathi": "अंतर्यामी राहून सर्वांचे नियमन करणारे यम"}]}, {"id": "stotram-18", "section": "stotram", "num": "18", "slokaNum": 18, "label": "Śloka 18", "speaker": "Names 163–172", "start": 716, "end": 729, "sanskrit": "वेद्यो वैद्यः सदायोगी वीरहा माधवो मधुः ।\nअतीन्द्रियो महामायो महोत्साहो महाबलः ॥ १८ ॥", "iast": "vedyo vaidyaḥ sadāyogī vīrahā mādhavo madhuḥ,\natīndriyo mahāmāyo mahotsāho mahābalaḥ.", "meaning": "Vedyaḥ – One who has to be known by those who aspire for Mokṣa. Vaidyaḥ – One who knows all branches of knowledge. Sadāyogī – One who is ever experienceable, being ever existent. Vīrahā – One who destroys heroic Asuras for the protection of Dharma. Mādhavaḥ – One who is the Lord or Master of Mā (knowledge). Madhuḥ – Honey – because the Lord gives joy, just like honey. Atīndriyaḥ – One who is not knowable by the senses. Mahāmāyaḥ – One who can cause illusion even over great illusionists. Mahotsāhaḥ – One ever busy in the work of creation, sustentation and dissolution. Mahābalaḥ – The strongest among all who have strength.", "meaningMarathi": "Vedyaḥ (मोक्षेच्छूंनी जाणण्यास योग्य वेद्य) • Vaidyaḥ (सर्व विद्यांचे ज्ञाते वैद्य) • Sadāyogī (सदैव अनुभवता येणारे सदायोगी) • Vīrahā (धर्मरक्षणासाठी वीर असुरांचा वध करणारे वीरहा) • Mādhavaḥ (ज्ञानरूप विद्येचे स्वामी माधव) • Madhuḥ (मधाप्रमाणे आनंद देणारे मधू) • Atīndriyaḥ (इंद्रियांच्या पलीकडील अतींद्रिय) • Mahāmāyaḥ (महामायावींनाही मोहित करणारे महामाय) • Mahotsāhaḥ (सृष्टीकार्यात सदैव उत्साही महोत्साह) • Mahābalaḥ (बलवंतांमध्ये सर्वश्रेष्ठ महाबल)", "names": [{"name": "Vedyaḥ", "meaning": "One who has to be known by those who aspire for Mokṣa.", "idx": 163, "marathi": "मोक्षेच्छूंनी जाणण्यास योग्य वेद्य"}, {"name": "Vaidyaḥ", "meaning": "One who knows all branches of knowledge.", "idx": 164, "marathi": "सर्व विद्यांचे ज्ञाते वैद्य"}, {"name": "Sadāyogī", "meaning": "One who is ever experienceable, being ever existent.", "idx": 165, "marathi": "सदैव अनुभवता येणारे सदायोगी"}, {"name": "Vīrahā", "meaning": "One who destroys heroic Asuras for the protection of Dharma.", "idx": 166, "marathi": "धर्मरक्षणासाठी वीर असुरांचा वध करणारे वीरहा"}, {"name": "Mādhavaḥ", "meaning": "One who is the Lord or Master of Mā (knowledge).", "idx": 167, "marathi": "ज्ञानरूप विद्येचे स्वामी माधव"}, {"name": "Madhuḥ", "meaning": "Honey – because the Lord gives joy, just like honey.", "idx": 168, "marathi": "मधाप्रमाणे आनंद देणारे मधू"}, {"name": "Atīndriyaḥ", "meaning": "One who is not knowable by the senses.", "idx": 169, "marathi": "इंद्रियांच्या पलीकडील अतींद्रिय"}, {"name": "Mahāmāyaḥ", "meaning": "One who can cause illusion even over great illusionists.", "idx": 170, "marathi": "महामायावींनाही मोहित करणारे महामाय"}, {"name": "Mahotsāhaḥ", "meaning": "One ever busy in the work of creation, sustentation and dissolution.", "idx": 171, "marathi": "सृष्टीकार्यात सदैव उत्साही महोत्साह"}, {"name": "Mahābalaḥ", "meaning": "The strongest among all who have strength.", "idx": 172, "marathi": "बलवंतांमध्ये सर्वश्रेष्ठ महाबल"}]}, {"id": "stotram-19", "section": "stotram", "num": "19", "slokaNum": 19, "label": "Śloka 19", "speaker": "Names 173–180", "start": 729, "end": 741, "sanskrit": "महाबुद्धिर्महावीर्यो महाशक्तिर्महाद्युतिः ।\nअनिर्देश्यवपुः श्रीमानमेयात्मा महाद्रिधृक् ॥ १९ ॥", "iast": "mahābuddhir mahāvīryo mahāśaktir mahādyutiḥ,\nanirdeśyavapuḥ śrīmān ameyātmā mahādridhṛk.", "meaning": "Mahābuddhiḥ – The wisest among the wise. Mahāvīryaḥ – The most powerful one. Mahāśaktiḥ – One with great resources of strength and skill. Mahādyutiḥ – One who is intensely brilliant both within and without. Anirdeśya-vapuḥ – One whose form cannot be indicated as 'He is this'. Śrīmān – One endowed with greatness of every kind. Ameyātmā – The Spirit with intelligence that cannot be measured. Mahādridhṛk – One who held up the great mountain Mandara and also Govardhana.", "meaningMarathi": "Mahābuddhiḥ (ज्ञान्यांमध्ये सर्वश्रेष्ठ महाबुद्धी) • Mahāvīryaḥ (परम पराक्रमी महावीर्य) • Mahāśaktiḥ (अफाट सामर्थ्य असलेले महाशक्ती) • Mahādyutiḥ (अंतर्बाह्य तेजस्वी महाद्युती) • Anirdeśya-vapuḥ (असेच रूप आहे असे सांगता न येणारे अनिर्देश्यवपू) • Śrīmān (सर्व ऐश्वर्यांनी युक्त श्रीमान) • Ameyātmā (ज्यांचे ज्ञान अथांग आहे असे अमेयात्मा) • Mahādridhṛk (मंदार व गोवर्धन पर्वत उचलणारे महाद्रिधृक्)", "names": [{"name": "Mahābuddhiḥ", "meaning": "The wisest among the wise.", "idx": 173, "marathi": "ज्ञान्यांमध्ये सर्वश्रेष्ठ महाबुद्धी"}, {"name": "Mahāvīryaḥ", "meaning": "The most powerful one.", "idx": 174, "marathi": "परम पराक्रमी महावीर्य"}, {"name": "Mahāśaktiḥ", "meaning": "One with great resources of strength and skill.", "idx": 175, "marathi": "अफाट सामर्थ्य असलेले महाशक्ती"}, {"name": "Mahādyutiḥ", "meaning": "One who is intensely brilliant both within and without.", "idx": 176, "marathi": "अंतर्बाह्य तेजस्वी महाद्युती"}, {"name": "Anirdeśya-vapuḥ", "meaning": "One whose form cannot be indicated as 'He is this'.", "idx": 177, "marathi": "असेच रूप आहे असे सांगता न येणारे अनिर्देश्यवपू"}, {"name": "Śrīmān", "meaning": "One endowed with greatness of every kind.", "idx": 178, "marathi": "सर्व ऐश्वर्यांनी युक्त श्रीमान"}, {"name": "Ameyātmā", "meaning": "The Spirit with intelligence that cannot be measured.", "idx": 179, "marathi": "ज्यांचे ज्ञान अथांग आहे असे अमेयात्मा"}, {"name": "Mahādridhṛk", "meaning": "One who held up the great mountain Mandara and also Govardhana.", "idx": 180, "marathi": "मंदार व गोवर्धन पर्वत उचलणारे महाद्रिधृक्"}]}, {"id": "stotram-20", "section": "stotram", "num": "20", "slokaNum": 20, "label": "Śloka 20", "speaker": "Names 181–188", "start": 741, "end": 753, "sanskrit": "महेष्वासो महीभर्ता श्रीनिवासः सतां गतिः ।\nअनिरुद्धः सुरानन्दो गोविन्दो गोविदां पतिः ॥ २० ॥", "iast": "maheṣvāso mahībhartā śrīnivāsaḥ satāṃ gatiḥ,\naniruddhaḥ surānando govindo govidāṃ patiḥ.", "meaning": "Maheṣvāsaḥ – One equipped with the great bow. Mahībhartā – One who held up the earth submerged in Pralaya waters. Śrīnivāsaḥ – One on whose chest the Goddess Śrī dwells. Satāṃgatiḥ – One who bestows the highest destiny to all holy men. Aniruddhaḥ – One who has never been obstructed in manifesting in various forms. Surānandaḥ – One who bestows joy on all divinities. Govindaḥ – Gau means words; He who pervades all words, giving them power. Govidāṃ patiḥ – The master of all words and their knowers.", "meaningMarathi": "Maheṣvāsaḥ (महान धनुष्य धारण करणारे महेष्वास) • Mahībhartā (प्रलयजलातून पृथ्वीचा उद्धार करणारे महीभर्ता) • Śrīnivāsaḥ (ज्यांच्या वक्षःस्थळी श्रीलक्ष्मी निवास करते) • Satāṃgatiḥ (सज्जनांचे परम गतीस्थान सतांगती) • Aniruddhaḥ (कोणत्याही अडथळ्याविना प्रकट होणारे अनिरुद्ध) • Surānandaḥ (देवांना आनंद देणारे सुरानंद) • Govindaḥ (सर्व वेदवाक्यांत व्याप्त असलेले गोविंद) • Govidāṃ patiḥ (वेदज्ञ व वाणीचे स्वामी गोविदांपती)", "names": [{"name": "Maheṣvāsaḥ", "meaning": "One equipped with the great bow.", "idx": 181, "marathi": "महान धनुष्य धारण करणारे महेष्वास"}, {"name": "Mahībhartā", "meaning": "One who held up the earth submerged in Pralaya waters.", "idx": 182, "marathi": "प्रलयजलातून पृथ्वीचा उद्धार करणारे महीभर्ता"}, {"name": "Śrīnivāsaḥ", "meaning": "One on whose chest the Goddess Śrī dwells.", "idx": 183, "marathi": "ज्यांच्या वक्षःस्थळी श्रीलक्ष्मी निवास करते"}, {"name": "Satāṃgatiḥ", "meaning": "One who bestows the highest destiny to all holy men.", "idx": 184, "marathi": "सज्जनांचे परम गतीस्थान सतांगती"}, {"name": "Aniruddhaḥ", "meaning": "One who has never been obstructed in manifesting in various forms.", "idx": 185, "marathi": "कोणत्याही अडथळ्याविना प्रकट होणारे अनिरुद्ध"}, {"name": "Surānandaḥ", "meaning": "One who bestows joy on all divinities.", "idx": 186, "marathi": "देवांना आनंद देणारे सुरानंद"}, {"name": "Govindaḥ", "meaning": "Gau means words; He who pervades all words, giving them power.", "idx": 187, "marathi": "सर्व वेदवाक्यांत व्याप्त असलेले गोविंद"}, {"name": "Govidāṃ patiḥ", "meaning": "The master of all words and their knowers.", "idx": 188, "marathi": "वेदज्ञ व वाणीचे स्वामी गोविदांपती"}]}, {"id": "stotram-21", "section": "stotram", "num": "21", "slokaNum": 21, "label": "Śloka 21", "speaker": "Names 189–197", "start": 753, "end": 764, "sanskrit": "मरीचिर्दमनो हंसः सुपर्णो भुजगोत्तमः ।\nहिरण्यनाभः सुतपाः पद्मनाभः प्रजापतिः ॥ २१ ॥", "iast": "marīcir damano haṃsaḥ suparṇo bhujagottamaḥ,\nhiraṇyanābhaḥ sutapāḥ padmanābhaḥ prajāpatiḥ.", "meaning": "Marīciḥ – The supreme power and impressiveness in virtuous persons. Damanaḥ – One who as Yama inflicts punishments on the unrighteous. Haṃsaḥ – One who removes the fear of Saṃsāra from those who meditate on Him. Suparṇaḥ – One who has two wings in the shape of Dharma and Adharma. Bhujagottamaḥ – One who is the greatest of those who move on arms (serpents). Hiraṇyanābhaḥ – From whose golden navel arose Brahmā the creator. Sutapāḥ – One who performs rigorous austerities at Badarikāśrama. Padmanābhaḥ – One whose navel is beautifully shaped like a lotus. Prajāpatiḥ – The father of all beings, who are His children.", "meaningMarathi": "Marīciḥ (तेजस्व्यांचे परम तेज मरीची) • Damanaḥ (अधार्मिकांचे दमन करणारे दमन) • Haṃsaḥ (ध्यानाने संसारभय हरणारे हंस) • Suparṇaḥ (धर्माधर्मरूपी दोन पंख असलेले सुपर्ण) • Bhujagottamaḥ (सर्पांमध्ये श्रेष्ठ (अनंत) भुजगोत्तम) • Hiraṇyanābhaḥ (ज्यांच्या सुवर्णनाभीतून ब्रह्मदेव प्रकट झाले) • Sutapāḥ (बदरिकाश्रमात कठोर तप करणारे सुतपा) • Padmanābhaḥ (कमलासारखी सुंदर नाभी असलेले पद्मनाभ) • Prajāpatiḥ (सर्व जीवांचे पिता प्रजापती)", "names": [{"name": "Marīciḥ", "meaning": "The supreme power and impressiveness in virtuous persons.", "idx": 189, "marathi": "तेजस्व्यांचे परम तेज मरीची"}, {"name": "Damanaḥ", "meaning": "One who as Yama inflicts punishments on the unrighteous.", "idx": 190, "marathi": "अधार्मिकांचे दमन करणारे दमन"}, {"name": "Haṃsaḥ", "meaning": "One who removes the fear of Saṃsāra from those who meditate on Him.", "idx": 191, "marathi": "ध्यानाने संसारभय हरणारे हंस"}, {"name": "Suparṇaḥ", "meaning": "One who has two wings in the shape of Dharma and Adharma.", "idx": 192, "marathi": "धर्माधर्मरूपी दोन पंख असलेले सुपर्ण"}, {"name": "Bhujagottamaḥ", "meaning": "One who is the greatest of those who move on arms (serpents).", "idx": 193, "marathi": "सर्पांमध्ये श्रेष्ठ (अनंत) भुजगोत्तम"}, {"name": "Hiraṇyanābhaḥ", "meaning": "From whose golden navel arose Brahmā the creator.", "idx": 194, "marathi": "ज्यांच्या सुवर्णनाभीतून ब्रह्मदेव प्रकट झाले"}, {"name": "Sutapāḥ", "meaning": "One who performs rigorous austerities at Badarikāśrama.", "idx": 195, "marathi": "बदरिकाश्रमात कठोर तप करणारे सुतपा"}, {"name": "Padmanābhaḥ", "meaning": "One whose navel is beautifully shaped like a lotus.", "idx": 196, "marathi": "कमलासारखी सुंदर नाभी असलेले पद्मनाभ"}, {"name": "Prajāpatiḥ", "meaning": "The father of all beings, who are His children.", "idx": 197, "marathi": "सर्व जीवांचे पिता प्रजापती"}]}, {"id": "stotram-22", "section": "stotram", "num": "22", "slokaNum": 22, "label": "Śloka 22", "speaker": "Names 198–208", "start": 764, "end": 776, "sanskrit": "अमृत्युः सर्वदृक् सिंहः सन्धाता सन्धिमान् स्थिरः ।\nअजो दुर्मर्षणः शास्ता विश्रुतात्मा सुरारिहा ॥ २२ ॥", "iast": "amṛtyuḥ sarvadṛk siṃhaḥ sandhātā sandhimān sthiraḥ,\najo durmarṣaṇaḥ śāstā viśrutātmā surārihā.", "meaning": "Amṛtyuḥ – One who is without death or its cause. Sarvadṛk – One who sees the Karmas of all Jīvas through His inherent wisdom. Siṃhaḥ – One who does Hiṃsā (destruction). Sandhātā – One who unites the Jīvas with the fruits of their actions. Sandhimān – One who is Himself the enjoyer of the fruits of actions. Sthiraḥ – One who is always of the same nature. Ajaḥ – One who goes into the hearts of devotees or destroys Asuras. Durmarṣaṇaḥ – One whose might the Asuras cannot bear. Śāstā – One who instructs and directs all through the scriptures. Viśrutātmā – One who is specially known through signifying terms like Truth, Knowledge. Surārihā – One who destroys the enemies of Suras or Devas.", "meaningMarathi": "Amṛtyuḥ (मृत्यू व त्याच्या कारणांपासून मुक्त अमृत्यू) • Sarvadṛk (आपल्या ज्ञानाने सर्वांची कर्मे पाहणारे सर्वदृक्) • Siṃhaḥ (दुष्टांचा संहार करणारे सिंह) • Sandhātā (जीवांना कर्मफळांशी जोडणारे संधाता) • Sandhimān (कर्मफळांचे स्वतः भोक्ता संधिमान) • Sthiraḥ (सदैव एकरूप स्थिर) • Ajaḥ (भक्तांच्या हृदयात वास करणारे अज) • Durmarṣaṇaḥ (असुरांना असह्य पराक्रमी दुर्मर्षण) • Śāstā (शास्त्रांद्वारे सर्वांना उपदेश करणारे शास्ता) • Viśrutātmā (सत्य-ज्ञानादी शब्दांनी प्रसिद्ध विश्रुतात्मा) • Surārihā (देवांच्या शत्रूंचा नाश करणारे सुरारिहा)", "names": [{"name": "Amṛtyuḥ", "meaning": "One who is without death or its cause.", "idx": 198, "marathi": "मृत्यू व त्याच्या कारणांपासून मुक्त अमृत्यू"}, {"name": "Sarvadṛk", "meaning": "One who sees the Karmas of all Jīvas through His inherent wisdom.", "idx": 199, "marathi": "आपल्या ज्ञानाने सर्वांची कर्मे पाहणारे सर्वदृक्"}, {"name": "Siṃhaḥ", "meaning": "One who does Hiṃsā (destruction).", "idx": 200, "marathi": "दुष्टांचा संहार करणारे सिंह"}, {"name": "Sandhātā", "meaning": "One who unites the Jīvas with the fruits of their actions.", "idx": 201, "marathi": "जीवांना कर्मफळांशी जोडणारे संधाता"}, {"name": "Sandhimān", "meaning": "One who is Himself the enjoyer of the fruits of actions.", "idx": 202, "marathi": "कर्मफळांचे स्वतः भोक्ता संधिमान"}, {"name": "Sthiraḥ", "meaning": "One who is always of the same nature.", "idx": 203, "marathi": "सदैव एकरूप स्थिर"}, {"name": "Ajaḥ", "meaning": "One who goes into the hearts of devotees or destroys Asuras.", "idx": 204, "marathi": "भक्तांच्या हृदयात वास करणारे अज"}, {"name": "Durmarṣaṇaḥ", "meaning": "One whose might the Asuras cannot bear.", "idx": 205, "marathi": "असुरांना असह्य पराक्रमी दुर्मर्षण"}, {"name": "Śāstā", "meaning": "One who instructs and directs all through the scriptures.", "idx": 206, "marathi": "शास्त्रांद्वारे सर्वांना उपदेश करणारे शास्ता"}, {"name": "Viśrutātmā", "meaning": "One who is specially known through signifying terms like Truth, Knowledge.", "idx": 207, "marathi": "सत्य-ज्ञानादी शब्दांनी प्रसिद्ध विश्रुतात्मा"}, {"name": "Surārihā", "meaning": "One who destroys the enemies of Suras or Devas.", "idx": 208, "marathi": "देवांच्या शत्रूंचा नाश करणारे सुरारिहा"}]}, {"id": "stotram-23", "section": "stotram", "num": "23", "slokaNum": 23, "label": "Śloka 23", "speaker": "Names 209–217", "start": 776, "end": 788, "sanskrit": "गुरुर्गुरुतमो धाम सत्यः सत्यपराक्रमः ।\nनिमिषोऽनिमिषः स्रग्वी वाचस्पतिरुदारधीः ॥ २३ ॥", "iast": "gurur gurutamo dhāma satyaḥ satyaparākramaḥ,\nnimiṣo 'nimiṣaḥ sragvī vācaspatir udāradhīḥ.", "meaning": "Guruḥ – The greatest teacher. Gurutamaḥ – One who is the teacher of all forms of knowledge. Dhāma – The Supreme Light. Satyaḥ – One who is embodied as the virtue of truth. Satyaparākramaḥ – One of unfailing valour. Nimiṣaḥ – One whose eyelids are closed in Yoga-nidrā. Animiṣaḥ – One who is ever awake. Sragvī – One who has the necklace Vaijayantī, strung with the five elements. Vācaspatir-udāradhīḥ – The master of Vāk (knowledge), of wide intelligence.", "meaningMarathi": "Guruḥ (परम श्रेष्ठ गुरू) • Gurutamaḥ (सर्व विद्यांचे आचार्य गुरुतम) • Dhāma (परम प्रकाशरूप धाम) • Satyaḥ (सत्यस्वरूप) • Satyaparākramaḥ (अमोघ पराक्रम असलेले सत्यपराक्रम) • Nimiṣaḥ (योगनिद्रेत नेत्र मिटलेले निमिष) • Animiṣaḥ (सदैव जागृत अनिमिष) • Sragvī (पंचमहाभूतांची वैजयंती माळ धारण करणारे स्रग्वी) • Vācaspatir-udāradhīḥ (विशाल बुद्धी असलेले वाणीचे स्वामी वाचस्पती)", "names": [{"name": "Guruḥ", "meaning": "The greatest teacher.", "idx": 209, "marathi": "परम श्रेष्ठ गुरू"}, {"name": "Gurutamaḥ", "meaning": "One who is the teacher of all forms of knowledge.", "idx": 210, "marathi": "सर्व विद्यांचे आचार्य गुरुतम"}, {"name": "Dhāma", "meaning": "The Supreme Light.", "idx": 211, "marathi": "परम प्रकाशरूप धाम"}, {"name": "Satyaḥ", "meaning": "One who is embodied as the virtue of truth.", "idx": 212, "marathi": "सत्यस्वरूप"}, {"name": "Satyaparākramaḥ", "meaning": "One of unfailing valour.", "idx": 213, "marathi": "अमोघ पराक्रम असलेले सत्यपराक्रम"}, {"name": "Nimiṣaḥ", "meaning": "One whose eyelids are closed in Yoga-nidrā.", "idx": 214, "marathi": "योगनिद्रेत नेत्र मिटलेले निमिष"}, {"name": "Animiṣaḥ", "meaning": "One who is ever awake.", "idx": 215, "marathi": "सदैव जागृत अनिमिष"}, {"name": "Sragvī", "meaning": "One who has the necklace Vaijayantī, strung with the five elements.", "idx": 216, "marathi": "पंचमहाभूतांची वैजयंती माळ धारण करणारे स्रग्वी"}, {"name": "Vācaspatir-udāradhīḥ", "meaning": "The master of Vāk (knowledge), of wide intelligence.", "idx": 217, "marathi": "विशाल बुद्धी असलेले वाणीचे स्वामी वाचस्पती"}]}, {"id": "stotram-24", "section": "stotram", "num": "24", "slokaNum": 24, "label": "Śloka 24", "speaker": "Names 218–227", "start": 788, "end": 801, "sanskrit": "अग्रणीर्ग्रामणीः श्रीमान् न्यायो नेता समीरणः ।\nसहस्रमूर्धा विश्वात्मा सहस्राक्षः सहस्रपात् ॥ २४ ॥", "iast": "agraṇīr grāmaṇīḥ śrīmān nyāyo netā samīraṇaḥ,\nsahasramūrdhā viśvātmā sahasrākṣaḥ sahasrapāt.", "meaning": "Agraṇīḥ – One who leads all liberation-seekers to the highest status. Grāmaṇīḥ – One who has command over the collectivity of all beings. Śrīmān – One more resplendent than everything. Nyāyaḥ – The consistency which runs through all ways of knowing. Netā – One who moves this world of becoming. Samīraṇaḥ – One who in the form of breath keeps all living beings functioning. Sahasramūrdhā – One with a thousand (innumerable) heads. Viśvātmā – The soul of the universe. Sahasrākṣaḥ – One with a thousand (innumerable) eyes. Sahasrapāt – One with a thousand (innumerable) legs.", "meaningMarathi": "Agraṇīḥ (मुमुक्षूंना परमपदाकडे नेणारे अग्रणी) • Grāmaṇīḥ (सर्व भूतसमुदायाचे नायक ग्रामणी) • Śrīmān (सर्वांपेक्षा तेजस्वी श्रीमान) • Nyāyaḥ (सर्व प्रमाणांचा आधार न्याय) • Netā (विश्वाचा कारभार चालवणारे नेता) • Samīraṇaḥ (प्राणवायू रूपाने सर्वांना चेतावणी देणारे समीरण) • Sahasramūrdhā (असंख्य मस्तके असलेले सहस्रमूर्धा) • Viśvātmā (विश्वाचे अंतरात्मा विश्वात्मा) • Sahasrākṣaḥ (असंख्य नेत्र असलेले सहस्राक्ष) • Sahasrapāt (असंख्य चरण असलेले सहस्रपात्)", "names": [{"name": "Agraṇīḥ", "meaning": "One who leads all liberation-seekers to the highest status.", "idx": 218, "marathi": "मुमुक्षूंना परमपदाकडे नेणारे अग्रणी"}, {"name": "Grāmaṇīḥ", "meaning": "One who has command over the collectivity of all beings.", "idx": 219, "marathi": "सर्व भूतसमुदायाचे नायक ग्रामणी"}, {"name": "Śrīmān", "meaning": "One more resplendent than everything.", "idx": 220, "marathi": "सर्वांपेक्षा तेजस्वी श्रीमान"}, {"name": "Nyāyaḥ", "meaning": "The consistency which runs through all ways of knowing.", "idx": 221, "marathi": "सर्व प्रमाणांचा आधार न्याय"}, {"name": "Netā", "meaning": "One who moves this world of becoming.", "idx": 222, "marathi": "विश्वाचा कारभार चालवणारे नेता"}, {"name": "Samīraṇaḥ", "meaning": "One who in the form of breath keeps all living beings functioning.", "idx": 223, "marathi": "प्राणवायू रूपाने सर्वांना चेतावणी देणारे समीरण"}, {"name": "Sahasramūrdhā", "meaning": "One with a thousand (innumerable) heads.", "idx": 224, "marathi": "असंख्य मस्तके असलेले सहस्रमूर्धा"}, {"name": "Viśvātmā", "meaning": "The soul of the universe.", "idx": 225, "marathi": "विश्वाचे अंतरात्मा विश्वात्मा"}, {"name": "Sahasrākṣaḥ", "meaning": "One with a thousand (innumerable) eyes.", "idx": 226, "marathi": "असंख्य नेत्र असलेले सहस्राक्ष"}, {"name": "Sahasrapāt", "meaning": "One with a thousand (innumerable) legs.", "idx": 227, "marathi": "असंख्य चरण असलेले सहस्रपात्"}]}, {"id": "stotram-25", "section": "stotram", "num": "25", "slokaNum": 25, "label": "Śloka 25", "speaker": "Names 228–235", "start": 801, "end": 812, "sanskrit": "आवर्तनो निवृत्तात्मा संवृतः सम्प्रमर्दनः ।\nअहः संवर्तको वह्निरनिलो धरणीधरः ॥ २५ ॥", "iast": "āvartano nivṛttātmā saṃvṛtaḥ saṃpramardanaḥ,\nahaḥ saṃvartako vahnir anilo dharaṇīdharaḥ.", "meaning": "Āvartanaḥ – One who whirls round and round the wheel of Saṃsāra. Nivṛttātmā – One whose being is free or untouched by the bondage of Saṃsāra. Saṃvṛtaḥ – One who is covered by all-covering Avidyā or ignorance. Sampramardanaḥ – One who delivers destructive blows on all beings through His Vibhūtis (Rudra, Yama etc.). Ahaḥ-saṃvartakaḥ – The Lord who, as the sun, regulates the succession of day and night. Vahniḥ – One who as fire carries the offerings made to the Devas in sacrifices. Anilaḥ – One who has no fixed residence. Dharaṇī-dharaḥ – One who supports the worlds, Ādiśeṣa, and the quarters.", "meaningMarathi": "Āvartanaḥ (संसारचक्र फिरवणारे आवर्तन) • Nivṛttātmā (संसारबंधनापासून मुक्त निवृत्तात्मा) • Saṃvṛtaḥ (अविद्येने आच्छादलेले संवृत) • Sampramardanaḥ (रुद्र-यमादी रूपांनी संहार करणारे संप्रमर्दन) • Ahaḥ-saṃvartakaḥ (सूर्यरूपाने दिनरात्रीचे नियमन करणारे अहःसंवर्तक) • Vahniḥ (यज्ञहवी देवांपर्यंत नेणारे वह्नी (अग्नी)) • Anilaḥ (कोणत्याही एका स्थानी मर्यादित नसलेले अनिल) • Dharaṇī-dharaḥ (पृथ्वी व लोकांना धारण करणारे धरणीधर)", "names": [{"name": "Āvartanaḥ", "meaning": "One who whirls round and round the wheel of Saṃsāra.", "idx": 228, "marathi": "संसारचक्र फिरवणारे आवर्तन"}, {"name": "Nivṛttātmā", "meaning": "One whose being is free or untouched by the bondage of Saṃsāra.", "idx": 229, "marathi": "संसारबंधनापासून मुक्त निवृत्तात्मा"}, {"name": "Saṃvṛtaḥ", "meaning": "One who is covered by all-covering Avidyā or ignorance.", "idx": 230, "marathi": "अविद्येने आच्छादलेले संवृत"}, {"name": "Sampramardanaḥ", "meaning": "One who delivers destructive blows on all beings through His Vibhūtis (Rudra, Yama etc.).", "idx": 231, "marathi": "रुद्र-यमादी रूपांनी संहार करणारे संप्रमर्दन"}, {"name": "Ahaḥ-saṃvartakaḥ", "meaning": "The Lord who, as the sun, regulates the succession of day and night.", "idx": 232, "marathi": "सूर्यरूपाने दिनरात्रीचे नियमन करणारे अहःसंवर्तक"}, {"name": "Vahniḥ", "meaning": "One who as fire carries the offerings made to the Devas in sacrifices.", "idx": 233, "marathi": "यज्ञहवी देवांपर्यंत नेणारे वह्नी (अग्नी)"}, {"name": "Anilaḥ", "meaning": "One who has no fixed residence.", "idx": 234, "marathi": "कोणत्याही एका स्थानी मर्यादित नसलेले अनिल"}, {"name": "Dharaṇī-dharaḥ", "meaning": "One who supports the worlds, Ādiśeṣa, and the quarters.", "idx": 235, "marathi": "पृथ्वी व लोकांना धारण करणारे धरणीधर"}]}, {"id": "stotram-26", "section": "stotram", "num": "26", "slokaNum": 26, "label": "Śloka 26", "speaker": "Names 236–246", "start": 812, "end": 824, "sanskrit": "सुप्रसादः प्रसन्नात्मा विश्वधृग्विश्वभुग्विभुः ।\nसत्कर्ता सत्कृतः साधुर्जह्नुर्नारायणो नरः ॥ २६ ॥", "iast": "suprasādaḥ prasannātmā viśvadhṛg viśvabhug vibhuḥ,\nsatkartā satkṛtaḥ sādhur jahnur nārāyaṇo naraḥ.", "meaning": "Suprasādaḥ – One whose Prasāda or mercy is uniquely wonderful, granting salvation even to foes. Prasannātmā – One whose mind is never contaminated by Rajas or Tamas. Viśvadhṛg – One who holds the universe by His power. Viśvabhug – One who enjoys or protects the worlds. Vibhuḥ – One who takes various forms. Satkartā – One who offers benefits. Satkṛtaḥ – One who is adored even by those who deserve adoration. Sādhuḥ – One who acts according to justice. Jahnuḥ – One who dissolves all beings in Himself at the time of dissolution. Nārāyaṇaḥ – One having His residence in all beings. Naraḥ – The eternal Paramātmā who directs everything.", "meaningMarathi": "Suprasādaḥ (शत्रूंनाही मोक्ष देणारी अद्भुत कृपा असलेले सुप्रसाद) • Prasannātmā (रजो-तमोगुणांनी कधीही मलिन न होणारे प्रसन्नात्मा) • Viśvadhṛg (आपल्या शक्तीने विश्व धारण करणारे विश्वधृक्) • Viśvabhug (विश्वाचे रक्षण व उपभोग घेणारे विश्वभुक्) • Vibhuḥ (अनेक  27", "speaker": "Names 247–255", "start": 824, "end": 836, "sanskrit": "असङ्ख्येयोऽप्रमेयात्मा विशिष्टः शिष्टकृच्छुचिः ।\nसिद्धार्थः सिद्धसङ्कल्पः सिद्धिदः सिद्धिसाधनः ॥ २७ ॥", "iast": "asaṅkhyeyo 'prameyātmā viśiṣṭaḥ śiṣṭakṛc chuciḥ,\nsiddhārthaḥ siddhasaṅkalpaḥ siddhidaḥ siddhisādhanaḥ.", "meaning": "Asaṅkhyeyaḥ – One who has no differences of name and form. Aprameyātmā – One whose nature cannot be grasped by any of the means of knowledge. Viśiṣṭaḥ – One who excels everything. Śiṣṭakṛt – One who commands everything, or protects good men. Śuciḥ – Pure. Siddhārthaḥ – One whose object is always fulfilled. Siddhasaṅkalpaḥ – One whose resolutions are always fulfilled. Siddhidaḥ – One who bestows Siddhi or fulfillment on all who practise disciplines. Siddhisādhanaḥ – One who brings fulfillment to worthy works.", "meaningMarathi": "Asaṅkhyeyaḥ (नाम-रूपांच्या मर्यादेपलीकडील असंख्येय) • Aprameyātmā (कोणत्याही प्रमाणाने न मोजता येणारे अप्रमेयात्मा) • Viśiṣṭaḥ (सर्वांहून श्रेष्ठ विशिष्ट) • Śiṣṭakṛt (सज्जनांचे रक्षण व आज्ञापालन करणारे शिष्टकृत्) • Śuciḥ (परम पवित्र शुची) • Siddhārthaḥ (ज्यांचे सर्व मनोरथ सिद्ध आहेत असे सिद्धार्थ) • Siddhasaṅkalpaḥ (ज्यांचे संकल्प सदैव पूर्ण होतात असे सिद्धसंकल्प) • Siddhidaḥ (साधकांना सिद्धी देणारे सिद्धिद) • Siddhisādhanaḥ (सत्कार्यांना सिद्धीस नेणारे सिद्धिसाधन)", "names": [{"name": "Asaṅkhyeyaḥ", "meaning": "One who has no differences of name and form.", "idx": 247, "marathi": "नाम-रूपांच्या मर्यादेपलीकडील असंख्येय"}, {"name": "Aprameyātmā", "meaning": "One whose nature cannot be grasped by any of the means of knowledge.", "idx": 248, "marathi": "कोणत्याही प्रमाणाने न मोजता येणारे अप्रमेयात्मा"}, {"name": "Viśiṣṭaḥ", "meaning": "One who excels everything.", "idx": 249, "marathi": "सर्वांहून श्रेष्ठ विशिष्ट"}, {"name": "Śiṣṭakṛt", "meaning": "One who commands everything, or protects good men.", "idx": 250, "marathi": "सज्जनांचे रक्षण व आज्ञापालन करणारे शिष्टकृत्"}, {"name": "Śuciḥ", "meaning": "Pure.", "idx": 251, "marathi": "परम पवित्र शुची"}, {"name": "Siddhārthaḥ", "meaning": "One whose object is always fulfilled.", "idx": 252, "marathi": "ज्यांचे सर्व मनोरथ सिद्ध आहेत असे सिद्धार्थ"}, {"name": "Siddhasaṅkalpaḥ", "meaning": "One whose resolutions are always fulfilled.", "idx": 253, "marathi": "ज्यांचे संकल्प सदैव पूर्ण होतात असे सिद्धसंकल्प"}, {"name": "Siddhidaḥ", "meaning": "One who bestows Siddhi or fulfillment on all who practise disciplines.", "idx": 254, "marathi": "साधकांना सिद्धी देणारे सिद्धिद"}, {"name": "Siddhisādhanaḥ", "meaning": "One who brings fulfillment to worthy works.", "idx": 255, "marathi": "सत्कार्यांना सिद्धीस नेणारे सिद्धिसाधन"}]}, {"id": "stotram-28", "section": "stotram", "num": "28", "slokaNum": 28, "label": "Śloka 28", "speaker": "Names 256–264", "start": 836, "end": 847, "sanskrit": "वृषाही वृषभो विष्णुर्वृषपर्वा वृषोदरः ।\nवर्धनो वर्धमानश्च विविक्तः श्रुतिसागरः ॥ २८ ॥", "iast": "vṛṣāhī vṛṣabho viṣṇur vṛṣaparvā vṛṣodaraḥ,\nvardhano vardhamānaś ca viviktaḥ śrutisāgaraḥ.", "meaning": "Vṛṣāhī – One who is the possessor of Dharma. Vṛṣabhaḥ – One who showers on devotees all that they pray for. Viṣṇuḥ – One who pervades everything. Vṛṣaparvā – One who has given Dharma observances as steps to attain the supreme state. Vṛṣodaraḥ – One whose abdomen showers offspring. Vardhanaḥ – One who increases the ecstasy of His devotees. Vardhamānaḥ – One who multiplies in the form of the universe. Viviktaḥ – One who is untouched and unaffected. Śrutisāgaraḥ – One to whom all the Śruti or Vedic words flow.", "meaningMarathi": "Vṛṣāhī (धर्माचे स्वामी वृषाही) • Vṛṣabhaḥ (भक्तांच्या सर्व कामनांचा वर्षाव करणारे वृषभ) • Viṣṇuḥ (सर्वव्यापी विष्णू) • Vṛṣaparvā (मोक्षप्राप्तीसाठी धर्मरूपी पायऱ्या देणारे वृषपर्वा) • Vṛṣodaraḥ (उदरातून सृष्टीचा विस्तार करणारे वृषोदर) • Vardhanaḥ (भक्तांचा आनंद वाढवणारे वर्धन) • Vardhamānaḥ (विश्वरूपाने विस्तार पावणारे वर्धमान) • Viviktaḥ (सदैव अलिप्त व निराळे विविक्त) • Śrutisāgaraḥ (सर्व वेदमंत्रांचे महासागर श्रुतिसागर)", "names": [{"name": "Vṛṣāhī", "meaning": "One who is the possessor of Dharma.", "idx": 256, "marathi": "धर्माचे स्वामी वृषाही"}, {"name": "Vṛṣabhaḥ", "meaning": "One who showers on devotees all that they pray for.", "idx": 257, "marathi": "भक्तांच्या सर्व कामनांचा वर्षाव करणारे वृषभ"}, {"name": "Viṣṇuḥ", "meaning": "One who pervades everything.", "idx": 258, "marathi": "सर्वव्यापी विष्णू"}, {"name": "Vṛṣaparvā", "meaning": "One who has given Dharma observances as steps to attain the supreme state.", "idx": 259, "marathi": "मोक्षप्राप्तीसाठी धर्मरूपी पायऱ्या देणारे वृषपर्वा"}, {"name": "Vṛṣodaraḥ", "meaning": "One whose abdomen showers offspring.", "idx": 260, "marathi": "उदरातून सृष्टीचा विस्तार करणारे वृषोदर"}, {"name": "Vardhanaḥ", "meaning": "One who increases the ecstasy of His devotees.", "idx": 261, "marathi": "भक्तांचा आनंद वाढवणारे वर्धन"}, {"name": "Vardhamānaḥ", "meaning": "One who multiplies in the form of the universe.", "idx": 262, "marathi": "विश्वरूपाने विस्तार पावणारे वर्धमान"}, {"name": "Viviktaḥ", "meaning": "One who is untouched and unaffected.", "idx": 263, "marathi": "सदैव अलिप्त व निराळे विविक्त"}, {"name": "Śrutisāgaraḥ", "meaning": "One to whom all the Śruti or Vedic words flow.", "idx": 264, "marathi": "सर्व वेदमंत्रांचे महासागर श्रुतिसागर"}]}, {"id": "stotram-29", "section": "stotram", "num": "29", "slokaNum": 29, "label": "Śloka 29", "speaker": "Names 265–274", "start": 847, "end": 859, "sanskrit": "सुभुजो दुर्धरो वाग्मी महेन्द्रो वसुदो वसुः ।\nनैकरूपो बृहद्रूपः शिपिविष्टः प्रकाशनः ॥ २९ ॥", "iast": "subhujo durdharo vāgmī mahendro vasudo vasuḥ,\nnaikarūpo bṛhadrūpaḥ śipiviṣṭaḥ prakāśanaḥ.", "meaning": "Subhujaḥ – One possessing excellent arms that protect the worlds. Durdharaḥ – One who holds up the universe – a work none else can do. Vāgmī – One from whom the words constituting the Veda come out. Mahendraḥ – The great Lord, the God of all gods. Vasudaḥ – One who bestows riches. Vasuḥ – One who is Himself the Vasu (wealth). Naikarūpaḥ – One who is without an exclusive form. Bṛhadrūpaḥ – One who has adopted immense forms like that of the Cosmic Boar. Śipiviṣṭaḥ – One who resides in cows as Yajña (or dwells in rays of light). Prakāśanaḥ – One who illumines everything.", "meaningMarathi": "Subhujaḥ (जगाचे रक्षण करणारे सुंदर बाहू असलेले सुभुज) • Durdharaḥ (दुसऱ्या कोणालाही अशक्य असे विश्वधारण करणारे दुर्धर) • Vāgmī (वेदांची वाणी प्रकट करणारे वाग्मी) • Mahendraḥ (देवांचेही देव महेंद्र) • Vasudaḥ (संपत्ती देणारे वसुद) • Vasuḥ (स्वतः ऐश्वर्यस्वरूप वसू) • Naikarūpaḥ (एकाच रूपात मर्यादित नसलेले नैकरूप) • Bṛhadrūpaḥ (वराहादी विशाल रूपे धारण करणारे बृहद्रूप) • Śipiviṣṭaḥ (किरणांत व यज्ञात वास करणारे शिपिविष्ट) • Prakāśanaḥ (सर्वकाही प्रकाशित करणारे प्रकाशन)", "names": [{"name": "Subhujaḥ", "meaning": "One possessing excellent arms that protect the worlds.", "idx": 265, "marathi": "जगाचे रक्षण करणारे सुंदर बाहू असलेले सुभुज"}, {"name": "Durdharaḥ", "meaning": "One who holds up the universe – a work none else can do.", "idx": 266, "marathi": "दुसऱ्या कोणालाही अशक्य असे विश्वधारण करणारे दुर्धर"}, {"name": "Vāgmī", "meaning": "One from whom the words constituting the Veda come out.", "idx": 267, "marathi": "वेदांची वाणी प्रकट करणारे वाग्मी"}, {"name": "Mahendraḥ", "meaning": "The great Lord, the God of all gods.", "idx": 268, "marathi": "देवांचेही देव महेंद्र"}, {"name": "Vasudaḥ", "meaning": "One who bestows riches.", "idx": 269, "marathi": "संपत्ती देणारे वसुद"}, {"name": "Vasuḥ", "meaning": "One who is Himself the Vasu (wealth).", "idx": 270, "marathi": "स्वतः ऐश्वर्यस्वरूप वसू"}, {"name": "Naikarūpaḥ", "meaning": "One who is without an exclusive form.", "idx": 271, "marathi": "एकाच रूपात मर्यादित नसलेले नैकरूप"}, {"name": "Bṛhadrūpaḥ", "meaning": "One who has adopted immense forms like that of the Cosmic Boar.", "idx": 272, "marathi": "वराहादी विशाल रूपे धारण करणारे बृहद्रूप"}, {"name": "Śipiviṣṭaḥ", "meaning": "One who resides in cows as Yajña (or dwells in rays of light).", "idx": 273, "marathi": "किरणांत व यज्ञात वास करणारे शिपिविष्ट"}, {"name": "Prakāśanaḥ", "meaning": "One who illumines everything.", "idx": 274, "marathi": "सर्वकाही प्रकाशित करणारे प्रकाशन"}]}, {"id": "stotram-30", "section": "stotram", "num": "30", "slokaNum": 30, "label": "Śloka 30", "speaker": "Names 275–282", "start": 859, "end": 872, "sanskrit": "ओजस्तेजोद्युतिधरः प्रकाशात्मा प्रतापनः ।\nऋद्धः स्पष्टाक्षरो मन्त्रश्चन्द्रांशुर्भास्करद्युतिः ॥ ३० ॥", "iast": "ojas tejo dyutidharaḥ prakāśātmā pratāpanaḥ,\nṛddhaḥ spaṣṭākṣaro mantraś candrāṃśur bhāskaradyutiḥ.", "meaning": "Ojas-tejo-dyuti-dharaḥ – One endowed with strength, vigour and brilliance. Prakāśātmā – One whose form is radiant. Pratāpanaḥ – One who warms the world through power manifestations like the Sun. Ṛddhaḥ – One rich in excellences like Dharma, Jñāna, and Vairāgya. Spaṣṭākṣaraḥ – One manifested by the clear, high-pitched sound of Oṃkāra. Mantraḥ – One who manifests as the Vedic Mantras, or is known through Mantras. Candrāṃśuḥ – Like cool moonlight, giving relief to those scorched by Saṃsāra. Bhāskara-dyutiḥ – He who has the effulgence of the sun.", "meaningMarathi": "Ojas-tejo-dyuti-dharaḥ (ओज, तेज आणि द्युती धारण करणारे) • Prakāśātmā (तेजोमय स्वरूपाचे प्रकाशात्मा) • Pratāpanaḥ (सूर्यादी रूपांनी जगाला उष्णता देणारे प्रतापन) • Ṛddhaḥ (धर्म-ज्ञान-वैराग्यादी गुणांनी समृद्ध ऋद्ध) • Spaṣṭākṣaraḥ (स्पष्ट ॐकार ध्वनीने प्रकट होणारे स्पष्टाक्षर) • Mantraḥ (वेदमंत्रस्वरूप मंत्र) • Candrāṃśuḥ (संसारतापातून चंद्रकिरणांप्रमाणे शीतलता देणारे चंद्रांशू) • Bhāskara-dyutiḥ (सूर्याप्रमाणे तेज असलेले भास्करद्युती)", "names": [{"name": "Ojas-tejo-dyuti-dharaḥ", "meaning": "One endowed with strength, vigour and brilliance.", "idx": 275, "marathi": "ओज, तेज आणि द्युती धारण करणारे"}, {"name": "Prakāśātmā", "meaning": "One whose form is radiant.", "idx": 276, "marathi": "तेजोमय स्वरूपाचे प्रकाशात्मा"}, {"name": "Pratāpanaḥ", "meaning": "One who warms the world through power manifestations like the Sun.", "idx": 277, "marathi": "सूर्यादी रूपांनी जगाला उष्णता देणारे प्रतापन"}, {"name": "Ṛddhaḥ", "meaning": "One rich in excellences like Dharma, Jñāna, and Vairāgya.", "idx": 278, "marathi": "धर्म-ज्ञान-वैराग्यादी गुणांनी समृद्ध ऋद्ध"}, {"name": "Spaṣṭākṣaraḥ", "meaning": "One manifested by the clear, high-pitched sound of Oṃkāra.", "idx": 279, "marathi": "स्पष्ट ॐकार ध्वनीने प्रकट होणारे स्पष्टाक्षर"}, {"name": "Mantraḥ", "meaning": "One who manifests as the Vedic Mantras, or is known through Mantras.", "idx": 280, "marathi": "वेदमंत्रस्वरूप मंत्र"}, {"name": "Candrāṃśuḥ", "meaning": "Like cool moonlight, giving relief to those scorched by Saṃsāra.", "idx": 281, "marathi": "संसारतापातून चंद्रकिरणांप्रमाणे शीतलता देणारे चंद्रांशू"}, {"name": "Bhāskara-dyutiḥ", "meaning": "He who has the effulgence of the sun.", "idx": 282, "marathi": "सूर्याप्रमाणे तेज असलेले भास्करद्युती"}]}, {"id": "stotram-31", "section": "stotram", "num": "31", "slokaNum": 31, "label": "Śloka 31", "speaker": "Names 283–289", "start": 872, "end": 883, "sanskrit": "अमृतांशूद्भवो भानुः शशबिन्दुः सुरेश्वरः ।\nऔषधं जगतः सेतुः सत्यधर्मपराक्रमः ॥ ३१ ॥", "iast": "amṛtāṃśūdbhavo bhānuḥ śaśabinduḥ sureśvaraḥ,\nauṣadhaṃ jagataḥ setuḥ satyadharmaparākramaḥ.", "meaning": "Amṛtāṃśūdbhavaḥ – The Paramātman from whom the Moon originated during the churning of the Milk-ocean. Bhānuḥ – One who shines. Śaśabinduḥ – One who has the mark of the hare, the Moon. Sureśvaraḥ – The Lord of all Devas and those who do good. Auṣadham – The medicine for the great disease of Saṃsāra. Jagataḥ setuḥ – The bridge to cross the ocean of Saṃsāra. Satya-dharma-parākramaḥ – One whose righteousness, omniscience, and valour are all true.", "meaningMarathi": "Amṛtāṃśūdbhavaḥ (समुद्रमंथनात ज्यांच्यापासून चंद्र उत्पन्न झाला ते अमृतांशूद्भव) • Bhānuḥ (स्वयंप्रकाशित भानू) • Śaśabinduḥ (सशाचे चिन्ह असलेला चंद्ररूप शशबिंदू) • Sureśvaraḥ (सर्व देवांचे ईश्वर सुरेश्वर) • Auṣadham (संसाररूपी व्याधीवरील परम औषध) • Jagataḥ setuḥ (संसारसागर पार करण्याचा सेतू) • Satya-dharma-parākramaḥ (ज्यांचा धर्म व पराक्रम सदैव सत्य आहे असे सत्यधर्मपराक्रम)", "names": [{"name": "Amṛtāṃśūdbhavaḥ", "meaning": "The Paramātman from whom the Moon originated during the churning of the Milk-ocean.", "idx": 283, "marathi": "समुद्रमंथनात ज्यांच्यापासून चंद्र उत्पन्न झाला ते अमृतांशूद्भव"}, {"name": "Bhānuḥ", "meaning": "One who shines.", "idx": 284, "marathi": "स्वयंप्रकाशित भानू"}, {"name": "Śaśabinduḥ", "meaning": "One who has the mark of the hare, the Moon.", "idx": 285, "marathi": "सशाचे चिन्ह असलेला चंद्ररूप शशबिंदू"}, {"name": "Sureśvaraḥ", "meaning": "The Lord of all Devas and those who do good.", "idx": 286, "marathi": "सर्व देवांचे ईश्वर सुरेश्वर"}, {"name": "Auṣadham", "meaning": "The medicine for the great disease of Saṃsāra.", "idx": 287, "marathi": "संसाररूपी व्याधीवरील परम औषध"}, {"name": "Jagataḥ setuḥ", "meaning": "The bridge to cross the ocean of Saṃsāra.", "idx": 288, "marathi": "संसारसागर पार करण्याचा सेतू"}, {"name": "Satya-dharma-parākramaḥ", "meaning": "One whose righteousness, omniscience, and valour are all true.", "idx": 289, "marathi": "ज्यांचा धर्म व पराक्रम सदैव सत्य आहे असे सत्यधर्मपराक्रम"}]}, {"id": "stotram-32", "section": "stotram", "num": "32", "slokaNum": 32, "label": "Śloka 32", "speaker": "Names 290–299", "start": 883, "end": 895, "sanskrit": "भूतभव्यभवन्नाथः पवनः पावनोऽनलः ।\nकामहा कामकृत्कान्तः कामः कामप्रदः प्रभुः ॥ ३२ ॥", "iast": "bhūtabhavyabhavannāthaḥ pavanaḥ pāvano 'nalaḥ,\nkāmahā kāmakṛt kāntaḥ kāmaḥ kāmapradaḥ prabhuḥ.", "meaning": "Bhūta-bhavya-bhavan-nāthaḥ – Master of all beings of the past, future and present. Pavanaḥ – The purifier. Pāvanaḥ – One who causes movement. Analaḥ – The Jīvātmā recognizing Prāṇa as Himself (or boundless fire). Kāmahā – One who destroys desire in seekers of liberation. Kāmakṛt – One who fulfils the wants of pure-minded devotees. Kāntaḥ – One who is extremely beautiful. Kāmaḥ – Sought after by those desiring the four supreme values of life. Kāmapradaḥ – One who liberally fulfils devotees' desires. Prabhuḥ – One who surpasses all.", "meaningMarathi": "Bhūta-bh label": "Śloka 36", "speaker": "Names 327–335", "start": 930, "end": 941, "sanskrit": "स्कन्दः स्कन्दधरो धुर्यो वरदो वायुवाहनः ।\nवासुदेवो बृहद्भानुरादिदेवः पुरन्दरः ॥ ३६ ॥", "iast": "skandaḥ skandadharo dhuryo varado vāyuvāhanaḥ,\nvāsudevo bṛhadbhānur ādidevaḥ purandaraḥ.", "meaning": "Skandaḥ – One who drives everything as air. Skanda-dharaḥ – One who supports the righteous path. Dhuryaḥ – One who bears the burden of all beings. Varadaḥ – One who gives boons. Vāyuvāhanaḥ – One who vibrates the seven Vāyus (atmospheres). Vāsudevaḥ – One who is both Vasu (indweller) and Deva (shining). Bṛhadbhānuḥ – The great brilliance. Ādidevaḥ – The Divinity who is the source of all Devas. Purandaraḥ – One who destroys the cities of the enemies of Devas.", "meaningMarathi": "Skandaḥ (वायुरूपाने सर्वांना गती देणारे स्कंद) • Skanda-dharaḥ (धर्ममार्गाचे रक्षण करणारे स्कंदधर) • Dhuryaḥ (सर्व प्राण्यांचा भार वाहणारे धुर्य) • Varadaḥ (वरदान देणारे वरद) • Vāyuvāhanaḥ (सप्त वायूंना गती देणारे वायुवाहन) • Vāsudevaḥ (सर्वत्र वास करणारे व तेजस्वी वासुदेव) • Bṛhadbhānuḥ (महातेजस्वी बृहद्भानू) • Ādidevaḥ (सर्व देवांचे मूळ आदिदेव) • Purandaraḥ (असुरांची नगरे नष्ट करणारे पुरंदर)", "names": [{"name": "Skandaḥ", "meaning": "One who drives everything as air.", "idx": 327, "marathi": "वायुरूपाने सर्वांना गती देणारे स्कंद"}, {"name": "Skanda-dharaḥ", "meaning": "One who supports the righteous path.", "idx": 328, "marathi": "धर्ममार्गाचे रक्षण करणारे स्कंदधर"}, {"name": "Dhuryaḥ", "meaning": "One who bears the burden of all beings.", "idx": 329, "marathi": "सर्व प्राण्यांचा भार वाहणारे धुर्य"}, {"name": "Varadaḥ", "meaning": "One who gives boons.", "idx": 330, "marathi": "वरदान देणारे वरद"}, {"name": "Vāyuvāhanaḥ", "meaning": "One who vibrates the seven Vāyus (atmospheres).", "idx": 331, "marathi": "सप्त वायूंना गती देणारे वायुवाहन"}, {"name": "Vāsudevaḥ", "meaning": "One who is both Vasu (indweller) and Deva (shining).", "idx": 332, "marathi": "सर्वत्र वास करणारे व तेजस्वी वासुदेव"}, {"name": "Bṛhadbhānuḥ", "meaning": "The great brilliance.", "idx": 333, "marathi": "महातेजस्वी बृहद्भानू"}, {"name": "Ādidevaḥ", "meaning": "The Divinity who is the source of all Devas.", "idx": 334, "marathi": "सर्व देवांचे मूळ आदिदेव"}, {"name": "Purandaraḥ", "meaning": "One who destroys the cities of the enemies of Devas.", "idx": 335, "marathi": "असुरांची नगरे नष्ट करणारे पुरंदर"}]}, {"id": "stotram-37", "section": "stotram", "num": "37", "slokaNum": 37, "label": "Śloka 37", "speaker": "Names 336–345", "start": 941, "end": 953, "sanskrit": "अशोकस्तारणस्तारः शूरः शौरिर्जनेश्वरः ।\nअनुकूलः शतावर्तः पद्मी पद्मनिभेक्षणः ॥ ३७ ॥", "iast": "aśokas tāraṇas tāraḥ śūraḥ śaurir janeśvaraḥ,\nanukūlaḥ śatāvartaḥ padmī padmanibhekṣaṇaḥ.", "meaning": "Aśokaḥ – One without sorrow, infatuation, hunger, thirst, birth and death. Tāraṇaḥ – One who uplifts beings from the ocean of Saṃsāra. Tāraḥ – One who liberates beings from the fear of birth, old age, and death. Śūraḥ – One of great prowess fulfilling Dharma, Artha, Kāma and Mokṣa. Śauriḥ – Born as Kṛṣṇa in the lineage of Śūra. Janeśvaraḥ – The Lord of all beings. Anukūlaḥ – Being the Ātman of all, favorable to all. Śatāvartaḥ – One who has taken innumerable incarnations. Padmī – One holding a lotus in His hand. Padma-nibhekṣaṇaḥ – One with eyes resembling lotus.", "meaningMarathi": "Aśokaḥ (शोक, मोह, क्षुधा, तृष्णा यांपासून मुक्त अशोक) • Tāraṇaḥ (संसारसागरातून तारून नेणारे तारण) • Tāraḥ (जन्म-जरा-मृत्यूच्या भयातून मुक्त करणारे तार) • Śūraḥ (चार पुरुषार्थ देणारे महापराक्रमी शूर) • Śauriḥ (शूर कुळात श्रीकृष्ण म्हणून जन्मलेले शौरि) • Janeśvaraḥ (सर्व जनांचे ईश्वर जनेश्वर) • Anukūlaḥ (सर्वांचे अंतरात्मा असल्याने सर्वांना अनुकूल) • Śatāvartaḥ (असंख्य अवतार घेणारे शतावर्त) • Padmī (हातात कमळ धारण करणारे पद्मी) • Padma-nibhekṣaṇaḥ (कमळासारखे नेत्र असलेले पद्मनिभेक्षण)", "names": [{"name": "Aśokaḥ", "meaning": "One without sorrow, infatuation, hunger, thirst, birth and death.", "idx": 336, "marathi": "शोक, मोह, क्षुधा, तृष्णा यांपासून मुक्त अशोक"}, {"
