    function renderMain() {
      if (state.pageMode === 'origin') {
        chantControls.classList.add('hidden');
        renderOriginStory();
        return;
      }

      chantControls.classList.remove('hidden');
      const list = getFilteredVerses();
      const rangeBar = document.getElementById('stotramRangeBar');
      const resultMeta = document.getElementById('resultMeta');

      if (state.activeSection === 'stotram' && !state.searchQuery.trim()) rangeBar.classList.remove('hidden');
      else rangeBar.classList.add('hidden');

      if (!list.length) {
        mainStage.innerHTML = `
          <div class="surface rounded-3xl p-12 text-center">
            <p class="font-display text-base font-bold mb-1">No verses found</p>
            <p class="text-xs mb-5" style="color: var(--text-secondary);">Try another Sanskrit word, divine name, or English/Marathi term.</p>
            <button id="btnResetFilters" type="button" class="px-4 py-2 rounded-full text-xs font-semibold accent-pill">Reset Filters</button>
          </div>
        `;
        const rBtn = document.getElementById('btnResetFilters');
        if (rBtn) rBtn.addEventListener('click', () => {
          state.searchQuery = ''; state.onlyBookmarks = false; state.stotramRange = 'all';
          searchInput.value = ''; btnClearSearch.classList.add('hidden'); renderAll();
        });
        return;
      }

      resultMeta.textContent = `${list.length} verse${list.length === 1 ? '' : 's'}`;

      if (state.viewMode === 'focus') {
        let idx = list.findIndex(v => v.id === state.activeVerseId);
        if (idx < 0) { idx = 0; state.activeVerseId = list[0].id; }
        const cur = list[idx];
        const navBar = `
          <div class="flex items-center justify-between gap-2">
            <button id="focusPrev" type="button" ${idx === 0 ? 'disabled' : ''} class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold soft-surface hover:bg-orange-500/10 disabled:opacity-35 transition">
              <i data-lucide="chevron-left" class="w-4 h-4"></i> Prev
            </button>
            <div class="flex items-center gap-2">
              <span class="text-xs font-medium" style="color: var(--text-secondary);">${idx + 1} / ${list.length}</span>
              <select id="focusJumpSelect" class="px-3 py-1 rounded-full soft-surface text-xs font-semibold cursor-pointer focus:outline-none max-w-[160px]" aria-label="Jump to verse">
                ${list.map((v, i) => `<option value="${v.id}" ${i === idx ? 'selected' : ''}>${escapeHtml(v.label)}</option>`).join('')}
              </select>
            </div>
            <button id="focusNext" type="button" ${idx === list.length - 1 ? 'disabled' : ''} class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold soft-surface hover:bg-orange-500/10 disabled:opacity-35 transition">
              Next <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        mainStage.innerHTML = navBar + renderVerseCard(cur, true);

        document.getElementById('focusPrev').addEventListener('click', () => {
          if (idx > 0) { state.activeVerseId = list[idx - 1].id; renderMain(); updatePlayerUI(); }
        });
        document.getElementById('focusNext').addEventListener('click', () => {
          if (idx < list.length - 1) { state.activeVerseId = list[idx + 1].id; renderMain(); updatePlayerUI(); }
        });
        document.getElementById('focusJumpSelect').addEventListener('change', (e) => {
          state.activeVerseId = e.target.value; renderMain(); updatePlayerUI();
        });
      } else {
        mainStage.innerHTML = list.map(v => renderVerseCard(v, false)).join('');
      }

      if (window.lucide) window.lucide.createIcons();
    }

    function updatePlayingHighlight() {
      const eqHtml = `<span class="inline-flex items-end gap-[2px] h-3"><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span></span>`;
      document.querySelectorAll('[data-verse-card]').forEach(el => {
        const id = el.getAttribute('data-verse-card');
        const active = state.isPlaying && state.playingVerseId === id;
        el.classList.toggle('verse-playing', active);
        const btn = el.querySelector('[data-action="play"]');
        if (btn) {
          btn.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition ' +
            (active ? 'accent-pill shadow-sm' : 'soft-surface hover:bg-indigo-500/15');
          btn.innerHTML = (active ? eqHtml : '<i data-lucide="play" class="w-3 h-3"></i>') + `<span>${active ? 'Playing' : 'Play'}</span>`;
        }
      });
      if (window.lucide) window.lucide.createIcons();
    }

    function updateProgressBadge() {
      document.getElementById('progressBadge').textContent = `${state.studied.size} / ${VERSES.length}`;
      document.getElementById('bookmarkCount').textContent = state.bookmarks.size;
    }

    function updatePlayerUI() {
      const cur = verseById[state.playingVerseId || state.activeVerseId] || VERSES[0];
      document.getElementById('playerVerseTitle').textContent = cur.label;
      document.getElementById('playerVerseSub').textContent = state.audioEngine === 'mp3'
        ? `Challakere Brothers • ${formatTime(cur.start)}–${formatTime(cur.end)}`
        : `${cur.speaker} • Sanskrit TTS`;

      document.getElementById('engineBadge').textContent = state.audioEngine === 'mp3' ? 'Synced Audio' : 'TTS';
      document.getElementById('labelEngineToggle').textContent = state.audioEngine === 'mp3' ? 'Audio' : 'TTS';

      document.getElementById('iconPlayPause').setAttribute('data-lucide', state.isPlaying ? 'pause' : 'play');

      const modeLabels = { single: 'Single', loop: 'Loop', continuous: 'Flow' };
      const modeIcons = { single: 'play-circle', loop: 'repeat-1', continuous: 'infinity' };
      document.getElementById('labelPlaybackMode').textContent = modeLabels[state.playbackMode];
      document.getElementById('iconPlaybackMode').setAttribute('data-lucide', modeIcons[state.playbackMode]);

      if (window.lucide) window.lucide.createIcons();
    }

    function updateChromeStyles() {
      const originBtn = document.getElementById('btnOriginStory');
      if (state.pageMode === 'origin') {
        originBtn.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition accent-pill shadow-sm';
        originBtn.removeAttribute('style');
      } else {
        originBtn.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition border hover:opacity-90';
        originBtn.setAttribute('style', 'border-color: rgba(234, 88, 12, 0.35); background-color: var(--accent-soft); color: var(--accent);');
      }

      document.querySelectorAll('.sec-tab').forEach(btn => {
        const active = btn.getAttribute('data-section') === state.activeSection && !state.searchQuery.trim();
        btn.className = 'sec-tab px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition ' +
          (active ? 'accent-pill shadow-sm' : 'hover:bg-orange-500/10');
      });

      document.querySelectorAll('.range-btn').forEach(btn => {
        const active = btn.getAttribute('data-range') === state.stotramRange;
        btn.className = 'range-btn px-2.5 py-1 rounded-full text-[11px] font-semibold transition ' +
          (active ? 'accent-pill' : 'soft-surface hover:bg-orange-500/10');
      });

      document.querySelectorAll('.lang-btn').forEach(btn => {
        const active = btn.getAttribute('data-lang') === state.meaningLang;
        btn.className = 'lang-btn px-2.5 py-1 rounded-xl transition ' +
          (active ? 'accent-pill' : 'hover:bg-orange-500/10');
      });

      const focusBtn = document.getElementById('btnViewFocus');
      const listBtn = document.getElementById('btnViewList');
      focusBtn.className = 'px-2.5 py-1 rounded-xl text-xs font-semibold inline-flex items-center gap-1 transition ' +
        (state.viewMode === 'focus' ? 'accent-pill' : 'hover:bg-orange-500/10');
      listBtn.className = 'px-2.5 py-1 rounded-xl text-xs font-semibold inline-flex items-center gap-1 transition ' +
        (state.viewMode === 'list' ? 'accent-pill' : 'hover:bg-orange-500/10');

      const iastBtn = document.getElementById('btnToggleIast');
      iastBtn.className = 'px-3 py-1.5 rounded-2xl text-[11px] font-semibold transition ' +
        (state.showIast ? 'accent-pill' : 'soft-surface hover:bg-orange-500/10');

      const bmBtn = document.getElementById('btnBookmarksOnly');
      bmBtn.className = 'inline-flex items-center gap-1 px-3 py-1.5 rounded-2xl text-[11px] font-semibold transition ' +
        (state.onlyBookmarks ? 'accent-pill' : 'soft-surface hover:bg-orange-500/10');

      document.documentElement.classList.toggle('dark', state.darkMode);
      document.documentElement.style.setProperty('--font-scale', String(state.fontScale));
      document.getElementById('iconTheme').setAttribute('data-lucide', state.darkMode ? 'sun' : 'moon');
    }

    function renderAll() {
      updateChromeStyles();
      updateProgressBadge();
      renderMain();
      updatePlayerUI();
    }

    // Event Delegation on Main Stage
    mainStage.addEventListener('click', (e) => {
      const originPill = e.target.closest('[data-origin-id]');
      if (originPill) {
        state.activeOriginId = originPill.getAttribute('data-origin-id');
        renderOriginStory();
        return;
      }
      const nameBtn = e.target.closest('[data-speak-name]');
      if (nameBtn) {
        speakSingleName(nameBtn.getAttribute('data-speak-name'), nameBtn);
        return;
      }
      const actionBtn = e.target.closest('[data-action]');
      if (!actionBtn) return;
      const action = actionBtn.getAttribute('data-action');
      const id = actionBtn.getAttribute('data-id');
      if (action === 'play') playVerse(id);
      else if (action === 'bookmark') {
        if (state.bookmarks.has(id)) { state.bookmarks.delete(id); showToast('Removed from saved'); }
        else { state.bookmarks.add(id); showToast('Saved verse'); }
        persistState(); renderAll();
      } else if (action === 'studied') {
        if (state.studied.has(id)) state.studied.delete(id);
        else state.studied.add(id);
        persistState(); renderAll();
      } else if (action === 'copy') copyVerse(id);
    });

    // Header Navigation
    document.getElementById('btnBrandHome').addEventListener('click', () => {
      state.pageMode = 'chant';
      renderAll();
    });
    document.getElementById('btnOriginStory').addEventListener('click', () => {
      state.pageMode = state.pageMode === 'origin' ? 'chant' : 'origin';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('sectionTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.sec-tab');
      if (!btn) return;
      state.pageMode = 'chant';
      state.activeSection = btn.getAttribute('data-section');
      state.searchQuery = '';
      searchInput.value = '';
      btnClearSearch.classList.add('hidden');
      const first = getFilteredVerses()[0];
      if (first) state.activeVerseId = first.id;
      renderAll();
    });

    document.getElementById('stotramRangeBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.range-btn');
      if (!btn) return;
      state.stotramRange = btn.getAttribute('data-range');
      const first = getFilteredVerses()[0];
      if (first) state.activeVerseId = first.id;
      renderAll();
    });

    document.getElementById('langGroup').addEventListener('click', (e) => {
      const btn = e.target.closest('.lang-btn');
      if (!btn) return;
      state.meaningLang = btn.getAttribute('data-lang');
      persistState();
      renderAll();
    });

    document.getElementById('btnViewFocus').addEventListener('click', () => { state.viewMode = 'focus'; renderAll(); });
    document.getElementById('btnViewList').addEventListener('click', () => { state.viewMode = 'list'; renderAll(); });

    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      btnClearSearch.classList.toggle('hidden', !state.searchQuery);
      renderAll();
    });
    btnClearSearch.addEventListener('click', () => {
      state.searchQuery = ''; searchInput.value = '';
      btnClearSearch.classList.add('hidden'); renderAll();
    });

    document.getElementById('btnToggleIast').addEventListener('click', () => { state.showIast = !state.showIast; persistState(); renderAll(); });
    document.getElementById('btnBookmarksOnly').addEventListener('click', () => { state.onlyBookmarks = !state.onlyBookmarks; renderAll(); });

    document.getElementById('btnFontDec').addEventListener('click', () => {
      state.fontScale = Math.max(0.85, +(state.fontScale - 0.1).toFixed(2));
      persistState(); updateChromeStyles();
    });
    document.getElementById('btnFontInc').addEventListener('click', () => {
      state.fontScale = Math.min(1.45, +(state.fontScale + 0.1).toFixed(2));
      persistState(); updateChromeStyles();
    });
    document.getElementById('btnTheme').addEventListener('click', () => {
      state.darkMode = !state.darkMode; persistState(); updateChromeStyles();
      if (window.lucide) window.lucide.createIcons();
    });

    // Audio Dock
    document.getElementById('btnPlayPause').addEventListener('click', () => {
      if (state.isPlaying) stopAllPlayback();
      else playVerse(state.activeVerseId);
    });
    document.getElementById('btnPrevVerse').addEventListener('click', () => {
      const list = getFilteredVerses();
      const idx = list.findIndex(v => v.id === state.activeVerseId);
      if (idx > 0) {
        const target = list[idx - 1];
        state.activeVerseId = target.id;
        if (state.isPlaying) playVerse(target.id);
        else { if (state.pageMode === 'chant') renderMain(); updatePlayerUI(); }
        scrollVerseIntoView(target.id);
      }
    });
    document.getElementById('btnNextVerse').addEventListener('click', () => {
      const list = getFilteredVerses();
      const idx = list.findIndex(v => v.id === state.activeVerseId);
      if (idx >= 0 && idx < list.length - 1) {
        const target = list[idx + 1];
        state.activeVerseId = target.id;
        if (state.isPlaying) playVerse(target.id);
        else { if (state.pageMode === 'chant') renderMain(); updatePlayerUI(); }
        scrollVerseIntoView(target.id);
      }
    });
    document.getElementById('btnPlaybackMode').addEventListener('click', () => {
      const order = ['single', 'loop', 'continuous'];
      state.playbackMode = order[(order.indexOf(state.playbackMode) + 1) % order.length];
      const desc = { single: 'Single Verse Mode', loop: 'Loop Verse Mode', continuous: 'Continuous Flow Mode' };
      showToast(desc[state.playbackMode]);
      updatePlayerUI();
    });
    document.getElementById('speedSelect').addEventListener('change', (e) => {
      state.playbackRate = parseFloat(e.target.value) || 1.0;
      audioEl.playbackRate = state.playbackRate;
      showToast('Speed: ' + state.playbackRate + '×');
    });
    document.getElementById('offsetSelect').addEventListener('change', (e) => {
      state.timeOffset = parseFloat(e.target.value) || 0;
      showToast('Sync offset: ' + (state.timeOffset >= 0 ? '+' : '') + state.timeOffset + 's');
    });
    document.getElementById('btnEngineToggle').addEventListener('click', () => {
      stopAllPlayback();
      state.audioEngine = state.audioEngine === 'mp3' ? 'tts' : 'mp3';
      showToast(state.audioEngine === 'mp3' ? 'Switched to Synced Challakere Audio' : 'Switched to Sanskrit TTS');
      updatePlayerUI();
    });
    document.getElementById('audioScrub').addEventListener('input', (e) => {
      audioEl.currentTime = parseFloat(e.target.value) || 0;
    });

    document.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (state.isPlaying) stopAllPlayback();
        else playVerse(state.activeVerseId);
      } else if (e.code === 'ArrowRight') {
        document.getElementById('btnNextVerse').click();
      } else if (e.code === 'ArrowLeft') {
        document.getElementById('btnPrevVerse').click();
      } else if (e.key && e.key.toLowerCase() === 'l') {
        state.playbackMode = state.playbackMode === 'loop' ? 'single' : 'loop';
        showToast(state.playbackMode === 'loop' ? 'Loop ON' : 'Loop OFF');
        updatePlayerUI();
      }
    });

    renderAll();
  </script>
</body>
</html>
