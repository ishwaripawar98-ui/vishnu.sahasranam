ld. Vṛddhātmā – One whose Ātman is most ancient. Mahākṣaḥ – One who has glorious eyes. Garuḍa-dhvajaḥ – One who has Garuḍa on His banner.", "meaningMarathi": "Padma-nābhaḥ (हृदयकमळाच्या मध्यभागी वास करणारे पद्मनाभ) • Aravindākṣaḥ (कमलनयन अरविंदाक्ष) • Padma-garbhaḥ (हृदयकमळात पूजनीय पद्मगर्भ) • Śarīra-bhṛt (अन्न व प्राण रूपाने शरीरांचे पोषण करणारे शरीरभृत्) • Maharddhiḥ (अपार ऐश्वर्यशाली महर्द्धी) • Ṛddhaḥ (विश्वरूपाने विस्तारलेले ऋद्ध) • Vṛddhātmā (अत्यंत प्राचीन वृद्धात्मा) • Mahākṣaḥ (दिव्य नेत्र असलेले महाक्ष) • Garuḍa-dhvajaḥ (ध्वजावर गरुडाचे चिन्ह असलेले गरुडध्वज)", "names": [{"name": "Padma-nābhaḥ", "meaning": "One who resides in the center of the heart-lotus.", "idx": 346, "marathi": "हृदयकमळाच्या मध्यभागी वास करणारे पद्मनाभ"}, {"name": "Aravindākṣaḥ", "meaning": "One whose eyes resemble the lotus.", "idx": 347, "marathi": "कमलनयन अरविंदाक्ष"}, {"name": "Padma-garbhaḥ", "meaning": "One fit to be worshipped in the middle of the heart-lotus.", "idx": 348, "marathi": "हृदयकमळात पूजनीय पद्मगर्भ"}, {"name": "Śarīra-bhṛt", "meaning": "One who supports the bodies of beings as food and Prāṇa.", "idx": 349, "marathi": "अन्न व प्राण रूपाने शरीरांचे पोषण करणारे शरीरभृत्"}, {"name": "Maharddhiḥ", "meaning": "One of enormous prosperity.", "idx": 350, "marathi": "अपार ऐश्वर्यशाली महर्द्धी"}, {"name": "Ṛddhaḥ", "meaning": "One seen standing in the form of the world.", "idx": 351, "marathi": "विश्वरूपाने विस्तारलेले ऋद्ध"}, {"name": "Vṛddhātmā", "meaning": "One whose Ātman is most ancient.", "idx": 352, "marathi": "अत्यंत प्राचीन वृद्धात्मा"}, {"name": "Mahākṣaḥ", "meaning": "One who has glorious eyes.", "idx": 353, "marathi": "दिव्य नेत्र असलेले महाक्ष"}, {"name": "Garuḍa-dhvajaḥ", "meaning": "One who has Garuḍa on His banner.", "idx": 354, "marathi": "ध्वजावर गरुडाचे चिन्ह असलेले गरुडध्वज"}]}, {"id": "stotram-39", "section": "stotram", "num": "39", "slokaNum": 39, "label": "Śloka 39", "speaker": "Names 355–362", "start": 966, "end": 977, "sanskrit": "अतुलः शरभो भीमः समयज्ञो हविर्हरिः ।\nसर्वलक्षणलक्षण्यो लक्ष्मीवान् समितिञ्जयः ॥ ३९ ॥", "iast": "atulaḥ śarabho bhīmaḥ samayajño havirhariḥ,\nsarvalakṣaṇalakṣaṇyo lakṣmīvān samitiñjayaḥ.", "meaning": "Atulaḥ – One who cannot be compared to anything else. Śarabhaḥ – One who shines inside the perishable body. Bhīmaḥ – One of whom all cosmic forces stand in awe. Samayajñaḥ – One who knows the time for creation, sustentation and dissolution. Havir-hariḥ – One who accepts the offerings (Havis) in Yajñas. Sarva-lakṣaṇa-lakṣaṇyaḥ – The supreme knowledge obtained through all criteria of knowledge. Lakṣmīvān – One on whose chest Goddess Lakṣmī always resides. Samitiñjayaḥ – One victorious in battle.", "meaningMarathi": "Atulaḥ (ज्यांना कशाचीही तुलना नाही असे अतुल) • Śarabhaḥ (नश्वर शरीरात प्रकाशणारे शरभ) • Bhīmaḥ (सर्वांना वचक वाटणारे भीम) • Samayajñaḥ (सृष्टी-स्थिती-लयाचा समय जाणणारे समयज्ञ) • Havir-hariḥ (यज्ञातील हविर्भाग स्वीकारणारे हविर्हरि) • Sarva-lakṣaṇa-lakṣaṇyaḥ (सर्व शास्त्रप्रमाणांचे अंतिम लक्ष्य) • Lakṣmīvān (ज्यांच्या वक्षःस्थळी सदैव लक्ष्मी आहे असे लक्ष्मीवान) • Samitiñjayaḥ (युद्धात सदैव विजयी समितिञ्जय)", "names": [{"name": "Atulaḥ", "meaning": "One who cannot be compared to anything else.", "idx": 355, "marathi": "ज्यांना कशाचीही तुलना नाही असे अतुल"}, {"name": "Śarabhaḥ", "meaning": "One who shines inside the perishable body.", "idx": 356, "marathi": "नश्वर शरीरात प्रकाशणारे शरभ"}, {"name": "Bhīmaḥ", "meaning": "One of whom all cosmic forces stand in awe.", "idx": 357, "marathi": "सर्वांना वचक वाटणारे भीम"}, {"name": "Samayajñaḥ", "meaning": "One who knows the time for creation, sustentation and dissolution.", "idx": 358, "marathi": "सृष्टी-स्थिती-लयाचा समय जाणणारे समयज्ञ"}, {"name": "Havir-hariḥ", "meaning": "One who accepts the offerings (Havis) in Yajñas.", "idx": 359, "marathi": "यज्ञातील हविर्भाग स्वीकारणारे हविर्हरि"}, {"name": "Sarva-lakṣaṇa-lakṣaṇyaḥ", "meaning": "The supreme knowledge obtained through all criteria of knowledge.", "idx": 360, "marathi": "सर्व शास्त्रप्रमाणांचे अंतिम लक्ष्य"}, {"name": "Lakṣmīvān", "meaning": "One on whose chest Goddess Lakṣmī always resides.", "idx": 361, "marathi": "ज्यांच्या वक्षःस्थळी सदैव लक्ष्मी आहे असे लक्ष्मीवान"}, {"name": "Samitiñjayaḥ", "meaning": "One victorious in battle.", "idx": 362, "marathi": "युद्धात सदैव विजयी समितिञ्जय"}]}, {"id": "stotram-40", "section": "stotram", "num": "40", "slokaNum": 40, "label": "Śloka 40", "speaker": "Names 363–372", "start": 977, "end": 988, "sanskrit": "विक्षरो रोहितो मार्गो हेतुर्दामोदरः सहः ।\nमहीधरो महाभागो वेगवानमिताशनः ॥ ४० ॥", "iast": "vikṣaro rohito mārgo hetur dāmodaraḥ sahaḥ,\nmahīdharo mahābhāgo vegavān amitāśanaḥ.", "meaning": "Vikṣaraḥ – One without destruction. Rohitaḥ – One who assumed the form of the Rohita fish. Mārgaḥ – The path sought by seekers of Mokṣa. Hetuḥ – Both the instrumental and material cause of the universe. Dāmodaraḥ – One of benevolent mind known through self-control. Sahaḥ – One who subordinates and bears everything. Mahīdharaḥ – One who props up the earth. Mahābhāgaḥ – One who enjoys supreme felicities. Vegavān – One of tremendous speed. Amitāśanaḥ – One who consumes all worlds at Dissolution.", "meaningMarathi": "Vikṣaraḥ (नाशरहित विक्षर) • Rohitaḥ (रोहित मत्स्याचे रूप घेतलेले) • Mārgaḥ (मोक्षेच्छूंचा परम मार्ग) • Hetuḥ (विश्वाचे निमित्त व उपादान कारण हेतू) • Dāmodaraḥ (संयमाने प्राप्त होणारे उदारमनाचे दामोदर) • Sahaḥ (सर्वांना सहन करणारे व जिंकणारे सह) • Mahīdharaḥ (पर्वतरूपाने पृथ्वी धारण करणारे महीधर) • Mahābhāgaḥ (परम भाग्यशाली महाभाग) • Vegavān (अप्रतिम गती असलेले वेगवान) • Amitāśanaḥ (प्रलयकाळी सर्व लोक ग्रासणारे अमिताशन)", "names": [{"name": "Vikṣaraḥ", "meaning": "One without destruction.", "idx": 363, "marathi": "नाशरहित विक्षर"}, {"name": "Rohitaḥ", "meaning": "One who assumed the form of the Rohita fish.", "idx": 364, "marathi": "रोहित मत्स्याचे रूप घेतलेले"}, {"name": "Mārgaḥ", "meaning": "The path sought by seekers of Mokṣa.", "idx": 365, "marathi": "मोक्षेच्छूंचा परम मार्ग"}, {"name": "Hetuḥ", "meaning": "Both the instrumental and material cause of the universe.", "idx": 366, "marathi": "विश्वाचे निमित्त व उपादान कारण हेतू"}, {"name": "Dāmodaraḥ", "meaning": "One of benevolent mind known through self-control.", "idx": 367, "marathi": "संयमाने प्राप्त होणारे उदारमनाचे दामोदर"}, {"name": "Sahaḥ", "meaning": "One who subordinates and bears everything.", "idx": 368, "marathi": "सर्वांना सहन करणारे व जिंकणारे सह"}, {"name": "Mahīdharaḥ", "meaning": "One who props up the earth.", "idx": 369, "marathi": "पर्वतरूपाने पृथ्वी धारण करणारे महीधर"}, {"name": "Mahābhāgaḥ", "meaning": "One who enjoys supreme felicities.", "idx": 370, "marathi": "परम भाग्यशाली महाभाग"}, {"name": "Vegavān", "meaning": "One of tremendous speed.", "idx": 371, "marathi": "अप्रतिम गती असलेले वेगवान"}, {"name": "Amitāśanaḥ", "meaning": "One who consumes all worlds at Dissolution.", "idx": 372, "marathi": "प्रलयकाळी सर्व लोक ग्रासणारे अमिताशन"}]}, {"id": "stotram-41", "section": "stotram", "num": "41", "slokaNum": 41, "label": "Śloka 41", "speaker": "Names 373–383", "start": 988, "end": 1000, "sanskrit": "उद्भवः क्षोभणो देवः श्रीगर्भः परमेश्वरः ।\nकरणं कारणं कर्ता विकर्ता गहनो गुहः ॥ ४१ ॥", "iast": "udbhavaḥ kṣobhaṇo devaḥ śrīgarbhaḥ parameśvaraḥ,\nkaraṇaṃ kāraṇaṃ kartā vikartā gahano guhaḥ.", "meaning": "Udbhavaḥ – Material cause of creation. Kṣobhaṇaḥ – One who stirred Prakṛti and Puruṣa at creation. Devaḥ – One who sports through cosmic activities. Śrīgarbhaḥ – One within whom Śrī and the universe exist. Parameśvaraḥ – Supreme Lord holding sway over all. Karaṇam – Primary instrument in generating the universe. Kāraṇam – The Cause who moves all others. Kartā – Free and independent master. Vikartā – Creator of this unique universe. Gahanaḥ – Whose nature and greatness are unfathomable. Guhaḥ – One who hides His true nature through Māyā.", "meaningMarathi": "Udbhavaḥ (सृष्टीचे उपादान कारण उद्भव) • Kṣobhaṇaḥ (सृष्टीच्या आरंभी प्रकृती-पुरुषांत क्षोभ निर्माण करणारे) • Devaḥ (सृष्टीक्रीडा करणारे देव) • Śrīgarbhaḥ (ज्यांच्या उदरात सर्व वैभव व विश्व आहे ते श्रीगर्भ) • Parameśvaraḥ (सर्वोच्च स्वामी परमेश्वर) • Karaṇam (विश्वनिर्मितीचे प्रमुख साधन करण) • Kāraṇam (सर्वांचे प्रेरक कारण) • Kartā (स्वतंत्र कर्ता) • Vikartā (अद्भुत विश्व निर्माण करणारे विकर्ता) • Gahanaḥ (ज्यांचा महिमा अगम्य आहे असे गहन) • Guhaḥ (मायेने आपले स्वरूप लपवणारे गुह)", "names": [{"name": "Udbhavaḥ", "meaning": "Material cause of creation.", "idx": 373, "marathi": "सृष्टीचे उपादान कारण उद्भव"}, {"name": "Kṣobhaṇaḥ", "meaning": "One who stirred Prakṛti and Puruṣa at creation.", "idx": 374, "marathi": "सृष्टीच्या आरंभी प्रकृती-पुरुषांत क्षोभ निर्माण करणारे"}, {"name": "Devaḥ", "meaning": "One who sports through cosmic activities.", "idx": 375, "marathi": "सृष्टीक्रीडा करणारे देव"}, {"name": "Śrīgarbhaḥ", "meaning": "One within whom Śrī and the universe exist.", "idx": 376, "marathi": "ज्यांच्या उदरात सर्व वैभव व विश्व आहे ते श्रीगर्भ"}, {"name": "Parameśvaraḥ", "meaning": "Supreme Lord holding sway over all.", "idx": 377, "marathi": "सर्वोच्च स्वामी परमेश्वर"}, {"name": "Karaṇam", "meaning": "Primary instrument in generating the universe.", "idx": 378, "marathi": "विश्वनिर्मितीचे प्रमुख साधन करण"}, {"name": "Kāraṇam", "meaning": "The Cause who moves all others.", "idx": 379, "marathi": "सर्वांचे प्रेरक कारण"}, {"name": "Kartā", "meaning": "Free and independent master.", "idx": 380, "marathi": "स्वतंत्र कर्ता"}, {"name": "Vikartā", "meaning": "Creator of this unique universe.", "idx": 381, "marathi": "अद्भुत विश्व निर्माण करणारे विकर्ता"}, {"name": "Gahanaḥ", "meaning": "Whose nature and greatness are unfathomable.", "idx": 382, "marathi": "ज्यांचा महिमा अगम्य आहे असे गहन"}, {"name": "Guhaḥ", "meaning": "One who hides His true nature through Māyā.", "idx": 383, "marathi": "मायेने आपले स्वरूप लपवणारे गुह"}]}, {"id": "stotram-42", "section": "stotram", "num": "42", "slokaNum": 42, "label": "Śloka 42", "speaker": "Names 384–393", "start": 1000, "end": 1012, "sanskrit": "व्यवसायो व्यवस्थानः संस्थानः स्थानदो ध्रुवः ।\nपरर्द्धिः परमस्पष्टस्तुष्टः पुष्टः शुभेक्षणः ॥ ४२ ॥", "iast": "vyavasāyo vyavasthānaḥ saṃsthānaḥ sthānado dhruvaḥ,\npararddhiḥ paramaspaṣṭas tuṣṭaḥ puṣṭaḥ śubhekṣaṇaḥ.", "meaning": "Vyavasāyaḥ – Wholly of the nature of knowledge. Vyavasthānaḥ – In whom the orderly regulation of the universe rests. Saṃsthānaḥ – In whom all beings dwell at dissolution. Sthānadaḥ – One who grants status according to Karma. Dhruvaḥ – Indestructible. Pararddhiḥ – Possessing supreme lordliness. Paramaspaṣṭaḥ – Supremely clear and glorious. Tuṣṭaḥ – Of the nature of supreme contentment. Puṣṭaḥ – One who fills everything. Śubhekṣaṇaḥ – Whose auspicious glance bestows liberation and cuts all doubts.", "meaningMarathi": "Vyavasāyaḥ (पूर्ण ज्ञानस्वरूप व्यवसाय) • Vyavasthānaḥ (विश्वाची सुव्यवस्था राखणारे व्यवस्थान) • Saṃsthānaḥ (प्रलयकाळी सर्वांचे विश्रामस्थान संस्थान) • Sthānadaḥ (ध्रुवादी भक्तांना योग्य स्थान देणारे स्थानद) • Dhruvaḥ (अविनाशी ध्रुव) • Pararddhiḥ (सर्वोच्च ऐश्वर्य असलेले परर्द्धी) • Paramaspaṣṭaḥ (परम स्पष्ट व तेजस्वी परमस्पष्ट) • Tuṣṭaḥ (परम संतुष्ट तुष्ट) • Puṣṭaḥ (सर्वत्र परिपूर्ण पुष्ट) • Śubhekṣaṇaḥ (ज्यांची मंगल दृष्टी सर्व संशय छेदते असे शुभेक्षण)", "names": [{"name": "Vyavasāyaḥ", "meaning": "Wholly of the nature of knowledge.", "idx": 384, "marathi": "पूर्ण ज्ञानस्वरूप व्यवसाय"}, {"name": "Vyavasthānaḥ", "meaning": "In whom the orderly regulation of the universe rests.", "idx": 385, "marathi": "विश्वाची सुव्यवस्था राखणारे व्यवस्थान"}, {"name": "Saṃsthānaḥ", "meaning": "In whom all beings dwell at dissolution.", "idx": 386, "marathi": "प्रलयकाळी सर्वांचे विश्रामस्थान संस्थान"}, {"name": "Sthānadaḥ", "meaning": "One who grants status according to Karma.", "idx": 387, "marathi": "ध्रुवादी भक्तांना योग्य स्थान देणारे स्थानद"}, {"name": "Dhruvaḥ", "meaning": "Indestructible.", "idx": 388, "marathi": "अविनाशी ध्रुव"}, {"name": "Pararddhiḥ", "meaning": "Possessing supreme lordliness.", "idx": 389, "marathi": "सर्वोच्च ऐश्वर्य असलेले परर्द्धी"}, {"name": "Paramaspaṣṭaḥ", "meaning": "Supremely clear and glorious.", "idx": 390, "marathi": "परम स्पष्ट व तेजस्वी परमस्पष्ट"}, {"name": "Tuṣṭaḥ", "meaning": "Of the nature of supreme contentment.", "idx": 391, "marathi": "परम संतुष्ट तुष्ट"}, {"name": "Puṣṭaḥ", "meaning": "One who fills everything.", "idx": 392, "marathi": "सर्वत्र परिपूर्ण पुष्ट"}, {"name": "Śubhekṣaṇaḥ", "meaning": "Whose auspicious glance bestows liberation and cuts all doubts.", "idx": 393, "marathi": "ज्यांची मंगल दृष्टी सर्व संशय छेदते असे शुभेक्षण"}]}, {"id": "stotram-43", "section": "stotram", "num": "43", "slokaNum": 43, "label": "Śloka 43", "speaker": "Names 394–404", "start": 1012, "end": 1025, "sanskrit": "रामो विरामो विरजो मार्गो नेयो नयोऽनयः ।\nवीरः शक्तिमतां श्रेष्ठो धर्मो धर्मविदुत्तमः ॥ ४३ ॥", "iast": "rāmo virāmo virajo mārgo neyo nayo 'nayaḥ,\nvīraḥ śaktimatāṃ śreṣṭho dharmo dharmaviduttamaḥ.", "meaning": "Rāmaḥ – The eternally blissful one in whom yogis delight. Virāmaḥ – In whom all beings find their end. Virajaḥ – Free from all passion and desire. Mārgaḥ – The path. Neyaḥ – One who leads the Jīva to the Supreme. Nayaḥ – The leader in the form of spiritual illumination. Anayaḥ – One for whom there is no higher leader. Vīraḥ – Valorous. Śaktimatāṃ śreṣṭhaḥ – Most powerful among all powerful beings. Dharmaḥ – One who supports all beings. Dharma-viduttamaḥ – Greatest knower of Dharma.", "meaningMarathi": "Rāmaḥ (योगी ज्यांच्यात रममाण होतात ते नित्य आनंदस्वरूप राम) • Virāmaḥ (सर्वांचे अंतिम विश्रामस्थान विराम) • Virajaḥ (वासना व रजापासून मुक्त विरज) • Mārgaḥ (मोक्षाचा मार्ग) • Neyaḥ (जीवांना परमात्म्याकडे नेणारे नेय) • Nayaḥ (ज्ञानरूपाने नेतृत्व करणारे नय) • Anayaḥ (ज्यांच्यावर कोणीही नेता नाही असे अनय) • Vīraḥ (पराक्रमी वीर) • Śaktimatāṃ śreṣṭhaḥ (शक्तिवंतांमध्ये श्रेष्ठ) • Dharmaḥ (सर्वांना धारण करणारे धर्म) • Dharma-viduttamaḥ (धर्माचे सर्वोत्तम ज्ञाते धर्मविदुत्तम)", "names": [{"name": "Rāmaḥ", "meaning": "The eternally blissful one in whom yogis delight.", "idx": 394, "marathi": "योगी ज्यांच्यात रममाण होतात ते नित्य आनंदस्वरूप राम"}, {"name": "Virāmaḥ", "meaning": "In whom all beings find their end.", "idx": 395, "marathi": "सर्वांचे अंतिम विश्रामस्थान विराम"}, {"name": "Virajaḥ", "meaning": "Free from all passion and desire.", "idx": 396, "marathi": "वासना व रजापासून मुक्त विरज"}, {"name": "Mārgaḥ", "meaning": "The path.", "idx": 397, "marathi": "मोक्षाचा मार्ग"}, {"name": "Neyaḥ", "meaning": "One who leads the Jīva to the Supreme.", "idx": 398, "marathi": "जीवांना परमात्म्याकडे नेणारे नेय"}, {"name": "Nayaḥ", "meaning": "The leader in the form of spiritual illumination.", "idx": 399, "marathi": "ज्ञानरूपाने नेतृत्व करणारे नय"}, {"name": "Anayaḥ", "meaning": "One for whom there is no higher leader.", "idx": 400, "marathi": "ज्यांच्यावर कोणीही नेता नाही असे अनय"}, {"name": "Vīraḥ", "meaning": "Valorous.", "idx": 401, "marathi": "पराक्रमी वीर"}, {"name": "Śaktimatāṃ śreṣṭhaḥ", "meaning": "Most powerful among all powerful beings.", "idx": 402, "marathi": "शक्तिवंतांमध्ये श्रेष्ठ"}, {"name": "Dharmaḥ", "meaning": "One who supports all beings.", "idx": 403, "marathi": "सर्वांना धारण करणारे धर्म"}, {"name": "Dharma-viduttamaḥ", "meaning": "Greatest knower of Dharma.", "idx": 404, "marathi": "धर्माचे सर्वोत्तम ज्ञाते धर्मविदुत्तम"}]}, {"id": "stotram-44", "section": "stotram", "num": "44", "slokaNum": 44, "label": "Śloka 44", "speaker": "Names 405–415", "start": 1025, "end": 1037, "sanskrit": "वैकुण्ठः पुरुषः प्राणः प्राणदः प्रणवः पृथुः ।\nहिरण्यगर्भः शत्रुघ्नो व्याप्तो वायुरधोक्षजः ॥ ४४ ॥", "iast": "vaikuṇṭhaḥ puruṣaḥ prāṇaḥ prāṇadaḥ praṇavaḥ pṛthuḥ,\nhiraṇyagarbhaḥ śatrughno vyāpto vāyur adhokṣajaḥ.", "meaning": "Vaikuṇṭhaḥ – One who unites all diversified categories. Puruṣaḥ – One who existed before everything. Prāṇaḥ – One who functions as vital force Prāṇa. Prāṇadaḥ – Giver of life. Praṇavaḥ – Praised and worshipped with Om. Pṛthuḥ – One who expanded Himself as the world. Hiraṇyagarbhaḥ – Cause of the golden egg from which Brahmā was born. Śatrughnaḥ – Destroyer of enemies of the Devas. Vyāptaḥ – Cause pervading all effects. Vāyuḥ – One who moves towards His devotees. Adhokṣajaḥ – One who undergoes no degeneration.", "meaningMarathi": "Vaikuṇṭhaḥ (सर्व तत्त्वांना एकत्र बांधून ठेवणारे वैकुंठ) • Puruṣaḥ (सर्वांपूर्वी अस्तित्वात असलेले पुरुष) • Prāṇaḥ (प्राणशक्ती रूपाने कार्य करणारे प्राण) • Prāṇadaḥ (जीवन देणारे प्राणद) • Praṇavaḥ (ॐकाराने वंदिले जाणारे प्रणव) • Pṛthuḥ (विश्वरूपाने विस्तारलेले पृथू) • Hiraṇyagarbhaḥ (ब्रह्मदेवाचे उत्पत्तिस्थान हिरण्यगर्भ) • Śatrughnaḥ (देवशत्रूंचा संहार करणारे शत्रुघ्न) • Vyāptaḥ (सर्व कार्यांत कारणरूपाने व्याप्त) • Vāyuḥ (भक्तांकडे धाव घेणारे वायू) • Adhokṣajaḥ (स्वस्वरूपापासून कधीही क्षीण न होणारे अधोक्षज)", "names": [{"name": "Vaikuṇṭhaḥ", "meaning": "One who unites all diversified categories.", "idx": 405, "marathi": "सर्व तत्त्वांना एकत्र बांधून ठेवणारे वैकुंठ"}, {"name": "Puruṣaḥ", "meaning": "One who existed before everything.", "idx": 406, "marathi": "सर्वांपूर्वी अस्तित्वात असलेले पुरुष"}, {"name": "Prāṇaḥ", "meaning": "One who functions as vital force Prāṇa.", "idx": 407, "marathi": "प्राणशक्ती रूपाने कार्य करणारे प्राण"}, {"name": "Prāṇadaḥ", "meaning": "Giver of life.", "idx": 408, "marathi": "जीवन देणारे प्राणद"}, {"name": "Praṇavaḥ", "meaning": "Praised and worshipped with Om.", "idx": 409, "marathi": "ॐकाराने वंदिले जाणारे प्रणव"}, {"name": "Pṛthuḥ", "meaning": "One who expanded Himself as the world.", "idx": 410, "marathi": "विश्वरूपाने विस्तारलेले पृथू"}, {"name": "Hiraṇyagarbhaḥ", "meaning": "Cause of the golden egg from which Brahmā was born.", "idx": 411, "marathi": "ब्रह्मदेवाचे उत्पत्तिस्थान हिरण्यगर्भ"}, {"name": "Śatrughnaḥ", "meaning": "Destroyer of enemies of the Devas.", "idx": 412, "marathi": "देवशत्रूंचा संहार करणारे शत्रुघ्न"}, {"name": "Vyāptaḥ", "meaning": "Cause pervading all effects.", "idx": 413, "marathi": "सर्व कार्यांत कारणरूपाने व्याप्त"}, {"name": "Vāyuḥ", "meaning": "One who moves towards His devotees.", "idx": 414, "marathi": "भक्तांकडे धाव घेणारे वायू"}, {"name": "Adhokṣajaḥ", "meaning": "One who undergoes no degeneration.", "idx": 415, "marathi": "स्वस्वरूपापासून कधीही क्षीण न होणारे अधोक्षज"}]}, {"id": "stotram-45", "section": "stotram", "num": "45", "slokaNum": 45, "label": "Śloka 45", "speaker": "Names 416–425", "start": 1037, "end": 1049, "sanskrit": "ऋतुः सुदर्शनः कालः परमेष्ठी परिग्रहः ।\nउग्रः संवत्सरो दक्षो विश्रामो विश्वदक्षिणः ॥ ४५ ॥", "iast": "ṛtuḥ sudarśanaḥ kālaḥ parameṣṭhī parigrahaḥ,\nugraḥ saṃvatsaro dakṣo viśrāmo viśvadakṣiṇaḥ.", "meaning": "Ṛtuḥ – Of the nature of Time (seasons). Sudarśanaḥ – Whose vision bestows Mokṣa. Kālaḥ – One who measures and sets limits to everything. Parameṣṭhī – One dwelling in supreme greatness in the heart-sky. Parigrahaḥ – Grasped on all sides by refuge-seekers; receiver of offerings. Ugraḥ – Cause of awe even to the Sun. Saṃvatsaraḥ – In whom all beings reside. Dakṣaḥ – One who augments as the world. Viśrāmaḥ – Bestower of rest and liberation from Saṃsāra. Viśvadakṣiṇaḥ – Proficient in everything.", "meaningMarathi": "Ṛtuḥ (ऋतुरूप कालस्वरूप) • Sudarśanaḥ (ज्यांचे दर्शन मोक्ष देते असे सुदर्शन) • Kālaḥ (सर्वांची मर्यादा ठरवणारे काल) • Parameṣṭhī (हृदयाकाशात परम महिमेने राहणारे परमेष्ठी) • Parigrahaḥ (शरणागतांचे अर्पण स्वीकारणारे परिग्रह) • Ugraḥ (सूर्यालाही भय उत्पन्न करणारे उग्र) • Saṃvatsaraḥ (ज्यांच्यात सर्व प्राणी राहतात ते संवत्सर) • Dakṣaḥ (अत्यंत कुशल दक्ष) • Viśrāmaḥ (संसारतापातून विश्रांती देणारे विश्राम) • Viśvadakṣiṇaḥ (सर्व कार्यांत निपुण विश्वदक्षिण)", "names": [{"name": "Ṛtuḥ", "meaning": "Of the nature of Time (seasons).", "idx": 416, "marathi": "ऋतुरूप कालस्वरूप"}, {"name": "Sudarśanaḥ", "meaning": "Whose vision bestows Mokṣa.", "idx": 417, "marathi": "ज्यांचे दर्शन मोक्ष देते असे सुदर्शन"}, {"name": "Kālaḥ", "meaning": "One who measures and sets limits to everything.", "idx": 418, "marathi": "सर्वांची मर्यादा ठरवणारे काल"}, {"name": "Parameṣṭhī", "meaning": "One dwelling in supreme greatness in the heart-sky.", "idx": 419, "marathi": "हृदयाकाशात परम महिमेने राहणारे परमेष्ठी"}, {"name": "Parigrahaḥ", "meaning": "Grasped on all sides by refuge-seekers; receiver of offerings.", "idx": 420, "marathi": "शरणागतांचे अर्पण स्वीकारणारे परिग्रह"}, {"name": "Ugraḥ", "meaning": "Cause of awe even to the Sun.", "idx": 421, "marathi": "सूर्यालाही भय उत्पन्न करणारे उग्र"}, {"name": "Saṃvatsaraḥ", "meaning": "In whom all beings reside.", "idx": 422, "marathi": "ज्यांच्यात सर्व प्राणी राहतात ते संवत्सर"}, {"name": "Dakṣaḥ", "meaning": "One who augments as the world.", "idx": 423, "marathi": "अत्यंत कुशल दक्ष"}, {"name": "Viśrāmaḥ", "meaning": "Bestower of rest and liberation from Saṃsāra.", "idx": 424, "marathi": "संसारतापातून विश्रांती देणारे विश्राम"}, {"name": "Viśvadakṣiṇaḥ", "meaning": "Proficient in everything.", "idx": 425, "marathi": "सर्व कार्यांत निपुण विश्वदक्षिण"}]}, {"id": "stotram-46", "section": "stotram", "num": "46", "slokaNum": 46, "label": "Śloka 46", "speaker": "Names 426–434", "start": 1049, "end": 1061, "sanskrit": "विस्तारः स्थावरस्थाणुः प्रमाणं बीजमव्ययम् ।\nअर्थोऽनर्थो महाकोशो महाभोगो महाधनः ॥ ४६ ॥", "iast": "vistāraḥ sthāvaraḥ sthāṇuḥ pramāṇaṃ bījam avyayam,\nartho 'nartho mahākośo mahābhogo mahādhanaḥ.", "meaning": "Vistāraḥ – In whom all worlds attain manifestation. Sthāvaraḥ-sthāṇuḥ – Firmly established, in whom enduring entities rest. Pramāṇaṃ – Of the nature of pure consciousness. Bījamavyayam – Unchanging seed of Saṃsāra. Arthaḥ – Sought by all as bliss. Anarthaḥ – Self-fulfilled, having no external end to seek. Mahākośaḥ – Covered by the great Kośas. Mahābhogaḥ – Having Bliss as great enjoyment. Mahādhanaḥ – Having the whole universe as His wealth.", "meaningMarathi": "Vistāraḥ (ज्यांच्यात सर्व लोकांचा विस्तार झाला आहे ते विस्तार) • Sthāvaraḥ-sthāṇuḥ (स्थिर व सर्व लोकांचे आधार स्थावरस्थाणू) • Pramāṇaṃ (शुद्ध चैतन्यरूप प्रमाण) • Bījamavyayam (कधीही न बदलणारे विश्वाचे अविनाशी बीज) • Arthaḥ (आनंदस्वरूप असल्याने सर्वांना हवेहवेसे अर्थ) • Anarthaḥ (स्वतः पूर्ण असल्याने ज्यांना काहीच नको असे अनर्थ) • Mahākośaḥ (अन्नमयादी महाकोशांनी युक्त महाकोश) • Mahābhogaḥ (परमानंद हेच ज्यांचे भोग आहे असे महाभोग) • Mahādhanaḥ (संपूर्ण विश्व हेच ज्यांचे धन आहे असे महाधन)", "names": [{"name": "Vistāraḥ", "meaning": "In whom all worlds attain manifestation.", "idx": 426, "marathi": "ज्यांच्यात सर्व लोकांचा विस्तार झाला आहे ते विस्तार"}, {"name": "Sthāvaraḥ-sthāṇuḥ", "meaning": "Firmly established, in whom enduring entities rest.", "idx": 427, "marathi": "स्थिर व सर्व लोकांचे आधार स्थावरस्थाणू"}, {"name": "Pramāṇaṃ", "meaning": "Of the nature of pure consciousness.", "idx": 428, "marathi": "शुद्ध चैतन्यरूप प्रमाण"}, {"name": "Bījamavyayam", "meaning": "Unchanging seed of Saṃsāra.", "idx": 429, "marathi": "कधीही न बदलणारे विश्वाचे अविनाशी बीज"}, {"name": "Arthaḥ", "meaning": "Sought by all as bliss.", "idx": 430, "marathi": "आनंदस्वरूप असल्याने सर्वांना हवेहवेसे अर्थ"}, {"name": "Anarthaḥ", "meaning": "Self-fulfilled, having no external end to seek.", "idx": 431, "marathi": "स्वतः पूर्ण असल्याने ज्यांना काहीच नको असे अनर्थ"}, {"name": "Mahākośaḥ", "meaning": "Covered by the great Kośas.", "idx": 432, "marathi": "अन्नमयादी महाकोशांनी युक्त महाकोश"}, {"name": "Mahābhogaḥ", "meaning": "Having Bliss as great enjoyment.", "idx": 433, "marathi": "परमानंद हेच ज्यांचे भोग आहे असे महाभोग"}, {"name": "Mahādhanaḥ", "meaning": "Having the whole universe as His wealth.", "idx": 434, "marathi": "संपूर्ण विश्व हेच ज्यांचे धन आहे असे महाधन"}]}, {"id": "stotram-47", "section": "stotram", "num": "47", "slokaNum": 47, "label": "Śloka 47", "speaker": "Names 435–444", "start": 1061, "end": 1073, "sanskrit": "अनिर्विण्णः स्थविष्ठोऽभूर्धर्मयूपो महामखः ।\nनक्षत्रनेमिर्नक्षत्री क्षमः क्षामः समीहनः ॥ ४७ ॥", "iast": "anirviṇṇaḥ sthaviṣṭho 'bhūr dharmayūpo mahāmakhaḥ,\nnakṣatranemir nakṣatrī kṣamaḥ kṣāmaḥ samīhanaḥ.", "meaning": "Anirviṇṇaḥ – Never heedless or dejected, being self-fulfilled. Sthaviṣṭhaḥ – Of huge cosmic proportions. Abhūḥ – Without birth. Dharma-yūpaḥ – Sacrificial post to which all Dharmas are bound. Mahāmakhaḥ – Great sacrifice yielding Nirvāṇa. Nakṣatra-nemiḥ – Heart and hub of all stars. Nakṣatrī – In the form of the Moon, lord of stars. Kṣamaḥ – Capable in everything. Kṣāmaḥ – Remaining as pure Self after all mental modifications cease. Samīhanaḥ – One who exerts well for creation.", "meaningMarathi": "Anirviṇṇaḥ (सदैव तृप्त व निराशारहित अनिर्विण्ण) • Sthaviṣṭhaḥ (विराट पुरुषरूप स्थविष्ठ) • Abhūḥ (जन्मरहित अभू) • Dharma-yūpaḥ (सर्व धर्म ज्यांच्याशी बांधलेले आहेत तो धर्मयूप) • Mahāmakhaḥ (निर्वाण देणारा महान यज्ञ महामख) • Nakṣatra-nemiḥ (सर्व नक्षत्रांचे केंद्र नक्षत्रनेमी) • Nakṣatrī (चंद्ररूपाने नक्षत्रांचे स्वामी नक्षत्री) • Kṣamaḥ (सर्वकाही सहन करणारे व समर्थ क्षम) • Kṣāmaḥ (सर्व वृत्ती लय पावल्यावर उरणारे शुद्ध आत्मस्वरूप क्षाम) • Samīhanaḥ (सृष्टीकार्यासाठी प्रयत्नशील समीहन)", "names": [{"name": "Anirviṇṇaḥ", "meaning": "Never heedless or dejected, being self-fulfilled.", "idx": 435, "marathi": "सदैव तृप्त व निराशारहित अनिर्विण्ण"}, {"name": "Sthaviṣṭhaḥ", "meaning": "Of huge cosmic proportions.", "idx": 436, "marathi": "विराट पुरुषरूप स्थविष्ठ"}, {"name": "Abhūḥ", "meaning": "Without birth.", "idx": 437, "marathi": "जन्मरहित अभू"}, {"name": "Dharma-yūpaḥ", "meaning": "Sacrificial post to which all Dharmas are bound.", "idx": 438, "marathi": "सर्व धर्म ज्यांच्याशी बांधलेले आहेत तो धर्मयूप"}, {"name": "Mahāmakhaḥ", "meaning": "Great sacrifice yielding Nirvāṇa.", "idx": 439, "marathi": "निर्वाण देणारा महान यज्ञ महामख"}, {"name": "Nakṣatra-nemiḥ", "meaning": "Heart and hub of all stars.", "idx": 440, "marathi": "सर्व नक्षत्रांचे केंद्र नक्षत्रनेमी"}, {"name": "Nakṣatrī", "meaning": "In the form of the Moon, lord of stars.", "idx": 441, "marathi": "चंद्ररूपाने नक्षत्रांचे स्वामी नक्षत्री"}, {"name": "Kṣamaḥ", "meaning": "Capable in everything.", "idx": 442, "marathi": "सर्वकाही सहन करणारे व समर्थ क्षम"}, {"name": "Kṣāmaḥ", "meaning": "Remaining as pure Self after all mental modifications cease.", "idx": 443, "marathi": "सर्व वृत्ती लय पावल्यावर उरणारे शुद्ध आत्मस्वरूप क्षाम"}, {"name": "Samīhanaḥ", "meaning": "One who exerts well for creation.", "idx": 444, "marathi": "सृष्टीकार्यासाठी प्रयत्नशील समीहन"}]}, {"id": "stotram-48", "section": "stotram", "num": "48", "slokaNum": 48, "label": "Śloka 48", "speaker": "Names 445–454", "start": 1073, "end": 1086, "sanskrit": "यज्ञ इज्यो महेज्यश्च क्रतुः सत्रं सतां गतिः ।\nसर्वदर्शी विमुक्तात्मा सर्वज्ञो ज्ञानमुत्तमम् ॥ ४८ ॥", "iast": "yajña ijyo mahejyaś ca kratuḥ satraṃ satāṃ gatiḥ,\nsarvadarśī vimuktātmā sarvajño jñānam uttamam.", "meaning": "Yajñaḥ – Of the nature of sacrifice. Ijyaḥ – Fit to be worshipped in sacrifices. Mahejyaḥ – Alone capable of granting liberation. Kratuḥ – Sacrifice with a sacrificial post. Satraṃ – Of the nature of ordained Dharma. Satāṃ-gatiḥ – Sole support for holy seekers of Mokṣa. Sarva-darśī – Sees all good and evil actions by inborn insight. Vimuktātmā – Naturally free. Sarvajñaḥ – Both all and knower of all. Jñānam-uttamam – Supreme, birthless consciousness.", "meaningMarathi": "Yajñaḥ (स्वतः यज्ञस्वरूप) • Ijyaḥ (यज्ञात पूजनीय इज्य) • Mahejyaḥ (मोक्ष देणारे सर्वश्रेष्ठ उपास्य महेज्य) • Kratuḥ (यूपस्तंभासह केला जाणारा क्रतू) • Satraṃ (धर्मस्वरूप सत्र) • Satāṃ-gatiḥ (मुमुक्षू सज्जनांचे एकमेव आश्रयस्थान सतांगती) • Sarva-darśī (सर्वांची शुभाशुभ कर्मे पाहणारे सर्वदर्शी) • Vimuktātmā (स्वाभाविकच मुक्त विमुक्तात्मा) • Sarvajñaḥ (सर्वरूप व सर्वज्ञ) • Jñānam-uttamam (देश-कालातीत परम श्रेष्ठ ज्ञान)", "names": [{"name": "Yajñaḥ", "meaning": "Of the nature of sacrifice.", "idx": 445, "marathi": "स्वतः यज्ञस्वरूप"}, {"name": "Ijyaḥ", "meaning": "Fit to be worshipped in sacrifices.", "idx": 446, "marathi": "यज्ञात पूजनीय इज्य"}, {"name": "Mahejyaḥ", "meaning": "Alone capable of granting liberation.", "idx": 447, "marathi": "मोक्ष देणारे सर्वश्रेष्ठ उपास्य महेज्य"}, {"name": "Kratuḥ", "meaning": "Sacrifice with a sacrificial post.", "idx": 448, "marathi": "यूपस्तंभासह केला जाणारा क्रतू"}, {"name": "Satraṃ", "meaning": "Of the nature of ordained Dharma.", "idx": 449, "marathi": "धर्मस्वरूप सत्र"}, {"name": "Satāṃ-gatiḥ", "meaning": "Sole support for holy seekers of Mokṣa.", "idx": 450, "marathi": "मुमुक्षू सज्जनांचे एकमेव आश्रयस्थान सतांगती"}, {"name": "Sarva-darśī", "meaning": "Sees all good and evil actions by inborn insight.", "idx": 451, "marathi": "सर्वांची शुभाशुभ कर्मे पाहणारे सर्वदर्शी"}, {"name": "Vimuktātmā", "meaning": "Naturally free.", "idx": 452, "marathi": "स्वाभाविकच मुक्त विमुक्तात्मा"}, {"name": "Sarvajñaḥ", "meaning": "Both all and knower of all.", "idx": 453, "marathi": "सर्वरूप व सर्वज्ञ"}, {"name": "Jñānam-uttamam", "meaning": "Supreme, birthless consciousness.", "idx": 454, "marathi": "देश-कालातीत परम श्रेष्ठ ज्ञान"}]}, {"id": "stotram-49", "section": "stotram", "num": "49", "slokaNum": 49, "label": "Śloka 49", "speaker": "Names 455–464", "start": 1086, "end": 1097, "sanskrit": "सुव्रतः सुमुखः सूक्ष्मः सुघोषः सुखदः सुहृत् ।\nमनोहरो जितक्रोधो वीरबाहुर्विदारणः ॥ ४९ ॥", "iast": "suvrataḥ sumukhaḥ sūkṣmaḥ sughoṣaḥ sukhadaḥ suhṛt,\nmanoharaḥ jitakrodho vīrabāhur vidāraṇaḥ.", "meaning": "Suvrataḥ – Taken the magnanimous vow to save all refuge-seekers. Sumukhaḥ – With a pleasant face. Sūkṣmaḥ – Subtle, beyond gross causes. Sughoṣaḥ – Whose auspicious sound is the Veda. Sukhadaḥ – Giver of happiness to good people. Suhṛt – Helps without expecting return. Manoharaḥ – Captivates the mind by incomparable bliss. Jitakrodhaḥ – Conqueror of anger. Vīrabāhuḥ – Whose heroic arms uphold Vedic Dharma. Vidāraṇaḥ – Destroyer of those opposing Dharma.", "meaningMarathi": "Suvrataḥ (शरणागतांच्या रक्षणाचे महान व्रत घेतलेले सुव्रत) • Sumukhaḥ (प्रसन्न मुखकमल असलेले सुमुख) • Sūkṣmaḥ (अत्यंत सूक्ष्म) • Sughoṣaḥ (वेदरूपी मंगल ध्वनी असलेले सुघोष) • Sukhadaḥ (सज्जनांना सुख देणारे सुखद) • Suhṛt (निरपेक्षपणे मदत करणारे सुहृत्) • Manoharaḥ (अपार आनंदाने मन हरणारे मनोहर) • Jitakrodhaḥ (क्रोधावर विजय मिळवलेले जितक्रोध) • Vīrabāhuḥ (वेदधर्मासाठी पराक्रमी बाहू असलेले वीरबाहू) • Vidāraṇaḥ (अधार्मिकांचा नाश करणारे विदारण)", "names": [{"name": "Suvrataḥ", "meaning": "Taken the magnanimous vow to save all refuge-seekers.", "idx": 455, "marathi": "शरणागतांच्या रक्षणाचे महान व्रत घेतलेले सुव्रत"}, {"name": "Sumukhaḥ", "meaning": "With a pleasant face.", "idx": 456, "marathi": "प्रसन्न मुखकमल असलेले सुमुख"}, {"name": "Sūkṣmaḥ", "meaning": "Subtle, beyond gross causes.", "idx": 457, "marathi": "अत्यंत सूक्ष्म"}, {"name": "Sughoṣaḥ", "meaning": "Whose auspicious sound is the Veda.", "idx": 458, "marathi": "वेदरूपी मंगल ध्वनी असलेले सुघोष"}, {"name": "Sukhadaḥ", "meaning": "Giver of happiness to good people.", "idx": 459, "marathi": "सज्जनांना सुख देणारे सुखद"}, {"name": "Suhṛt", "meaning": "Helps without expecting return.", "idx": 460, "marathi": "निरपेक्षपणे मदत करणारे सुहृत्"}, {"name": "Manoharaḥ", "meaning": "Captivates the mind by incomparable bliss.", "idx": 461, "marathi": "अपार आनंदाने मन हरणारे मनोहर"}, {"name": "Jitakrodhaḥ", "meaning": "Conqueror of anger.", "idx": 462, "marathi": "क्रोधावर विजय मिळवलेले जितक्रोध"}, {"name": "Vīrabāhuḥ", "meaning": "Whose heroic arms uphold Vedic Dharma.", "idx": 463, "marathi": "वेदधर्मासाठी पराक्रमी बाहू असलेले वीरबाहू"}, {"name": "Vidāraṇaḥ", "meaning": "Destroyer of those opposing Dharma.", "idx": 464, "marathi": "अधार्मिकांचा नाश करणारे विदारण"}]}, {"id": "stotram-50", "section": "stotram", "num": "50", "slokaNum": 50, "label": "Śloka 50", "speaker": "Names 465–474", "start": 1097, "end": 1109, "sanskrit": "स्वापनः स्ववशो व्यापी नैकात्मा नैककर्मकृत् ।\nवत्सरो वत्सलो वत्सी रत्नगर्भो धनेश्वरः ॥ ५० ॥", "iast": "svāpanaḥ svavaśo vyāpī naikātmā naikakarmakṛt,\nvatsaro vatsalo vatsī ratnagarbho dhaneśvaraḥ.", "meaning": "Svāpanaḥ – Enfolds Jīvas in the sleep of Ajñāna. Svavaśaḥ – Master of Himself alone. Vyāpī – Interpenetrates everything like Ākāśa. Naikātmā – Manifests in manifold forms for cosmic processes. Naikakarmakṛt – Engages in innumerable cosmic activities. Vatsaraḥ – In whom everything dwells. Vatsalaḥ – Full of love for His devotees. Vatsī – Protector of those dear to Him. Ratnagarbhaḥ – The Ocean holding gems in its depths. Dhaneśvaraḥ – Lord of all wealth.", "meaningMarathi": "Svāpanaḥ (जीवांना अज्ञानरूपी निद्रेत ठेवणारे स्वापन) • Svavaśaḥ (स्वतःच्याच अधीन असलेले स्ववश) • Vyāpī (आकाशाप्रमाणे सर्वव्यापी) • Naikātmā (विविध सृष्टीकार्यांसाठी अनेक रूपे घेणारे नैकात्मा) • Naikakarmakṛt (असंख्य सृष्टीकर्मे करणारे नैककर्मकृत्) • Vatsaraḥ (सर्वांचे निवासस्थान वत्सर) • Vatsalaḥ (भक्तांवर अपार प्रेम करणारे वत्सल) • Vatsī (प्रिय भक्तांचे रक्षण करणारे वत्सी) • Ratnagarbhaḥ (रत्नांचे भांडार समुद्ररूप रत्नगर्भ) • Dhaneśvaraḥ (सर्व संपत्तीचे स्वामी धनेश्वर)", "names": [{"name": "Svāpanaḥ", "meaning": "Enfolds Jīvas in the sleep of Ajñāna.", "idx": 465, "marathi": "जीवांना अज्ञानरूपी निद्रेत ठेवणारे स्वापन"}, {"name": "Svavaśaḥ", "meaning": "Master of Himself alone.", "idx": 466, "marathi": "स्वतःच्याच अधीन असलेले स्ववश"}, {"name": "Vyāpī", "meaning": "Interpenetrates everything like Ākāśa.", "idx": 467, "marathi": "आकाशाप्रमाणे सर्वव्यापी"}, {"name": "Naikātmā", "meaning": "Manifests in manifold forms for cosmic processes.", "idx": 468, "marathi": "विविध सृष्टीकार्यांसाठी अनेक रूपे घेणारे नैकात्मा"}, {"name": "Naikakarmakṛt", "meaning": "Engages in innumerable cosmic activities.", "idx": 469, "marathi": "असंख्य सृष्टीकर्मे करणारे नैककर्मकृत्"}, {"name": "Vatsaraḥ", "meaning": "In whom everything dwells.", "idx": 470, "marathi": "सर्वांचे निवासस्थान वत्सर"}, {"name": "Vatsalaḥ", "meaning": "Full of love for His devotees.", "idx": 471, "marathi": "भक्तांवर अपार प्रेम करणारे वत्सल"}, {"name": "Vatsī", "meaning": "Protector of those dear to Him.", "idx": 472, "marathi": "प्रिय भक्तांचे रक्षण करणारे वत्सी"}, {"name": "Ratnagarbhaḥ", "meaning": "The Ocean holding gems in its depths.", "idx": 473, "marathi": "रत्नांचे भांडार समुद्ररूप रत्नगर्भ"}, {"name": "Dhaneśvaraḥ", "meaning": "Lord of all wealth.", "idx": 474, "marathi": "सर्व संपत्तीचे स्वामी धनेश्वर"}]}, {"id": "stotram-51", "section": "stotram", "num": "51", "slokaNum": 51, "label": "Śloka 51", "speaker": "Names 475–485", "start": 1109, "end": 1121, "sanskrit": "धर्मगुब्धर्मकृद्धर्मी सदसत्क्षरमक्षरम् ।\nअविज्ञाता सहस्रांशुर्विधाता कृतलक्षणः ॥ ५१ ॥", "iast": "dharmagub dharmakṛd dharmī sadasat kṣaram akṣaram,\navijñātā sahasrāṃśur vidhātā kṛtalakṣaṇaḥ.", "meaning": "Dharmagub – Protector of Dharma. Dharmakṛd – Performs Dharma to uphold tradition. Dharmī – Upholder of Dharma. Sat – Parabrahman of the nature of truth. Asat – Manifested world of relative reality. Kṣaram – All changing beings. Akṣaram – The changeless One. Avijñātā – Beyond the Jīva's limited sense of agency. Sahasrāṃśuḥ – The Sun with innumerable rays. Vidhātā – Unique support of all cosmic bearers like Ananta. Kṛtalakṣaṇaḥ – Of the nature of consciousness.", "meaningMarathi": "Dharmagub (धर्माचे रक्षण करणारे धर्मगुप्) • Dharmakṛd (धर्मपरंपरा टिकवण्यासाठी स्वतः धर्माचरण करणारे धर्मकृत्) • Dharmī (धर्माचे धारणकर्ते धर्मी) • Sat (सत्यस्वरूप परब्रह्म सत्) • Asat (व्यावहारिक जगद्रूप असत्) • Kṣaram (परिवर्तनशील प्राणिमात्र क्षर) • Akṣaram (अविनाशी परब्रह्म अक्षर) • Avijñātā (जीवाच्या कर्तृत्वभावापासून मुक्त अविज्ञाता) • Sahasrāṃśuḥ (असंख्य किरण असलेले सूर्यरूप सहस्रांशू) • Vidhātā (विश्व धारण करणाऱ्या शक्तींचे आधार विधाता) • Kṛtalakṣaṇaḥ (चैतन्यस्वरूप कृतलक्षण)", "names": [{"name": "Dharmagub", "meaning": "Protector of Dharma.", "idx": 475, "marathi": "धर्माचे रक्षण करणारे धर्मगुप्"}, {"name": "Dharmakṛd", "meaning": "Performs Dharma to uphold tradition.", "idx": 476, "marathi": "धर्मपरंपरा टिकवण्यासाठी स्वतः धर्माचरण करणारे धर्मकृत्"}, {"name": "Dharmī", "meaning": "Upholder of Dharma.", "idx": 477, "marathi": "धर्माचे धारणकर्ते धर्मी"}, {"name": "Sat", "meaning": "Parabrahman of the nature of truth.", "idx": 478, "marathi": "सत्यस्वरूप परब्रह्म सत्"}, {"name": "Asat", "meaning": "Manifested world of relative reality.", "idx": 479, "marathi": "व्यावहारिक जगद्रूप असत्"}, {"name": "Kṣaram", "meaning": "All changing beings.", "idx": 480, "marathi": "परिवर्तनशील प्राणिमात्र क्षर"}, {"name": "Akṣaram", "meaning": "The changeless One.", "idx": 481, "marathi": "अविनाशी परब्रह्म अक्षर"}, {"name": "Avijñātā", "meaning": "Beyond the Jīva's limited sense of agency.", "idx": 482, "marathi": "जीवाच्या कर्तृत्वभावापासून मुक्त अविज्ञाता"}, {"name": "Sahasrāṃśuḥ", "meaning": "The Sun with innumerable rays.", "idx": 483, "marathi": "असंख्य किरण असलेले सूर्यरूप सहस्रांशू"}, {"name": "Vidhātā", "meaning": "Unique support of all cosmic bearers like Ananta.", "idx": 484, "marathi": "विश्व धारण करणाऱ्या शक्तींचे आधार विधाता"}, {"name": "Kṛtalakṣaṇaḥ", "meaning": "Of the nature of consciousness.", "idx": 485, "marathi": "चैतन्यस्वरूप कृतलक्षण"}]}, {"id": "stotram-52", "section": "stotram", "num": "52", "slokaNum": 52, "label": "Śloka 52", "speaker": "Names 486–493", "start": 1121, "end": 1133, "sanskrit": "गभस्तिनेमिः सत्त्वस्थः सिंहो भूतमहेश्वरः ।\nआदिदेवो महादेवो देवेशो देवभृद्गुरुः ॥ ५२ ॥", "iast": "gabhastinemiḥ sattvasthaḥ siṃho bhūtamaheśvaraḥ,\nādidevo mahādevo deveśo devabhṛd guruḥ.", "meaning": "Gabhastinemiḥ – Dwells at the center of rays as the Sun. Sattvasthaḥ – Dwells specially in luminous Sattvaguṇa. Siṃhaḥ – Irresistible power like a lion. Bhūtamaheśvaraḥ – Supreme Lord of all beings. Ādidevaḥ – First of all beings. Mahādevaḥ – Great through supreme self-knowledge. Deveśaḥ – Lord of all Devas. Devabhṛd-guruḥ – Controller and Guru even of Indra.", "meaningMarathi": "Gabhastinemiḥ (किरणांच्या केंद्रस्थानी असलेले सूर्यरूप गभस्तिनेमी) • Sattvasthaḥ (प्रकाशमय सत्त्वगुणात स्थित सत्त्वस्थ) • Siṃhaḥ (सिंहाप्रमाणे अजिंक्य पराक्रमी) • Bhūtamaheśvaraḥ (सर्व प्राण्यांचे परम महेश्वर) • Ādidevaḥ (सर्वांत प्रथम असलेले आदिदेव) • Mahādevaḥ (परम आत्मज्ञानाने महान महादेव) • Deveśaḥ (सर्व देवांचे स्वामी देवेश) • Devabhṛd-guruḥ (इंद्रादी देवांचेही गुरू देवभृद्गुरू)", "names": [{"name": "Gabhastinemiḥ", "meaning": "Dwells at the center of rays as the Sun.", "idx": 486, "marathi": "किरणांच्या केंद्रस्थानी असलेले सूर्यरूप गभस्तिनेमी"}, {"name": "Sattvasthaḥ", "meaning": "Dwells specially in luminous Sattvaguṇa.", "idx": 487, "marathi": "प्रकाशमय सत्त्वगुणात स्थित सत्त्वस्थ"}, {"name": "Siṃhaḥ", "meaning": "Irresistible power like a lion.", "idx": 488, "marathi": "सिंहाप्रमाणे अजिंक्य पराक्रमी"}, {"name": "Bhūtamaheśvaraḥ", "meaning": "Supreme Lord of all beings.", "idx": 489, "marathi": "सर्व प्राण्यांचे परम महेश्वर"}, {"name": "Ādidevaḥ", "meaning": "First of all beings.", "idx": 490, "marathi": "सर्वांत प्रथम असलेले आदिदेव"}, {"name": "Mahādevaḥ", "meaning": "Great through supreme self-knowledge.", "idx": 491, "marathi": "परम आत्मज्ञानाने महान महादेव"}, {"name": "Deveśaḥ", "meaning": "Lord of all Devas.", "idx": 492, "marathi": "सर्व देवांचे स्वामी देवेश"}, {"name": "Devabhṛd-guruḥ", "meaning": "Controller and Guru even of Indra.", "idx": 493, "marathi": "इंद्रादी देवांचेही गुरू देवभृद्गुरू"}]}, {"id": "stotram-53", "section": "stotram", "num": "53", "slokaNum": 53, "label": "Śloka 53", "speaker": "Names 494–502", "start": 1133, "end": 1145, "sanskrit": "उत्तरो गोपतिर्गोप्ता ज्ञानगम्यः पुरातनः ।\nशरीरभूतभृद्भोक्ता कपीन्द्रो भूरिदक्षिणः ॥ ५३ ॥", "iast": "uttaro gopatir goptā jñānagamyaḥ purātanaḥ,\nśarīrabhūtabhṛd bhoktā kapīndro bhūridakṣiṇaḥ.", "meaning": "Uttaraḥ – Liberated from Saṃsāra, supreme. Gopatiḥ – Master of the earth; Kṛṣṇa tending cattle. Goptā – Protector of all beings. Jñānagamyaḥ – Attainable through spiritual knowledge. Purātanaḥ – Unlimited by time, existing before all. Śarīrabhūtabhṛd – Master of the five elements forming the body. Bhoktā – Protector and enjoyer of infinite bliss. Kapīndraḥ – Lord of Varāha or of the monkeys as Rāma. Bhūridakṣiṇaḥ – Receiver of abundant offerings in Yajñas.", "meaningMarathi": "Uttaraḥ (संसारातून तरून गेलेले परम श्रेष्ठ उत्तर) • Gopatiḥ (गोपालांच्या रूपात गाईंचे व पृथ्वीचे स्वामी गोपती) • Goptā (सर्व भूतांचे रक्षक गोप्ता) • Jñānagamyaḥ (केवळ आत्मज्ञानाने प्राप्त होणारे ज्ञानगम्य) • Purātanaḥ (कालातीत प्राचीन पुरातन) • Śarīrabhūtabhṛd (शरीर घडवणाऱ्या पंचमहाभूतांचे स्वामी) • Bhoktā (रक्षक व अनंत आनंदाचे भोक्ता) • Kapīndraḥ (वराह व वानरांचे स्वामी रामरूप कपींद्र) • Bhūridakṣiṇaḥ (यज्ञात विपुल दक्षिणा प्राप्त करणारे भूरिदक्षिण)", "names": [{"name": "Uttaraḥ", "meaning": "Liberated from Saṃsāra, supreme.", "idx": 494, "marathi": "संसारातून तरून गेलेले परम श्रेष्ठ उत्तर"}, {"name": "Gopatiḥ", "meaning": "Master of the earth; Kṛṣṇa tending cattle.", "idx": 495, "marathi": "गोपालांच्या रूपात गाईंचे व पृथ्वीचे स्वामी गोपती"}, {"name": "Goptā", "meaning": "Protector of all beings.", "idx": 496, "marathi": "सर्व भूतांचे रक्षक गोप्ता"}, {"name": "Jñānagamyaḥ", "meaning": "Attainable through spiritual knowledge.", "idx": 497, "marathi": "केवळ आत्मज्ञानाने प्राप्त होणारे ज्ञानगम्य"}, {"name": "Purātanaḥ", "meaning": "Unlimited by time, existing before all.", "idx": 498, "marathi": "कालातीत प्राचीन पुरातन"}, {"name": "Śarīrabhūtabhṛd", "meaning": "Master of the five elements forming the body.", "idx": 499, "marathi": "शरीर घडवणाऱ्या पंचमहाभूतांचे स्वामी"}, {"name": "Bhoktā", "meaning": "Protector and enjoyer of infinite bliss.", "idx": 500, "marathi": "रक्षक व अनंत आनंदाचे भोक्ता"}, {"name": "Kapīndraḥ", "meaning": "Lord of Varāha or of the monkeys as Rāma.", "idx": 501, "marathi": "वराह व वानरांचे स्वामी रामरूप कपींद्र"}, {"name": "Bhūridakṣiṇaḥ", "meaning": "Receiver of abundant offerings in Yajñas.", "idx": 502, "marathi": "यज्ञात विपुल दक्षिणा प्राप्त करणारे भूरिदक्षिण"}]}, {"id": "stotram-54", "section": "stotram", "num": "54", "slokaNum": 54, "label": "Śloka 54", "speaker": "Names 503–512", "start": 1145, "end": 1157, "sanskrit": "सोमपोऽमृतपः सोमः पुरुजित्पुरुसत्तमः ।\nविनयो जयः सत्यसन्धो दाशार्हः सात्वतां पतिः ॥ ५४ ॥", "iast": "somapo 'mṛtapaḥ somaḥ purujit purusattamaḥ,\nvinayo jayaḥ satyasandho dāśārhaḥ sātvatāṃ patiḥ.", "meaning": "Somapaḥ – Drinks the Soma in all Yajñas. Amṛtapaḥ – Drinks the nectar of immortal Bliss. Somaḥ – As the moon, invigorates plants. Purujit – Victorious over numerous foes. Purusattamaḥ – Cosmic in form and foremost of all. Vinayaḥ – Inflicts discipline on the wicked. Jayaḥ – Victorious over all beings. Satyasandhaḥ – Whose resolve always comes true. Dāśārhaḥ – Worthy of charitable offerings; born in Daśārha clan. Sātvatāṃ-patiḥ – Lord and protector of the Sātvatas.", "meaningMarathi": "Somapaḥ (यज्ञातील सोमरस प्राशन करणारे सोमप) • Amṛtapaḥ (स्वस्वरूपातील अमृतानंदाचे पान करणारे अमृतप) • Somaḥ (चंद्ररूपाने वनस्पतींचे पोषण करणारे सोम) • Purujit (अनेक शत्रूंवर विजय मिळवणारे पुरुजित्) • Purusattamaḥ (विराट व सर्वांत श्रेष्ठ पुरुसत्तम) • Vinayaḥ (दुष्टांना शासन करणारे विनय) • Jayaḥ (सर्वविजयी जय) • Satyasandhaḥ (ज्यांचे संकल्प सदैव सत्य होतात असे सत्यसंध) • Dāśārhaḥ (दानार्ह व दाशार्ह कुळात अवतरलेले) • Sātvatāṃ-patiḥ (सात्वत तंत्राचे प्रवर्तक व रक्षक सात्वतांपती)", "names": [{"name": "Somapaḥ", "meaning": "Drinks the Soma in all Yajñas.", "idx": 503, "marathi": "यज्ञातील सोमरस प्राशन करणारे सोमप"}, {"name": "Amṛtapaḥ", "meaning": "Drinks the nectar of immortal Bliss.", "idx": 504, "marathi": "स्वस्वरूपातील अमृतानंदाचे पान करणारे अमृतप"}, {"name": "Somaḥ", "meaning": "As the moon, invigorates plants.", "idx": 505, "marathi": "चंद्ररूपाने वनस्पतींचे पोषण करणारे सोम"}, {"name": "Purujit", "meaning": "Victorious over numerous foes.", "idx": 506, "marathi": "अनेक शत्रूंवर विजय मिळवणारे पुरुजित्"}, {"name": "Purusattamaḥ", "meaning": "Cosmic in form and foremost of all.", "idx": 507, "marathi": "विराट व सर्वांत श्रेष्ठ पुरुसत्तम"}, {"name": "Vinayaḥ", "meaning": "Inflicts discipline on the wicked.", "idx": 508, "marathi": "दुष्टांना शासन करणारे विनय"}, {"name": "Jayaḥ", "meaning": "Victorious over all beings.", "idx": 509, "marathi": "सर्वविजयी जय"}, {"name": "Satyasandhaḥ", "meaning": "Whose resolve always comes true.", "idx": 510, "marathi": "ज्यांचे संकल्प सदैव सत्य होतात असे सत्यसंध"}, {"name": "Dāśārhaḥ", "meaning": "Worthy of charitable offerings; born in Daśārha clan.", "idx": 511, "marathi": "दानार्ह व दाशार्ह कुळात अवतरलेले"}, {"name": "Sātvatāṃ-patiḥ", "meaning": "Lord and protector of the Sātvatas.", "idx": 512, "marathi": "सात्वत तंत्राचे प्रवर्तक व रक्षक सात्वतांपती"}]}, {"id": "stotram-55", "section": "stotram", "num": "55", "slokaNum": 55, "label": "Śloka 55", "speaker": "Names 513–520", "start": 1157, "end": 1169, "sanskrit": "जीवो विनयिता साक्षी मुकुन्दोऽमितविक्रमः ।\nअम्भोनिधिरनन्तात्मा महोदधिशयोऽन्तकः ॥ ५५ ॥", "iast": "jīvo vinayitā sākṣī mukundo 'mitavikramaḥ,\nambhonidhir anantātmā mahodadhiśayo 'ntakaḥ.", "meaning": "Jīvaḥ – As Kṣetrajña, associated with Prāṇas. Vinayitā-sākṣī – Witnesses the worshipful humility of devotees. Mukundaḥ – Bestower of Mukti (Liberation). Amitavikramaḥ – Whose three strides were limitless. Ambhonidhiḥ – In whom all beings dwell. Anantātmā – Unlimited by space, time and causation. Mahodadhi-śayaḥ – Reclines upon the waters of Cosmic Dissolution. Antakaḥ – Brings about the end of all beings.", "meaningMarathi": "Jīvaḥ (प्राणांशी युक्त क्षेत्रज्ञ जीवरूप) • Vinayitā-sākṣī (भक्तांच्या विनयशीलतेचे साक्षीदार) • Mukundaḥ (मोक्ष (मुक्ती) देणारे मुकुंद) • Amitavikramaḥ (ज्यांची तीन पावले अमर्याद होती असे अमितविक्रम) • Ambhonidhiḥ (देव-मानवादी सर्वांचे आश्रयस्थान अंभोनिधी) • Anantātmā (देश-कालातीत अनंतात्मा) • Mahodadhi-śayaḥ (प्रलयजलावर शयन करणारे महोदधिशय) • Antakaḥ (सर्वांचा अंत करणारे अंतक)", "names": [{"name": "Jīvaḥ", "meaning": "As Kṣetrajña, associated with Prāṇas.", "idx": 513, "marathi": "प्राणांशी युक्त क्षेत्रज्ञ जीवरूप"}, {"name": "Vinayitā-sākṣī", "meaning": "Witnesses the worshipful humility of devotees.", "idx": 514, "marathi": "भक्तांच्या विनयशीलतेचे साक्षीदार"}, {"name": "Mukundaḥ", "meaning": "Bestower of Mukti (Liberation).", "idx": 515, "marathi": "मोक्ष (मुक्ती) देणारे मुकुंद"}, {"name": "Amitavikramaḥ", "meaning": "Whose three strides were limitless.", "idx": 516, "marathi": "ज्यांची तीन पावले अमर्याद होती असे अमितविक्रम"}, {"name": "Ambhonidhiḥ", "meaning": "In whom all beings dwell.", "idx": 517, "marathi": "देव-मानवादी सर्वांचे आश्रयस्थान अंभोनिधी"}, {"name": "Anantātmā", "meaning": "Unlimited by space, time and causation.", "idx": 518, "marathi": "देश-कालातीत अनंतात्मा"}, {"name": "Mahodadhi-śayaḥ", "meaning": "Reclines upon the waters of Cosmic Dissolution.", "idx": 519, "marathi": "प्रलयजलावर शयन करणारे महोदधिशय"}, {"name": "Antakaḥ", "meaning": "Brings about the end of all beings.", "idx": 520, "marathi": "सर्वांचा अंत करणारे अंतक"}]}, {"id": "stotram-56", "section": "stotram", "num": "56", "slokaNum": 56, "label": "Śloka 56", "speaker": "Names 521–530", "start": 1169, "end": 1181, "sanskrit": "अजो महार्हः स्वाभाव्यो जितामित्रः प्रमोदनः ।\nआनन्दो नन्दनो नन्दः सत्यधर्मा त्रिविक्रमः ॥ ५६ ॥", "iast": "ajo mahārhaḥ svābhāvyo jitāmitraḥ pramodanaḥ,\nānando nandano nandaḥ satyadharmā trivikramaḥ.", "meaning": "Ajaḥ – Unborn (or born of Viṣṇu as Kāmadeva). Mahārhaḥ – Fit for supreme worship. Svābhāvyaḥ – Eternally perfect, naturally beginningless. Jitāmitraḥ – Conqueror of inner enemies like anger and outer foes like Rāvaṇa. Pramodanaḥ – Ever joyous in immortal Bliss. Ānandaḥ – Whose form is Bliss. Nandanaḥ – Giver of delight. Nandaḥ – Endowed with all perfections. Satyadharmā – Whose knowledge and attributes are true. Trivikramaḥ – Whose three strides covered the entire universe.", "meaningMarathi": "Ajaḥ (अजन्मा (अज)) • Mahārhaḥ (परम पूजनीय महार्ह) • Svābhāvyaḥ (नित्यसिद्ध व अनादी स्वाभाव्य) • Jitāmitraḥ (आंतरिक व बाह्य शत्रूंना जिंकलेले जितामित्र) • Pramodanaḥ (अमृतानंदात सदैव प्रमुदित प्रमोदन) • Ānandaḥ (स्वतः आनंदस्वरूप) • Nandanaḥ (सर्वांना आनंद देणारे नंदन) • Nandaḥ (सर्व परिपूर्णतांनी युक्त नंद) • Satyadharmā (सत्य ज्ञान व धर्म असलेले सत्यधर्मा) • Trivikramaḥ (तीन पावलांत त्रैलोक्य व्यापणारे त्रिविक्रम)", "names": [{"name": "Ajaḥ", "meaning": "Unborn (or born of Viṣṇu as Kāmadeva).", "idx": 521, "marathi": "अजन्मा (अज)"}, {"name": "Mahārhaḥ", "meaning": "Fit for supreme worship.", "idx": 522, "marathi": "परम पूजनीय महार्ह"}, {"name": "Svābhāvyaḥ", "meaning": "Eternally perfect, naturally beginningless.", "idx": 523, "marathi": "नित्यसिद्ध व अनादी स्वाभाव्य"}, {"name": "Jitāmitraḥ", "meaning": "Conqueror of inner enemies like anger and outer foes like Rāvaṇa.", "idx": 524, "marathi": "आंतरिक व बाह्य शत्रूंना जिंकलेले जितामित्र"}, {"name": "Pramodanaḥ", "meaning": "Ever joyous in immortal Bliss.", "idx": 525, "marathi": "अमृतानंदात सदैव प्रमुदित प्रमोदन"}, {"name": "Ānandaḥ", "meaning": "Whose form is Bliss.", "idx": 526, "marathi": "स्वतः आनंदस्वरूप"}, {"name": "Nandanaḥ", "meaning": "Giver of delight.", "idx": 527, "marathi": "सर्वांना आनंद देणारे नंदन"}, {"name": "Nandaḥ", "meaning": "Endowed with all perfections.", "idx": 528, "marathi": "सर्व परिपूर्णतांनी युक्त नंद"}, {"name": "Satyadharmā", "meaning": "Whose knowledge and attributes are true.", "idx": 529, "marathi": "सत्य ज्ञान व धर्म असलेले सत्यधर्मा"}, {"name": "Trivikramaḥ", "meaning": "Whose three strides covered the entire universe.", "idx": 530, "marathi": "तीन पावलांत त्रैलोक्य व्यापणारे त्रिविक्रम"}]}, {"id": "stotram-57", "section": "stotram", "num": "57", "slokaNum": 57, "label": "Śloka 57", "speaker": "Names 531–537", "start": 1181, "end": 1193, "sanskrit": "महर्षिः कपिलाचार्यः कृतज्ञो मेदिनीपतिः ।\nत्रिपदस्त्रिदशाध्यक्षो महाशृङ्गः कृतान्तकृत् ॥ ५७ ॥", "iast": "maharṣiḥ kapilācāryaḥ kṛtajño medinīpatiḥ,\ntripadas tridaśādhyakṣo mahāśṛṅgaḥ kṛtāntakṛt.", "meaning": "Maharṣiḥ Kapilācāryaḥ – Great sage Kapila, master of all Vedas. Kṛtajñaḥ – Knower of the manifested world and all actions. Medinīpatiḥ – Lord of the earth. Tripadaḥ – Having three strides. Tridaśādhyakṣaḥ – Witness of waking, dream and sleep states. Mahāśṛṅgaḥ – With a great horn (Matsya incarnation). Kṛtānta-kṛt – Brings about the dissolution of the manifested universe.", "meaningMarathi": "Maharṣiḥ Kapilācāryaḥ (सर्व वेदांचे ज्ञाते महर्षी कपिलाचार्य) • Kṛtajñaḥ (विश्व व सर्व कर्मे जाणणारे कृतज्ञ) • Medinīpatiḥ (पृथ्वीचे स्वामी मेदिनीपती) • Tripadaḥ (तीन पावले असलेले त्रिपद) • Tridaśādhyakṣaḥ (जागृती, स्वप्न व सुषुप्ती यांचे साक्षी त्रिदशाध्यक्ष) • Mahāśṛṅgaḥ (मत्स्य अवतारात महाशृंग असलेले) • Kṛtānta-kṛt (सृष्टीचा संहार करणारे कृतांतकृत्)", "names": [{"name": "Maharṣiḥ Kapilācāryaḥ", "meaning": "Great sage Kapila, master of all Vedas.", "idx": 531, "marathi": "सर्व वेदांचे ज्ञाते महर्षी कपिलाचार्य"}, {"name": "Kṛtajñaḥ", "meaning": "Knower of the manifested world and all actions.", "idx": 532, "marathi": "विश्व व सर्व कर्मे जाणणारे कृतज्ञ"}, {"name": "Medinīpatiḥ", "meaning": "Lord of the earth.", "idx": 533, "marathi": "पृथ्वीचे स्वामी मेदिनीपती"}, {"name": "Tripadaḥ", "meaning": "Having three strides.", "idx": 534, "marathi": "तीन पावले असलेले त्रिपद"}, {"name": "Tridaśādhyakṣaḥ", "meaning": "Witness of waking, dream and sleep states.", "idx": 535, "marathi": "जागृती, स्वप्न व सुषुप्ती यांचे साक्षी त्रिदशाध्यक्ष"}, {"name": "Mahāśṛṅgaḥ", "meaning": "With a great horn (Matsya incarnation).", "idx": 536, "marathi": "मत्स्य अवतारात महाशृंग असलेले"}, {"name": "Kṛtānta-kṛt", "meaning": "Brings about the dissolution of the manifested universe.", "idx": 537, "marathi": "सृष्टीचा संहार करणारे कृतांतकृत्"}]}, {"id": "stotram-58", "section": "stotram", "num": "58", "slokaNum": 58, "label": "Śloka 58", "speaker": "Names 538–546", "start": 1193, "end": 1205, "sanskrit": "महावराहो गोविन्दः सुषेणः कनकाङ्गदी ।\nगुह्यो गभीरो गहनो गुप्तश्चक्रगदाधरः ॥ ५८ ॥", "iast": "mahāvarāho govindaḥ suṣeṇaḥ kanakāṅgadī,\nguhyo gabhīro gahano guptaś cakragadādharaḥ.", "meaning": "Mahā-varāhaḥ – The great Cosmic Boar. Govindaḥ – Known through Vedic words. Suṣeṇaḥ – Surrounded by an armed guard of eternal associates. Kanakāṅgadī – Wearing armlets of gold. Guhyaḥ – Known through esoteric Upaniṣadic wisdom; hidden in the heart. Gabhīraḥ – Of profound majesty. Gahanaḥ – Difficult to fathom; witness of all states. Guptaḥ – Beyond words and thought. Cakra-gadā-dharaḥ – Bearer of the discus and mace.", "meaningMarathi": "Mahā-varāhaḥ (महान वराह अवतार घेणारे महावराह) • Govindaḥ (वेदवाक्यांनी जाणले जाणारे गोविंद) • Suṣeṇaḥ (नित्य पार्षदांच्या सेनेने युक्त सुषेण) • Kanakāṅgadī (सुवर्णाचे बाजूबंद धारण करणारे कनकांगदी) • Guhyaḥ (उपनिषदांच्या गूढ ज्ञानाने व हृदयात जाणले जाणारे गुह्य) • Gabhīraḥ (गंभीर महिमा असलेले गभीर) • Gahanaḥ (अगम्य व सर्व अवस्थांचे साक्षी गहन) • Guptaḥ (वाणी व मनाच्या पलीकडील गुप्त) • Cakra-gadā-dharaḥ (चक्र व गदा धारण करणारे चक्रगदाधर)", "names": [{"name": "Mahā-varāhaḥ", "meaning": "The great Cosmic Boar.", "idx": 538, "marathi": "महान वराह अवतार घेणारे महावराह"}, {"name": "Govindaḥ", "meaning": "Known through Vedic words.", "idx": 539, "marathi": "वेदवाक्यांनी जाणले जाणारे गोविंद"}, {"name": "Suṣeṇaḥ", "meaning": "Surrounded by an armed guard of eternal associates.", "idx": 540, "marathi": "नित्य पार्षदांच्या सेनेने युक्त सुषेण"}, {"name": "Kanakāṅgadī", "meaning": "Wearing armlets of gold.", "idx": 541, "marathi": "सुवर्णाचे बाजूबंद धारण करणारे कनकांगदी"}, {"name": "Guhyaḥ", "meaning": "Known through esoteric Upaniṣadic wisdom; hidden in the heart.", "idx": 542, "marathi": "उपनिषदांच्या गूढ ज्ञानाने व हृदयात जाणले जाणारे गुह्य"}, {"name": "Gabhīraḥ", "meaning": "Of profound majesty.", "idx": 543, "marathi": "गंभीर महिमा असलेले गभीर"}, {"name": "Gahanaḥ", "meaning": "Difficult to fathom; witness of all states.", "idx": 544, "marathi": "अगम्य व सर्व अवस्थांचे साक्षी गहन"}, {"name": "Guptaḥ", "meaning": "Beyond words and thought.", "idx": 545, "marathi": "वाणी व मनाच्या पलीकडील गुप्त"}, {"name": "Cakra-gadā-dharaḥ", "meaning": "Bearer of the discus and mace.", "idx": 546, "marathi": "चक्र व गदा धारण करणारे चक्रगदाधर"}]}, {"id": "stotram-59", "section": "stotram", "num": "59", "slokaNum": 59, "label": "Śloka 59", "speaker": "Names 547–557", "start": 1205, "end": 1218, "sanskrit": "वेधाः स्वाङ्गोऽजितः कृष्णो दृढः सङ्कर्षणोऽच्युतः ।\nवरुणो वारुणो वृक्षः पुष्कराक्षो महामनाः ॥ ५९ ॥", "iast": "vedhāḥ svāṅgo 'jitaḥ kṛṣṇo dṛḍhaḥ saṅkarṣaṇo 'cyutaḥ,\nvaruṇo vāruṇo vṛkṣaḥ puṣkarākṣo mahāmanāḥ.", "meaning": "Vedhāḥ – The cosmic regulator. Svāṅgaḥ – Himself the instrument in accomplishing works. Ajitaḥ – Unconquered in all incarnations. Kṛṣṇaḥ – Known as Kṛṣṇa-dvaipāyana. Dṛḍhaḥ – Whose nature knows no decay. Saṅkarṣaṇo-acyutaḥ – Attracts all beings at Dissolution without falling from His nature. Varuṇaḥ – The setting sun withdrawing its rays. Vāruṇaḥ – Manifested as Vasiṣṭha or Agastya. Vṛkṣaḥ – Unshakable like a tree. Puṣkarākṣaḥ – Shines in the heart-lotus; lotus-eyed. Mahāmanāḥ – Fulfils cosmic functions by mind alone.", "meaningMarathi": "Vedhāḥ (सृष्टीचे विधान करणारे वेधा) • Svāṅgaḥ (कार्याची सिद्धी स्वतःच करणारे स्वांग) • Ajitaḥ (सर्व अवतारांत अजिंक्य अजित) • Kṛṣṇaḥ (कृष्णद्वैपायन व्यासरूप श्रीकृष्ण) • Dṛḍhaḥ (कधीही क्षीण न होणारे दृढ) • Saṅkarṣaṇo-acyutaḥ (प्रलयकाळी सर्वांना आकर्षित करूनही अच्युत राहणारे संकर्षणोच्युत) • Varuṇaḥ (किरणे आवरून घेणारे वरुण) • Vāruṇaḥ (वसिष्ठ व अगस्ती रूपात प्रकट झालेले वारुण) • Vṛkṣaḥ (वृक्षाप्रमाणे अचल) • Puṣkarākṣaḥ (हृदयकमळात प्रकाशणारे कमलनयन पुष्कराक्ष) • Mahāmanāḥ (केवळ मनानेच सृष्टी-स्थिती-लय करणारे महामना)", "names": [{"name": "Vedhāḥ", "meaning": "The cosmic regulator.", "idx": 547, "marathi": "सृष्टीचे विधान करणारे वेधा"}, {"name": "Svāṅgaḥ", "meaning": "Himself the instrument in accomplishing works.", "idx": 548, "marathi": "कार्याची सिद्धी स्वतःच करणारे स्वांग"}, {"name": "Ajitaḥ", "meaning": "Unconquered in all incarnations.", "idx": 549, "marathi": "सर्व अवतारांत अजिंक्य अजित"}, {"name": "Kṛṣṇaḥ", "meaning": "Known as Kṛṣṇa-dvaipāyana.", "idx": 550, "marathi": "कृष्णद्वैपायन व्यासरूप श्रीकृष्ण"}, {"name": "Dṛḍhaḥ", "meaning": "Whose nature knows no decay.", "idx": 551, "marathi": "कधीही क्षीण न होणारे दृढ"}, {"name": "Saṅkarṣaṇo-acyutaḥ", "meaning": "Attracts all beings at Dissolution without falling from His nature.", "idx": 552, "marathi": "प्रलयकाळी सर्वांना आकर्षित करूनही अच्युत राहणारे संकर्षणोच्युत"}, {"name": "Varuṇaḥ", "meaning": "The setting sun withdrawing its rays.", "idx": 553, "marathi": "किरणे आवरून घेणारे वरुण"}, {"name": "Vāruṇaḥ", "meaning": "Manifested as Vasiṣṭha or Agastya.", "idx": 554, "marathi": "वसिष्ठ व अगस्ती रूपात प्रकट झालेले वारुण"}, {"name": "Vṛkṣaḥ", "meaning": "Unshakable like a tree.", "idx": 555, "marathi": "वृक्षाप्रमाणे अचल"}, {"name": "Puṣkarākṣaḥ", "meaning": "Shines in the heart-lotus; lotus-eyed.", "idx": 556, "marathi": "हृदयकमळात प्रकाशणारे कमलनयन पुष्कराक्ष"}, {"name": "Mahāmanāḥ", "meaning": "Fulfils cosmic functions by mind alone.", "idx": 557, "marathi": "केवळ मनानेच सृष्टी-स्थिती-लय करणारे महामना"}]}, {"id": "stotram-60", "section": "stotram", "num": "60", "slokaNum": 60, "label": "Śloka 60", "speaker": "Names 558–566", "start": 1218, "end": 1230, "sanskrit": "भगवान् भगहाऽऽनन्दी वनमाली हलायुधः ।\nआदित्यो ज्योतिरादित्यः सहिष्णुर्गतिसत्तमः ॥ ६० ॥", "iast": "bhagavān bhagahānandī vanamālī halāyudhaḥ,\nādityo jyotir ādityaḥ sahiṣṇur gatisattamaḥ.", "meaning": "Bhagavān – Knower of origin, dissolution, bondage, liberation, knowledge and ignorance. Bhagahā – Withdraws the six divine attributes at dissolution. Ānandī – Of the nature of Bliss. Vanamālī – Wears the Vaijayantī garland representing the five elements. Halāyudhaḥ – Wielded the ploughshare as Balabhadra. Ādityaḥ – Born of Aditi as Vāmana. Jyotir-ādityaḥ – Dwells in the brilliance of the sun's orb. Sahiṣṇuḥ – Endures pairs of opposites like heat and cold. Gatisattamaḥ – Ultimate resort and greatest of all beings.", "meaningMarathi": "Bhagavān (उत्पत्ती, लय, बंध, मोक्ष व ज्ञान जाणणारे भगवान) • Bhagahā (प्रलयकाळी षड्गुण स्वतःत सामावून घेणारे भगहा) • Ānandī (आनंदस्वरूप आनंदी) • Vanamālī (पंचमहाभूतांची वैजयंती वनमाळा धारण करणारे वनमाली) • Halāyudhaḥ (बलराम रूपात नांगर धारण करणारे हलायुध) • Ādityaḥ (वामन रूपात अदितीपुत्र आदित्य) • Jyotir-ādityaḥ (सूर्यमंडळातील तेजात वास करणारे ज्योतिरादित्य) • Sahiṣṇuḥ (शीतोष्णादी द्वंद्वे सहन करणारे सहिष्णू) • Gatisattamaḥ (सर्वांचा परम आश्रय व श्रेष्ठ गतिसत्तम)", "names": [{"name": "Bhagavān", "meaning": "Knower of origin, dissolution, bondage, liberation, knowledge and ignorance.", "idx": 558, "marathi": "उत्पत्ती, लय, बंध, मोक्ष व ज्ञान जाणणारे भगवान"}, {"name": "Bhagahā", "meaning": "Withdraws the six divine attributes at dissolution.", "idx": 559, "marathi": "प्रलयकाळी षड्गुण स्वतःत सामावून घेणारे भगहा"}, {"name": "Ānandī", "meaning": "Of the nature of Bliss.", "idx": 560, "marathi": "आनंदस्वरूप आनंदी"}, {"name": "Vanamālī", "meaning": "Wears the Vaijayantī garland representing the five elements.", "idx": 561, "marathi": "पंचमहाभूतांची वैजयंती वनमाळा धारण करणारे वनमाली"}, {"name": "Halāyudhaḥ", "meaning": "Wielded the ploughshare as Balabhadra.", "idx": 562, "marathi": "बलराम रूपात नांगर धारण करणारे हलायुध"}, {"name": "Ādityaḥ", "meaning": "Born of Aditi as Vāmana.", "idx": 563, "marathi": "वामन रूपात अदितीपुत्र आदित्य"}, {"name": "Jyotir-ādityaḥ", "meaning": "Dwells in the brilliance of the sun's orb.", "idx": 564, "marathi": "सूर्यमंडळातील तेजात वास करणारे ज्योतिरादित्य"}, {"name": "Sahiṣṇuḥ", "meaning": "Endures pairs of opposites like heat and cold.", "idx": 565, "marathi": "शीतोष्णादी द्वंद्वे सहन करणारे सहिष्णू"}, {"name": "Gatisattamaḥ", "meaning": "Ultimate resort and greatest of all beings.", "idx": 566, "marathi": "सर्वांचा परम आश्रय व श्रेष्ठ गतिसत्तम"}]}, {"id": "stotram-61", "section": "stotram", "num": "61", "slokaNum": 61, "label": "Śloka 61", "speaker": "Names 567–573", "start": 1230, "end": 1241, "sanskrit": "सुधन्वा खण्डपरशुर्दारुणो द्रविणप्रदः ।\nदिवःस्पृक् सर्वदृग्व्यासो वाचस्पतिरयोनिजः ॥ ६१ ॥", "iast": "sudhanvā khaṇḍaparaśur dāruṇo draviṇapradaḥ,\ndivaḥspṛk sarvadṛg vyāso vācaspatir ayonijaḥ.", "meaning": "Sudhanvā – Wielder of the excellent Śārṅga bow. Khaṇḍa-paraśuḥ – Wielder of the battle-axe destroying enemies. Dāruṇaḥ – Stern towards those on the evil path. Draviṇapradaḥ – Bestower of desired wealth on devotees. Divaḥ-spṛk – Touches the heavens. Sarvadṛg-vyāsaḥ – Whose comprehension encompasses everything. Vācaspatir-ayonijaḥ – Master of all learning, not born of a mother.", "meaningMarathi": "Sudhanvā (श्रेष्ठ शार्ङ्ग धनुष्य धारण करणारे सुधन्वा) • Khaṇḍa-paraśuḥ (शत्रूंचा नाश करणारा परशू धारण करणारे खंडपरशू) • Dāruṇaḥ (दुष्टांप्रती कठोर दारुण) • Draviṇapradaḥ (भक्तांना इष्ट धन देणारे द्रविणप्रद) • Divaḥ-spṛk (आकाशाला स्पर्श करणारे दिवःस्पृक्) • Sarvadṛg-vyāsaḥ (सर्वकाही जाणणारे सर्वदृग्व्यास) • Vācaspatir-ayonijaḥ (सर्व विद्यांचे स्वामी व अयोनिज असलेले वाचस्पतिरयोनिज)", "names": [{"name": "Sudhanvā", "meaning": "Wielder of the excellent Śārṅga bow.", "idx": 567, "marathi": "श्रेष्ठ शार्ङ्ग धनुष्य धारण करणारे सुधन्वा"}, {"name": "Khaṇḍa-paraśuḥ", "meaning": "Wielder of the battle-axe destroying enemies.", "idx": 568, "marathi": "शत्रूंचा नाश करणारा परशू धारण करणारे खंडपरशू"}, {"name": "Dāruṇaḥ", "meaning": "Stern towards those on the evil path.", "idx": 569, "marathi": "दुष्टांप्रती कठोर दारुण"}, {"name": "Draviṇapradaḥ", "meaning": "Bestower of desired wealth on devotees.", "idx": 570, "marathi": "भक्तांना इष्ट धन देणारे द्रविणप्रद"}, {"name": "Divaḥ-spṛk", "meaning": "Touches the heavens.", "idx": 571, "marathi": "आकाशाला स्पर्श करणारे दिवःस्पृक्"}, {"name": "Sarvadṛg-vyāsaḥ", "meaning": "Whose comprehension encompasses everything.", "idx": 572, "marathi": "सर्वकाही जाणणारे सर्वदृग्व्यास"}, {"name": "Vācaspatir-ayonijaḥ", "meaning": "Master of all learning, not born of a mother.", "idx": 573, "marathi": "सर्व विद्यांचे स्वामी व अयोनिज असलेले वाचस्पतिरयोनिज"}]}, {"id": "stotram-62", "section": "stotram", "num": "62", "slokaNum": 62, "label": "Śloka 62", "speaker": "Names 574–585", "start": 1241, "end": 1254, "sanskrit": "त्रिसामा सामगः साम निर्वाणं भेषजं भिषक् ।\nसंन्यासकृच्छमः शान्तो निष्ठा शान्तिः परायणम् ॥ ६२ ॥", "iast": "trisāmā sāmagaḥ sāma nirvāṇaṃ bheṣajaṃ bhiṣak,\nsaṃnyāsakṛc chamaḥ śānto niṣṭhā śāntiḥ parāyaṇam.", "meaning": "Trisāmā – Praised by Sāma chanters through the three Sāmas. Sāmagaḥ – Chanter of Sāma-gāna. Sāma – The Sāma Veda itself. Nirvāṇaṃ – Supreme bliss where all miseries cease. Bheṣajaṃ – Medicine for the disease of Saṃsāra. Bhiṣak – The divine physician. Saṃnyāsakṛt – Instituted the order of Saṃnyāsa for Mokṣa. Śamaḥ – Ordained pacification of the mind. Śāntaḥ – Peaceful, untouched by worldly pleasures. Niṣṭhā – In whom all beings rest at Pralaya. Śāntiḥ – Complete erasure of ignorance (Brahman). Parāyaṇam – Highest state with no return.", "meaningMarathi": "Trisāmā (तीन साममंत्रांनी स्तुती केले जाणारे त्रिसामा) • Sāmagaḥ (सामगान करणारे सामग) • Sāma (वेदामधील सामवेद स्वरूप) • Nirvāṇaṃ (सर्व दुःखांचा अंत असलेले परमानंद निर्वाण) • Bheṣajaṃ (संसाररोगावरील औषध भेषज) • Bhiṣak (दिव्य वैद्य भिषक्) • Saṃnyāsakṛt (मोक्षासाठी संन्यासाश्रमाची स्थापना करणारे) • Śamaḥ (चित्तशांतीचा उपदेश करणारे शम) • Śāntaḥ (विषयासक्तीरहित शांत) • Niṣṭhā (प्रलयकाळी सर्वांचे विश्रामस्थान निष्ठा) • Śāntiḥ (अविद्यानाशरूप परम शांती) • Parāyaṇam (पुनरावृत्ती नसलेले परमपद परायण)", "names": [{"name": "Trisāmā", "meaning": "Praised by Sāma chanters through the three Sāmas.", "idx": 574, "marathi": "तीन साममंत्रांनी स्तुती केले जाणारे त्रिसामा"}, {"name": "Sāmagaḥ", "meaning": "Chanter of Sāma-gāna.", "idx": 575, "marathi": "सामगान करणारे सामग"}, {"name": "Sāma", "meaning": "The Sāma Veda itself.", "idx": 576, "marathi": "वेदामधील सामवेद स्वरूप"}, {"name": "Nirvāṇaṃ", "meaning": "Supreme bliss where all miseries cease.", "idx": 577, "marathi": "सर्व दुःखांचा अंत असलेले परमानंद निर्वाण"}, {"name": "Bheṣajaṃ", "meaning": "Medicine for the disease of Saṃsāra.", "idx": 578, "marathi": "संसाररोगावरील औषध भेषज"}, {"name": "Bhiṣak", "meaning": "The divine physician.", "idx": 579, "marathi": "दिव्य वैद्य भिषक्"}, {"name": "Saṃnyāsakṛt", "meaning": "Instituted the order of Saṃnyāsa for Mokṣa.", "idx": 580, "marathi": "मोक्षासाठी संन्यासाश्रमाची स्थापना करणारे"}, {"name": "Śamaḥ", "meaning": "Ordained pacification of the mind.", "idx": 581, "marathi": "चित्तशांतीचा उपदेश करणारे शम"}, {"name": "Śāntaḥ", "meaning": "Peaceful, untouched by worldly pleasures.", "idx": 582, "marathi": "विषयासक्तीरहित शांत"}, {"name": "Niṣṭhā", "meaning": "In whom all beings rest at Pralaya.", "idx": 583, "marathi": "प्रलयकाळी सर्वांचे विश्रा
