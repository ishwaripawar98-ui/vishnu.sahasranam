kes beings across the ocean of Saṃsāra. Duṣkṛtihā – Effaces evil effects of bad actions. Puṇyaḥ – Bestows holiness on devotees. Duḥsvapna-nāśanaḥ – Saves from ominous dreams. Vīrahā – Frees Jīvas from transmigratory paths. Rakṣaṇaḥ – Protects the three worlds through Sattvaguṇa. Santaḥ – Very soul of virtuous people. Jīvanaḥ – Sustains life as Prāṇa. Paryavasthitaḥ – Pervading everywhere in the universe.", "meaningMarathi": "Uttāraṇaḥ (संसारसागराच्या पलीकडे नेणारे उत्तारण) • Duṣkṛtihā (पापकर्म व त्याचे फळ नष्ट करणारे दुष्कृतिहा) • Puṇyaḥ (स्मरणाने पावन करणारे पुण्य) • Duḥsvapna-nāśanaḥ (अशुभ स्वप्नांचा नाश करणारे दुःस्वप्ननाशन) • Vīrahā (जीवांना जन्म-मृत्यूच्या मार्गातून मुक्त करणारे वीरहा) • Rakṣaṇaḥ (सत्त्वगुणाने त्रैलोक्याचे रक्षण करणारे रक्षण) • Santaḥ (सज्जनांचे अंतरात्मा संत) • Jīvanaḥ (प्राणरूपाने सर्वांना जिवंत ठेवणारे जीवन) • Paryavasthitaḥ (विश्वात सर्वत्र स्थित पर्यवस्थित)", "names": [{"name": "Uttāraṇaḥ", "meaning": "Takes beings across the ocean of Saṃsāra.", "idx": 923, "marathi": "संसारसागराच्या पलीकडे नेणारे उत्तारण"}, {"name": "Duṣkṛtihā", "meaning": "Effaces evil effects of bad actions.", "idx": 924, "marathi": "पापकर्म व त्याचे फळ नष्ट करणारे दुष्कृतिहा"}, {"name": "Puṇyaḥ", "meaning": "Bestows holiness on devotees.", "idx": 925, "marathi": "स्मरणाने पावन करणारे पुण्य"}, {"name": "Duḥsvapna-nāśanaḥ", "meaning": "Saves from ominous dreams.", "idx": 926, "marathi": "अशुभ स्वप्नांचा नाश करणारे दुःस्वप्ननाशन"}, {"name": "Vīrahā", "meaning": "Frees Jīvas from transmigratory paths.", "idx": 927, "marathi": "जीवांना जन्म-मृत्यूच्या मार्गातून मुक्त करणारे वीरहा"}, {"name": "Rakṣaṇaḥ", "meaning": "Protects the three worlds through Sattvaguṇa.", "idx": 928, "marathi": "सत्त्वगुणाने त्रैलोक्याचे रक्षण करणारे रक्षण"}, {"name": "Santaḥ", "meaning": "Very soul of virtuous people.", "idx": 929, "marathi": "सज्जनांचे अंतरात्मा संत"}, {"name": "Jīvanaḥ", "meaning": "Sustains life as Prāṇa.", "idx": 930, "marathi": "प्राणरूपाने सर्वांना जिवंत ठेवणारे जीवन"}, {"name": "Paryavasthitaḥ", "meaning": "Pervading everywhere in the universe.", "idx": 931, "marathi": "विश्वात सर्वत्र स्थित पर्यवस्थित"}]}, {"id": "stotram-100", "section": "stotram", "num": "100", "slokaNum": 100, "label": "Śloka 100", "speaker": "Names 932–940", "start": 1702, "end": 1715, "sanskrit": "अनन्तरूपोऽनन्तश्रीर्जितमन्युर्भयापहः ।\nचतुरश्रो गभीरात्मा विदिशो व्यादिशो दिशः ॥ १०० ॥", "iast": "anantarūpo 'nantaśrīr jitamanyur bhayāpahaḥ,\ncaturaśro gabhīrātmā vidiśo vyādiśo diśaḥ.", "meaning": "Ananta-rūpaḥ – Having innumerable forms. Anantaśrīḥ – Whose glory is infinite. Jita-manyuḥ – Conqueror of anger. Bhayāpahaḥ – Destroys fears of Saṃsāra. Caturaśraḥ – Just, bestowing exact fruits of Karma. Gabhīrātmā – Unfathomable in nature. Vidiśaḥ – Distributes fruits according to competency. Vyādiśaḥ – Directs deities in their varied functions. Diśaḥ – Bestows ritual fruits through the Vedas.", "meaningMarathi": "Ananta-rūpaḥ (विश्वात अनंत रूपे धारण करणारे अनंतरूप) • Anantaśrīḥ (अनंत ऐश्वर्यशाली अनंतश्री) • Jita-manyuḥ (क्रोधावर विजय मिळवलेले जितमन्यू) • Bhayāpahaḥ (संसारभय नाहीसे करणारे भयापह) • Caturaśraḥ (कर्मानुसार न्याय्य फळ देणारे चतुरश्र) • Gabhīrātmā (अथांग स्वरूपाचे गभीरात्मा) • Vidiśaḥ (योग्यतेनुसार विविध फळे वाटणारे विदिश) • Vyādiśaḥ (इंद्रादी देवांना कार्याचा आदेश देणारे व्यादिश) • Diśaḥ (वेदांद्वारे कर्मफळ देणारे दिश)", "names": [{"name": "Ananta-rūpaḥ", "meaning": "Having innumerable forms.", "idx": 932, "marathi": "विश्वात अनंत रूपे धारण करणारे अनंतरूप"}, {"name": "Anantaśrīḥ", "meaning": "Whose glory is infinite.", "idx": 933, "marathi": "अनंत ऐश्वर्यशाली अनंतश्री"}, {"name": "Jita-manyuḥ", "meaning": "Conqueror of anger.", "idx": 934, "marathi": "क्रोधावर विजय मिळवलेले जितमन्यू"}, {"name": "Bhayāpahaḥ", "meaning": "Destroys fears of Saṃsāra.", "idx": 935, "marathi": "संसारभय नाहीसे करणारे भयापह"}, {"name": "Caturaśraḥ", "meaning": "Just, bestowing exact fruits of Karma.", "idx": 936, "marathi": "कर्मानुसार न्याय्य फळ देणारे चतुरश्र"}, {"name": "Gabhīrātmā", "meaning": "Unfathomable in nature.", "idx": 937, "marathi": "अथांग स्वरूपाचे गभीरात्मा"}, {"name": "Vidiśaḥ", "meaning": "Distributes fruits according to competency.", "idx": 938, "marathi": "योग्यतेनुसार विविध फळे वाटणारे विदिश"}, {"name": "Vyādiśaḥ", "meaning": "Directs deities in their varied functions.", "idx": 939, "marathi": "इंद्रादी देवांना कार्याचा आदेश देणारे व्यादिश"}, {"name": "Diśaḥ", "meaning": "Bestows ritual fruits through the Vedas.", "idx": 940, "marathi": "वेदांद्वारे कर्मफळ देणारे दिश"}]}, {"id": "stotram-101", "section": "stotram", "num": "101", "slokaNum": 101, "label": "Śloka 101", "speaker": "Names 941–949", "start": 1715, "end": 1726, "sanskrit": "अनादिर्भूर्भुवो लक्ष्मीः सुवीरो रुचिराङ्गदः ।\nजननो जनजन्मादिर्भीमो भीमपराक्रमः ॥ १०१ ॥", "iast": "anādir bhūrbhuvo lakṣmīḥ suvīro rucirāṅgadaḥ,\njanano janajanmādir bhīmo bhīmaparākramaḥ.", "meaning": "Anādiḥ – Without beginning, ultimate cause. Bhūrbhuvaḥ – Support of even the earth. Lakṣmīḥ – Bestower of all auspiciousness to the earth. Suvīraḥ – Many brilliant ways of manifestation. Rucirāṅgadaḥ – Wears attractive armlets. Jananaḥ – Gives birth to all living beings. Jana-janmādiḥ – Root cause of embodied Jīvas. Bhīmaḥ – Cause of awe and fear. Bhīma-parākramaḥ – Whose valour terrified the Asuras.", "meaningMarathi": "Anādiḥ (आदि नसलेले सर्वांचे मूळकारण अनादी) • Bhūrbhuvaḥ (पृथ्वीचेही आधारस्थान भूर्भुव) • Lakṣmīḥ (पृथ्वीला सर्व मंगल देणारे लक्ष्मीस्वरूप) • Suvīraḥ (अनेक तेजस्वी अवतार असलेले सुवीर) • Rucirāṅgadaḥ (मनोहर बाजूबंद धारण करणारे रुचिरांगद) • Jananaḥ (सर्व प्राण्यांना जन्म देणारे जनन) • Jana-janmādiḥ (जीवांच्या उत्पत्तीचे आदिकारण जनजन्मादी) • Bhīmaḥ (दुष्टांना भयप्रद भीम) • Bhīma-parākramaḥ (असुरांना थरकाप भरवणारा पराक्रम असलेले भीमपराक्रम)", "names": [{"name": "Anādiḥ", "meaning": "Without beginning, ultimate cause.", "idx": 941, "marathi": "आदि नसलेले सर्वांचे मूळकारण अनादी"}, {"name": "Bhūrbhuvaḥ", "meaning": "Support of even the earth.", "idx": 942, "marathi": "पृथ्वीचेही आधारस्थान भूर्भुव"}, {"name": "Lakṣmīḥ", "meaning": "Bestower of all auspiciousness to the earth.", "idx": 943, "marathi": "पृथ्वीला सर्व मंगल देणारे लक्ष्मीस्वरूप"}, {"name": "Suvīraḥ", "meaning": "Many brilliant ways of manifestation.", "idx": 944, "marathi": "अनेक तेजस्वी अवतार असलेले सुवीर"}, {"name": "Rucirāṅgadaḥ", "meaning": "Wears attractive armlets.", "idx": 945, "marathi": "मनोहर बाजूबंद धारण करणारे रुचिरांगद"}, {"name": "Jananaḥ", "meaning": "Gives birth to all living beings.", "idx": 946, "marathi": "सर्व प्राण्यांना जन्म देणारे जनन"}, {"name": "Jana-janmādiḥ", "meaning": "Root cause of embodied Jīvas.", "idx": 947, "marathi": "जीवांच्या उत्पत्तीचे आदिकारण जनजन्मादी"}, {"name": "Bhīmaḥ", "meaning": "Cause of awe and fear.", "idx": 948, "marathi": "दुष्टांना भयप्रद भीम"}, {"name": "Bhīma-parākramaḥ", "meaning": "Whose valour terrified the Asuras.", "idx": 949, "marathi": "असुरांना थरकाप भरवणारा पराक्रम असलेले भीमपराक्रम"}]}, {"id": "stotram-102", "section": "stotram", "num": "102", "slokaNum": 102, "label": "Śloka 102", "speaker": "Names 950–958", "start": 1726, "end": 1738, "sanskrit": "आधारनिलयोऽधाता पुष्पहासः प्रजागरः ।\nऊर्ध्वगः सत्पथाचारः प्राणदः प्रणवः पणः ॥ १०२ ॥", "iast": "ādhāranilayo 'dhātā puṣpahāsaḥ prajāgaraḥ,\nūrdhvagaḥ satpathācāraḥ prāṇadaḥ praṇavaḥ paṇaḥ.", "meaning": "Ādhāra-nilayaḥ – Support of the five basic elements. Adhātā – His own support, needing none outside. Puṣpahāsaḥ – Manifests as the universe like blooming flowers. Prajāgaraḥ – Eternal Awareness, ever awake. Ūrdhvagaḥ – Above everything. Satpathācāraḥ – Follows the conduct of the good. Prāṇadaḥ – Restores life to the dead (as with Parīkṣit). Praṇavaḥ – Inseparably related to Oṃ. Paṇaḥ – Bestows the fruits of Karma according to actions.", "meaningMarathi": "Ādhāra-nilayaḥ (पंचमहाभूतांचेही आधारस्थान आधारनिलय) • Adhātā (स्वतःच स्वतःचे आधार असलेले अधाता) • Puṣpahāsaḥ (कळीतून फूल उमलावे तसे विश्व प्रकट करणारे पुष्पहास) • Prajāgaraḥ (नित्य चैतन्यस्वरूप जागृत प्रजागर) • Ūrdhvagaḥ (सर्वांच्या वर असलेले ऊर्ध्वग) • Satpathācāraḥ (सन्मार्गाने चालणारे सत्पथाचार) • Prāṇadaḥ (परीक्षितासारख्या मृतालाही जीवन देणारे प्राणद) • Praṇavaḥ (ॐकार स्वरूप प्रणव) • Paṇaḥ (कर्मानुसार फळाचा व्यवहार करणारे पण)", "names": [{"name": "Ādhāra-nilayaḥ", "meaning": "Support of the five basic elements.", "idx": 950, "marathi": "पंचमहाभूतांचेही आधारस्थान आधारनिलय"}, {"name": "Adhātā", "meaning": "His own support, needing none outside.", "idx": 951, "marathi": "स्वतःच स्वतःचे आधार असलेले अधाता"}, {"name": "Puṣpahāsaḥ", "meaning": "Manifests as the universe like blooming flowers.", "idx": 952, "marathi": "कळीतून फूल उमलावे तसे विश्व प्रकट करणारे पुष्पहास"}, {"name": "Prajāgaraḥ", "meaning": "Eternal Awareness, ever awake.", "idx": 953, "marathi": "नित्य चैतन्यस्वरूप जागृत प्रजागर"}, {"name": "Ūrdhvagaḥ", "meaning": "Above everything.", "idx": 954, "marathi": "सर्वांच्या वर असलेले ऊर्ध्वग"}, {"name": "Satpathācāraḥ", "meaning": "Follows the conduct of the good.", "idx": 955, "marathi": "सन्मार्गाने चालणारे सत्पथाचार"}, {"name": "Prāṇadaḥ", "meaning": "Restores life to the dead (as with Parīkṣit).", "idx": 956, "marathi": "परीक्षितासारख्या मृतालाही जीवन देणारे प्राणद"}, {"name": "Praṇavaḥ", "meaning": "Inseparably related to Oṃ.", "idx": 957, "marathi": "ॐकार स्वरूप प्रणव"}, {"name": "Paṇaḥ", "meaning": "Bestows the fruits of Karma according to actions.", "idx": 958, "marathi": "कर्मानुसार फळाचा व्यवहार करणारे पण"}]}, {"id": "stotram-103", "section": "stotram", "num": "103", "slokaNum": 103, "label": "Śloka 103", "speaker": "Names 959–966", "start": 1738, "end": 1750, "sanskrit": "प्रमाणं प्राणनिलयः प्राणभृत्प्राणजीवनः ।\nतत्त्वं तत्त्वविदेकात्मा जन्ममृत्युजरातिगः ॥ १०३ ॥", "iast": "pramāṇaṃ prāṇanilayaḥ prāṇabhṛt prāṇajīvanaḥ,\ntattvaṃ tattvavid ekātmā janmamṛtyujarātigaḥ.", "meaning": "Pramāṇaṃ – Self-certifying Pure Consciousness. Prāṇanilayaḥ – Home and dissolving ground of Prāṇas. Prāṇa-bhṛt – Strengthens Prāṇas as food nourishes. Prāṇa-jīvanaḥ – Keeps beings alive through vital airs. Tattvaṃ – Brahman, Ultimate Reality. Tattvavid – Knows His own true nature. Ekātmā – Sole Being and Spirit in all. Janma-mṛtyu-jarātigaḥ – Beyond birth, existence, growth, change, decay and death.", "meaningMarathi": "Pramāṇaṃ (स्वयंप्रकाश शुद्ध चैतन्यरूप प्रमाण) • Prāṇanilayaḥ (प्राणांचे आश्रय व लयस्थान प्राणनिलय) • Prāṇa-bhṛt (अन्नाप्रमाणे प्राणांचे पोषण करणारे प्राणभृत्) • Prāṇa-jīvanaḥ (प्राण-अपानादी वायूंनी जीवित ठेवणारे प्राणजीवन) • Tattvaṃ (परम तत्त्व (ब्रह्म)) • Tattvavid (स्वस्वरूपाचे ज्ञाते तत्त्ववित्) • Ekātmā (सर्वांतील एकमेव आत्मा एकात्मा) • Janma-mṛtyu-jarātigaḥ (जन्म, मृत्यू व वार्धक्य यांच्या पलीकडील जन्ममृत्युजरातिग)", "names": [{"name": "Pramāṇaṃ", "meaning": "Self-certifying Pure Consciousness.", "idx": 959, "marathi": "स्वयंप्रकाश शुद्ध चैतन्यरूप प्रमाण"}, {"name": "Prāṇanilayaḥ", "meaning": "Home and dissolving ground of Prāṇas.", "idx": 960, "marathi": "प्राणांचे आश्रय व लयस्थान प्राणनिलय"}, {"name": "Prāṇa-bhṛt", "meaning": "Strengthens Prāṇas as food nourishes.", "idx": 961, "marathi": "अन्नाप्रमाणे प्राणांचे पोषण करणारे प्राणभृत्"}, {"name": "Prāṇa-jīvanaḥ", "meaning": "Keeps beings alive through vital airs.", "idx": 962, "marathi": "प्राण-अपानादी वायूंनी जीवित ठेवणारे प्राणजीवन"}, {"name": "Tattvaṃ", "meaning": "Brahman, Ultimate Reality.", "idx": 963, "marathi": "परम तत्त्व (ब्रह्म)"}, {"name": "Tattvavid", "meaning": "Knows His own true nature.", "idx": 964, "marathi": "स्वस्वरूपाचे ज्ञाते तत्त्ववित्"}, {"name": "Ekātmā", "meaning": "Sole Being and Spirit in all.", "idx": 965, "marathi": "सर्वांतील एकमेव आत्मा एकात्मा"}, {"name": "Janma-mṛtyu-jarātigaḥ", "meaning": "Beyond birth, existence, growth, change, decay and death.", "idx": 966, "marathi": "जन्म, मृत्यू व वार्धक्य यांच्या पलीकडील जन्ममृत्युजरातिग"}]}, {"id": "stotram-104", "section": "stotram", "num": "104", "slokaNum": 104, "label": "Śloka 104", "speaker": "Names 967–975", "start": 1750, "end": 1762, "sanskrit": "भूर्भुवःस्वस्तरुस्तारः सविता प्रपितामहः ।\nयज्ञो यज्ञपतिर्यज्वा यज्ञाङ्गो यज्ञवाहनः ॥ १०४ ॥", "iast": "bhūrbhuvaḥ svastarus tāraḥ savitā prapitāmahaḥ,\nyajño yajñapatir yajvā yajñāṅgo yajñavāhanaḥ.", "meaning": "Bhūr-bhuvaḥ-svastaruḥ – Tree from which the three Vyāhṛtis spring. Tāraḥ – Helps Jīvas cross Saṃsāra. Savitā – Generates all worlds. Prapitāmahaḥ – Father of Brahmā, grandfather of all. Yajñaḥ – Of the form of Yajña. Yajñapatiḥ – Protector and master of all Yajñas. Yajvā – Manifests as performer of Yajña. Yajñāṅgaḥ – Parts of His Varāha body are parts of Yajña. Yajña-vāhanaḥ – Supports Yajñas yielding fruits.", "meaningMarathi": "Bhūr-bhuvaḥ-svastaruḥ (भूः, भुवः, स्वः या व्याहृतींचा कल्पवृक्ष) • Tāraḥ (संसारातून तारणारे तार) • Savitā (सर्व लोकांचे जनक सविता) • Prapitāmahaḥ (ब्रह्मदेवाचेही पिता प्रपितामह) • Yajñaḥ (यज्ञस्वरूप) • Yajñapatiḥ (सर्व यज्ञांचे स्वामी व रक्षक यज्ञपती) • Yajvā (यज्ञ करणारे यज्वा) • Yajñāṅgaḥ (वराह रूपात ज्यांचे अवयव यज्ञांगे आहेत ते यज्ञांग) • Yajña-vāhanaḥ (फलदायी यज्ञांचे वहन करणारे यज्ञवाहन)", "names": [{"name": "Bhūr-bhuvaḥ-svastaruḥ", "meaning": "Tree from which the three Vyāhṛtis spring.", "idx": 967, "marathi": "भूः, भुवः, स्वः या व्याहृतींचा कल्पवृक्ष"}, {"name": "Tāraḥ", "meaning": "Helps Jīvas cross Saṃsāra.", "idx": 968, "marathi": "संसारातून तारणारे तार"}, {"name": "Savitā", "meaning": "Generates all worlds.", "idx": 969, "marathi": "सर्व लोकांचे जनक सविता"}, {"name": "Prapitāmahaḥ", "meaning": "Father of Brahmā, grandfather of all.", "idx": 970, "marathi": "ब्रह्मदेवाचेही पिता प्रपितामह"}, {"name": "Yajñaḥ", "meaning": "Of the form of Yajña.", "idx": 971, "marathi": "यज्ञस्वरूप"}, {"name": "Yajñapatiḥ", "meaning": "Protector and master of all Yajñas.", "idx": 972, "marathi": "सर्व यज्ञांचे स्वामी व रक्षक यज्ञपती"}, {"name": "Yajvā", "meaning": "Manifests as performer of Yajña.", "idx": 973, "marathi": "यज्ञ करणारे यज्वा"}, {"name": "Yajñāṅgaḥ", "meaning": "Parts of His Varāha body are parts of Yajña.", "idx": 974, "marathi": "वराह रूपात ज्यांचे अवयव यज्ञांगे आहेत ते यज्ञांग"}, {"name": "Yajña-vāhanaḥ", "meaning": "Supports Yajñas yielding fruits.", "idx": 975, "marathi": "फलदायी यज्ञांचे वहन करणारे यज्ञवाहन"}]}, {"id": "stotram-105", "section": "stotram", "num": "105", "slokaNum": 105, "label": "Śloka 105", "speaker": "Names 976–984", "start": 1762, "end": 1775, "sanskrit": "यज्ञभृद्यज्ञकृद्यज्ञी यज्ञभुग्यज्ञसाधनः ।\nयज्ञान्तकृद्यज्ञगुह्यमन्नमन्नाद एव च ॥ १०५ ॥", "iast": "yajñabhṛd yajñakṛd yajñī yajñabhug yajñasādhanaḥ,\nyajñāntakṛd yajñaguhyam annam annāda eva ca.", "meaning": "Yajñabhṛd – Protector and supporter of Yajñas. Yajñakṛd – Performs Yajña at beginning and end of creation. Yajñī – Principal Lord of Yajña. Yajñabhug – Enjoyer and protector of Yajña. Yajña-sādhanaḥ – Both means and end of Yajña. Yajñāntakṛd – End and fruit of Yajña. Yajñaguhyam – Esoteric essence of sacrifice (Jñāna Yajña). Annam – Sustenance pervading all beings. Annādaḥ – Eater of the whole world as food.", "meaningMarathi": "Yajñabhṛd (यज्ञांचे रक्षण व पोषण करणारे यज्ञभृत्) • Yajñakṛd (सृष्टीच्या आरंभी व अंती यज्ञ करणारे यज्ञकृत्) • Yajñī (यज्ञाचे प्रमुख स्वामी यज्ञी) • Yajñabhug (यज्ञाचे भोक्ता व रक्षक यज्ञभुक्) • Yajña-sādhanaḥ (यज्ञाचे साधन व साध्य दोन्ही) • Yajñāntakṛd (यज्ञाचे अंतिम फळ देणारे यज्ञान्तकृत्) • Yajñaguhyam (सर्व यज्ञांचे गूढ सार ज्ञानयज्ञ (यज्ञगुह्य)) • Annam (प्राण्यांचे पोषण करणारे अन्नस्वरूप) • Annādaḥ (संपूर्ण विश्व अन्नरूपाने ग्रहण करणारे अन्नाद)", "names": [{"name": "Yajñabhṛd", "meaning": "Protector and supporter of Yajñas.", "idx": 976, "marathi": "यज्ञांचे रक्षण व पोषण करणारे यज्ञभृत्"}, {"name": "Yajñakṛd", "meaning": "Performs Yajña at beginning and end of creation.", "idx": 977, "marathi": "सृष्टीच्या आरंभी व अंती यज्ञ करणारे यज्ञकृत्"}, {"name": "Yajñī", "meaning": "Principal Lord of Yajña.", "idx": 978, "marathi": "यज्ञाचे प्रमुख स्वामी यज्ञी"}, {"name": "Yajñabhug", "meaning": "Enjoyer and protector of Yajña.", "idx": 979, "marathi": "यज्ञाचे भोक्ता व रक्षक यज्ञभुक्"}, {"name": "Yajña-sādhanaḥ", "meaning": "Both means and end of Yajña.", "idx": 980, "marathi": "यज्ञाचे साधन व साध्य दोन्ही"}, {"name": "Yajñāntakṛd", "meaning": "End and fruit of Yajña.", "idx": 981, "marathi": "यज्ञाचे अंतिम फळ देणारे यज्ञान्तकृत्"}, {"name": "Yajñaguhyam", "meaning": "Esoteric essence of sacrifice (Jñāna Yajña).", "idx": 982, "marathi": "सर्व यज्ञांचे गूढ सार ज्ञानयज्ञ (यज्ञगुह्य)"}, {"name": "Annam", "meaning": "Sustenance pervading all beings.", "idx": 983, "marathi": "प्राण्यांचे पोषण करणारे अन्नस्वरूप"}, {"name": "Annādaḥ", "meaning": "Eater of the whole world as food.", "idx": 984, "marathi": "संपूर्ण विश्व अन्नरूपाने ग्रहण करणारे अन्नाद"}]}, {"id": "stotram-106", "section": "stotram", "num": "106", "slokaNum": 106, "label": "Śloka 106", "speaker": "Names 985–992", "start": 1775, "end": 1787, "sanskrit": "आत्मयोनिः स्वयञ्जातो वैखानः सामगायनः ।\nदेवकीनन्दनः स्रष्टा क्षितीशः पापनाशनः ॥ १०६ ॥", "iast": "ātmayoniḥ svayañjāto vaikhānaḥ sāmagāyanaḥ,\ndevakīnandanaḥ sraṣṭā kṣitīśaḥ pāpanāśanaḥ.", "meaning": "Ātmayoniḥ – Sole material cause of all. Svayaṃ-jātaḥ – Self-born instrumental cause. Vaikhānaḥ – Excavated the earth as Varāha. Sāmagāyanaḥ – Recites and is sung through Sāma chants. Devakī-nandanaḥ – Son of Devakī as Kṛṣṇa. Sraṣṭā – Creator of all worlds. Kṣitīśaḥ – Master of the earth (Rāma). Pāpanāśanaḥ – Destroys sins of those who adore and praise Him.", "meaningMarathi": "Ātmayoniḥ (विश्वाचे एकमेव उपादान कारण आत्मयोनी) • Svayaṃ-jātaḥ (स्वतःच प्रकट झालेले स्वयंजात) • Vaikhānaḥ (वराह रूपात पृथ्वीचे उत्खनन करणारे वैखान) • Sāmagāyanaḥ (सामवेदाचे गान करणारे सामगायन) • Devakī-nandanaḥ (श्रीकृष्ण रूपात देवकीचे पुत्र देवकीनंदन) • Sraṣṭā (सर्व लोकांचे निर्माते स्रष्टा) • Kṣitīśaḥ (पृथ्वीचे स्वामी रामरूप क्षितीश) • Pāpanāśanaḥ (भक्तांची सर्व पापे नाश करणारे पापनाशन)", "names": [{"name": "Ātmayoniḥ", "meaning": "Sole material cause of all.", "idx": 985, "marathi": "विश्वाचे एकमेव उपादान कारण आत्मयोनी"}, {"name": "Svayaṃ-jātaḥ", "meaning": "Self-born instrumental cause.", "idx": 986, "marathi": "स्वतःच प्रकट झालेले स्वयंजात"}, {"name": "Vaikhānaḥ", "meaning": "Excavated the earth as Varāha.", "idx": 987, "marathi": "वराह रूपात पृथ्वीचे उत्खनन करणारे वैखान"}, {"name": "Sāmagāyanaḥ", "meaning": "Recites and is sung through Sāma chants.", "idx": 988, "marathi": "सामवेदाचे गान करणारे सामगायन"}, {"name": "Devakī-nandanaḥ", "meaning": "Son of Devakī as Kṛṣṇa.", "idx": 989, "marathi": "श्रीकृष्ण रूपात देवकीचे पुत्र देवकीनंदन"}, {"name": "Sraṣṭā", "meaning": "Creator of all worlds.", "idx": 990, "marathi": "सर्व लोकांचे निर्माते स्रष्टा"}, {"name": "Kṣitīśaḥ", "meaning": "Master of the earth (Rāma).", "idx": 991, "marathi": "पृथ्वीचे स्वामी रामरूप क्षितीश"}, {"name": "Pāpanāśanaḥ", "meaning": "Destroys sins of those who adore and praise Him.", "idx": 992, "marathi": "भक्तांची सर्व पापे नाश करणारे पापनाशन"}]}, {"id": "stotram-107", "section": "stotram", "num": "107", "slokaNum": 107, "label": "Śloka 107", "speaker": "Names 993–1000", "start": 1787, "end": 1804, "sanskrit": "शङ्खभृन्नन्दकी चक्री शार्ङ्गधन्वा गदाधरः ।\nरथाङ्गपाणिरक्षोभ्यः सर्वप्रहरणायुधः ॥ १०७ ॥\nश्री सर्वप्रहरणायुध ॐ नम इति ।", "iast": "śaṅkhabhṛn nandakī cakrī śārṅgadhanvā gadādharaḥ,\nrathāṅgapāṇir akṣobhyaḥ sarvapraharaṇāyudhaḥ.\nśrī sarvapraharaṇāyudha oṃ nama iti.", "meaning": "Śaṅkhabhṛt – Bears conch Pāñcajanya (Tāmasāhaṃkāra). Nandakī – Holds sword Nandaka (spiritual illumination). Cakrī – Bears discus Sudarśana (Rājasāhaṃkāra). Śārṅga-dhanvā – Wields the Śārṅga bow. Gadādharaḥ – Holds mace Kaumodakī (intellect). Rathāṅga-pāṇiḥ – Holds the wheel (Cakra). Akṣobhyaḥ – Unperturbed, controlling all weapons. Sarva-praharaṇāyudhaḥ – Whose arsenal of protective weapons is unlimited.", "meaningMarathi": "Śaṅkhabhṛt (पांचजन्य शंख धारण करणारे शंखभृत्) • Nandakī (ज्ञानस्वरूप नंदक खड्ग धारण करणारे नंदकी) • Cakrī (सुदर्शन चक्र धारण करणारे चक्री) • Śārṅga-dhanvā (शार्ङ्ग धनुष्य धारण करणारे शार्ङ्गधन्वा) • Gadādharaḥ (बुद्धितत्त्वरूप कौमोदकी गदा धारण करणारे गदाधर) • Rathāṅga-pāṇiḥ (हातात चक्र धारण करणारे रथांगपाणी) • Akṣobhyaḥ (कशानेही विचलित न होणारे अक्षोभ्य) • Sarva-praharaṇāyudhaḥ (भक्तांच्या रक्षणासाठी सर्व प्रकारची आयुधे असलेले सर्वप्रहरणायुध)", "names": [{"name": "Śaṅkhabhṛt", "meaning": "Bears conch Pāñcajanya (Tāmasāhaṃkāra).", "idx": 993, "marathi": "पांचजन्य शंख धारण करणारे शंखभृत्"}, {"name": "Nandakī", "meaning": "Holds sword Nandaka (spiritual illumination).", "idx": 994, "marathi": "ज्ञानस्वरूप नंदक खड्ग धारण करणारे नंदकी"}, {"name": "Cakrī", "meaning": "Bears discus Sudarśana (Rājasāhaṃkāra).", "idx": 995, "marathi": "सुदर्शन चक्र धारण करणारे चक्री"}, {"name": "Śārṅga-dhanvā", "meaning": "Wields the Śārṅga bow.", "idx": 996, "marathi": "शार्ङ्ग धनुष्य धारण करणारे शार्ङ्गधन्वा"}, {"name": "Gadādharaḥ", "meaning": "Holds mace Kaumodakī (intellect).", "idx": 997, "marathi": "बुद्धितत्त्वरूप कौमोदकी गदा धारण करणारे गदाधर"}, {"name": "Rathāṅga-pāṇiḥ", "meaning": "Holds the wheel (Cakra).", "idx": 998, "marathi": "हातात चक्र धारण करणारे रथांगपाणी"}, {"name": "Akṣobhyaḥ", "meaning": "Unperturbed, controlling all weapons.", "idx": 999, "marathi": "कशानेही विचलित न होणारे अक्षोभ्य"}, {"name": "Sarva-praharaṇāyudhaḥ", "meaning": "Whose arsenal of protective weapons is unlimited.", "idx": 1000, "marathi": "भक्तांच्या रक्षणासाठी सर्व प्रकारची आयुधे असलेले सर्वप्रहरणायुध"}]}, {"id": "stotram-108", "section": "stotram", "num": "108", "slokaNum": 108, "label": "Śloka 108", "speaker": "Concluding Protection Śloka", "start": 1805, "end": 1842, "sanskrit": "वनमाली गदी शार्ङ्गी शङ्खी चक्री च नन्दकी ।\nश्रीमान् नारायणो विष्णुर्वासुदेवोऽभिरक्षतु ॥ १०८ ॥\nश्री वासुदेवोऽभिरक्षतु ॐ नम इति ।", "iast": "vanamālī gadī śārṅgī śaṅkhī cakrī ca nandakī,\nśrīmān nārāyaṇo viṣṇur vāsudevo 'bhirakṣatu.\nśrī vāsudevo 'bhirakṣatu oṃ nama iti.", "meaning": "May the glorious Lord Nārāyaṇa protect us – He who wears the forest garland (Vanamālā), who bears the mace (Gadā), the bow Śārṅga, the conch (Śaṅkha), the discus (Cakra) and the sword Nandaka, and who is known as Viṣṇu and Vāsudeva. (Chanted three times in traditional Pārāyaṇam.)", "meaningMarathi": "वनमाळा धारण करणारे, गदा, शार्ङ्ग धनुष्य, शंख, चक्र आणि नंदक खड्ग धारण करणारे श्रीमान नारायण, विष्णू, भगवान वासुदेव आमचे सर्वतोपरी रक्षण करोत. (पारंपरिक पारायणात हा श्लोक तीन वेळा म्हटला जातो.)", "names": []}, {"id": "phala-1", "section": "phala", "num": "1", "label": "Phalaśruti 1", "speaker": "Phalaśruti", "start": 1848, "end": 1860, "sanskrit": "इतीदं कीर्तनीयस्य केशवस्य महात्मनः ।\nनाम्नां सहस्रं दिव्यानामशेषेण प्रकीर्तितम् ॥ १ ॥", "iast": "itīdaṃ kīrtanīyasya keśavasya mahātmanaḥ,\nnāmnāṃ sahasraṃ divyānām aśeṣeṇa prakīrtitam.", "meaning": "Bhīṣma said: Thus, the thousand divine names of the great-souled Keśava, which are worthy of being praised, have been sung in their entirety.", "meaningMarathi": "भीष्म म्हणाले – अशा प्रकारे कीर्तनास योग्य अशा महात्मा केशवांच्या दिव्य सहस्रनामांचे संपूर्णपणे वर्णन केले आहे."}, {"id": "phala-2", "section": "phala", "num": "2", "label": "Phalaśruti 2", "speaker": "Phalaśruti", "start": 1860, "end": 1872, "sanskrit": "य इदं शृणुयान्नित्यं यश्चापि परिकीर्तयेत् ।\nनाशुभं प्राप्नुयात्किञ्चित्सोऽमुत्रेह च मानवः ॥ २ ॥", "iast": "ya idaṃ śṛṇuyān nityaṃ yaś cāpi parikīrtayet,\nnāśubhaṃ prāpnuyāt kiñcit so 'mutreha ca mānavaḥ.", "meaning": "That person who hears this daily or recites it shall not meet with any evil or inauspiciousness either in this world or in the next.", "meaningMarathi": "जो मनुष्य हे स्तोत्र नित्य ऐकतो किंवा पठण करतो, त्याला इहलोकात किंवा परलोकात कधीही कोणतेही अशुभ प्राप्त होत नाही."}, {"id": "phala-3", "section": "phala", "num": "3", "label": "Phalaśruti 3", "speaker": "Phalaśruti", "start": 1872, "end": 1885, "sanskrit": "वेदान्तगो ब्राह्मणः स्यात्क्षत्रियो विजयी भवेत् ।\nवैश्यो धनसमृद्धः स्याच्छूद्रः सुखमवाप्नुयात् ॥ ३ ॥", "iast": "vedāntago brāhmaṇaḥ syāt kṣatriyo vijayī bhavet,\nvaiśyo dhanasamṛddhaḥ syāc chūdraḥ sukham avāpnuyāt.", "meaning": "A Brāhmaṇa will attain mastery over the Vedas; a Kṣatriya will become victorious; a Vaiśya will become wealthy and prosperous; and a Śūdra will attain happiness.", "meaningMarathi": "याच्या पठणाने ब्राह्मण वेदान्तज्ञ होतो, क्षत्रिय विजयी होतो, वैश्य धनसमृद्ध होतो आणि शूद्र सुख प्राप्त करतो."}, {"id": "phala-4", "section": "phala", "num": "4", "label": "Phalaśruti 4", "speaker": "Phalaśruti", "start": 1885, "end": 1900, "sanskrit": "धर्मार्थी प्राप्नुयाद्धर्ममर्थार्थी चार्थमाप्नुयात् ।\nकामानवाप्नुयात्कामी प्रजार्थी प्राप्नुयात्प्रजाम् ॥ ४ ॥", "iast": "dharmārthī prāpnuyād dharmam arthārthī cārtham āpnuyāt,\nkāmān avāpnuyāt kāmī prajārthī prāpnuyāt prajām.", "meaning": "He who desires righteousness (Dharma) will attain righteousness; he who desires wealth will acquire wealth; he who seeks pleasures will enjoy all pleasures; and he who desires progeny will be blessed with offspring.", "meaningMarathi": "धर्माची इच्छा करणाऱ्याला धर्म, अर्थाची इच्छा करणाऱ्याला धन, कामाची इच्छा करणाऱ्याला इष्ट भोग आणि प्रजेची इच्छा करणाऱ्याला संतान प्राप्त होते."}, {"id": "phala-5", "section": "phala", "num": "5", "label": "Phalaśruti 5", "speaker": "Phalaśruti", "start": 1900, "end": 1913, "sanskrit": "भक्तिमान् यः सदोत्थाय शुचिस्तद्गतमानसः ।\nसहस्रं वासुदेवस्य नाम्नामेतत्प्रकीर्तयेत् ॥ ५ ॥", "iast": "bhaktimān yaḥ sadotthāya śucis tadgatamānasaḥ,\nsahasraṃ vāsudevasya nāmnām etat prakīrtayet.", "meaning": "The devoted person who, rising early in the morning and purifying himself, recites these thousand names of Vāsudeva with a mind fully absorbed in Him...", "meaningMarathi": "जो भक्तिमान मनुष्य दररोज प्रातःकाळी उठून, शुचिर्भूत होऊन, वासुदेवाच्या ठिकाणी चित्त एकाग्र करून या सहस्रनामांचे पठण करतो..."}, {"id": "phala-6", "section": "phala", "num": "6", "label": "Phalaśruti 6", "speaker": "Phalaśruti", "start": 1913, "end": 1926, "sanskrit": "यशः प्राप्नोति विपुलं ज्ञातिप्राधान्यमेव च ।\nअचलां श्रियमाप्नोति श्रेयः प्राप्नोत्यनुत्तमम् ॥ ६ ॥", "iast": "yaśaḥ prāpnoti vipulaṃ jñātiprādhānyam eva ca,\nacalāṃ śriyam āpnoti śreyaḥ prāpnoty anuttamam.", "meaning": "...attains immense fame and leadership among his kinsmen. He acquires steady, unshakeable wealth and achieves the supreme, unsurpassed good.", "meaningMarathi": "...त्याला विपुल यश आणि स्वजनांमध्ये श्रेष्ठत्व प्राप्त होते; त्याला अचल लक्ष्मी (संपत्ती) आणि परम कल्याण प्राप्त होते."}, {"id": "phala-7", "section": "phala", "num": "7", "label": "Phalaśruti 7", "speaker": "Phalaśruti", "start": 1926, "end": 1938, "sanskrit": "न भयं क्वचिदाप्नोति वीर्यं तेजश्च विन्दति ।\nभवत्यरोगो द्युतिमान्बलरूपगुणान्वितः ॥ ७ ॥", "iast": "na bhayaṃ kvacid āpnoti vīryaṃ tejaś ca vindati,\nbhavaty arogo dyutimān balarūpaguṇānvitaḥ.", "meaning": "He never encounters fear from any quarter; he gains exceptional valour and vitality. He remains free from diseases, radiant, and endowed with strength, beauty, and noble virtues.", "meaningMarathi": "त्याला कोठेही भय राहत नाही, त्याला पराक्रम व तेज प्राप्त होते; तो निरोगी, तेजस्वी, बलवान, रूपवान व गुणसंपन्न होतो."}, {"id": "phala-8", "section": "phala", "num": "8", "label": "Phalaśruti 8", "speaker": "Phalaśruti", "start": 1938, "end": 1951, "sanskrit": "रोगार्तो मुच्यते रोगाद्बद्धो मुच्येत बन्धनात् ।\nभयान्मुच्येत भीतस्तु मुच्येतापन्न आपदः ॥ ८ ॥", "iast": "rogārto mucyate rogād baddho mucyeta bandhanāt,\nbhayān mucyeta bhītas tu mucyetāpanna āpadaḥ.", "meaning": "One who is afflicted by disease is freed from sickness; one who is bound is liberated from captivity; one who is terrified is released from fear; and one facing a crisis is delivered from adversity.", "meaningMarathi": "रोगपीडित मनुष्य रोगातून मुक्त होतो, बद्ध मनुष्य बंधनातून मुक्त होतो, भयभीत भयातून मुक्त होतो आणि संकटात सापडलेला आपत्तीतून मुक्त होतो."}, {"id": "phala-9", "section": "phala", "num": "9", "label": "Phalaśruti 9", "speaker": "Phalaśruti", "start": 1951, "end": 1962, "sanskrit": "दुर्गाण्यतितरत्याशु पुरुषः पुरुषोत्तमम् ।\nस्तुवन्नामसहस्रेण नित्यं भक्तिसमन्वितः ॥ ९ ॥", "iast": "durgāṇy atitaraty āśu puruṣaḥ puruṣottamam,\nstuvan nāmasahasreṇa nityaṃ bhaktisamanvitaḥ.", "meaning": "A person quickly crosses over difficulties by praising the Supreme Person with a thousand names, ever accompanied by devotion.", "meaningMarathi": "नित्य भक्तिभावाने या सहस्रनामांनी पुरुषोत्तमाची स्तुती करणारा मनुष्य सर्व संकटांवर शीघ्रतेने मात करतो."}, {"id": "phala-10", "section": "phala", "num": "10", "label": "Phalaśruti 10", "speaker": "Phalaśruti", "start": 1962, "end": 1974, "sanskrit": "वासुदेवाश्रयो मर्त्यो वासुदेवपरायणः ।\nसर्वपापविशुद्धात्मा याति ब्रह्म सनातनम् ॥ १० ॥", "iast": "vāsudevāśrayo martyo vāsudevaparāyaṇaḥ,\nsarvapāpaviśuddhātmā yāti brahma sanātanam.", "meaning": "That mortal who takes refuge in Vāsudeva and considers Vāsudeva as the highest goal becomes completely purified of all sins and attains the eternal Brahman.", "meaningMarathi": "वासुदेवाचा आश्रय घेणारा आणि वासुदेवपरायण असलेला मनुष्य सर्व पापांपासून शुद्ध होऊन सनातन ब्रह्मपदास प्राप्त होतो."}, {"id": "phala-11", "section": "phala", "num": "11", "label": "Phalaśruti 11", "speaker": "Phalaśruti", "start": 1974, "end": 1986, "sanskrit": "न वासुदेवभक्तानामशुभं विद्यते क्वचित् ।\nजन्ममृत्युजराव्याधिभयं नैवोपजायते ॥ ११ ॥", "iast": "na vāsudevabhaktānām aśubhaṃ vidyate kvacit,\njanmamṛtyujarāvyādhibhayaṃ naivopajāyate.", "meaning": "There is nothing inauspicious for the devotees of Vāsudeva. They are not afraid of birth, death, old age or disease.", "meaningMarathi": "वासुदेवाच्या भक्तांना कधीही कोणतेही अशुभ घडत नाही; त्यांना जन्म, मृत्यू, वार्धक्य आणि व्याधी यांचे भय राहत नाही."}, {"id": "phala-12", "section": "phala", "num": "12", "label": "Phalaśruti 12", "speaker": "Phalaśruti", "start": 1986, "end": 1998, "sanskrit": "इमं स्तवमधीयानः श्रद्धाभक्तिसमन्वितः ।\nयुज्येतात्मसुखक्षान्तिश्रीधृतिस्मृतिकीर्तिभिः ॥ १२ ॥", "iast": "imaṃ stavam adhīyānaḥ śraddhābhaktisamanvitaḥ,\nyujyetātmasukha-kṣānti-śrī-dhṛti-smṛti-kīrtibhiḥ.", "meaning": "One who studies this hymn with sincere faith and devotion becomes endowed with inner happiness, forgiveness, prosperity, fortitude, memory, and enduring fame.", "meaningMarathi": "श्रद्धा व भक्तीने या स्तोत्राचे अध्ययन करणारा मनुष्य आत्मसुख, क्षमाशीलता, ऐश्वर्य, धैर्य, स्मृती आणि कीर्ती यांनी युक्त होतो."}, {"id": "phala-13", "section": "phala", "num": "13", "label": "Phalaśruti 13", "speaker": "Phalaśruti", "start": 1998, "end": 2011, "sanskrit": "न क्रोधो न च मात्सर्यं न लोभो नाशुभा मतिः ।\nभवन्ति कृतपुण्यानां भक्तानां पुरुषोत्तमे ॥ १३ ॥", "iast": "na krodho na ca mātsaryaṃ na lobho nāśubhā matiḥ,\nbhavanti kṛtapuṇyānāṃ bhaktānāṃ puruṣottame.", "meaning": "Neither anger, nor malice, nor greed, nor unrighteous thoughts arise in the minds of those highly meritorious devotees who are completely devoted to Puruṣottama.", "meaningMarathi": "पुरुषोत्तमाच्या पुण्यवान भक्तांच्या मनात क्रोध, मत्सर, लोभ किंवा अशुभ बुद्धी कधीही निर्माण होत नाही."}, {"id": "phala-14", "section": "phala", "num": "14", "label": "Phalaśruti 14", "speaker": "Phalaśruti", "start": 2011, "end": 2023, "sanskrit": "द्यौः सचन्द्रार्कनक्षत्रा खं दिशो भूर्महोदधिः ।\nवासुदेवस्य वीर्येण विधृतानि महात्मनः ॥ १४ ॥", "iast": "dyauḥ sacandrārkanakṣatrā khaṃ diśo bhūr mahodadhiḥ,\nvāsudevasya vīryeṇa vidhṛtāni mahātmanaḥ.", "meaning": "The firmament along with the moon, sun, and stars, the sky, the directions, the earth, and the great ocean are all sustained and held together by the supreme power of the high-souled Vāsudeva.", "meaningMarathi": "चंद्र-सूर्य व नक्षत्रांसह द्युलोक, आकाश, दिशा, पृथ्वी आणि महासागर हे सर्व महात्मा वासुदेवाच्या सामर्थ्यानेच धारण केलेले आहेत."}, {"id": "phala-15", "section": "phala", "num": "15", "label": "Phalaśruti 15", "speaker": "Phalaśruti", "start": 2023, "end": 2035, "sanskrit": "ससुरासुरगन्धर्वं सयक्षोरगराक्षसम् ।\nजगद्वशे वर्ततेदं कृष्णस्य सचराचरम् ॥ १५ ॥", "iast": "sasurāsuragandharvaṃ sayakṣoragarākṣasam,\njagadvaśe vartate 'daṃ kṛṣṇasya sacarācaram.", "meaning": "This entire universe, containing moving and non-moving entities, along with Devas, Asuras, Gandharvas, Yakṣas, Nāgas, and Rākṣasas, remains under the absolute control of Lord Kṛṣṇa.", "meaningMarathi": "देव, असुर, गंधर्व, यक्ष, नाग आणि राक्षस यांच्यासह हे संपूर्ण चराचर जग भगवान श्रीकृष्णांच्या अधीन आहे."}, {"id": "phala-16", "section": "phala", "num": "16", "label": "Phalaśruti 16", "speaker": "Phalaśruti", "start": 2035, "end": 2048, "sanskrit": "इन्द्रियाणि मनो बुद्धिः सत्त्वं तेजो बलं धृतिः ।\nवासुदेवात्मकान्याहुः क्षेत्रं क्षेत्रज्ञ एव च ॥ १६ ॥", "iast": "indriyāṇi mano buddhiḥ sattvaṃ tejo balaṃ dhṛtiḥ,\nvāsudevātmakāny āhuḥ kṣetraṃ kṣetrajña eva ca.", "meaning": "The senses, mind, intellect, being (sattva), splendour, strength, and fortitude, as well as the body (Kṣetra) and the individual soul (Kṣetrajña), are all declared to have Vāsudeva as their inner essence.", "meaningMarathi": "इंद्रिये, मन, बुद्धी, सत्त्व, तेज, बल, धैर्य तसेच शरीर (क्षेत्र) आणि आत्मा (क्षेत्रज्ञ) हे सर्व वासुदेवस्वरूपच आहेत असे ज्ञानी सांगतात."}, {"id": "phala-17", "section": "phala", "num": "17", "label": "Phalaśruti 17", "speaker": "Phalaśruti", "start": 2048, "end": 2060, "sanskrit": "सर्वागमानामाचारः प्रथमं परिकल्प्यते ।\nआचारप्रभवो धर्मो धर्मस्य प्रभुरच्युतः ॥ १७ ॥", "iast": "sarvāgamānām ācāraḥ prathamaṃ parikalpyate,\nācāraprabhavo dharmo dharmasya prabhur acyutaḥ.", "meaning": "Conduct (ācāra) is considered the foremost of all sacred traditions. Righteousness (Dharma) springs from righteous conduct, and Lord Acyuta is the supreme master of all Dharma.", "meaningMarathi": "सर्व शास्त्रांचा मूळ आधार सदाचार आहे; सदाचारातून धर्म निर्माण होतो आणि भगवान अच्युत हेच धर्माचे प्रभू आहेत."}, {"id": "phala-18", "section": "phala", "num": "18", "label": "Phalaśruti 18", "speaker": "Phalaśruti", "start": 2060, "end": 2071, "sanskrit": "ऋषयः पितरो देवा महाभूतानि धातवः ।\nजङ्गमाजङ्गमं चेदं जगन्नारायणोद्भवम् ॥ १८ ॥", "iast": "ṛṣayaḥ pitaro devā mahābhūtāni dhātavaḥ,\njaṅgamājaṅgamaṃ cedaṃ jagan nārāyaṇodbhavam.", "meaning": "The celestial sages, the ancestors (Pitṛs), the gods, the primordial elements, the bodily constituents, and this entire universe of moving and stationary objects have all originated from Nārāyaṇa.", "meaningMarathi": "ऋषी, पितर, देव, पंचमहाभूते, धातू आणि हे संपूर्ण चराचर जग भगवान नारायणापासूनच उत्पन्न झाले आहे."}, {"id": "phala-19", "section": "phala", "num": "19", "label": "Phalaśruti 19", "speaker": "Phalaśruti", "start": 2071, "end": 2085, "sanskrit": "योगो ज्ञानं तथा साङ्ख्यं विद्याः शिल्पादि कर्म च ।\nवेदाः शास्त्राणि विज्ञानमेतत्सर्वं जनार्दनात् ॥ १९ ॥", "iast": "yogo jñānaṃ tathā sāṅkhyaṃ vidyāḥ śilpādi karma ca,\nvedāḥ śāstrāṇi vijñānam etat sarvaṃ janārdanāt.", "meaning": "Yoga, knowledge (Jñāna), Sāṅkhya philosophy, sciences, arts, crafts, the Vedas, the sacred scriptures, and experiential wisdom—all these emanate from Lord Janārdana.", "meaningMarathi": "योग, ज्ञान, सांख्यशास्त्र, सर्व विद्या, शिल्पादी कर्मे, वेद, शास्त्रे आणि विज्ञान हे सर्व भगवान जनार्दनापासूनच प्रकट झाले आहे."}, {"id": "phala-20", "section": "phala", "num": "20", "label": "Phalaśruti 20", "speaker": "Phalaśruti", "start": 2085, "end": 2099, "sanskrit": "एको विष्णुर्महद्भूतं पृथग्भूतान्यनेकशः ।\nत्रींल्लोकान्व्याप्य भूतात्मा भुङ्क्ते विश्वभुगव्ययः ॥ २० ॥", "iast": "eko viṣṇur mahadbhūtaṃ pṛthagbhūtāny anekaśaḥ,\ntrīn lokān vyāpya bhūtātmā bhuṅkte viśvabhug avyayaḥ.", "meaning": "The one all-pervading Lord Viṣṇu is the great reality behind all distinct beings. Pervading the three worlds as the inner soul of all, the inexhaustible enjoyer of the universe experiences all creation.", "meaningMarathi": "एकच सर्वव्यापी भगवान विष्णू अनेक प्राणिमात्रांच्या रूपात असलेले महद्भूत आहेत; ते तिन्ही लोकांत व्यापून सर्वांचे अंतरात्मा म्हणून अविनाशी भोक्ता आहेत."}, {"id": "phala-21", "section": "phala", "num": "21", "label": "Phalaśruti 21", "speaker": "Phalaśruti", "start": 2099, "end": 2111, "sanskrit": "इमं स्तवं भगवतो विष्णोर्व्यासेन कीर्तितम् ।\nपठेद्य इच्छेत्पुरुषः श्रेयः प्राप्तुं सुखानि च ॥ २१ ॥", "iast": "imaṃ stavaṃ bhagavato viṣṇor vyāsena kīrtitam,\npaṭhed ya icchet puruṣaḥ śreyaḥ prāptuṃ sukhāni ca.", "meaning": "Any person who desires to attain ultimate welfare, prosperity, and happiness should recite this hymn of Lord Viṣṇu, composed and sung by Sage Vyāsa.", "meaningMarathi": "कल्याण आणि सुख प्राप्त करण्याची इच्छा असलेल्या मनुष्याने व्यासमुनींनी गायलेल्या भगवान विष्णूंच्या या स्तोत्राचे पठण करावे."}, {"id": "phala-22", "section": "phala", "num": "22", "label": "Phalaśruti 22", "speaker": "Phalaśruti", "start": 2111, "end": 2127, "sanskrit": "विश्वेश्वरमजं देवं जगतः प्रभवाप्ययम् ।\nभजन्ति ये पुष्कराक्षं न ते यान्ति पराभवम् ॥ २२ ॥\nन ते यान्ति पराभवं ॐ नम इति ।", "iast": "viśveśvaram ajaṃ devaṃ jagataḥ prabhavāpyayam,\nbhajanti ye puṣkarākṣaṃ na te yānti parābhavam.\nna te yānti parābhavam oṃ nama iti.", "meaning": "Those who worship the lotus-eyed, unborn Lord of the universe, who is the source and dissolution of everything and who is inexhaustible, never encounter defeat or humiliation. Om Namah.", "meaningMarathi": "विश्वेश्वर, अजन्मा, जगाच्या उत्पत्ती-लयाचे कारण आणि अविनाशी अशा कमलनयन श्रीविष्णूंचे जे भजन करतात, त्यांचा कधीही पराभव होत नाही."}, {"id": "phala-23", "section": "phala", "num": "23", "label": "Phalaśruti 23", "speaker": "Arjuna uvāca", "start": 2127, "end": 2142, "sanskrit": "अर्जुन उवाच –\nपद्मपत्रविशालाक्ष पद्मनाभ सुरोत्तम ।\nभक्तानामनुरक्तानां त्राता भव जनार्दन ॥ २३ ॥", "iast": "arjuna uvāca –\npadmapatraviśālākṣa padmanābha surottama,\nbhaktānām anuraktānāṃ trātā bhava janārdana.", "meaning": "Arjuna said: O Lord with large eyes like lotus petals, O Padmanābha, O best of gods! Be the saviour of Your deeply attached and loving devotees, O Janārdana.", "meaningMarathi": "अर्जुन म्हणाले – हे कमलदलाप्रमाणे विशाल नेत्र असलेल्या पद्मनाभा, सुरोत्तमा जनार्दना! तुझ्यावर अनन्य प्रेम करणाऱ्या भक्तांचा तू रक्षक हो."}, {"id": "phala-24", "section": "phala", "num": "24", "label": "Phalaśruti 24", "speaker": "Śrī Bhagavān uvāca", "start": 2142, "end": 2161, "sanskrit": "श्रीभगवानुवाच –\nयो मां नामसहस्रेण स्तोतुमिच्छति पाण्डव ।\nसोऽहमेकेन श्लोकेन स्तुत एव न संशयः ॥ २४ ॥\nस्तुत एव न संशय ॐ नम इति ।", "iast": "śrī bhagavān uvāca –\nyo māṃ nāmasahasreṇa stotum icchati pāṇḍava,\nso 'ham ekena ślokena stuta eva na saṃśayaḥ.\nstuta eva na saṃśaya oṃ nama iti.", "meaning": "The Blessed Lord said: O Arjuna (son of Pāṇḍu)! If someone desires to praise Me with the full thousand names, let him know that I am equally pleased and praised by the recitation of just a single stanza. There is absolutely no doubt about this.", "meaningMarathi": "श्रीभगवान म्हणाले – हे पांडवा! जो मनुष्य सहस्रनामांनी माझी स्तुती करू इच्छितो, त्याची एका श्लोकाने केलेली स्तुतीही सहस्रनामांइतकीच मला मान्य होते, यात शंका नाही."}, {"id": "phala-25", "section": "phala", "num": "25", "label": "Phalaśruti 25", "speaker": "Vyāsa uvāca", "start": 2161, "end": 2180, "sanskrit": "व्यास उवाच –\nवासनाद्वासुदेवस्य वासितं भुवनत्रयम् ।\nसर्वभूतनिवासोऽसि वासुदेव नमोऽस्तु ते ॥ २५ ॥\nश्री वासुदेव नमोऽस्तु ते ॐ नम इति ।", "iast": "vyāsa uvāca –\nvāsanād vāsudevasya vāsitaṃ bhuvanatrayam,\nsarvabhūtanivāso 'si vāsudeva namo 'stu te.\nśrī vāsudeva namo 'stu te oṃ nama iti.", "meaning": "Sage Vyāsa said: Because Vāsudeva pervades everything, the three worlds are permeated by Him. You are the dwelling place of all living beings – O Vāsudeva, salutations to You.", "meaningMarathi": "व्यास म्हणाले – वासुदेवाच्या सर्वत्र वास्तव्यामुळे तिन्ही लोक व्यापलेले आहेत. हे वासुदेवा, तू सर्व भूतांचे निवासस्थान आहेस; तुला माझा नमस्कार असो."}, {"id": "phala-26", "section": "phala", "num": "26", "label": "Phalaśruti 26", "speaker": "Pārvatyuvāca", "start": 2180, "end": 2195, "sanskrit": "पार्वत्युवाच –\nकेनोपायेन लघुना विष्णोर्नामसहस्रकम् ।\nपठ्यते पण्डितैर्नित्यं श्रोतुमिच्छाम्यहं प्रभो ॥ २६ ॥", "iast": "pārvatyuvāca –\nkenopāyena laghunā viṣṇor nāmasahasrakam,\npaṭhyate paṇḍitair nityaṃ śrotum icchāmy ahaṃ prabho.", "meaning": "Goddess Pārvatī said: O Lord, I wish to hear how the learned scholars daily recite these thousand names of Lord Viṣṇu by some brief and easy method.", "meaningMarathi": "पार्वती म्हणाल्या – हे प्रभू! विद्वान पंडित कोणत्या सोप्या व लघु उपायाने नित्य श्रीविष्णूंचे सहस्रनाम पठण करतात, हे ऐकण्याची माझी इच्छा आहे."}, {"id": "phala-27", "section": "phala", "num": "27", "label": "Phalaśruti 27", "speaker": "Īśvara uvāca", "start": 2195, "end": 2236, "sanskrit": "ईश्वर उवाच –\nश्रीराम राम रामेति रमे रामे मनोरमे ।\nसहस्रनाम तत्तुल्यं रामनाम वरानने ॥ २७ ॥\nश्रीरामनाम वरानन ॐ नम इति ।", "iast": "īśvara uvāca –\nśrīrāma rāma rāmeti rame rāme manorame,\nsahasranāma tat tulyaṃ rāmanāma varānane.\nśrīrāmanāma varānana oṃ nama iti.", "meaning": "Lord Śiva (Īśvara) replied: O beautiful-faced one! I delight in chanting the sweet name of 'Rāma, Rāma, Rāma,' which gladdens the mind. Chanting the single holy name of 'Rāma' is completely equivalent to reciting the entire thousand names of Lord Viṣṇu.", "meaningMarathi": "भगवान शिव म्हणाले – हे सुंदर मुखकमल असलेल्या पार्वती! मी 'श्रीराम, राम, राम' असे जपत मनोहर रामनामात रममाण होतो. एक रामनाम हे संपूर्ण विष्णुसहस्रनामाच्या बरोबरीचे आहे."}, {"id": "phala-28", "section": "phala", "num": "28", "label": "Phalaśruti 28", "speaker": "Brahmovāca", "start": 2236, "end": 2260, "sanskrit": "ब्रह्मोवाच –\nनमोऽस्त्वनन्ताय सहस्रमूर्तये सहस्रपादाक्षिशिरोरुबाहवे ।\nसहस्रनाम्ने पुरुषाय शाश्वते सहस्रकोटियुगधारिणे नमः ॥ २८ ॥\nश्री सहस्रकोटियुगधारिणे नम ॐ नम इति ।", "iast": "brahmovāca –\nnamo 'stv anantāya sahasramūrtaye sahasrapādākṣiśirorubāhave,\nsahasranāmne puruṣāya śāśvate sahasrakoṭiyugadhāriṇe namaḥ.\nśrī sahasrakoṭiyugadhāriṇe nama oṃ nama iti.", "meaning": "Lord Brahmā said: Salutations to the Infinite Being, who possesses thousands of cosmic forms, thousands of feet, eyes, heads, thighs, and arms. Salutations to the eternal Supreme Person who is praised by a thousand names, and who upholds countless cosmic cycles.", "meaningMarathi": "ब्रह्मदेव म्हणाले – अनंत, सहस्रमूर्ती, सहस्रचरण-नेत्र-मस्तक-बाहू असलेल्या, सहस्रनाम, शाश्वत पुरुष आणि सहस्रकोटी युगे धारण करणाऱ्या परमात्म्याला माझा नमस्कार असो."}, {"id": "phala-29", "section": "phala", "num": "29", "label": "Phalaśruti 29", "speaker": "Sañjaya uvāca", "start": 2260, "end": 2276, "sanskrit": "सञ्जय उवाच –\nयत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः ।\nतत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम ॥ २९ ॥", "iast": "sañjaya uvāca –\nyatra yogeśvaraḥ kṛṣṇo yatra pārtho dhanurdharaḥ,\ntatra śrīr vijayo bhūtir dhruvā nītir matir mama.", "meaning": "Sañjaya said: Wherever there is Kṛṣṇa, the supreme Lord of Yoga, and wherever there is Arjuna, the wielder of the bow, there will certainly be opulence, victory, extraordinary prosperity, and unswerving righteousness. This is my firm conviction.", "meaningMarathi": "संजय म्हणाले – जेथे योगेश्वर श्रीकृष्ण आहेत आणि जेथे धनुर्धारी अर्जुन आहे, तेथेच श्री (ऐश्वर्य), विजय, भूती (समृद्धी) आणि अचल नीती असते, हे माझे ठाम मत आहे."}, {"id": "phala-30", "section": "phala", "num": "30", "label": "Phalaśruti 30", "speaker": "Śrī Bhagavān uvāca", "start": 2276, "end": 2292, "sanskrit": "श्रीभगवानुवाच –\nअनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते ।\nतेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम् ॥ ३० ॥", "iast": "śrī bhagavān uvāca –\nananyāś cintayanto māṃ ye janāḥ paryupāsate,\nteṣāṃ nityābhiyuktānāṃ yogakṣemaṃ vahāmy aham.", "meaning": "The Supreme Lord said: For those people who worship Me with undivided devotion, meditating exclusively on Me, and who are perpetually attuned to Me, I personally carry and secure their spiritual and material welfare (Yoga and Kṣema).", "meaningMarathi": "श्रीभगवान म्हणाले – जे लोक अनन्य भावाने माझे चिंतन करून माझी उपासना करतात, त्या नित्ययुक्त भक्तांचा योगक्षेम मी स्वतः वाहतो."}, {"id": "phala-31", "section": "phala", "num": "31", "label": "Phalaśruti 31", "speaker": "Śrī Bhagavān uvāca", "start": 2292, "end": 2304, "sanskrit": "परित्राणाय साधूनां विनाशाय च दुष्कृताम् ।\nधर्मसंस्थापनार्थाय सम्भवामि युगे युगे ॥ ३१ ॥", "iast": "paritrāṇāya sādhūnāṃ vināśāya ca duṣkṛtām,\ndharmasaṃsthāpanārthāya sambhavāmi yuge yuge.", "meaning": "For the protection of the righteous, the total destruction of the wicked, and for the firm re-establishment of righteousness, I manifest myself age after age.", "meaningMarathi": "सज्जनांचे रक्षण करण्यासाठी, दुष्टांचा नाश करण्यासाठी आणि धर्माची पुनःस्थापना करण्यासाठी मी युगायुगांत अवतार घेतो."}, {"id": "phala-32", "section": "phala", "num": "32", "label": "Phalaśruti 32", "speaker": "Phalaśruti", "start": 2304, "end": 2321, "sanskrit": "आर्ताः विषण्णाः शिथिलाश्च भीताः घोरेषु च व्याधिषु वर्तमानाः ।\nसङ्कीर्त्य नारायणशब्दमात्रं विमुक्तदुःखाः सुखिनो भवन्ति ॥ ३२ ॥", "iast": "ārtāḥ viṣaṇṇāḥ śithilāś ca bhītāḥ ghoreṣu ca vyādhiṣu vartamānāḥ,\nsaṅkīrtya nārāyaṇaśabdamātraṃ vimuktaduḥkhāḥ sukhino bhavanti.", "meaning": "Those who are distressed, deeply dejected, physically broken, terrified, or suffering from severe diseases, become liberated from their suffering and attain supreme happiness by merely chanting the sacred name 'Nārāyaṇa'.", "meaningMarathi": "जे दुःखी, खिन्न, दुर्बल, भयभीत किंवा भयंकर व्याधींनी ग्रस्त आहेत, ते केवळ 'नारायण' या शब्दाचे संकीर्तन करून सर्व दुःखांतून मुक्त होऊन सुखी होतात."}, {"id": "phala-33", "section": "phala", "num": "33", "label": "Phalaśruti 33", "speaker": "Samarpaṇam & Kṣamā", "start": 2321, "end": 2360, "sanskrit": "कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना वा प्रकृतेः स्वभावात् ।\nकरोमि यद्यत् सकलं परस्मै नारायणायेति समर्पयामि ॥ ३३ ॥\nविसर्गबिन्दुमात्राणि पदपादाक्षराणि च ।\nन्यूनानि चातिरिक्तानि क्षमस्व पुरुषोत्तम ॥", "iast": "kāyena vācā manasendriyair vā buddhyātmanā vā prakṛteḥ svabhāvāt,\nkaromi yad yat sakalaṃ parasmai nārāyaṇāyeti samarpayāmi.\nvisargabindumātrāṇi padapādākṣarāṇi ca,\nnyūnāni cātiriktāni kṣamasva puruṣottama.", "meaning": "Whatever actions I perform with my body, speech, mind, senses, intellect, soul, or innate nature, I offer all of it to the Supreme (Nārāyaṇa). O Puruṣottama, please forgive any omissions or excesses in visargas, bindus, vowel lengths, words, or syllables during this recitation.", "meaningMarathi": "शरीर, वाणी, मन, इंद्रिये, बुद्धी, आत्मा किंवा प्रकृतीच्या स्वभावानुसार मी जे काही कर्म करतो, ते सर्व परब्रह्म नारायणाला समर्पित करतो. हे पुरुषोत्तमा, या पठणात विसर्ग, अनुस्वार, मात्रा, पद किंवा अक्षर यात काही कमी-जास्त झाले असल्यास मला क्षमा कर."}];
    const ORIGIN_STORY = [{"id": "origin-0", "badge": "Prologue • उत्पत्ती कथा", "titleMr": "श्री विष्णूसहस्रनाम स्तोत्र कसे झाले?", "titleEn": "How the Sacred Stotram Was Preserved", "meta": "Mahābhārata • Anuśāsana Parva, Ch. 135", "marathi": "श्री विष्णूसहस्रनाम स्तोत्र कसे झाले ते पाहू.\n\nमहाभारतातील अनुशासन पर्वातील १३५ वा अध्याय हा श्री विष्णू सहस्रनामाचा आहे. भीष्माचार्य जेव्हा शरपंजरीवर पडलेले होते तेव्हा श्रीकृष्णांनी धर्मराजास भीष्माचार्यांकडून धर्मविषयक ज्ञान घेण्यास सांगितले. सर्व पांडव श्रीकृष्णासह भीष्मांकडे आले. भीष्मांनी श्रीकृष्णास हात जोडून त्यांची स्तुती गायला सुरुवात केली. ती स्तुती इतकी मंत्रमुग्ध होती की सगळे भारावून ऐकत होते. जेव्हा स्तुती पूर्ण झाली तेव्हा भीष्मांनी श्रीकृष्णाचा जयघोष केला, तेव्हा सगळे भानावर आले. भीष्मांना नमस्कार केला व सगळे परत फिरले.\n\nयुधिष्ठिर म्हणाला, \"ही स्तुती कोणाच्या लक्षात कशी राहणार? लिहून ठेवायला हवी.\" त्याने तेथे आलेल्या प्रत्येकाला विचारले. जो तो म्हणू लागला – \"आम्ही ऐकण्यातच तल्लीन होतो. आता काय करायचं?\" सगळे श्रीकृष्णाकडे गेले व त्यास म्हणाले, \"तुला माहीत असेल तर तू सांग.\" श्रीकृष्ण म्हणाले, \"नाही, मी तर भीष्मपितामहांचे बोलणे ऐकण्यात गुंगलो होतो. एक भक्त माझी एवढी स्तुती गात होता ती ऐकत होतो.\" युधिष्ठिर म्हणाला, \"आता तूच मार्ग सुचव.\" श्रीकृष्ण म्हणाले, \"हे काम सहदेव करू शकेल.\"\n\nश्रीकृष्ण म्हणाले, \"सहदेवा, तू देवाधिदेव महादेवाची पूजा करून त्यांना प्रसन्न करून घेतले आहेस. त्यांनी तुला एक माळ दिली, जी तुझ्या गळ्यात आहे. त्या मण्यांवर सर्व कोरले आहे. ते तू पाहू शकशील व लिहून घेतील लेखनिक.\" सहदेवांनी शंकराची आराधना केली. त्यांना त्या माळेवर दिसू लागले व हे श्री विष्णू सहस्रनाम आपल्याला मिळाले. आता आपण सर्वजण मोबाईल-संगणकावर वाचतोय तसे खूप जुने तंत्रज्ञान आहे. आपली भारतीय संस्कृती महान आहे.", "english": "In the Anuśāsana Parva of the Mahābhārata, while Bhīṣma lay upon his bed of arrows, Śrī Kṛṣṇa urged Yudhiṣṭhira and the Pāṇḍavas to receive supreme dharma wisdom from him. Bhīṣma folded his hands before Kṛṣṇa and sang the thousand names with such spellbinding devotion that every listener—even Śrī Kṛṣṇa Himself, absorbed in His devotee's praise—forgot to record it.\n\nWhen Yudhiṣṭhira worried how humanity would remember the hymn, Kṛṣṇa pointed to Sahadeva, who wore a sacred mālā gifted by Lord Śiva. Through Mahādeva's grace, every syllable was inscribed upon the beads of that mālā; Sahadeva meditated upon Śiva, beheld the verses on the beads, and dictated them to scribes—preserving the Viṣṇu Sahasranāma for all ages."}, {"id": "origin-1", "badge": "Part 1 • भाग १", "titleMr": "महाभारत अनुशासन पर्व — भाग १", "titleEn": "Yudhiṣṭhira's Coronation, Cārvāka & Kṛṣṇa's Call", "meta": "Hastināpura → Kurukṣetra • Uttarāyaṇa", "marathi": "व्यास ऋषींनी युधिष्ठिरास पितामह भीष्मांकडून ज्ञान घे असे सांगितले. कृष्णाने त्यास सांगितले, \"व्यासांनी जे सांगितले आहे तेच कर. सर्वांच्या सुखासाठी तेच आवश्यक आहे.\" युधिष्ठिर आपल्या नगरात प्रवेशला. नागरिकांनी त्याचे स्वागत केले. चार्वाक हा दुर्योधनाचा मित्र ब्राह्मणाचे रूप घेऊन सर्व ब्राह्मणांच्या वतीने युधिष्ठिरास म्हणाला, \"तू आम्हाला राजा नकोस. तुझे हात आपल्या बांधवांच्या रक्ताने माखले आहेत.\" ते ऐकताच बाकीचे ब्राह्मण उठून चार्वाकाची निर्भत्सना करू लागले व त्यास ठार केले, आणि म्हणाले, \"युधिष्ठिरा, आम्हाला तूच राजा हवा आहेस, तुझे कल्याण होईल.\" चार्वाकाने खूप मोठे तप केले होते त्यामुळे त्यास अभय होते; त्याचा वध वाणीसंपन्न ब्राह्मणांकडून होईल असे ठरले होते.\n\nयुधिष्ठिर सिंहासनावर विराजमान झाला. कृष्णास प्रणाम करून म्हणाला की \"तुझ्यामुळेच मला राज्य परत मिळाले आहे\" व त्याने कृष्णाची स्तुती केली. भीम, अर्जुन, नकुल, सहदेव यांचेही गुणवर्णन करून त्यांना त्यांची सदने व स्थाने दिली.\n\nकृष्णाचे चिंतन पितामह भीष्म करत होते; कृष्ण त्या आनंदात तल्लीन झाला होता. कृष्णाने पितामह भीष्मांचे गुणवर्णन केले: \"भीष्म स्वर्गात गेल्यावर पृथ्वीची अवस्था चंद्र नाहीसा झालेल्या रात्रीसारखी होईल. म्हणून युधिष्ठिरा, अचाट पराक्रम करणाऱ्या गंगापुत्र भीष्मांकडे जाऊन चार विद्या, चार यज्ञ, चार आश्रम आणि सर्व राजधर्म यांविषयी प्रश्न कर. भीष्मांचा शेवट झाल्यानंतर या सर्व ज्ञानाचा लोप होईल, म्हणून लवकर जा.\"\n\nयुधिष्ठिर श्रीकृष्णास म्हणाला, \"तूही आमच्या बरोबर चल; पितामहांना परलोकी जाताना तुझे दर्शन व्हायला हवे.\" सारे जण आपापल्या रथात सज्ज होऊन पितामहांना भेटण्यास गेले. सूर्य उत्तरायणाकडे वळताच भीष्मांनी आपले चित्त एकाग्र केले. त्यांच्या सभोवती अनेक ऋषीगण होते. भीष्मांनी कृष्णाचे कृतीने, मनाने आणि वाणीने ध्यान केले व हात जोडून वासुदेवाचे स्तवन केले: \"आदिहीन व अंतहीन अशा श्रेष्ठ ब्रह्माचे ज्ञान देवांनाही होत नाही आणि ऋषीमुनींनाही होत नाही; त्या विधात्यालाच ते होते आणि त्याच्याकडूनच इतरांना होते.\" येथेच भीष्मांनी विष्णूसहस्रनाम म्हटले.", "english": "Guided by Sage Vyāsa and Śrī Kṛṣṇa, Yudhiṣṭhira entered Hastināpura, where the demon Cārvāka disguised as a Brāhmaṇa tried to curse him but was exposed and vanquished by the assembly of sages. After his coronation, Kṛṣṇa felt Bhīṣma's deep contemplation from afar and warned Yudhiṣṭhira: once Bhīṣma departs, the earth will be like a moonless night, losing a treasury of rājadharma and spiritual wisdom.\n\nYudhiṣṭhira invited Kṛṣṇa to accompany them so Bhīṣma could have His darśana. As the Sun turned toward Uttarāyaṇa amid gathered ṛṣis, Bhīṣma stilled his mind and began his supreme hymn of praise to Vāsudeva."}, {"id": "origin-2", "badge": "Part 2 • भाग २", "titleMr": "महाभारत अनुशासन पर्व — भाग २", "titleEn": "The Cosmic Puruṣa & Chaturvyūha", "meta": "Bhīṣma's Vision of Nārāyaṇa", "marathi": "हा भगवंत कोण आहे, त्याचा जन्म कोठून झाला हे देव, दानव, गंधर्व, यक्ष, राक्षस, पन्नग यांनाही समजत नाही. दोऱ्यात मणी ओवलेले असतात त्याप्रमाणे त्या भूतनाथाच्या ठिकाणी हे सर्व प्राणिमात्र सत्त्व, रज, तम या गुणांपासून निर्माण होऊन राहतात आणि त्यात एकरूप होतात. बळकट तंतूंच्या आधाराने पुष्पमाला स्थिर राहावी त्याप्रमाणे विश्वच ज्याचे शरीर आहे अशा विश्वकर्म्याच्या ठायी हे विश्व स्थिर राहते.\n\nसहस्र मस्तके, सहस्र पाद, सहस्र नेत्र, सहस्र हात व मुकुट आणि सहस्र मुखांनी झळकणाऱ्या या हरीला, नारायणाला विश्वाचे आधारस्थान मानले जाते. तो स्थूलांहून स्थूल, मोठ्यांहून मोठा, श्रेष्ठांहून श्रेष्ठ आहे. जीव, मन, अहंकार आणि ब्रह्म ही चार रूपे असलेल्या त्या देवाची वासुदेव, संकर्षण, प्रद्युम्न आणि अनिरुद्ध या नावांनी पूजा करतात.\n\nयज्ञातील अरणी ज्वलंत अग्नी निर्माण करते, त्याप्रमाणे देवकी देवीने पृथ्वीवरील ब्रह्माच्या संरक्षणासाठी वसुदेवापासून त्याला जन्म दिला. सर्व भेदांचा त्याग करून इच्छेपासून मुक्त असलेला भक्त निर्मळ गोविंदाला आपल्या हृदयात सूक्ष्म दृष्टीने पाहतो आणि मोक्ष प्राप्ती करून घेतो. पाण्यात जलचर संचार करतात त्याप्रमाणे त्याच्या ठिकाणी सर्व लोक संचार करतात. हे ऋत आणि एकाक्षर ब्रह्म सत् व असत् याच्या पलीकडचे आहे; त्याला आदि, अंत व मध्य नाही. दुःखावरील औषध म्हणून निग्रहपूर्वक याची पूजा करतात.", "english": "Even gods, sages, and celestial beings cannot fathom His origin. Like pearls strung on a thread, all beings woven of sattva, rajas, and tamas abide in Him. With thousand heads, eyes, and feet, He is the substratum of the cosmos, worshipped through the fourfold Vyūha—Vāsudeva, Saṅkarṣaṇa, Pradyumna, and Aniruddha.\n\nJust as sacred fire emerges from araṇi wood, He manifested through Devakī and Vasudeva to protect dharma. Beyond existence and non-existence, without beginning or end, He is the supreme medicine for all suffering."}, {"id": "origin-3", "badge": "Part 3 • भाग ३", "titleMr": "महाभारत अनुशासन पर्व — भाग ३", "titleEn": "Bhīṣma's Stavanarāja — Sūrya, Soma & Yajña", "meta": "Vedic Mantras & 17 Syllables of Homa", "marathi": "भीष्माचा स्तवनराज – जो सूर्यरूप परमात्मा सुवर्णाच्या वर्णाचा आहे, दैत्यांचा संहार करणारा आहे, अदितीपासून बारा रूपांत निर्माण झाला, त्याला माझा प्रणाम. जो सोमात्मक परमात्मा शुक्लपक्षात देवांना आणि कृष्णपक्षात पितरांना अमृताने संतुष्ट करतो तसेच जो द्विजातींचा राजा आहे, त्याला नमस्कार असो.\n\nघोर अंधाराच्या पलीकडे असलेल्या ज्या स्वयंज्योति पुरुषाचे ज्ञान झाल्यानंतर मानव मृत्यूच्याही पलीकडे जातो, त्या ज्ञेयस्वरूप परमात्म्याला मी वंदन करतो. ज्या वेदात्मक परमात्म्याचे बहुवृच ब्राह्मण बृहदुक्थ सामाच्या वेळी गायन करतात आणि महायज्ञात अग्निचयनाच्या वेळी गायन करतात, त्यास प्रणाम असो.\n\nजो ऋक्, यजुस्, साम यांच्या स्वरूपाचा आहे, जो पाच हविद्रव्यांच्या स्वरूपाचा आहे तसेच ज्यासाठी गायत्रीसारख्या छंदांचे गायन केले जाते, त्या यज्ञात्मक परमेश्वराला मी वंदन करतो. ज्या होमात्मक परमात्म्याचे हवन 'आश्रावय', 'अस्तु श्रौषट्', 'यज', 'ये यजामहे' आणि 'वषट्' अशा एकूण सतरा अक्षरांनी केले जाते, त्याला माझा प्रणाम असो.", "english": "Bhīṣma's Stavanarāja salutes the Supreme as the golden-hued twelve Ādityas, the nectar-giving Soma nourishing gods and ancestors, and the self-luminous Puruṣa beyond all darkness whose knowledge conquers death. He bows to the Lord embodied in the Ṛk, Yajus, and Sāma Vedas, the Gāyatrī metre, and the seventeen sacred syllables of Vedic fire-sacrifice."}, {"id": "origin-4", "badge": "Part 4 • भाग ४", "titleMr": "महाभारत अनुशासन पर्व — भाग ४", "titleEn": "Vāgātmaka Puruṣa, Varāha & the Bridge of Dharma", "meta": "Speech, Creation & Cosmic Rescue", "marathi": "जो यजु नामक वेदपुरुष आहे, गायत्री इत्यादी छंद ज्याचे अवयव आहेत आणि रथंतर व बृहत् ज्यांचे प्रीतिवाक्य आहे, त्या स्तोत्रात्मक परमात्म्याला मी वंदन करतो. जो हंसरूप परमात्मा विश्व निर्माण करणाऱ्या ऋषींच्या सहस्रवर्षे चाललेल्या यज्ञसत्रात सुवर्णमय पंख असलेल्या पक्ष्याच्या रूपात प्रकट झाला, त्याला मी नमस्कार करतो.\n\nज्या वागात्मक परमात्म्याला दिव्य अक्षर असे म्हणतात—पदे किंवा वाक्ये ज्याचे हातपाय आहेत, संधी ही ज्याची बोटे आहेत, स्वर आणि व्यंजने हे ज्याचे अलंकार आहेत—त्याला माझे वंदन असो. ज्याने यज्ञरूपी वराह होऊन त्रिभुवनाच्या कल्याणासाठी पृथ्वीचा उद्धार केला त्या सामर्थ्यात्मक विष्णूला मी प्रणाम करतो.\n\nजो योगाचा अवलंब करून सर्पाने सजवलेल्या आणि त्याच्या सहस्र फणांनी रचलेल्या शय्येवर शयन करतो, त्या निद्रास्वरूप परमात्म्याला माझा नमस्कार असो. जो सज्जनांना तरून जाण्यासाठी योगधर्माचा सेतू करतो त्या सत्यात्मक परमेश्वराला मी नमन करतो. विविध धर्मांनी आराधना करणाऱ्यांचा आश्रय असलेल्या धर्ममय विष्णूला आणि सर्व प्राण्यांच्या उत्पत्तीचे कारण असलेल्या कामस्वरूप परमात्म्याला मी वंदन करतो.", "english": "Bhīṣma bows to the golden-winged Haṃsa who appeared in the sages' thousand-year sacrifice, and to the Divine Word (Vāgātmaka Puruṣa) whose limbs are words, whose fingers are sandhis, and whose ornaments are vowels and consonants. He salutes the Cosmic Boar (Varāh     function cleanDevanagariForTTS(text) {
      return (text || '')
        .replace(/॥\s*[०-९0-9]+\s*॥/g, '।')
        .replace(/॥/g, '।')
        .replace(/\n+/g, ' । ')
        .trim();
    }

    function speakTextTTS(text, onDone) {
      if (!('speechSynthesis' in window)) {
        showToast('Speech synthesis unavailable in this browser.');
        return;
      }
      try { window.speechSynthesis.cancel(); } catch (e) {}
      const utter = new SpeechSynthesisUtterance(cleanDevanagariForTTS(text));
      const voice = pickSanskritVoice();
      if (voice) { utter.voice = voice; utter.lang = voice.lang; }
      else { utter.lang = 'hi-IN'; }
      utter.rate = Math.max(0.55, Math.min(1.3, state.playbackRate * 0.85));
      utter.onend = () => { if (onDone) onDone(); };
      utter.onerror = () => {
        state.isPlaying = false;
        state.playingVerseId = null;
        updatePlayerUI();
        updatePlayingHighlight();
      };
      window.speechSynthesis.speak(utter);
    }

    function speakSingleName(nameText, pillEl) {
      if (state.isPlaying) stopAllPlayback();
      document.querySelectorAll('.name-tile.speaking').forEach(el => el.classList.remove('speaking'));
      if (pillEl) pillEl.classList.add('speaking');
      speakTextTTS(nameText, () => {
        if (pillEl) pillEl.classList.remove('speaking');
      });
    }

    function playVerse(verseId) {
      const v = verseById[verseId];
      if (!v) return;
      if (state.isPlaying && state.playingVerseId === verseId) {
        stopAllPlayback();
        return;
      }
      stopAllPlayback();
      state.activeVerseId = verseId;
      state.playingVerseId = verseId;
      state.isPlaying = true;
      state.studied.add(verseId);
      persistState();
      updateProgressBadge();

      if (state.audioEngine === 'mp3') {
        const targetStart = Math.max(0, v.start + state.timeOffset);
        audioEl.playbackRate = state.playbackRate;
        try { audioEl.currentTime = targetStart; } catch (e) {}
        const p = audioEl.play();
        if (p && p.catch) {
          p.catch(() => {
            showToast('Using Sanskrit TTS fallback.');
            speakTextTTS(v.sanskrit, () => stopAllPlayback());
          });
        }
      } else {
        speakTextTTS(v.sanskrit, () => {
          if (!state.isPlaying || state.playingVerseId !== verseId) return;
          if (state.playbackMode === 'loop') {
            playVerse(verseId);
          } else if (state.playbackMode === 'continuous') {
            const list = getFilteredVerses();
            const pos = list.findIndex(x => x.id === verseId);
            if (pos >= 0 && pos < list.length - 1) {
              const nextV = list[pos + 1];
              state.activeVerseId = nextV.id;
              if (state.pageMode === 'chant' && state.viewMode === 'focus') renderMain();
              playVerse(nextV.id);
              scrollVerseIntoView(nextV.id);
            } else {
              stopAllPlayback();
            }
          } else {
            stopAllPlayback();
          }
        });
      }

      if (state.pageMode === 'chant' && state.viewMode === 'focus') renderMain();
      updatePlayerUI();
      updatePlayingHighlight();
    }

    audioEl.addEventListener('timeupdate', () => {
      const t = audioEl.currentTime;
      document.getElementById('timeCurrent').textContent = formatTime(t);
      document.getElementById('audioScrub').value = t;

      if (!state.isPlaying || !state.playingVerseId || state.audioEngine !== 'mp3') return;
      const cur = verseById[state.playingVerseId];
      if (!cur) return;

      const boundaryEnd = cur.end + state.timeOffset;
      if (state.playbackMode === 'single' && t >= boundaryEnd) {
        stopAllPlayback();
      } else if (state.playbackMode === 'loop' && t >= boundaryEnd) {
        audioEl.currentTime = Math.max(0, cur.start + state.timeOffset);
      } else if (state.playbackMode === 'continuous') {
        const adj = t - state.timeOffset;
        const matched = VERSES.find(v => adj >= v.start && adj < v.end);
        if (matched && matched.id !== state.playingVerseId) {
          state.playingVerseId = matched.id;
          state.activeVerseId = matched.id;
          state.studied.add(matched.id);
          persistState();
          updateProgressBadge();
          if (state.pageMode === 'chant') {
            if (matched.section !== state.activeSection && !state.searchQuery) {
              state.activeSection = matched.section;
              if (matched.section === 'stotram') state.stotramRange = 'all';
              renderAll();
            } else if (state.viewMode === 'focus') {
              renderMain();
            } else {
              updatePlayingHighlight();
            }
            scrollVerseIntoView(matched.id);
          }
          updatePlayerUI();
        }
      }
    });

    audioEl.addEventListener('loadedmetadata', () => {
      const dur = audioEl.duration || 2364;
      document.getElementById('audioScrub').max = dur;
      document.getElementById('timeTotal').textContent = formatTime(dur);
    });
    audioEl.addEventListener('ended', stopAllPlayback);

    function getFilteredVerses() {
      const q = stripDiacritics(state.searchQuery.trim());
      let list = VERSES;
      if (q) {
        list = list.filter(v => v._searchBlob.includes(q));
      } else {
        list = list.filter(v => v.section === state.activeSection);
        if (state.activeSection === 'stotram' && state.stotramRange !== 'all') {
          const [lo, hi] = state.stotramRange.split('-').map(Number);
          list = list.filter(v => v.slokaNum >= lo && v.slokaNum <= hi);
        }
      }
      if (state.onlyBookmarks) list = list.filter(v => state.bookmarks.has(v.id));
      return list;
    }

    function scrollVerseIntoView(verseId) {
      const el = document.querySelector('[data-verse-card="' + verseId + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function copyVerse(verseId) {
      const v = verseById[verseId];
      if (!v) return;
      const text = `${v.label} (${v.speaker})\n\n${v.sanskrit}\n\n${v.iast}\n\nमराठी अर्थ:\n${v.meaningMarathi}\n\nEnglish Meaning:\n${v.meaning}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied ' + v.label)).catch(() => fallbackCopy(text, v.label));
      } else {
        fallbackCopy(text, v.label);
      }
    }
    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('Copied ' + label); } catch (e) {}
      document.body.removeChild(ta);
    }

      document.getElementById('originLangGroup').addEventListener('click', (e) => {

        if (!b) return;
        state.meaningLang = b.getAttribute('data-origin-lang');
        persistState();
        renderAll();
      });
      const goPrev = () => { if (activeIdx > 0) { state.activeOriginId = ORIGIN_STORY[activeIdx - 1].id; renderOriginStory(); window.scrollTo({ top: 0, behavior: 'smooth' }); } };

      document.getElementById('originPrev').addEventListener('click', goPrev);
      document.getElementById('originNext').addEventListener('click', goNext);
      document.getElementById('originPrevBottom').addEventListener('click', goPrev);
      document.getElementById('originNextBottom').addEventListener('click', goNext);

      if (window.lucide) window.lucide.createIcons();
    }

    function renderVerseCard(v, isFocus) {
      const isPlayingThis = state.isPlaying && state.playingVerseId === v.id;
      const isBookmarked = state.bookmarks.has(v.id);
      const isStudied = state.studied.has(v.id);

      const showEn = state.meaningLang === 'both' || state.meaningLang === 'en';
      const showMr = state.meaningLang === 'both' || state.meaningLang === 'mr';

      let meaningHtml = '';
      if (hasNames) {
        const tiles = v.names.map(n => `
          <button type="button" data-speak-name="${escapeHtml(n.name)}" class="name-tile text-left rounded-2xl p-3.5 flex flex-col gap-1 cursor-pointer group">

      const eqHtml = `<span class="inline-flex items-end gap-[2px] h-3"><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span></span>`;

      return `

              <span class="px-2.5 py-1 rounded-full text-[11px] font-bold accent-pill">${escapeHtml(v.label)}</span>

            <div class="flex items-center gap-1">
              <button type="button" data-action="play" data-id="${v.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition ${isPlayingThis ? 'accent-pill shadow-sm' : 'soft-surface hover:bg-indigo-500/15'}">

          <!-- IAST -->
          ${state.showIast ? `
            <div class="text-xs sm:text-sm italic whitespace-pre-line mt-3 ${isFocus ? 'text-center' : ''}" style="color: var(--text-secondary);">
