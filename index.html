eaningMarathi": "Arciṣmān (ज्यांच्या किरणांनी सूर्य-चंद्र प्रकाशतात ते अर्चिष्मान) • Arcitaḥ (ब्रह्मादी देवांनीही पूजलेले अर्चित) • Kumbhaḥ (घटाप्रमाणे स्वतःत विश्व सामावून घेणारे कुंभ) • Viśuddhātmā (त्रिगुणांतीत शुद्ध आत्मस्वरूप विशुद्धात्मा) • Viśodhanaḥ (स्मरणानेच पापे धुणारे विशोधन) • Aniruddhaḥ (चतुर्व्यूहातील चौथे व अजेय अनिरुद्ध) • Aprati-rathaḥ (ज्यांना कोणीही तुल्यबळ शत्रू नाही असे अप्रतिरथ) • Pradyumnaḥ (श्रेष्ठ दिव्य ऐश्वर्य असलेले प्रद्युम्न) • Amitavikramaḥ (अमर्याद पराक्रमी अमितविक्रम)", "names": [{"name": "Arciṣmān", "meaning": "By whose rays the sun, moon and stars shine.", "idx": 633, "marathi": "ज्यांच्या किरणांनी सूर्य-चंद्र प्रकाशतात ते अर्चिष्मान"}, {"name": "Arcitaḥ", "meaning": "Worshipped by Brahmā and other Devas.", "idx": 634, "marathi": "ब्रह्मादी देवांनीही पूजलेले अर्चित"}, {"name": "Kumbhaḥ", "meaning": "Contains everything within Himself.", "idx": 635, "marathi": "घटाप्रमाणे स्वतःत विश्व सामावून घेणारे कुंभ"}, {"name": "Viśuddhātmā", "meaning": "Pure spirit above the three Guṇas.", "idx": 636, "marathi": "त्रिगुणांतीत शुद्ध आत्मस्वरूप विशुद्धात्मा"}, {"name": "Viśodhanaḥ", "meaning": "Destroys all sins by mere remembrance.", "idx": 637, "marathi": "स्मरणानेच पापे धुणारे विशोधन"}, {"name": "Aniruddhaḥ", "meaning": "Last of the four Vyūhas; unobstructed by foes.", "idx": 638, "marathi": "चतुर्व्यूहातील चौथे व अजेय अनिरुद्ध"}, {"name": "Aprati-rathaḥ", "meaning": "Having no equal antagonist.", "idx": 639, "marathi": "ज्यांना कोणीही तुल्यबळ शत्रू नाही असे अप्रतिरथ"}, {"name": "Pradyumnaḥ", "meaning": "Of superior sacred wealth; one of the four Vyūhas.", "idx": 640, "marathi": "श्रेष्ठ दिव्य ऐश्वर्य असलेले प्रद्युम्न"}, {"name": "Amitavikramaḥ", "meaning": "Of unlimited prowess.", "idx": 641, "marathi": "अमर्याद पराक्रमी अमितविक्रम"}]}, {"id": "stotram-69", "section": "stotram", "num": "69", "slokaNum": 69, "label": "Śloka 69", "speaker": "Names 642–650", "start": 1330, "end": 1342, "sanskrit": "कालनेमिनिहा वीरः शौरिः शूरजनेश्वरः ।\nत्रिलोकात्मा त्रिलोकेशः केशवः केशिहा हरिः ॥ ६९ ॥", "iast": "kālaneminihā vīraḥ śauriḥ śūrajaneśvaraḥ,\ntrilokātmā trilokeśaḥ keśavaḥ keśihā hariḥ.", "meaning": "Kālanemi-nihā – Destroyer of the Asura Kālanemi. Vīraḥ – Courageous and valiant. Śauriḥ – Born in the clan of Śūra as Kṛṣṇa. Śūrajaneśvaraḥ – Controls even great powers like Indra. Trilokātmā – Inner soul of the three worlds. Trilokeśaḥ – Commander of everything in the three worlds. Keśavaḥ – Source of the sun's rays of light. Keśihā – Destroyer of the Asura Keśi. Hariḥ – Destroys Saṃsāra along with ignorance.", "meaningMarathi": "Kālanemi-nihā (कालनेमी असुराचा वध करणारे) • Vīraḥ (महापराक्रमी वीर) • Śauriḥ (शूर कुळात जन्मलेले श्रीकृष्ण शौरि) • Śūrajaneśvaraḥ (इंद्रादी शूरांचेही स्वामी शूरजनेश्वर) • Trilokātmā (तिन्ही लोकांचे अंतरात्मा त्रिलोकात्मा) • Trilokeśaḥ (त्रैलोक्याचे नियंत्रक त्रिलोकेश) • Keśavaḥ (सूर्यकिरणांचे उगमस्थान केशव) • Keśihā (केशी असुराचा नाश करणारे केशिहा) • Hariḥ (अज्ञानासह संसारबंध हरणारे हरी)", "names": [{"name": "Kālanemi-nihā", "meaning": "Destroyer of the Asura Kālanemi.", "idx": 642, "marathi": "कालनेमी असुराचा वध करणारे"}, {"name": "Vīraḥ", "meaning": "Courageous and valiant.", "idx": 643, "marathi": "महापराक्रमी वीर"}, {"name": "Śauriḥ", "meaning": "Born in the clan of Śūra as Kṛṣṇa.", "idx": 644, "marathi": "शूर कुळात जन्मलेले श्रीकृष्ण शौरि"}, {"name": "Śūrajaneśvaraḥ", "meaning": "Controls even great powers like Indra.", "idx": 645, "marathi": "इंद्रादी शूरांचेही स्वामी शूरजनेश्वर"}, {"name": "Trilokātmā", "meaning": "Inner soul of the three worlds.", "idx": 646, "marathi": "तिन्ही लोकांचे अंतरात्मा त्रिलोकात्मा"}, {"name": "Trilokeśaḥ", "meaning": "Commander of everything in the three worlds.", "idx": 647, "marathi": "त्रैलोक्याचे नियंत्रक त्रिलोकेश"}, {"name": "Keśavaḥ", "meaning": "Source of the sun's rays of light.", "idx": 648, "marathi": "सूर्यकिरणांचे उगमस्थान केशव"}, {"name": "Keśihā", "meaning": "Destroyer of the Asura Keśi.", "idx": 649, "marathi": "केशी असुराचा नाश करणारे केशिहा"}, {"name": "Hariḥ", "meaning": "Destroys Saṃsāra along with ignorance.", "idx": 650, "marathi": "अज्ञानासह संसारबंध हरणारे हरी"}]}, {"id": "stotram-70", "section": "stotram", "num": "70", "slokaNum": 70, "label": "Śloka 70", "speaker": "Names 651–660", "start": 1342, "end": 1355, "sanskrit": "कामदेवः कामपालः कामी कान्तः कृतागमः ।\nअनिर्देश्यवपुर्विष्णुर्वीरोऽनन्तो धनञ्जयः ॥ ७० ॥", "iast": "kāmadevaḥ kāmapālaḥ kāmī kāntaḥ kṛtāgamaḥ,\nanirdeśyavapur viṣṇur vīro 'nanto dhanañjayaḥ.", "meaning": "Kāmadevaḥ – Desired by seekers of the four values of life. Kāmapālaḥ – Protects and fulfils righteous desires. Kāmī – All His desires are perpetually satisfied. Kāntaḥ – Of great beauty; effects dissolution of Brahmā. Kṛtāgamaḥ – Author of Śruti, Smṛti and Āgama. Anirdeśya-vapuḥ – Form beyond the Guṇas. Viṣṇuḥ – Whose brilliance spreads over sky and earth. Vīraḥ – Of heroic movement and action. Anantaḥ – Eternal, all-pervading, limitless. Dhanañjayaḥ – Arjuna, glorious manifestation of the Lord.", "meaningMarathi": "Kāmadevaḥ (चार पुरुषार्थ इच्छिणाऱ्यांना प्रिय कामदेव) • Kāmapālaḥ (धर्माचरण करणाऱ्यांच्या कामना पूर्ण करणारे कामपाल) • Kāmī (नित्य पूर्णकाम कामी) • Kāntaḥ (अत्यंत सुंदर रूप असलेले कांत) • Kṛtāgamaḥ (श्रुती, स्मृती व आगम यांचे निर्माते कृतागम) • Anirdeśya-vapuḥ (गुणातीत अनिर्देश्यवपू) • Viṣṇuḥ (द्यावापृथ्वीवर तेज पसरवणारे विष्णू) • Vīraḥ (वीरगती व पराक्रम असलेले वीर) • Anantaḥ (देश-कालातीत अनंत) • Dhanañjayaḥ (अर्जुनरूपाने विभूती असलेले धनंजय)", "names": [{"name": "Kāmadevaḥ", "meaning": "Desired by seekers of the four values of life.", "idx": 651, "marathi": "चार पुरुषार्थ इच्छिणाऱ्यांना प्रिय कामदेव"}, {"name": "Kāmapālaḥ", "meaning": "Protects and fulfils righteous desires.", "idx": 652, "marathi": "धर्माचरण करणाऱ्यांच्या कामना पूर्ण करणारे कामपाल"}, {"name": "Kāmī", "meaning": "All His desires are perpetually satisfied.", "idx": 653, "marathi": "नित्य पूर्णकाम कामी"}, {"name": "Kāntaḥ", "meaning": "Of great beauty; effects dissolution of Brahmā.", "idx": 654, "marathi": "अत्यंत सुंदर रूप असलेले कांत"}, {"name": "Kṛtāgamaḥ", "meaning": "Author of Śruti, Smṛti and Āgama.", "idx": 655, "marathi": "श्रुती, स्मृती व आगम यांचे निर्माते कृतागम"}, {"name": "Anirdeśya-vapuḥ", "meaning": "Form beyond the Guṇas.", "idx": 656, "marathi": "गुणातीत अनिर्देश्यवपू"}, {"name": "Viṣṇuḥ", "meaning": "Whose brilliance spreads over sky and earth.", "idx": 657, "marathi": "द्यावापृथ्वीवर तेज पसरवणारे विष्णू"}, {"name": "Vīraḥ", "meaning": "Of heroic movement and action.", "idx": 658, "marathi": "वीरगती व पराक्रम असलेले वीर"}, {"name": "Anantaḥ", "meaning": "Eternal, all-pervading, limitless.", "idx": 659, "marathi": "देश-कालातीत अनंत"}, {"name": "Dhanañjayaḥ", "meaning": "Arjuna, glorious manifestation of the Lord.", "idx": 660, "marathi": "अर्जुनरूपाने विभूती असलेले धनंजय"}]}, {"id": "stotram-71", "section": "stotram", "num": "71", "slokaNum": 71, "label": "Śloka 71", "speaker": "Names 661–670", "start": 1355, "end": 1369, "sanskrit": "ब्रह्मण्यो ब्रह्मकृद् ब्रह्मा ब्रह्म ब्रह्मविवर्धनः ।\nब्रह्मविद् ब्राह्मणो ब्रह्मी ब्रह्मज्ञो ब्राह्मणप्रियः ॥ ७१ ॥", "iast": "brahmaṇyo brahmakṛd brahmā brahma brahmavivardhanaḥ,\nbrahmavid brāhmaṇo brahmī brahmajño brāhmaṇapriyaḥ.", "meaning": "Brahmaṇyaḥ – Promoter of Vedas, Brāhmaṇas and knowledge. Brahmakṛt – Performer of Tapas (austerity). Brahmā – Creator of everything. Brahma – Vast, all-expanding Truth, Knowledge and Infinity. Brahma-vivardhanaḥ – Promotes austerity and spiritual disciplines. Brahmavid – Knower of the Vedas and their meaning. Brāhmaṇaḥ – Instructs the world in Vedic injunctions. Brahmī – In whom Tapas, Veda, mind and Prāṇa are established. Brahmajñaḥ – Knower of Brahman. Brāhmaṇapriyaḥ – Dear to holy men.", "meaningMarathi": "Brahmaṇyaḥ (वेद, ब्राह्मण व ज्ञानाचे पोषक ब्रह्मण्य) • Brahmakṛt (तप (ब्रह्म) आचरणारे ब्रह्मकृत्) • Brahmā (विश्वाचे निर्माते ब्रह्मा) • Brahma (सत्य-ज्ञान-अनंत स्वरूप ब्रह्म) • Brahma-vivardhanaḥ (तप व साधना वाढवणारे ब्रह्मविवर्धन) • Brahmavid (वेदांचे मर्म जाणणारे ब्रह्मवित्) • Brāhmaṇaḥ (ब्राह्मणरूपाने वेदोपदेश करणारे ब्राह्मण) • Brahmī (तप, वेद व प्राणांचे आश्रयस्थान ब्रह्मी) • Brahmajñaḥ (ब्रह्मस्वरूप जाणणारे ब्रह्मज्ञ) • Brāhmaṇapriyaḥ (ब्राह्मणांना व साधकांना अत्यंत प्रिय ब्राह्मणप्रिय)", "names": [{"name": "Brahmaṇyaḥ", "meaning": "Promoter of Vedas, Brāhmaṇas and knowledge.", "idx": 661, "marathi": "वेद, ब्राह्मण व ज्ञानाचे पोषक ब्रह्मण्य"}, {"name": "Brahmakṛt", "meaning": "Performer of Tapas (austerity).", "idx": 662, "marathi": "तप (ब्रह्म) आचरणारे ब्रह्मकृत्"}, {"name": "Brahmā", "meaning": "Creator of everything.", "idx": 663, "marathi": "विश्वाचे निर्माते ब्रह्मा"}, {"name": "Brahma", "meaning": "Vast, all-expanding Truth, Knowledge and Infinity.", "idx": 664, "marathi": "सत्य-ज्ञान-अनंत स्वरूप ब्रह्म"}, {"name": "Brahma-vivardhanaḥ", "meaning": "Promotes austerity and spiritual disciplines.", "idx": 665, "marathi": "तप व साधना वाढवणारे ब्रह्मविवर्धन"}, {"name": "Brahmavid", "meaning": "Knower of the Vedas and their meaning.", "idx": 666, "marathi": "वेदांचे मर्म जाणणारे ब्रह्मवित्"}, {"name": "Brāhmaṇaḥ", "meaning": "Instructs the world in Vedic injunctions.", "idx": 667, "marathi": "ब्राह्मणरूपाने वेदोपदेश करणारे ब्राह्मण"}, {"name": "Brahmī", "meaning": "In whom Tapas, Veda, mind and Prāṇa are established.", "idx": 668, "marathi": "तप, वेद व प्राणांचे आश्रयस्थान ब्रह्मी"}, {"name": "Brahmajñaḥ", "meaning": "Knower of Brahman.", "idx": 669, "marathi": "ब्रह्मस्वरूप जाणणारे ब्रह्मज्ञ"}, {"name": "Brāhmaṇapriyaḥ", "meaning": "Dear to holy men.", "idx": 670, "marathi": "ब्राह्मणांना व साधकांना अत्यंत प्रिय ब्राह्मणप्रिय"}]}, {"id": "stotram-72", "section": "stotram", "num": "72", "slokaNum": 72, "label": "Śloka 72", "speaker": "Names 671–678", "start": 1369, "end": 1381, "sanskrit": "महाक्रमो महाकर्मा महातेजा महोरगः ।\nमहाक्रतुर्महायज्वा महायज्ञो महाहविः ॥ ७२ ॥", "iast": "mahākramo mahākarmā mahātejā mahoragaḥ,\nmahākratur mahāyajvā mahāyajño mahāhaviḥ.", "meaning": "Mahākramaḥ – One with enormous strides. Mahākarmā – Performer of great cosmic works. Mahātejāḥ – Source of brilliance of the sun and luminaries. Mahoragaḥ – The great serpent Ādiśeṣa. Mahākratuḥ – The great Kratu (sacrifice). Mahāyajvā – Performer of sacrifices for the world's good. Mahāyajñaḥ – The great Yajña itself. Mahāhaviḥ – The universe offered as oblation into the fire of Brahman.", "meaningMarathi": "Mahākramaḥ (विशाल पावले टाकणारे महाक्रम) • Mahākarmā (जगन्निर्मितीसारखी महान कर्मे करणारे महाकर्मा) • Mahātejāḥ (सूर्यादी तेजांचे उगमस्थान महातेजा) • Mahoragaḥ (महान शेषनाग रूप महोरग) • Mahākratuḥ (महान क्रतू (यज्ञ) स्वरूप) • Mahāyajvā (लोककल्याणासाठी यज्ञ करणारे महायज्वा) • Mahāyajñaḥ (स्वतः महायज्ञ स्वरूप) • Mahāhaviḥ (ब्रह्मरूप अग्नीत अर्पण केलेले विश्वरूप महाहवी)", "names": [{"name": "Mahākramaḥ", "meaning": "One with enormous strides.", "idx": 671, "marathi": "विशाल पावले टाकणारे महाक्रम"}, {"name": "Mahākarmā", "meaning": "Performer of great cosmic works.", "idx": 672, "marathi": "जगन्निर्मितीसारखी महान कर्मे करणारे महाकर्मा"}, {"name": "Mahātejāḥ", "meaning": "Source of brilliance of the sun and luminaries.", "idx": 673, "marathi": "सूर्यादी तेजांचे उगमस्थान महातेजा"}, {"name": "Mahoragaḥ", "meaning": "The great serpent Ādiśeṣa.", "idx": 674, "marathi": "महान शेषनाग रूप महोरग"}, {"name": "Mahākratuḥ", "meaning": "The great Kratu (sacrifice).", "idx": 675, "marathi": "महान क्रतू (यज्ञ) स्वरूप"}, {"name": "Mahāyajvā", "meaning": "Performer of sacrifices for the world's good.", "idx": 676, "marathi": "लोककल्याणासाठी यज्ञ करणारे महायज्वा"}, {"name": "Mahāyajñaḥ", "meaning": "The great Yajña itself.", "idx": 677, "marathi": "स्वतः महायज्ञ स्वरूप"}, {"name": "Mahāhaviḥ", "meaning": "The universe offered as oblation into the fire of Brahman.", "idx": 678, "marathi": "ब्रह्मरूप अग्नीत अर्पण केलेले विश्वरूप महाहवी"}]}, {"id": "stotram-73", "section": "stotram", "num": "73", "slokaNum": 73, "label": "Śloka 73", "speaker": "Names 679–689", "start": 1381, "end": 1393, "sanskrit": "स्तव्यः स्तवप्रियः स्तोत्रं स्तुतिः स्तोता रणप्रियः ।\nपूर्णः पूरयिता पुण्यः पुण्यकीर्तिरनामयः ॥ ७३ ॥", "iast": "stavyaḥ stavapriyaḥ stotraṃ stutiḥ stotā raṇapriyaḥ,\npūrṇaḥ pūrayitā puṇyaḥ puṇyakīrtir anāmayaḥ.", "meaning": "Stavyaḥ – Object of laudations by all. Stava-priyaḥ – Pleased with hymns of praise. Stotraṃ – The hymn proclaiming the Lord's glory. Stutiḥ – The act of glorification. Stotā – Himself the singer of praise. Raṇapriyaḥ – Fond of battle for protecting the world. Pūrṇaḥ – Self-fulfilled source of all powers. Pūrayitā – Gives all fulfillments to others. Puṇyaḥ – Hearing of whom erases all sins. Puṇyakīrtiḥ – Of holy fame conferring merit. Anāmayaḥ – Free from all internal or external disease.", "meaningMarathi": "Stavyaḥ (सर्वांनी स्तुती करण्यास योग्य स्तव्य) • Stava-priyaḥ (स्तुतीप्रिय स्तवप्रिय) • Stotraṃ (भगवंताची कीर्ती गाणारे स्तोत्र) • Stutiḥ (स्तुतीक्रिया स्वरूप) • Stotā (स्तुती गाणारे स्वतः स्तोता) • Raṇapriyaḥ (विश्वरक्षणासाठी युद्धप्रिय रणप्रिय) • Pūrṇaḥ (सर्व गुणांनी परिपूर्ण पूर्ण) • Pūrayitā (इतरांच्या इच्छा पूर्ण करणारे पूरयिता) • Puṇyaḥ (श्रवणानेच पापे हरणारे पुण्य) • Puṇyakīrtiḥ (पावन कीर्ती असलेले पुण्यकीर्ती) • Anāmayaḥ (अंतर्बाह्य व्याधींपासून मुक्त अनामय)", "names": [{"name": "Stavyaḥ", "meaning": "Object of laudations by all.", "idx": 679, "marathi": "सर्वांनी स्तुती करण्यास योग्य स्तव्य"}, {"name": "Stava-priyaḥ", "meaning": "Pleased with hymns of praise.", "idx": 680, "marathi": "स्तुतीप्रिय स्तवप्रिय"}, {"name": "Stotraṃ", "meaning": "The hymn proclaiming the Lord's glory.", "idx": 681, "marathi": "भगवंताची कीर्ती गाणारे स्तोत्र"}, {"name": "Stutiḥ", "meaning": "The act of glorification.", "idx": 682, "marathi": "स्तुतीक्रिया स्वरूप"}, {"name": "Stotā", "meaning": "Himself the singer of praise.", "idx": 683, "marathi": "स्तुती गाणारे स्वतः स्तोता"}, {"name": "Raṇapriyaḥ", "meaning": "Fond of battle for protecting the world.", "idx": 684, "marathi": "विश्वरक्षणासाठी युद्धप्रिय रणप्रिय"}, {"name": "Pūrṇaḥ", "meaning": "Self-fulfilled source of all powers.", "idx": 685, "marathi": "सर्व गुणांनी परिपूर्ण पूर्ण"}, {"name": "Pūrayitā", "meaning": "Gives all fulfillments to others.", "idx": 686, "marathi": "इतरांच्या इच्छा पूर्ण करणारे पूरयिता"}, {"name": "Puṇyaḥ", "meaning": "Hearing of whom erases all sins.", "idx": 687, "marathi": "श्रवणानेच पापे हरणारे पुण्य"}, {"name": "Puṇyakīrtiḥ", "meaning": "Of holy fame conferring merit.", "idx": 688, "marathi": "पावन कीर्ती असलेले पुण्यकीर्ती"}, {"name": "Anāmayaḥ", "meaning": "Free from all internal or external disease.", "idx": 689, "marathi": "अंतर्बाह्य व्याधींपासून मुक्त अनामय"}]}, {"id": "stotram-74", "section": "stotram", "num": "74", "slokaNum": 74, "label": "Śloka 74", "speaker": "Names 690–698", "start": 1393, "end": 1404, "sanskrit": "मनोजवस्तीर्थकरो वसुरेता वसुप्रदः ।\nवसुप्रदो वासुदेवो वसुर्वसुमना हविः ॥ ७४ ॥", "iast": "manojavas tīrthakaro vasuretā vasupradaḥ,\nvasuprado vāsudevo vasur vasumanā haviḥ.", "meaning": "Manojavaḥ – Endowed with speed like the mind. Tīrthakaraḥ – Source of all sacred knowledge. Vasu-retāḥ – Whose creative essence is golden. Vasupradaḥ (1) – Master and bestower of wealth. Vasupradaḥ (2) – Bestower of the highest wealth, Mokṣa. Vāsudevaḥ – Son of Vasudeva. Vasuḥ – In whom all creation dwells. Vasumanāḥ – Whose mind dwells equally in all things. Haviḥ – The sacrificial oblation.", "meaningMarathi": "Manojavaḥ (मनाप्रमाणे वेगवान मनोजव) • Tīrthakaraḥ (सर्व पवित्र विद्यांचे जनक तीर्थकर) • Vasu-retāḥ (सुवर्णमय सृजनशक्ती असलेले वसुरेता) • Vasupradaḥ (1) (विपुल संपत्ती देणारे वसुप्रद (१)) • Vasupradaḥ (2) (मोक्षरूपी सर्वश्रेष्ठ धन देणारे वसुप्रद (२)) • Vāsudevaḥ (वसुदेवांचे पुत्र वासुदेव) • Vasuḥ (संपूर्ण सृष्टी ज्यांच्यात राहते ते वसू) • Vasumanāḥ (सर्वत्र समबुद्धी ठेवणारे वसुमना) • Haviḥ (यज्ञातील हविर्द्रव्य रूप हवी)", "names": [{"name": "Manojavaḥ", "meaning": "Endowed with speed like the mind.", "idx": 690, "marathi": "मनाप्रमाणे वेगवान मनोजव"}, {"name": "Tīrthakaraḥ", "meaning": "Source of all sacred knowledge.", "idx": 691, "marathi": "सर्व पवित्र विद्यांचे जनक तीर्थकर"}, {"name": "Vasu-retāḥ", "meaning": "Whose creative essence is golden.", "idx": 692, "marathi": "सुवर्णमय सृजनशक्ती असलेले वसुरेता"}, {"name": "Vasupradaḥ (1)", "meaning": "Master and bestower of wealth.", "idx": 693, "marathi": "विपुल संपत्ती देणारे वसुप्रद (१)"}, {"name": "Vasupradaḥ (2)", "meaning": "Bestower of the highest wealth, Mokṣa.", "idx": 694, "marathi": "मोक्षरूपी सर्वश्रेष्ठ धन देणारे वसुप्रद (२)"}, {"name": "Vāsudevaḥ", "meaning": "Son of Vasudeva.", "idx": 695, "marathi": "वसुदेवांचे पुत्र वासुदेव"}, {"name": "Vasuḥ", "meaning": "In whom all creation dwells.", "idx": 696, "marathi": "संपूर्ण सृष्टी ज्यांच्यात राहते ते वसू"}, {"name": "Vasumanāḥ", "meaning": "Whose mind dwells equally in all things.", "idx": 697, "marathi": "सर्वत्र समबुद्धी ठेवणारे वसुमना"}, {"name": "Haviḥ", "meaning": "The sacrificial oblation.", "idx": 698, "marathi": "यज्ञातील हविर्द्रव्य रूप हवी"}]}, {"id": "stotram-75", "section": "stotram", "num": "75", "slokaNum": 75, "label": "Śloka 75", "speaker": "Names 699–707", "start": 1404, "end": 1416, "sanskrit": "सद्गतिः सत्कृतिः सत्ता सद्भूतिः सत्परायणः ।\nशूरसेनो यदुश्रेष्ठः सन्निवासः सुयामुनः ॥ ७५ ॥", "iast": "sadgatiḥ satkṛtiḥ sattā sadbhūtiḥ satparāyaṇaḥ,\nśūraseno yaduśreṣṭhaḥ sannivāsaḥ suyāmunaḥ.", "meaning": "Sadgatiḥ – Attained by the virtuous; of excellent intelligence. Satkṛtiḥ – Whose achievements protect the world. Sattā – Pure Being without differences. Sad-bhūtiḥ – Pure existence and consciousness. Satparāyaṇaḥ – Highest status attainable by the realized. Śūrasenaḥ – Having heroic warriors like Hanumān. Yaduśreṣṭhaḥ – Greatest among the Yadus. Sannivāsaḥ – Resort of holy knowing ones. Suyāmunaḥ – Surrounded by illustrious associates by the Yamunā.", "meaningMarathi": "Sadgatiḥ (सज्जनांचे परम गतीस्थान सद्गती) • Satkṛtiḥ (विश्वरक्षणाची सत्कृत्ये करणारे सत्कृती) • Sattā (शुद्ध अस्तित्वरूप सत्ता) • Sad-bhūtiḥ (सच्चिदानंद स्वरूप सद्भूती) • Satparāyaṇaḥ (तत्त्वज्ञ संतांचे परम आश्रयस् ave no limits. Darpahā – Subdues the pride of the unrighteous. Darpadaḥ – Endows the righteous with dignified self-respect. Dṛptaḥ – Ever satisfied in His inherent bliss. Durdharaḥ – Difficult to contain in the heart during meditation. Aparājitaḥ – Never conquered by inner or outer enemies.", "meaningMarathi": "Bhūtāvāsaḥ (सर्व प्राण्यांचे निवासस्थान भूतावास) • Vāsudevaḥ (मायेने संपूर्ण विश्व व्यापणारे वासुदेव) • Sarvāsunilayaḥ (सर्व प्राण्यांचे प्राण ज्यांच्यात लीन होतात ते सर्वासुनिलय) • Analaḥ (असीम ऐश्वर्य व सामर्थ्य असलेले अनल) • Darpahā (अधार्मिकांचा गर्व हरणारे दर्पहा) • Darpadaḥ (धार्मिकांना स्वाभिमान देणारे दर्पद) • Dṛptaḥ (स्वस्वरूपातील आनंदात सदैव तृप्त दृप्त) • Durdharaḥ (ध्यानात हृदयात धारण करण्यास कठीण दुर्धर) • Aparājitaḥ (आंतरिक व बाह्य शत्रूंना अजिंक्य अपराजित)", "names": [{"name": "Bhūtāvāsaḥ", "meaning": "In whom all beings dwell.", "idx": 708, "marathi": "सर्व प्राण्यांचे निवासस्थान भूतावास"}, {"name": "Vāsudevaḥ", "meaning": "Pervades the universe by Māyā.", "idx": 709, "marathi": "मायेने संपूर्ण विश्व व्यापणारे वासुदेव"}, {"name": "Sarvāsunilayaḥ", "meaning": "In whom the Prāṇa of all living beings dissolves.", "idx": 710, "marathi": "सर्व प्राण्यांचे प्राण ज्यांच्यात लीन होतात ते सर्वासुनिलय"}, {"name": "Analaḥ", "meaning": "Whose power and wealth have no limits.", "idx": 711, "marathi": "असीम ऐश्वर्य व सामर्थ्य असलेले अनल"}, {"name": "Darpahā", "meaning": "Subdues the pride of the unrighteous.", "idx": 712, "marathi": "अधार्मिकांचा गर्व हरणारे दर्पहा"}, {"name": "Darpadaḥ", "meaning": "Endows the righteous with dignified self-respect.", "idx": 713, "marathi": "धार्मिकांना स्वाभिमान देणारे दर्पद"}, {"name": "Dṛptaḥ", "meaning": "Ever satisfied in His inherent bliss.", "idx": 714, "marathi": "स्वस्वरूपातील आनंदात सदैव तृप्त दृप्त"}, {"name": "Durdharaḥ", "meaning": "Difficult to contain in the heart during meditation.", "idx": 715, "marathi": "ध्यानात हृदयात धारण करण्यास कठीण दुर्धर"}, {"name": "Aparājitaḥ", "meaning": "Never conquered by inner or outer enemies.", "idx": 716, "marathi": "आंतरिक व बाह्य शत्रूंना अजिंक्य अपराजित"}]}, {"id": "stotram-77", "section": "stotram", "num": "77", "slokaNum": 77, "label": "Śloka 77", "speaker": "Names 717–724", "start": 1428, "end": 1441, "sanskrit": "विश्वमूर्तिर्महामूर्तिर्दीप्तमूर्तिरमूर्तिमान् ।\nअनेकमूर्तिरव्यक्तः शतमूर्तिः शताननः ॥ ७७ ॥", "iast": "viśvamūrtir mahāmūrtir dīptamūrtir amūrtimān,\nanekamūrtir avyaktaḥ śatamūrtiḥ śatānanaḥ.", "meaning": "Viśvamūrtiḥ – Has the whole universe as His body. Mahāmūrtiḥ – Enormous form reclining on Ādiśeṣa. Dīptamūrtiḥ – Luminous form of knowledge. Amūrtimān – Without a body born of Karma. Anekamūrtiḥ – Assumes several incarnations to help the world. Avyaktaḥ – Cannot be clearly pointed to as 'This'. Śatamūrtiḥ – Assumes countless forms for cosmic purposes. Śatānanaḥ – With a hundred (countless) faces.", "meaningMarathi": "Viśvamūrtiḥ (संपूर्ण विश्वच ज्यांचे शरीर आहे असे विश्वमूर्ती) • Mahāmūrtiḥ (शेषशायी विशाल रूप महामूर्ती) • Dīptamūrtiḥ (ज्ञानमय तेजोमूर्ती दीप्तमूर्ती) • Amūrtimān (कर्मजन्य देहापासून मुक्त अमूर्तिमान) • Anekamūrtiḥ (लोककल्याणासाठी अनेक अवतार घेणारे अनेकमूर्ती) • Avyaktaḥ (इंद्रियांना अव्यक्त) • Śatamūrtiḥ (चैतन्यरूप असूनही अनेक रूपे घेणारे शतमूर्ती) • Śatānanaḥ (असंख्य मुखे असलेले शतानन)", "names": [{"name": "Viśvamūrtiḥ", "meaning": "Has the whole universe as His body.", "idx": 717, "marathi": "संपूर्ण विश्वच ज्यांचे शरीर आहे असे विश्वमूर्ती"}, {"name": "Mahāmūrtiḥ", "meaning": "Enormous form reclining on Ādiśeṣa.", "idx": 718, "marathi": "शेषशायी विशाल रूप महामूर्ती"}, {"name": "Dīptamūrtiḥ", "meaning": "Luminous form of knowledge.", "idx": 719, "marathi": "ज्ञानमय तेजोमूर्ती दीप्तमूर्ती"}, {"name": "Amūrtimān", "meaning": "Without a body born of Karma.", "idx": 720, "marathi": "कर्मजन्य देहापासून मुक्त अमूर्तिमान"}, {"name": "Anekamūrtiḥ", "meaning": "Assumes several incarnations to help the world.", "idx": 721, "marathi": "लोककल्याणासाठी अनेक अवतार घेणारे अनेकमूर्ती"}, {"name": "Avyaktaḥ", "meanin svāmī – Lord of all fourteen spheres. Trilokadhṛt – Supports all three worlds. Sumedhāḥ – Of great beneficent intelligence. Medhajaḥ – Arose from Yāga (sacrifice). Dhanyaḥ – Perfectly self-satisfied. Satyamedhāḥ – Whose intelligence always bears fruit. Dharādharaḥ – Supports the worlds through Ādiśeṣa.", "meaningMarathi": "Amānī (अहंकाररहित अमानी) • Mānadaḥ (भक्तांना सन्मान व कृपा देणारे मानद) • Mānyaḥ (सर्वांनी वंदनीय मान्य) • Lokasvāmī (चौदा भुवनांचे स्वामी लोकस्वामी) • Trilokadhṛt (तिन्ही लोकांचे धारणकर्ते त्रिलोकधृत्) • Sumedhāḥ (कल्याणकारी श्रेष्ठ बुद्धीचे सुमेधा) • Medhajaḥ (यज्ञातून प्रकट झालेले मेधज) • Dhanyaḥ (सदैव कृतार्थ धन्य) • Satyamedhāḥ (ज्यांची बुद्धी सदैव फलदायी असते असे सत्यमेधा) • Dharādharaḥ (शेषनागादी रूपांनी पृथ्वी धारण करणारे धराधर)", "names": [{"name": "Amānī", "meaning": "Free from egoic identification with non-self.", "idx": 747, "marathi": "अहंकाररहित अमानी"}, {"name": "Mānadaḥ", "meaning": "Bestows honour and grace upon devotees.", "idx": 748, "marathi": "भक्तांना सन्मान व कृपा देणारे मानद"}, {"name": "Mānyaḥ", "meaning": "To be adored by all.", "idx": 749, "marathi": "सर्वांनी वंदनीय मान्य"}, {"name": "Lokasvāmī", "meaning": "Lord of all fourteen spheres.", "idx": 750, "marathi": "चौदा भुवनांचे स्वामी लोकस्वामी"}, {"name": "Trilokadhṛt", "meaning": "Supports all three worlds.", "idx": 751, "marathi": "तिन्ही लोकांचे धारणकर्ते त्रिलोकधृत्"}, {"name": "Sumedhāḥ", "meaning": "Of great beneficent intelligence.", "idx": 752, "marathi": "कल्याणकारी श्रेष्ठ बुद्धीचे सुमेधा"}, {"name": "Medhajaḥ", "meaning": "Arose from Yāga (sacrifice).", "idx": 753, "marathi": "यज्ञातून प्रकट झालेले मेधज"}, {"name": "Dhanyaḥ", "meaning": "Perfectly self-satisfied.", "idx": 754, "marathi": "सदैव कृतार्थ धन्य"}, {"name": "Satyamedhāḥ", "meaning": "Whose intelligence always bears fruit.", "idx": 755, "marathi": "ज्यांची बुद्धी सदैव फलदायी असते असे सत्यमेधा"}, {"name": "Dharādharaḥ", "meaning": "Supports the worlds through Ādiśeṣa.", "idx": 756, "marathi": "शेषनाग x": 766, "marathi": "चतुर्भुज वासुदेव"}, {"name": "Caturvyūhaḥ", "meaning": "Four manifestations: Vāsudeva, Saṃkarṣaṇa, Pradyumna, Aniruddha.", "idx": 767, "marathi": "वासुदेव, संकर्षण, प्रद्युम्न व अनिरुद्ध हे चतुर्व्यूह"}, {"name": "Caturgatiḥ", "meaning": "Goal of the four Āśramas and Varṇas.", "idx": 768, "marathi": "चार आश्रम व वर्णांचे अंतिम ध्येय चतुर्गती"}, {"name": "Caturātmā", "meaning": "Free from attachment and limitation.", "idx": 769, "marathi": "रागद्वेषरहित चतुरात्मा"}, {"name": "Caturbhāvaḥ", "meaning": "Origin of Dharma, Artha, Kāma and Mokṣa.", "idx": 770, "marathi": "धर्म, अर्थ, काम व मोक्षाचे उगमस्थान चतुर्भाव"}, {"name": "Catur-vedavid", "meaning": "Understands the true meaning of the four Vedas.", "idx": 771, "marathi": "चारही वेदांचे मर्मज्ञ चतुर्वेदवित्"}, {"name": "Ekapāt", "meaning": "With a single transcendent manifestation.", "idx": 772, "marathi": "अद्वितीय एकाच पादात स्थित एकपात्"}]}, {"id": "stotram-83", "section": "stotram", "num": "83", "slokaNum": 83, "label": "Śloka 83", "speaker": "Names 773–781", "start": 1501, "end": 1513, "sanskrit": "समावर्तोऽनिवृत्तात्मा दुर्जयो दुरतिक्रमः ।\nदुर्लभो दुर्गमो दुर्गो दुरावासो दुरारिहा ॥ ८३ ॥", "iast": "samāvarto 'nivṛttātmā durjayo duratikramaḥ,\ndurlabho durgamo durgo durāvāso durārihā.", "meaning": "Samāvartaḥ – Whirls the wheel of Saṃsāra. Anivṛttātmā – All-pervading, never separated from anything. Durjayaḥ – Unconquerable. Duratikramaḥ – Whose command none dare oppose. Durlabhaḥ – Attained by hard-won Bhakti. Durgamaḥ – Difficult to attain. Durgaḥ – Attainment guarded by obstacles. Durāvāsaḥ – Brought into the heart by yogis in Samādhi with great effort. Durārihā – Destroyer of inimical Asuras.", "meaningMarathi": "Samāvartaḥ (संसारचक्र चालवणारे समावर्त) • Anivṛttātmā (सर्वव्यापी असल्याने कशापासूनही वेगळे नसलेले अनिवृत्तात्मा) • Durjayaḥ (जिंकण्यास अशक्य दुर्जय) • Duratikramaḥ (ज्यांच्या आज्ञेचे उल्लंघन कोणी करू शकत नाही असे दुरतिक्रम) • Durlabhaḥ (कठिण भक्तीनेच प्राप्त होणारे दुर्लभ) • Durgamaḥ (प्राप्त करण्यास कठीण दुर्गम) • Durgaḥ (अडथळ्यांमुळे अगम्य दुर्ग) • Durāvāsaḥ (योगी मोठ्या प्रयासाने हृदयात साठवतात असे दुरावास) • Durārihā (असुरांचा नाश करणारे दुरारिहा)", "names": [{"name": "Samāvartaḥ", "meaning": "Whirls the wheel of Saṃsāra.", "idx": 773, "marathi": "संसारचक्र चालवणारे समावर्त"}, {"name": "Anivṛttātmā", "meaning": "All-pervading, never separated from anything.", "idx": 774, "marathi": "सर्वव्यापी असल्याने कशापासूनही वेगळे नसलेले अनिवृत्तात्मा"}, {"name": "Durjayaḥ", "meaning": "Unconquerable.", "idx": 775, "marathi": "जिंकण्यास अशक्य दुर्जय"}, {"name": "Duratikramaḥ", "meaning": "Whose command none dare oppose.", "idx": 776, "marathi": "ज्यांच्या आज्ञेचे उल्लंघन कोणी करू शकत नाही असे दुरतिक्रम"}, {"name": "Durlabhaḥ", "meaning": "Attained by hard-won Bhakti.", "idx": 777, "marathi": "कठिण भक्तीनेच प्राप्त होणारे दुर्लभ"}, {"name": "Durgamaḥ", "meaning": "Difficult to attain.", "idx": 778, "marathi": "प्राप्त करण्यास कठीण दुर्गम"}, {"name": "Durgaḥ", "meaning": "Attainment guarded by obstacles.", "idx": 779, "marathi": "अडथळ्यांमुळे अगम्य दुर्ग"}, {"name": "Durāvāsaḥ", "meaning": "Brought into the heart by yogis in Samādhi with great effort.", "idx": 780, "marathi": "योगी मोठ्या प्रयासाने हृदयात साठवतात असे दुरावास"}, {"name": "Durārihā", "meaning": "Destroyer of inimical Asuras.", "idx": 781, "marathi": "असुरांचा नाश करणारे दुरारिहा"}]}, {"id": "stotram-84", "section": "stotram", "num": "84", "slokaNum": 84, "label": "Śloka 84", "speaker": "Names 782–789", "start": 1513, "end": 1525, "sanskrit": "शुभाङ्गो लोकसारङ्गः सुतन्तुस्तन्तुवर्धनः ।\nइन्द्रकर्मा महाकर्मा कृतकर्मा कृतागमः ॥ ८४ ॥", "iast": "śubhāṅgo lokasāraṅgaḥ sutantus tantuvardhanaḥ,\nindrakarmā mahākarmā kṛtakarmā kṛtāgamaḥ.", "meaning": "Śubhāṅgaḥ – Auspicious form to meditate upon. Lokasāraṅgaḥ – Extracts the essence from the world like a honey-bee. Sutantuḥ – Master of this infinitely extended universe-web. Tantu-vardhanaḥ – Augments or contracts the web of the world. Indra-karmā – Whose actions are most commendable. Mahākarmā – Of whom great elements like Ākāśa are effects. Kṛtakarmā – Fulfilled everything, nothing left to accomplish. Kṛtāgamaḥ – Gave out the Āgama as the Veda.", "meaningMarathi": "Śubhāṅgaḥ (ध्यानास अत्यंत मंगल रूप असलेले शुभांग) • Lokasāraṅgaḥ (मधमाशीप्रमाणे विश्वाचे सार ग्रहण करणारे लोकसारंग) • Sutantuḥ (अनंत विश्वाच्या तंतूंचे स्वामी सुतंतू) • Tantu-vardhanaḥ (विश्वतंतू वाढवणारे व आवरणारे तंतुवर्धन) • Indra-karmā (इंद्राप्रमाणे श्रेष्ठ कर्मे करणारे इंद्रकर्मा) • Mahākarmā (आकाशादी महाभूते ज्यांचे कार्य आहेत ते महाकर्मा) • Kṛtakarmā (सर्वकाही पूर्ण केलेले कृतकर्मा) • Kṛtāgamaḥ (वेदरूपी आगम देणारे कृतागम)", "names": [{"name": "Śubhāṅgaḥ", "meaning": "Auspicious form to meditate upon.", "idx": 782, "marathi": "ध्यानास अत्यंत मंगल रूप असलेले शुभांग"}, {"name": "Lokasāraṅgaḥ", "meaning": "Extracts the essence from the world like a honey-bee.", "idx": 783, "marathi": "मधमाशीप्रमाणे विश्वाचे सार ग्रहण करणारे लोकसारंग"}, {"name": "Sutantuḥ", "meaning": "Master of this infinitely extended universe-web.", "idx": 784, "marathi": "अनंत विश्वाच्या तंतूंचे स्वामी सुतंतू"}, {"name": "Tantu-vardhanaḥ", "meaning": "Augments or contracts the web of the world.", "idx": 785, "marathi": "विश्वतंतू वाढवणारे व आवरणारे तंतुवर्धन"}, {"name": "Indra-karmā", "meaning": "Whose actions are most commendable.", "idx": 786, "marathi": "इंद्राप्रमाणे श्रेष्ठ कर्मे करणारे इंद्रकर्मा"}, {"name": "Mahākarmā", "meaning": "Of whom great elements like Ākāśa are effects.", "idx": 787, "marathi": "आकाशादी महाभूते ज्यांचे कार्य आहेत ते महाकर्मा"}, {"name": "Kṛtakarmā", "meaning": "Fulfilled everything, nothing left to accomplish.", "idx": 788, "marathi": "सर्वकाही पूर्ण केलेले कृतकर्मा"}, {"name": "Kṛtāgamaḥ", "meaning": "Gave out the Āgama as the Veda.", "idx": 789, "marathi": "वेदरूपी आगम देणारे कृतागम"}]}, {"id": "stotram-85", "section": "stotram", "num": "85", "slokaNum": 85, "label": "Śloka 85", "speaker": "Names 790–799", "start": 1525, "end": 1537, "sanskrit": "उद्भवः सुन्दरः सुन्दो रत्ननाभः सुलोचनः ।\nअर्को वाजसनः शृङ्गी जयन्तः सर्वविज्जयी ॥ ८५ ॥", "iast": "udbhavaḥ sundaraḥ sundo ratnanābhaḥ sulocanaḥ,\narko vājasanaḥ śṛṅgī jayantaḥ sarvavij jayī.", "meaning": "Udbhavaḥ – Assumes noble embodiments by His own will. Sundaraḥ – Of enchanting graceful beauty. Sundaḥ – Noted for extreme tenderness. Ratna-nābhaḥ – Exceedingly beautiful navel. Sulocanaḥ – Brilliant eyes of omniscience. Arkaḥ – Worshipped even by Brahmā. Vājasanaḥ – Gives food to those who entreat Him. Śṛṅgī – Assumed the horned fish form at Pralaya. Jayantaḥ – Conquers enemies easily. Sarvavijjayī – All-knowing conqueror of inner and outer foes.", "meaningMarathi": "Udbhavaḥ (स्वेच्छेने दिव्य अवतार घेणारे उद्भव) • Sundaraḥ (सर्वांना मोहित करणारे सुंदर) • Sundaḥ (अत्यंत कोमल व दयाळू सुंद) • Ratna-nābhaḥ (रत्नासारखी सुंदर नाभी असलेले रत्ननाभ) • Sulocanaḥ (सर्वज्ञ तेजस्वी नेत्र असलेले सुलोचन) • Arkaḥ (ब्रह्मादी पूजनीयांनीही पूजलेले अर्क) • Vājasanaḥ (याचकांना अन्न देणारे वाजसन) • Śṛṅgī (प्रलयकाळी शिंग असलेल्या मत्स्याचे रूप घेणारे शृंगी) • Jayantaḥ (शत्रूंना सहज जिंकणारे जयंत) • Sarvavijjayī (सर्वज्ञ आणि अंतर्बाह्य शत्रूंना जिंकणारे सर्वविज्जयी)", "names": [{"name": "Udbhavaḥ", "meaning": "Assumes noble embodiments by His own will.", "idx": 790, "marathi": "स्वेच्छेने दिव्य अवतार घेणारे उद्भव"}, {"name": "Sundaraḥ", "meaning": "Of enchanting graceful beauty.", "idx": 791, "marathi": "सर्वांना मोहित करणारे सुंदर"}, {"name": "Sundaḥ", "meaning": "Noted for extreme tenderness.", "idx": 792, "marathi": "अत्यंत कोमल व दयाळू सुंद"}, {"name": "Ratna-nābhaḥ", "meaning": "Exceedingly beautiful navel.", "idx": 793, "marathi": "रत्नासारखी सुंदर नाभी असलेले रत्ननाभ"}, {"name": "Sulocanaḥ", "meaning": "Brilliant eyes of omniscience.", "idx": 794, "marathi": "सर्वज्ञ तेजस्वी नेत्र असलेले सुलोचन"}, {"name": "Arkaḥ", "meaning": "Worshipped even by Brahmā.", "idx": 795, "marathi": "ब्रह्मादी पूजनीयांनीही पूजलेले अर्क"}, {"name": "Vājasanaḥ", "meaning": "Gives food to those who entreat Him.", "idx": 796, "marathi": "याचकांना अन्न देणारे वाजसन"}, {"name": "Śṛṅgī", "meaning": "Assumed the horned fish form at Pralaya.", "idx": 797, "marathi": "प्रलयकाळी शिंग असलेल्या मत्स्याचे रूप घेणारे शृंगी"}, {"name": "Jayantaḥ", "meaning": "Conquers enemies easily.", "idx": 798, "marathi": "शत्रूंना सहज जिंकणारे जयंत"}, {"name": "Sarvavijjayī", "meaning": "All-knowing conqueror of inner and outer foes.", "idx": 799, "marathi": "सर्वज्ञ आणि अंतर्बाह्य शत्रूंना जिंकणारे सर्वविज्जयी"}]}, {"id": "stotram-86", "section": "stotram", "num": "86", "slokaNum": 86, "label": "Śloka 86", "speaker": "Names 800–806", "start": 1537, "end": 1549, "sanskrit": "सुवर्णबिन्दुरक्षोभ्यः सर्ववागीश्वरेश्वरः ।\nमहाह्रदो महागर्तो महाभूतो महानिधिः ॥ ८६ ॥", "iast": "suvarṇabindur akṣobhyaḥ sarvavāgīśvareśvaraḥ,\nmahāhrado mahāgarto mahābhūto mahānidhiḥ.", "meaning": "Suvarṇabinduḥ – Limbs equal to gold in brilliance. Akṣobhyaḥ – Never perturbed by passions or enemies. Sarva-vāgīśvareśvaraḥ – Master of all masters of learning. Mahāhradaḥ – Great lake of Bliss in which yogis dip. Mahāgartaḥ – Whose Māyā is as deep as a great pit. Mahābhūtaḥ – Undivided by past, present and future. Mahānidhiḥ – Great treasure supporting all elements.", "meaningMarathi": "Suvarṇabinduḥ (सुवर्णाप्रमाणे तेजस्वी अवयव असलेले सुवर्णबिंदू) • Akṣobhyaḥ (रागद्वेष किंवा असुरांनी कधीही विचलित न होणारे अक्षोभ्य) • Sarva-vāgīśvareśvaraḥ (ब्रह्मादी वागीश्वरांचेही स्वामी सर्ववागीश्वरेश्वर) • Mahāhradaḥ (योगी ज्यात डुंबतात तो आनंदसरोवर महाह्रद) • Mahāgartaḥ (ज्यांची माया महाखड्ड्याप्रमाणे दुस्तर आहे असे महागर्त) • Mahābhūtaḥ (त्रिकालाबाधित महाभूत) • Mahānidhiḥ (सर्व महाभूतांचे परम निधी महानिधी)", "names": [{"name": "Suvarṇabinduḥ", "meaning": "Limbs equal to gold in brilliance.", "idx": 800, "marathi": "सुवर्णाप्रमाणे तेजस्वी अवयव असलेले सुवर्णबिंदू"}, {"name": "Akṣobhyaḥ", "meaning": "Never perturbed by passions or enemies.", "idx": 801, "marathi": "रागद्वेष किंवा असुरांनी कधीही विचलित न होणारे अक्षोभ्य"}, rows downward as the universe. Udumbaraḥ – Superior to all, above the sky. Aśvatthaḥ – The ever-changing universe as His form. Cāṇūrāndhra-niṣūdanaḥ – Destroyer of the wrestler Cāṇūra.", "meaningMarathi": "Sulabhaḥ (पत्र, पुष्प, फळानेही भक्तीने सहज प्राप्त होणारे सुलभ) • Suvrataḥ (शुद्ध अर्पण स्वीकारणारे सुव्रत) • Siddhaḥ (ज्यांचे सर्व संकल्प सिद्ध आहेत असे सिद्ध) • Śatrujit (दुष्टशक्तींना जिंकणारे शत्रुजित्) • Śatrutāpanaḥ (देवशत्रूंना ताप देणारे शत्रुतापन) • Nyagrodhaḥ (वर राहून खाली विश्वरूपाने वाढणारे न्यग्रोध) • Udumbaraḥ (आकाशाच्याही पलीकडे श्रेष्ठ उदुंबर) • Aśvatthaḥ (क्षणोक्षणी बदलणारे विश्वरूप अश्वत्थ) • Cāṇūrāndhra-niṣūdanaḥ (चाणूर मल्लाचा वध करणारे चाणूरान्ध्रनिषूदन)", "names": [{"name": "Sulabhaḥ", "meaning": "Easily attained by offering leaf, flower or fruit with devotion.", "idx": 817, "marathi": "पत्र, पुष्प, फळानेही भक्तीने सहज प्राप्त होणारे सुलभ"}, {"name": "Suvrataḥ", "meaning": "Enjoys pure offerings; mere witness.", "idx": 818, "marathi": "शुद्ध अर्पण स्वीकारणारे सुव्रत"}, {"name": "Siddhaḥ", "meaning": "Whose purposes are always accomplished.", "idx": 819, "marathi": "ज्यांचे सर्व संकल्प सिद्ध आहेत असे सिद्ध"}, {"name": "Śatrujit", "meaning": "Conqueror of evil forces.", "idx": 820, "marathi": "दुष्टशक्तींना जिंकणारे शत्रुजित्"}, {"name": "Śatrutāpanaḥ", "meaning": "Destroyer of enemies of Devas.", "idx": 821, "marathi": "देवशत्रूंना ताप देणारे शत्रुतापन"}, {"name": "Nyagrodhaḥ", "meaning": "Remains above all yet grows downward as the universe.", "idx": 822, "marathi": "वर राहून खाली विश्वरूपाने वाढणारे न्यग्रोध"}, {"name": "Udumbaraḥ", "meaning": "Superior to all, above the sky.", "idx": 823, "marathi": "आकाशाच्याही पलीकडे श्रेष्ठ उदुंबर"}, {"name": "Aśvatthaḥ", "meaning": "The ever-changing universe as His form.", "idx": 824, "marathi": "क्षणोक्षणी बदलणारे विश्वरूप अश्वत्थ"}, {"name": "Cāṇūrāndhra-niṣūdanaḥ", "meaning": "Destroyer of the wrestler Cāṇūra.", "idx": 825, "marathi": "चाणूर मल्लाचा वध करणारे चाणूरान्ध्रनिषूदन"}]}, {"id": "stotram-89", "section": "stotram", "num": "89", "slokaNum": 89, "label": "Śloka 89", "speaker": "Names 826–834", "start": 1573, "end": 1585, "sanskrit": "सहस्रार्चिः सप्तजिह्वः सप्तैधाः सप्तवाहनः ।\nअमूर्तिरनघोऽचिन्त्यो भयकृद्भयनाशनः ॥ ८९ ॥", "iast": "sahasrārciḥ saptajihvaḥ saptaidhāḥ saptavāhanaḥ,\namūrtir anagho 'cintyo bhayakṛd bhayanāśanaḥ.", "meaning": "Sahasrārciḥ – With innumerable rays. Sapta-jihvaḥ – Fire with seven tongues of flame. Saptaidhāḥ – Seven forms of brilliance. Saptavāhanaḥ – Sun with seven horses. Amūrtiḥ – Formless pure consciousness. Anaghaḥ – Without sin or sorrow. Acintyaḥ – Beyond intellectual determination, the witnessing Self. Bhayakṛt – Generates fear in the wicked. Bhaya-nāśanaḥ – Destroys fears of the virtuous.", "meaningMarathi": "Sahasrārciḥ (असंख्य किरण असलेले सहस्रार्ची) • Sapta-jihvaḥ (अग्निरूपात सात ज्वाळा असलेले सप्तजिह्व) • Saptaidhāḥ (सात प्रकारचे तेज असलेले सप्तैधा) • Saptavāhanaḥ (सूर्यरूपात सात अश्व वाहन असलेले सप्तवाहन) • Amūrtiḥ (स्थूल देहरहित निराकार अमूर्ती) • Anaghaḥ (पाप व शोकरहित अनघ) • Acintyaḥ (मनाला व तर्कास अगम्य अचिंत्य) • Bhayakṛt (दुष्टांना भय उत्पन्न करणारे भयकृत्) • Bhaya-nāśanaḥ (सज्जनांचे भय नाश करणारे भयनाशन)", "names": [{"name": "Sahasrārciḥ", "meaning": "With innumerable rays.", "idx": 826, "marathi": "असंख्य किरण असलेले सहस्रार्ची"}, {"name": "Sapta-jihvaḥ", "meaning": "Fire with seven tongues of flame.", "idx": 827, "marathi": "अग्निरूपात सात ज्वाळा असलेले सप्तजिह्व"}, {"name": "Saptaidhāḥ", "meaning": "Seven forms of brilliance.", "idx": 828, "marathi": "सात प्रकारचे तेज असलेले सप्तैधा"}, {"name": "Saptavāhanaḥ", "meaning": "Sun with seven horses.", "idx": 829, "marathi": "सूर्यरूपात सात अश्व वाहन असलेले सप्तवाहन"}, {"name": "Amūrtiḥ", "meaning": "Formless pure consciousness.", "idx": 830, "marathi": "स्थूल देहरहित निराकार अमूर्ती"}, {"name": "Anaghaḥ", "meaning": "Without sin or sorrow.", "idx": 831, "marathi": "पाप व शोकरहित अनघ"}, {"name": "Acintyaḥ", "meaning": "Beyond intellectual determination, the witnessing Self.", "idx": 832, "marathi": "मनाला व तर्कास अगम्य अचिंत्य"}, {"name": "Bhayakṛt", "meaning": "Generates fear in the wicked.", "idx": 833, "marathi": "दुष्टांना भय उत्पन्न करणारे भयकृत्"}, {"name": "Bhaya-nāśanaḥ", "meaning": "Destroys fears of the virtuous.", "idx": 834, "marathi": "सज्जनांचे भय नाश करणारे भयनाशन"}]}, {"id": "stotram-90", "section": "stotram", "num": "90", "slokaNum": 90, "label": "Śloka 90", "speaker": "Names 835–846", "start": 1585, "end": 1597, "sanskrit": "अणुर्बृहत्कृशः स्थूलो गुणभृन्निर्गुणो महान् ।\nअधृतः स्वधृतः स्वास्यः प्राग्वंशो वंशवर्धनः ॥ ९० ॥", "iast": "aṇur bṛhat kṛśaḥ sthūlo guṇabhṛn nirguṇo mahān,\nadhṛtaḥ svadhṛtaḥ svāsyaḥ prāgvaṃśo vaṃśavardhanaḥ.", "meaning": "Aṇuḥ – Extremely subtle. Bṛhat – Huge and mighty. Kṛśaḥ – Non-material, beyond Prakṛti. Sthūlaḥ – Figuratively huge as inner pervader. Guṇa-bhṛt – Support of Sattva, Rajas and Tamas. Nirguṇaḥ – Without material Guṇas. Mahān – The Great. Adhṛtaḥ – Not supported by anything external. Svadhṛtaḥ – Supported only by Himself. Svāsyaḥ – Beautiful lotus-like face. Prāgvaṃśaḥ – Preceded by no prior cause. Vaṃśavardhanaḥ – Augments or dissolves the world-system.", "meaningMarathi": "Aṇuḥ (अत्यंत सूक्ष्म अणू) • Bṛhat (अत्यंत विशाल बृहत्) • Kṛśaḥ (प्रकृतीच्या पलीकडील कृश) • Sthūlaḥ (सर्वव्यापी असल्याने विराट स्थूल) • Guṇa-bhṛt (सत्त्व-रजो-तमो गुणांचे आधार गुणभृत्) • Nirguṇaḥ (प्रकृतीच्या गुणांपासून मुक्त निर्गुण) • Mahān (परम महान) • Adhṛtaḥ (कोणाच्याही आधाराविना असलेले अधृत) • Svadhṛtaḥ (स्वतःच स्वतःचे आधार स्वधृत) • Svāsyaḥ (कमळासारखे सुंदर मुख असलेले स्वास्य) • Prāgvaṃśaḥ (ज्यांच्या वंशापूर्वी काहीच नाही असे प्राग्वंश) • Vaṃśavardhanaḥ (विश्ववंशाची वृद्धी व लय करणारे वंशवर्धन)", "names": [{"name": "Aṇuḥ", "meaning": "Extremely subtle.", "idx": 835, "marathi": "अत्यंत सूक्ष्म अणू"}, {"name": "Bṛhat", "meaning": "Huge and mighty.", "idx": 836, "marathi": "अत्यंत विशाल बृहत्"}, {"name": "Kṛśaḥ", "meaning": "Non-material, beyond Prakṛti.", "idx": 837, "marathi": "प्रकृतीच्या पलीकडील कृश"}, {"name": "Sthūlaḥ", "meaning": "Figuratively huge as inner pervader.", "idx": 838, "marathi": "सर्वव्यापी असल्याने विराट स्थूल"}, {"name": "Guṇa-bhṛt", "meaning": "Support of Sattva, Rajas and Tamas.", "idx": 839, "marathi": "सत्त्व-रजो-तमो गुणांचे आधार गुणभृत्"}, {"name": "Nirguṇaḥ", "meaning": "Without material Guṇas.", "idx": 840, "marathi": "प्रकृतीच्या गुणांपासून मुक्त निर्गुण"}, {"name": "Mahān", "meaning": "The Great.", "idx": 841, "marathi": "परम महान"}, {"name": "Adhṛtaḥ", "meaning": "Not supported by anything external.", "idx": 842, "marathi": "कोणाच्याही आधाराविना असलेले अधृत"}, {"name": "Svadhṛtaḥ", "meaning": "Supported only by Himself.", "idx": 843, "marathi": "स्वतःच स्वतःचे आधार स्वधृत"}, {"name": "Svāsyaḥ", "meaning": "Beautiful lotus-like face.", "idx": 844, "marathi": "कमळासारखे सुंदर मुख असलेले स्वास्य"}, {"name": "Prāgvaṃśaḥ", "meaning": "Preceded by no prior cause.", "idx": 845, "marathi": "ज्यांच्या वंशापूर्वी काहीच नाही असे प्राग्वंश"}, {"name": "Vaṃśavardhanaḥ", "meaning": "Augments or dissolves the world-system.", "idx": 846, "marathi": "विश्ववंशाची वृद्धी व लय करणारे वंशवर्धन"}]}, {"id": "stotram-91", "section": "stotram", "num": "91", "slokaNum": 91, "label": "Śloka 91", "speaker": "Names 847–856", "start": 1597, "end": 1609, "sanskrit": "भारभृत् कथितो योगी योगीशः सर्वकामदः ।\nआश्रमः श्रमणः क्षामः सुपर्णो वायुवाहनः ॥ ९१ ॥", "iast": "bhārabhṛt kathito yogī yogīśaḥ sarvakāmadaḥ,\nāśramaḥ śramaṇaḥ kṣāmaḥ suparṇo vāyuvāhanaḥ.", "meaning": "Bhārabhṛt – Bears the earth as Ananta (Ādiśeṣa). Kathitaḥ – Spoken of as the highest by all Vedas. Yogī – Ever established in His own Self. Yogīśaḥ – Never shaken from Yoga. Sarva-kāmadaḥ – Bestows all desired fruits. Āśramaḥ – Bestower of rest to wanderers in Saṃsāra. Śramaṇaḥ – Brings tribulations to the undiscriminating. Kṣāmaḥ – Causes decline and dissolution of all beings. Suparṇaḥ – Tree of Saṃsāra with Vedic verses as leaves. Vāyuvāhanaḥ – In awe of whom Vāyu carries all beings.", "meaningMarathi": "Bhārabhṛt (अनंत शेषरूपाने पृथ्वीचा भार वाहणारे भारभृत्) • Kathitaḥ (सर्व वेदांनी सर्वोच्च मानलेले कथित) • Yogī (सदैव आत्मस्वरूपात स्थित योगी) • Yogīśaḥ (योगातून कधीही न ढळणारे योगीश) • Sarva-kāmadaḥ (सर्व इष्ट फळे देणारे सर्वकामद) • Āśramaḥ (संसारारण्यात भटकणाऱ्यांना विश्रांती देणारे आश्रम) • Śramaṇaḥ (अविवेकींना क्लेश देणारे श्रमण) • Kṣāmaḥ (सर्वांचा क्षय करणारे क्षाम) • Suparṇaḥ (वेदमंत्ररूपी सुंदर पाने असलेला संसारवृक्ष सुपर्ण) • Vāyuvāhanaḥ (ज्यांच्या भयाने वायू वाहतो ते वायुवाहन)", "names": [{"name": "Bhārabhṛt", "meaning": "Bears the earth as Ananta (Ādiśeṣa).", "idx": 847, "marathi": "अनंत शेषरूपाने पृथ्वीचा भार वाहणारे भारभृत्"}, {"name": "Kathitaḥ", "meaning": "Spoken of as the highest by all Vedas.", "idx": 848, "marathi": "सर्व वेदांनी सर्वोच्च मानलेले कथित"}, {"name": "Yogī", "meaning": "Ever established in His own Self.", "idx": 849, "marathi": "सदैव आत्मस्वरूपात स्थित योगी"}, {"name": "Yogīśaḥ", "meaning": "Never shaken from Yoga.", "idx": 850, "marathi": "योगातून कधीही न ढळणारे योगीश"}, {"name": "Sarva-kāmadaḥ", "meaning": "Bestows all desired fruits.", "idx": 851, "marathi": "सर्व इष्ट फळे देणारे सर्वकामद"}, {"name": "Āśramaḥ", "meaning": "Bestower of rest to wanderers in Saṃsāra.", "idx": 852, "marathi": "संसारारण्यात भटकणाऱ्यांना विश्रांती देणारे आश्रम"}, {"name": "Śramaṇaḥ", "meaning": "Brings tribulations to the undiscriminating.", "idx": 853, "marathi": "अविवेकींना क्लेश देणारे श्रमण"}, {"name": "Kṣāmaḥ", "meaning": "Causes decline and dissolution of all beings.", "idx": 854, "marathi": "सर्वांचा क्षय करणारे क्षाम"}, {"name": "Suparṇaḥ", "meaning": "Tree of Saṃsāra with Vedic verses as leaves.", "idx": 855, "marathi": "वेदमंत्ररूपी सुंदर पाने असलेला संसारवृक्ष सुपर्ण"}, {"name": "Vāyuvāhanaḥ", "meaning": "In awe of whom Vāyu carries all beings.", "idx": 856, "marathi": "ज्यांच्या भयाने वायू वाहतो ते वायुवाहन"}]}, {"id": "stotram-92", "section": "stotram", "num": "92", "slokaNum": 92, "label": "Śloka 92", "speaker": "Names 857–866", "start": 1609, "end": 1621, "sanskrit": "धनुर्धरो धनुर्वेदो दण्डो दमयिता दमः ।\nअपराजितः सर्वसहो नियन्ताऽनियमोऽयमः ॥ ९२ ॥", "iast": "dhanurdharo dhanurvedo daṇḍo damayitā damaḥ,\naparājitaḥ sarvasaho niyantā 'niyamo 'yamaḥ.", "meaning": "Dhanurdharaḥ – Wielded the great bow as Rāma. Dhanurvedaḥ – Master of the science of archery. Daṇḍaḥ – Discipline personified. Damayitā – Inflicts punishment on the wicked. Damaḥ – Self-discipline in beings. Aparājitaḥ – Never defeated by any enemy. Sarvasahaḥ – Expert in all works, bearing all with equanimity. Niyantā – Appoints everyone to their duties. Aniyamaḥ – Under no external law. Ayamaḥ – Beyond Yama and death.", "meaningMarathi": "Dhanurdharaḥ (राम अवतारात महान धनुष्य धारण करणारे धनुर्धर) • Dhanurvedaḥ (धनुर्विद्येचे आचार्य धनुर्वेद) • Daṇḍaḥ (दंडशक्ती स्वरूप दंड) • Damayitā (दुष्टांना शासन करणारे दमयिता) • Damaḥ (प्राण्यांतील आत्मसंयम दम) • Aparājitaḥ (कधीही पराभूत न होणारे अपराजित) • Sarvasahaḥ (सर्व कर्मे समभावाने सहन करणारे सर्वसह) • Niyantā (सर्वांना आपापल्या कर्तव्यावर नेमणारे नियंता) • Aniyamaḥ (कोणत्याही बाह्य नियमाधीन नसलेले अनियम) • Ayamaḥ (यमाच्याही पलीकडील मृत्युंजय अयम)", "names": [{"name": "Dhanurdharaḥ", "meaning": "Wielded the great bow as Rāma.", "idx": 857, "marathi": "राम अवतारात महान धनुष्य धारण करणारे धनुर्धर"}, {"name": "Dhanurvedaḥ", "meaning": "Master of the science of archery.", "idx": 858, "marathi": "धनुर्विद्येचे आचार्य धनुर्वेद"}, {"name": "Daṇḍaḥ", "meaning": "Discipline personified.", "idx": 859, "marathi": "दंडशक्ती स्वरूप दंड"}, {"name": "Damayitā", "meaning": "Inflicts punishment on the wicked.", "idx": 860, "marathi": "दुष्टांना शासन करणारे दमयिता"}, {"name": "Damaḥ", "meaning": "Self-discipline in beings.", "idx": 861, "marathi": "प्राण्यांतील आत्मसंयम दम"}, {"name": "Aparājitaḥ", "meaning": "Never defeated by any enemy.", "idx": 862, "marathi": "कधीही पराभूत न होणारे अपराजित"}, {"name": "Sarvasahaḥ", "meaning": "Expert in all works, bearing all with equanimity.", "idx": 863, "marathi": "सर्व कर्मे समभावाने सहन करणारे सर्वसह"}, {"name": "Niyantā", "meaning": "Appoints everyone to their duties.", "idx": 864, "marathi": "सर्वांना आपापल्या कर्तव्यावर नेमणारे नियंता"}, {"name": "Aniyamaḥ", "meaning": "Under no external law.", "idx": 865, "marathi": "कोणत्याही बाह्य नियमाधीन नसलेले अनियम"}, {"name": "Ayamaḥ", "meaning": "Beyond Yama and death.", "idx": 866, "marathi": "यमाच्याही पलीकडील मृत्युंजय अयम"}]}, {"id": "stotram-93", "section": "stotram", "num": "93", "slokaNum": 93, "label": "Śloka 93", "speaker": "Names 867–875", "start": 1621, "end": 1633, "sanskrit": "सत्त्ववान् सात्त्विकः सत्यः सत्यधर्मपरायणः ।\nअभिप्रायः प्रियार्होऽर्हः प्रियकृत् प्रीतिवर्धनः ॥ ९३ ॥", "iast": "sattvavān sāttvikaḥ satyaḥ satyadharmaparāyaṇaḥ,\nabhiprāyaḥ priyārho 'rhaḥ priyakṛt prītivardhanaḥ.", "meaning": "Sattvavān – Endowed with heroism, prowess and fortitude. Sāttvikaḥ – Established in Sattva Guṇa. Satyaḥ – Truly present in good people. Satya-dharma-parāyaṇaḥ – Foundation of truth and righteousness. Abhiprāyaḥ – Sought by seekers of ultimate values. Priyārhaḥ – Worthy of one's dearest offerings. Arhaḥ – Deserves all worship. Priyakṛt – Actively does what is dear to devotees. Prītivardhanaḥ – Enhances joy and devotion.", "meaningMarathi": "Sattvavān (शौर्य, पराक्रम व धैर्य यांनी युक्त सत्त्ववान) • Sāttvikaḥ (सत्त्वगुणात प्रतिष्ठित सात्त्विक) • Satyaḥ (सज्जनांमध्ये सत्यरूपाने स्थित सत्य) • Satya-dharma-parāyaṇaḥ (सत्य व धर्माचे परम आश्रयस्थान सत्यधर्मपरायण) • Abhiprāyaḥ (पुरुषार्थ साधकांचे अंतिम ध्येय अभिप्राय) • Priyārhaḥ (अत्यंत प्रिय वस्तू अर्पण करण्यास योग्य प्रियार्ह) • Arhaḥ (सर्व पूजेस पात्र अर्ह) • Priyakṛt (भक्तांचे सदैव प्रिय करणारे प्रियकृत्) • Prītivardhanaḥ (भक्तांची प्रीती व भक्ती वाढवणारे प्रीतिवर्धन)", "names": [{"name": "Sattvavān", "meaning": "Endowed with heroism, prowess and fortitude.", "idx": 867, "marathi": "शौर्य, पराक्रम व धैर्य यांनी युक्त सत्त्ववान"}, {"name": "Sāttvikaḥ", "meaning": "Established in Sattva Guṇa.", "idx": 868, "marathi": "सत्त्वगुणात प्रतिष्ठित सात्त्विक"}, {"name": "Satyaḥ", "meaning": "Truly present in good people.", "idx": 869, "marathi": "सज्जनांमध्ये सत्यरूपाने स्थित सत्य"}, {"name": "Satya-dharma-parāyaṇaḥ", "meaning": "Foundation of truth and righteousness.", "idx": 870, "marathi": "सत्य व धर्माचे परम आश्रयस्थान सत्यधर्मपरायण"}, {"name": "Abhiprāyaḥ", "meaning": "Sought by seekers of ultimate values.", "idx": 871, "marathi": "पुरुषार्थ साधकांचे अंतिम ध्येय अभिप्राय"}, {"name": "Priyārhaḥ", "meaning": "Worthy of one's dearest offerings.", "idx": 872, "marathi": "अत्यंत प्रिय वस्तू अर्पण करण्यास योग्य प्रियार्ह"}, {"name": "Arhaḥ", "meaning": "Deserves all worship.", "idx": 873, "marathi": "सर्व पूजेस पात्र अर्ह"}, {"name": "Priyakṛt", "meaning": "Actively does what is dear to devotees.", "idx": 874, "marathi": "भक्तांचे सदैव प्रिय करणारे प्रियकृत्"}, {"name": "Prītivardhanaḥ", "meaning": "Enhances joy and devotion.", "idx": 875, "marathi": "भक्तांची प्रीती व भक्ती वाढवणारे प्रीतिवर्धन"}]}, {"id": "stotram-94", "section": "stotram", "num": "94", "slokaNum": 94, "label": "Śloka 94", "speaker": "Names 876–885", "start": 1633, "end": 1644, "sanskrit": "विहायसगतिर्ज्योतिः सुरुचिर्हुतभुग्विभुः ।\nरविर्विरोचनः सूर्यः सविता रविलोचनः ॥ ९४ ॥", "iast": "vihāyasagatir jyotiḥ surucir hutabhug vibhuḥ,\nravir virocanaḥ sūryaḥ savitā ravilocanaḥ.", "meaning": "Vihāyasa-gatiḥ – Support of Viṣṇupada, the highest region. Jyotiḥ – Self-luminous consciousness. Suruciḥ – Eminently attractive brilliance. Hutabhuk – Receives all sacrificial offerings. Vibhuḥ – Dwells everywhere; master of three worlds. Raviḥ – Absorbs fluids as the Sun. Virocanaḥ – Shines in many ways. Sūryaḥ – Generates brilliance in Sūrya. Savitā – Brings forth all worlds. Ravi-locanaḥ – Having the sun as His eye.", "meaningMarathi": "Vihāyasa-gatiḥ (विष्णुपद (आकाश) ज्यांची गती आहे ते विहायसगती) • Jyotiḥ (स्वयंप्रकाशित चैतन्य ज्योती) • Suruciḥ (अत्यंत आकर्षक तेज असलेले सुरुची) • Hutabhuk (सर्व यज्ञांतील आहुती ग्रहण करणारे हुतभुक्) • V rifices. Bhoktā – Experiencer of Prakṛti. Sukhadaḥ – Bestows liberation (Mokṣa). Naikajaḥ – Takes birth repeatedly to preserve Dharma. Agrajaḥ – Born before all else as Hiraṇyagarbha. Anirviṇṇaḥ – Free from all sorrow. Sadāmarṣī – Always patient and forbearing toward good people. Lokādhiṣṭhānam – Supports all three worlds without needing support. Adbhutaḥ – The marvellous Being.", "meaningMarathi": "Anantaḥ (शाश्वत, सर्वव्यापी व कालातीत अनंत) • Hutabhuk (अग्नीयज्ञातील आहुती ग्रहण करणारे हुतभुक्) • Bhoktā (प्रकृतीचे अनुभव घेणारे भोक्ता) • Sukhadaḥ (भक्तांना मोक्षसुख देणारे सुखद) • Naikajaḥ (धर्मरक्षणासाठी अनेकदा अवतार घेणारे नैकज) • Agrajaḥ (सर्वांपूर्वी जन्मलेले हिरण्यगर्भ अग्रज) • Anirviṇṇaḥ (सदैव तृप्त व शोकरहित अनिर्विण्ण) • Sadāmarṣī (सज्जनांप्रती सदैव क्षमाशील सदामर्षी) • Lokādhiṣṭhānam (तिन्ही लोकांचे आधारस्थान लोकाधिष्ठान) • Adbhutaḥ (अद्भुत महिमा असलेले अद्भुत)", "names": [{"name": "Anantaḥ", "meaning": "Eternal, all-pervading, limitless.", "idx": 886, "marathi": "शाश्वत, सर्वव्यापी व कालातीत अनंत"}, {"name": "Hutabhuk", "meaning": "Consumes offerings in fire sacrifices.", "idx": 887, "marathi": "अग्नीयज्ञातील आहुती ग्रहण करणारे हुतभुक्"}, {"name": "Bhoktā", "meaning": "Experiencer of Prakṛti.", "idx": 888, "marathi": "प्रकृतीचे अनुभव घेणारे भोक्ता"}, {"name": "Sukhadaḥ", "meaning": "Bestows liberation (Mokṣa).", "idx": 889, "marathi": "भक्तांना मोक्षसुख देणारे सुखद"}, {"name": "Naikajaḥ", "meaning": "Takes birth repeatedly to preserve Dharma.", "idx": 890, "marathi": "धर्मरक्षणासाठी अनेकदा अवतार घेणारे नैकज"}, {"name": "Agrajaḥ", "meaning": "Born before all else as Hiraṇyagarbha.", "idx": 891, "marathi": "सर्वांपूर्वी जन्मलेले हिरण्यगर्भ अग्रज"}, {"name": "Anirviṇṇaḥ", "meaning": "Free from all sorrow.", "idx": 892, "marathi": "सदैव तृप्त व शोकरहित अनिर्विण्ण"}, {"name": "Sadāmarṣī", "meaning": "Always patient and forbearing toward good people.", "idx": 893, "marathi": "सज्जनांप्रती सदैव क्षमाशील सदामर्षी"}, {"name": "Lokādhiṣṭhānam", "meaning": "Supports a
